                            vi: "Con người chúng ta hiện tại gọi là chủng người thứ năm. Khi bước sang chủng người thứ năm này hàng ngàn năm qua, con người chỉ hoạt động với hai chuỗi xoắn sinh học vật lý, còn những chuỗi mã gen ánh sáng siêu phàm ngày xưa đều đã bị niêm phong vẫn ngủ đông đằng sau bên trong cơ thể. Thế nhưng các mật điện cổ đại đã tiên tri rằng khi nhân loại tiến tới giao điểm, những thời khắc bức xạ mà đỉnh chu kỳ mặt trời thứ 25 kết hợp cùng luồng sóng từ điểm 0 độ dội xuống từ trường trái đất thì những xung động năng lượng tần số cao này sẽ mở khóa toàn bộ các chuỗi mã gen ánh sáng đã ngủ yên hàng vạn năm, khai sinh ra chủng người thứ sáu gọi là linh giác nhân với ba huyền năng kỳ diệu:[cite: 1]"
                        },
                        {
                            en: "The first ability is the crystallization of the Light Body and nonverbal thought transmission. This corresponds closely to descriptions of the Realm of Streaming Radiance (Abhasvara Heaven) in ancient Buddhist scriptures, where noble beings communicate through light and waves of consciousness. Upon stepping into the frequency of the Spiritually Awakened Humans, their pineal gland—or third eye—is fully activated. Reaching this pivotal milestone, they gain the ability to perceive the auric frequency bands surrounding all things, so simply by looking into one another's eyes, they can transmit thoughts directly and fully sense another's inner mind without using spoken sound—what we commonly call telepathy.[cite: 1]",
                            vi: "Huyền năng thứ nhất gọi là sự kết tinh cơ thể ánh sáng, còn gọi là quang thể và khả năng truyền ý niệm không cần lời nói. Cho nên thấy điều này thì rất tương ứng với mô tả về cõi Quang Âm Thiên trong kinh điển của Phật giáo cổ đại, nơi các bậc thiện hữu giao tiếp với nhau bằng ánh sáng và sóng tâm thức. Khi bước sang tần số linh giác nhân bởi vì tuyến tùng hay con mắt thứ ba của họ đã được kích hoạt hoàn toàn. Và khi bước sang cột mốc quan trọng, linh giác nhân có thể có khả năng nhìn thấy các dải tần số hào quang bao quanh vạn vật nên chỉ cần nhìn vào ánh mắt nhau là có thể truyền hẳn ý niệm và thấu cảm trọn vẹn tâm ý đối phương mà không cần dùng đến ngôn ngữ âm thanh là cái mà chúng ta vẫn hay gọi là thần giao cách cảm đó.[cite: 1]"
                        },
                        {
                            en: "Their second ability is the mechanism of absorbing cosmic light-energy and ageless rejuvenation. Why do ancient esoteric scrolls describe the Sixth Root Race as having luminous countenances and remaining forever young? Because instead of drawing energy solely from dense, physical food as we of the Fifth Root Race do, the cellular structure of the Spiritually Awakened Humans can directly absorb particles of cosmic radiance, vital life force, and pure universal light through the crown of the head. In truth, this is nothing new: in hidden valleys of the Himalayas, true masters recorded accounts of practitioners who unlocked this spiritual-awakening frequency. They could live for hundreds of years amidst snow and ice with their hair still dark and youthful, their bodies constantly radiating warmth and a pure fragrance thanks to the endless circulation of cosmic vitality, bringing biological aging nearly to a halt.[cite: 1]",
                            vi: "Và huyền năng thứ hai của họ là cơ chế hấp thụ khí quang của vũ trụ và trẻ hóa vượt thời gian. Bởi vì tại sao các mật thư cổ đại lại miêu tả chủng người thứ sáu mang dung mạo phát sáng, trẻ mãi không già? Đó chính là bởi vì thay vì bạn chỉ nạp năng lượng từ thức ăn của vật chất thô nặng như chủng tử người thứ năm chúng ta thì cấu trúc tế bào của linh giác nhân lại có khả năng hấp thụ trực tiếp các hạt khí quang và sinh khí, ánh sáng thuần khí trong vũ trụ thông qua đỉnh đầu. Thật ra điều này không hề xa lạ bởi vì trong các thung lũng ẩn mật trên dãy Himalaya có các bậc chân sư từng ghi chép về những hành giả mở khóa được tần số linh giác này. Họ có thể sống hàng trăm năm giữa băng tuyết mà mái tóc vẫn xanh, cơ thể vẫn luôn tỏa ra hơi ấm và hương thơm thanh khiết nhờ dòng sinh khí của vũ trụ tuần hoàn bất tận như vậy và khiến cho sự lão hóa sinh học cơ thể của họ gần như dừng lại.[cite: 1]"
                        },
                        {
                            en: "The third ability unlocks the most astonishing secret—one that so many of you wonder about: why the Sixth Root Race is called the immortal race. It lies in the power to transfer consciousness across the veil of forgetfulness, preserving 100% of one's memories across lifetimes. Put simply, in secret Tibetan esoteric texts, modern humans fear death because whenever you cross into a new lifetime, you must pass through a veil of forgetfulness—what East Asian tradition calls drinking Meng Po's Soup. This wipes clean every memory of your past life. By contrast, the Sixth Root Race—the Spiritually Awakened Humans—can unlock continuous soul memory across time, known as past-life recall, much like reincarnated living Buddhas in Tibet. You may also have recently heard the astonishing story of a young royal grandson in Bhutan. At just three years old, he could recall in crystal-clear detail his past life hundreds of years ago as a great translator, finding his way back to his exact monastery, identifying his prayer beads and ritual implements, and calling his former disciples by their exact names. This is because as their consciousness steps into a new journey, it retains 100% of the memories, wisdom, and gifts from one life to the next, transforming existence into an unbroken, immortal stream.[cite: 1]",
                            vi: "Và huyền năng thứ ba giúp giải mã một bí mật chấn động nhất mà nghe rất nhiều các bạn hay thắc mắc đó là vì sao chủng người thứ sáu được gọi là chủng người bất tử. Đó chính là bởi vì năng lực chuyển di thần thức xuyên qua màn sương quên lãng, tức là giữ trọn được 100% ký ức qua nhiều kiếp sống. Bạn có thể hiểu đơn giản như thế này trong những văn bản mật truyền Tây Tạng thì con người hiện tại sở dĩ sợ cái chết là bởi vì khi bạn bước qua kiếp sống mới đều phải đi qua một cái gọi là màn sương quên lãng hay là trong phương Đông chúng ta hay gọi là phải uống canh Mạnh Bà. Điều này khiến cho chúng ta bị xóa trắng toàn bộ ký ức của kiếp trước. Nhưng mà chủng người thứ sáu, chủng linh giác nhân họ có thể mở khóa được bộ nhớ linh hồn liên tục xuyên thời gian hay còn gọi là túc mạng thông giống như các vị Phật sống tái sinh ở Tây Tạng. Hay gần đây là các bạn sẽ nghe thấy những câu chuyện chấn động về một vị gọi là hoàng tôn ở Bhutan. Ngài vừa lên ba tuổi đã có thể nhớ van vách tiền kiếp hàng trăm năm trước của mình là một bậc đại dịch giả tên là có thể tự tìm lại đúng tu viện, tìm được chuỗi tràng hạt pháp khí và gọi được đúng tên các đệ tử cũ của ngài. Lý do là bởi vì thần thức của các vị này khi bước sang hành trình mới vẫn có thể giữ nguyên vẹn được 100% ký ức, trí tuệ và thiên phú từ kiếp trước sang kiếp sau, biến sự sống thành một dòng chảy bất tử không bao giờ đứt đoạn.[cite: 1]"
                        }

                    },
                    paragraphs: [
                        {
                            en: "Yet on the journey of elevating consciousness from 3D to the luminous realm of 5D, why do ancient esoteric scriptures repeatedly warn of an enchanting space standing right in the middle, called the Fourth-Dimensional Trap—or the 4D dimension? Jenny notices that whenever people talk about Earth's great shift in 2027, many only think in terms of leaping straight from the third dimension (3D)—the tangible physical world—directly up into the fifth dimension (5D), the realm of lucid wisdom, bliss, and freedom.[cite: 1]",
                            vi: "Tuy nhiên, trên hành trình nâng tâm thức từ 3D lên cõi sáng 5D, tại sao các mật điện cổ đại lại hay cảnh báo về một vùng không gian đầy mê hoặc nằm chánh ở chính giữa mang tên là cái bẫy chiều không gian thứ tư hay còn gọi là chiều không gian 4D. Bởi vì Jenny thấy là khi nhắc đến các cuộc đại chuyển mình của trái đất năm 2027, nhiều người chỉ nghĩ đến những từ như là bước nhảy từ chiều không gian thứ ba 3D là thế giới vật chất hữu hình lên thẳng chiều không gian 5D là cõi giới của trí tuệ sáng suốt và phúc lạc của tự do.[cite: 1]"
                        },
                        {

                        },
                        {
                            en: "To put it simply, the moment you step into this fourth dimension, the wall separating past, present, and future unlocks instantly, transforming this realm into a crystal palace or a tunnel of light overflowing with miracles and psychic powers. Here, you might suddenly dream of the future down to the finest detail, receive signals from unseen Dharma protectors, or reconnect with deep karmic bonds from many past lifetimes.[cite: 1]",

                        },
                        {
                            en: "Yet it is precisely this wonder that creates the 4D trap standing right at the gateway to the higher 5D realm. In reality, Jenny knows many people who are new to spiritual practice—people who, upon first brushing against higher planes or this 4D astral realm, suddenly gain the ability to look at anyone and foresee upcoming events in their lives. Instead of moving forward, however, they become intoxicated with using that prophetic gift to pronounce people's fates and bask in the adoration of crowds, causing their soul and spiritual growth to stall forever at that transit waystation.[cite: 1]",
                            vi: "Tuy nhiên cũng chính cái sự huyền diệu ấy lại tạo nên một cái bẫy ở chiều không gian 4D này nằm chánh ngay cửa ngõ của cõi giới 5D cao hơn. Bởi vì thực tế là Jenny biết có nhiều bạn khi mới thực hành tâm linh, có những người khi mới chạm vào được những tầng giới cao hơn hay là những tầng trung giới 4D như vậy, bỗng nhiên là họ có cái năng lực là nhìn thấy ai cũng đọc thấu được biến cố sắp xảy ra với người đó. Nhưng mà thay vì đi tiếp, họ lại say sưa dùng cái khả năng tiên tri đó để phán số mệnh và tận hưởng sự sùng bái của đám đông khiến cho linh hồn và các bậc của họ dừng mãi ở chạm trung truyện đó.[cite: 1]"
                        },
                        {
                            en: "Others, living peacefully and believing they have finally healed, suddenly meet a complete stranger and feel their heart tighten as if they had known this person for hundreds of years. That happens because during meditation or dreams, the 4D time portal cracks open a fragment of memory and an unfinished vow from a past life, prompting them to throw caution to the wind and rush headlong into resuming an old romance—failing to realize it may actually be a karmic entanglement.[cite: 1]",
                            vi: "Có một số người khác đang yên ổn tưởng đã được chữa lành rồi thì bỗng nhiên gặp một người xa lạ mà tim thắt lại như là đã quen từ hàng trăm năm trước. Đó là bởi vì khi trong những buổi thiền định hay trong những giấc mơ cổng thời gian 4D hé mở một tí ký ức và một lời thề đang dang dở từ kiếp trước thì họ có thể liền bất chấp tất cả mà lao vào viết tiếp đoạn tình duyên cũ mà không nhận ra đó có thể là một nghiệp duyên.[cite: 1]"
                        },
                        {

                            vi: "Nên để hóa giải được điều này, trong kinh Thủ Lăng Nghiêm Đức Phật cũng có dạy rằng người có đại trí tuệ sẽ đón nhận mọi linh ứng kỳ diệu bằng trái tim khiêm nhường, lấy từ bi và chánh niệm để tháo gỡ trọn vẹn những duyên nợ tiền kiếp, biến chiều không gian thứ tư, biến những khả năng linh cảm của bạn thành một cây cầu, một phương tiện ánh sáng đưa linh hồn, đưa tâm thức của bạn bước thẳng vào những cảnh giới tự do cao cấp hơn.[cite: 1]"

                        {

                            vi: "Cuối cùng để lưu giữ được dấu ấn năng lượng này thì bạn hãy comment bình luận xuống bên dưới một câu khẳng định để cùng cộng hưởng năng lượng với mọi người đang theo dõi video và với Jenny nhé, là tôi tỉnh thức đón vận mới 2027 để cùng nhau kết nối và lan tỏa trường năng lượng thiện lành này với mọi người nhé.[cite: 1]"
                        },
                        {
                            en: "And that is everything Jenny wanted to share with you in today's video. If you have any questions or thoughts you would like to share with Jenny and everyone else, feel free to leave them in the comments below—Jenny always reads every single comment. See you all in the next videos.[cite: 1]",
                            vi: "Và đó là tất cả những gì mà Jenny muốn chia sẻ với các bạn trong video ngày hôm nay. Nếu như các bạn có những thắc mắc hay có những suy nghĩ nào muốn cho Jenny và mọi người cùng biết thì có thể comment xuống bên dưới video. Jenny luôn đọc hết các comment và bình luận của mọi người. Và hẹn gặp lại các bạn trong những video lần sau.[cite: 1]"
                        }
                    ]
                }
            ],
            glossary: [
                { term: "Prophecy", pos: "noun", def: "A prediction of what will happen in the future.", plain: "A warning or guess about what is coming.", context: "mysterious prophecies that have been surfacing everywhere...[cite: 1]", vi: "Lời tiên tri" },
                { term: "Esoteric", pos: "adjective", def: "Intended for or likely to be understood by only a small number of people with a specialized knowledge or interest.", plain: "Secret or highly specialized knowledge.", context: "esoteric circles worldwide stunned by an event...[cite: 1]", vi: "Huyền học / Bí truyền" },
                { term: "Astronomer", pos: "noun", def: "An expert in or student of astronomy.", plain: "A scientist who studies stars and planets.", context: "Why are astronomers and esoteric circles worldwide stunned...[cite: 1]", vi: "Nhà thiên văn học" },
                { term: "Phenomenon", pos: "noun", def: "A fact or situation that is observed to exist or happen, especially one whose cause or explanation is in question.", plain: "An event or occurrence that is unusual.", context: "a phenomenon that only repeats once every 320 years...[cite: 1]", vi: "Hiện tượng" },
                { term: "Root Race", pos: "noun", def: "In esoteric cosmology, a major evolutionary stage of human consciousness.", plain: "A broad evolutionary stage of humanity in spiritual beliefs.", context: "a Sixth Root Race called the Spiritually Awakened Humans...[cite: 1]", vi: "Chủng tộc gốc" },
                { term: "Labyrinth", pos: "noun", def: "A complicated irregular network of passages or paths in which it is difficult to find one's way; a maze.", plain: "A confusing maze you can get lost in.", context: "as if trapped in an invisible labyrinth...[cite: 1]", vi: "Mê cung" },
                { term: "Threshold", pos: "noun", def: "The magnitude or intensity that must be exceeded for a certain reaction, phenomenon, result, or condition to occur or be manifested.", plain: "The starting point or edge of something new.", context: "on the threshold of the approaching 2027 Grand Cycle.[cite: 1]", vi: "Ngưỡng cửa" },
                { term: "Scroll", pos: "noun", def: "A roll of parchment or paper for writing or painting on.", plain: "An old rolled-up document.", context: "from ancient esoteric scrolls of Mesopotamia...[cite: 1]", vi: "Cuộn mật thư" },
                { term: "Monastery", pos: "noun", def: "A building or buildings occupied by a community of monks living under religious vows.", plain: "A place where monks live and study.", context: "hidden scriptures kept in Himalayan monasteries...[cite: 1]", vi: "Tu viện" },
                { term: "Primordial", pos: "adjective", def: "Existing at or from the beginning of time; primeval.", plain: "Ancient, from the very beginning of time.", context: "it is a primordial rift between two eras...[cite: 1]", vi: "Khởi nguyên / Sơ khai" },
                { term: "Rift", pos: "noun", def: "A crack, split, or break in something.", plain: "A break or gap.", context: "it is a primordial rift between two eras...[cite: 1]", vi: "Khe nứt" },
                { term: "Synchronicity", pos: "noun", def: "The simultaneous occurrence of events which appear significantly related but have no discernible causal connection.", plain: "Meaningful coincidences.", context: "the code for synchronizing with the universe...[cite: 1]", vi: "Sự đồng bộ" },
                { term: "Orchestrate", pos: "verb", def: "Plan or coordinate the elements of (a situation) to produce a desired effect.", plain: "To carefully organize or control a situation.", context: "as though an unseen hand were orchestrating everything.[cite: 1]", vi: "Sắp đặt / Điều khiển" },
                { term: "Dormant", pos: "adjective", def: "Having normal physical functions suspended or slowed down for a period of time; in or as if in a deep sleep.", plain: "Asleep or inactive for now.", context: "were sealed away, lying dormant deep within the body.[cite: 1]", vi: "Ngủ đông / Tiềm ẩn" },
                { term: "Endow", pos: "verb", def: "Provide with a quality, ability, or asset.", plain: "To give a special gift or ability to someone.", context: "Spiritually Awakened Humans, endowed with three miraculous abilities...[cite: 1]", vi: "Ban cho / Phú cho" },
                { term: "Crystallization", pos: "noun", def: "The process of solidifying into a highly structured form.", plain: "Taking clear and solid form.", context: "The first ability is the crystallization of the Light Body...[cite: 1]", vi: "Sự kết tinh" },
                { term: "Telepathy", pos: "noun", def: "The supposed communication of thoughts or ideas by means other than the known senses.", plain: "Mind reading.", context: "without using spoken sound—what we commonly call telepathy.[cite: 1]", vi: "Thần giao cách cảm" },
                { term: "Rejuvenation", pos: "noun", def: "The action or process of making someone or something look or feel better, younger, or more vital.", plain: "Looking and feeling young again.", context: "absorbing cosmic light-energy and ageless rejuvenation.[cite: 1]", vi: "Sự trẻ hóa" },
                { term: "Luminous", pos: "adjective", def: "Full of or shedding light; bright or shining, especially in the dark.", plain: "Glowing with light.", context: "describe the Sixth Root Race as having luminous countenances...[cite: 1]", vi: "Phát sáng / Tỏa sáng" },
                { term: "Vitality", pos: "noun", def: "The state of being strong and active; energy.", plain: "Energy and life force.", context: "thanks to the endless circulation of cosmic vitality...[cite: 1]", vi: "Sinh khí" },
                { term: "Reincarnate", pos: "verb", def: "Cause (someone) to undergo rebirth in another body.", plain: "To be born again into a new life.", context: "much like reincarnated living Buddhas in Tibet.[cite: 1]", vi: "Tái sinh" },
                { term: "Implement", pos: "noun", def: "A tool, utensil, or other piece of equipment, especially as used for a particular purpose.", plain: "A tool or instrument.", context: "identifying his prayer beads and ritual implements...[cite: 1]", vi: "Pháp khí / Dụng cụ" },
                { term: "Enchanting", pos: "adjective", def: "Delightfully charming or attractive.", plain: "Magical and very attractive.", context: "warn of an enchanting space standing right in the middle...[cite: 1]", vi: "Đầy mê hoặc" },
                { term: "Intoxicated", pos: "adjective", def: "Exhilarated or stupefied by or as if by alcohol or a drug (or in this case, power/success).", plain: "Overly excited and blind to reason.", context: "they become intoxicated with using that prophetic gift...[cite: 1]", vi: "Say sưa / Mê muội" }
            ]
        };

        // Application State
        let globalLang = 'en'; 
        const appContent = document.getElementById('app-content');

        // Dark Mode Logic
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Global Language Toggle
        function toggleGlobalLang() {
            globalLang = globalLang === 'en' ? 'vi' : 'en';
            renderCurrentView(); // Re-render to update default states
        }

        // Internal toggle used by individual cards
        function toggleCardLang(event, cardInnerId, indicatorId, sourceLang) {
            event.stopPropagation();
            const inner = document.getElementById(cardInnerId);
            const indicator = document.getElementById(indicatorId);
            
            inner.classList.toggle('flipped');
            if (inner.classList.contains('flipped')) {
                indicator.textContent = sourceLang === 'en' ? 'VI' : 'EN';
                indicator.classList.replace('bg-blue-100', 'bg-red-100');
                indicator.classList.replace('text-blue-800', 'text-red-800');
                indicator.classList.replace('dark:bg-blue-900', 'dark:bg-red-900');
                indicator.classList.replace('dark:text-blue-200', 'dark:text-red-200');
            } else {
                indicator.textContent = sourceLang.toUpperCase();
                indicator.classList.replace('bg-red-100', 'bg-blue-100');
                indicator.classList.replace('text-red-800', 'text-blue-800');
                indicator.classList.replace('dark:bg-red-900', 'dark:bg-blue-900');
                indicator.classList.replace('dark:text-red-200', 'dark:text-blue-200');
            }
        }

        function toggleSectionCardLang(event, sectionId) {
            event.stopPropagation();
            const el = document.getElementById(`section-title-${sectionId}`);
            const current = el.getAttribute('data-current-lang');
            const target = current === 'en' ? 'vi' : 'en';
            
            const section = docData.sections.find(s => s.id === sectionId);
            el.textContent = section.title[target];
            el.setAttribute('data-current-lang', target);
        }

        // Router
        function navigate(path) {
            window.location.hash = path;
        }

        function handleRoute() {
            const hash = window.location.hash.slice(1) || 'home';
            renderView(hash);
        }

        function renderCurrentView() {
            handleRoute();
        }

        // View Renderer
        function renderView(hash) {
            window.scrollTo(0,0);
            const backBtn = document.getElementById('nav-back-btn');
            const logo = document.getElementById('nav-logo');
            
            if (hash === 'home') {
                backBtn.classList.add('hidden');
                logo.classList.remove('hidden');
                renderHome();
            } else if (hash === 'glossary') {
                backBtn.classList.remove('hidden');
                logo.classList.add('hidden', 'md:block');
                renderGlossary();
            } else {
                backBtn.classList.remove('hidden');
                logo.classList.add('hidden', 'md:block');
                renderSection(hash);
            }
        }

        // Render Home (Overview)
        function renderHome() {
            const titleHtml = `
                <div class="text-center mb-12 mt-8">
                    <h1 class="text-3xl md:text-5xl font-bold font-serif mb-4 leading-tight">${docData.title[globalLang]}</h1>
                    <p class="text-gray-500 dark:text-gray-400 italic">Select a section to begin reading.</p>
                </div>
            `;

            let sectionsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
            
            docData.sections.forEach(sec => {
                const titleStr = sec.title[globalLang];
                sectionsHtml += `
                    <div onclick="navigate('${sec.id}')" class="group cursor-pointer bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 rounded-xl p-6 shadow-sm hover:shadow-xl hover:border-primary/50 transition-all duration-300 relative">
                        <div class="absolute top-4 right-4">
                            <button onclick="toggleSectionCardLang(event, '${sec.id}')" class="text-xs font-semibold bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 px-2 py-1 rounded transition-colors shadow-sm">
                                ↻ Lang
                            </button>
                        </div>
                        <h3 id="section-title-${sec.id}" data-current-lang="${globalLang}" class="text-xl font-bold font-serif mb-2 pr-14 group-hover:text-primary transition-colors">${titleStr}</h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm flex items-center gap-1 mt-4">
                            Read Section <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </p>
                    </div>
                `;
            });

            // Add Glossary Quick Access Card
            sectionsHtml += `
                    <div onclick="navigate('glossary')" class="group cursor-pointer bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 rounded-xl p-6 shadow-sm hover:shadow-xl hover:border-primary transition-all duration-300 relative md:col-span-2">
                        <div class="flex items-center gap-4">
                            <div class="p-4 bg-white dark:bg-darkCard rounded-full shadow-sm">
                                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold font-serif mb-1 group-hover:text-primary transition-colors">Interactive Learner Glossary</h3>
                                <p class="text-gray-600 dark:text-gray-400 text-sm">Master 24+ B2/C1 academic and esoteric terms extracted from this forecast.</p>
                            </div>
                        </div>
                    </div>
            `;
            sectionsHtml += '</div>';

            appContent.innerHTML = titleHtml + sectionsHtml;
        }

        // Render Individual Section
        function renderSection(sectionId) {
            const section = docData.sections.find(s => s.id === sectionId);
            if (!section) {
                appContent.innerHTML = `<div class="text-center mt-20"><h2 class="text-2xl font-bold">Section not found.</h2></div>`;
                return;
            }

            const isEnFirst = globalLang === 'en';
            
            let html = `
                <div class="mb-10 text-center relative">
                    <h2 class="text-3xl md:text-4xl font-bold font-serif mb-6 leading-tight">${section.title[globalLang]}</h2>
                    <hr class="w-16 h-1 mx-auto bg-primary border-0 rounded">
                </div>
                <div class="space-y-6">
            `;

            section.paragraphs.forEach((p, index) => {
                const frontText = isEnFirst ? p.en : p.vi;
                const backText = isEnFirst ? p.vi : p.en;
                const indicatorText = isEnFirst ? 'EN' : 'VI';
                
                html += `
                    <div class="flip-container w-full group cursor-pointer" onclick="toggleCardLang(event, 'flip-inner-${index}', 'lang-badge-${index}', '${globalLang}')">
                        <div id="flip-inner-${index}" class="flip-card-inner">
                            <!-- FRONT -->
                            <div class="flip-card-front bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 rounded-xl p-6 md:p-8 shadow-sm group-hover:shadow-md transition-shadow relative">
                                <span id="lang-badge-${index}" class="absolute top-4 right-4 text-[10px] font-bold px-2 py-1 rounded bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 uppercase tracking-wide">
                                    ${indicatorText}
                                </span>
                                <p class="text-lg md:text-xl text-gray-700 dark:text-gray-300 pr-8">${frontText}</p>
                                <div class="mt-4 flex items-center justify-between text-sm text-gray-400 dark:text-gray-500">
                                    <span>Click to reveal ${isEnFirst ? 'Vietnamese' : 'English'}</span>
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                </div>
                            </div>
                            <!-- BACK -->
                            <div class="flip-card-back bg-gray-50 dark:bg-slate-800 border border-indigo-200 dark:border-indigo-800 rounded-xl p-6 md:p-8 shadow-sm group-hover:shadow-md transition-shadow relative">
                                <span class="absolute top-4 right-4 text-[10px] font-bold px-2 py-1 rounded bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200 uppercase tracking-wide">
                                    ${isEnFirst ? 'VI' : 'EN'}
                                </span>
                                <p class="text-lg md:text-xl text-gray-800 dark:text-gray-200 pr-8 font-medium">${backText}</p>
                                <div class="mt-4 flex items-center justify-between text-sm text-indigo-400">
                                    <span>Click to revert</span>
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
                <div class="mt-12 text-center">
                    <button onclick="navigate('home')" class="px-6 py-3 bg-white dark:bg-darkCard border border-gray-300 dark:border-gray-600 rounded-full font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                        ← Back to Overview
                    </button>
                </div>
            `;
            
            appContent.innerHTML = html;
        }

        // Render Glossary
        function renderGlossary() {
            let html = `
                <div class="mb-12 text-center">
                    <h2 class="text-3xl md:text-4xl font-bold font-serif mb-4">Interactive Learner Glossary</h2>
                    <p class="text-gray-600 dark:text-gray-400">Master specialized esoteric and academic vocabulary from the text.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            `;

            docData.glossary.forEach((item, index) => {
                html += `
                    <div class="bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 rounded-xl p-6 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex items-baseline gap-3 mb-2">
                                <h3 class="text-2xl font-bold font-serif text-gray-900 dark:text-white">${item.term}</h3>
                                <span class="text-sm italic text-gray-500 dark:text-gray-400">${item.pos}</span>
                            </div>
                            <p class="text-gray-800 dark:text-gray-200 font-medium mb-2">${item.def}</p>
                            <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 pb-4 border-b border-gray-100 dark:border-gray-800">
                                <strong>In other words:</strong> ${item.plain}
                            </p>
                            <blockquote class="text-sm italic text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-800/50 p-3 rounded-lg border-l-4 border-primary mb-4">
                                "${item.context}"
                            </blockquote>
                        </div>
                        <div class="mt-auto">
                            <button onclick="document.getElementById('vi-term-${index}').classList.toggle('hidden'); this.classList.toggle('bg-indigo-50'); this.classList.toggle('dark:bg-indigo-900/30')" class="w-full text-left flex justify-between items-center py-2 px-4 rounded border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors font-semibold text-gray-700 dark:text-gray-300">
                                Reveal Vietnamese
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div id="vi-term-${index}" class="hidden mt-3 text-center text-lg font-bold text-primary bg-indigo-50 dark:bg-indigo-900/20 py-3 rounded border border-indigo-100 dark:border-indigo-800">
                                ${item.vi}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
                <div class="mt-12 text-center">
                    <button onclick="navigate('home')" class="px-6 py-3 bg-white dark:bg-darkCard border border-gray-300 dark:border-gray-600 rounded-full font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                        ← Back to Overview
                    </button>
                </div>
            `;
            
            appContent.innerHTML = html;
        }

        // Initialization
        window.addEventListener('hashchange', handleRoute);
        
        // Initial Theme Check
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        // Start App
        handleRoute();
    </script>
</body>
</html>
