              vi: "Bước 4: Duy trì trọn vẹn trong 60 giây\n\nHãy duy trì trạng thái kết hợp giữa ý định rõ ràng và cảm xúc nâng cao trong 60 giây. Nếu suy nghĩ bị phân tán, nhẹ nhàng đưa chúng trở về trọng tâm bạn đã chọn. Nếu cảm xúc phai nhạt, hãy chủ động tạo lại chúng. Điều này không liên quan đến sự hoàn hảo mà liên quan đến sự kiên định trong việc kết hợp ý định tập trung với cảm xúc chân thực.\n\nTrong khoảng một phút ngắn ngủi này, hãy chú ý đến cách cơ thể phản ứng. Bạn có thể cảm thấy ấm áp, tê nhẹ, mở rộng hoặc có cảm giác năng lượng đang chảy trong cơ thể. Đây là dấu hiệu cho thấy hệ thần kinh của bạn đang chuyển sang trạng thái liên kết và sinh lý của bạn đang thực sự thay đổi."

            {

            },

              en: "Thời Điểm Thực Hành Tối Ưu (Optimal Practice Timing)\n\nThis technique delivers peak results when practiced consistently at the same time every day. The ideal window is immediately upon waking, when brainwave frequencies linger in suggestive alpha and theta states, making the subconscious most receptive to new neural patterning.\n\nThat said, you can deploy it as a quick reset button whenever life demands it: right before walking into a challenging meeting, or the moment you catch yourself slipping into unconscious, reactionary patterns.",

      const navBackBtn = document.getElementById('nav-back-btn');
      const navGlossaryBtn = document.getElementById('nav-glossary-btn');

      // Update persistent navbar indicators
      if (state.currentRoute === 'overview') {
        navBackBtn.classList.add('hidden');
      } else {
        navBackBtn.classList.remove('hidden');
      }

      if (state.currentRoute === 'glossary') {
        navGlossaryBtn.classList.add('bg-slate-200', 'dark:bg-slate-800', 'font-bold');
      } else {
        navGlossaryBtn.classList.remove('bg-slate-200', 'dark:bg-slate-800', 'font-bold');
      }

      // Route Dispatch
      if (state.currentRoute === 'overview') {
        root.innerHTML = renderOverview();
      } else if (state.currentRoute === 'glossary') {
        root.innerHTML = renderGlossary();
      } else {
        const targetSection = appData.sections.find(s => s.id === state.currentRoute);
        if (targetSection) {
          root.innerHTML = renderSectionPage(targetSection);
        } else {
          root.innerHTML = `<div class="py-20 text-center">
            <h2 class="text-2xl font-bold mb-2">Section Not Found</h2>
            <a href="#overview" class="text-brand-600 underline">Return to Overview</a>
          </div>`;
        }
      }
    }

    function renderSectionPage(section) {

      const currentIndex = appData.sections.findIndex(s => s.id === section.id);
      const prevSection = currentIndex > 0 ? appData.sections[currentIndex - 1] : null;
      const nextSection = currentIndex < appData.sections.length - 1 ? appData.sections[currentIndex + 1] : null;

      const isHeaderVi = state.overviewCardLangs[section.id] === 'vi';

      const paragraphCards = section.paragraphs.map((p, pIndex) => {
        const cardKey = `${section.id}-p-${pIndex}`;
        const activeLang = state.cardLanguages[cardKey] || state.globalMode || 'en';
        const isVi = activeLang === 'vi';

        // Format bullets or line breaks if any
        const enHtml = escapeHtml(p.en).replace(/\n\n/g, '<br/><br/>').replace(/•/g, '&bull;');
        const viHtml = escapeHtml(p.vi).replace(/\n\n/g, '<br/><br/>').replace(/•/g, '&bull;');

        return `

               id="${cardKey}">

              <div class="flex items-center gap-2">

                        title="Listen to English audio" 
                        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">

                </button>

                <button onclick="toggleCardLang('${cardKey}')" 
                        class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors flex items-center gap-1.5 border border-slate-200 dark:border-slate-700">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>

            </h1>
            <p class="text-base sm:text-lg font-serif italic text-slate-600 dark:text-slate-400">
              ${isHeaderVi ? section.titleEn : section.titleVi}

            </div>
          </div>

          <!-- Paragraphs Stack -->
          <div class="space-y-6">
            ${paragraphCards}

                  &larr; Return to Overview
                </a>
              `}
            </div>

            <div>
              ${nextSection ? `
                <a href="#${nextSection.id}" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 font-semibold text-sm text-white shadow-md shadow-teal-600/20 transition-all">

    /* -------------------------------------------------------------
       VIEW 3: INTERACTIVE LEARNER GLOSSARY (FINAL PAGE)
       ------------------------------------------------------------- */
    function renderGlossary() {
      // Filter list based on search and category filter
      const filtered = glossaryData.filter(item => {
        const matchesCategory = state.glossaryFilter === 'all' || item.category === state.glossaryFilter;
        const matchesQuery = !state.glossarySearch || 
          item.term.toLowerCase().includes(state.glossarySearch.toLowerCase()) ||
          item.def.toLowerCase().includes(state.glossarySearch.toLowerCase()) ||
          item.vi.toLowerCase().includes(state.glossarySearch.toLowerCase());
        return matchesCategory && matchesQuery;
      });

      const categories = ['all', 'Neuroscience', 'Psychology', 'Scientific', 'Mindset', 'Concepts', 'Idioms'];

      const categoryPills = categories.map(cat => {
        const isActive = state.glossaryFilter === cat;
        return `
          <button onclick="setGlossaryFilter('${cat}')" 
                  class="px-3.5 py-1.5 rounded-full text-xs font-semibold capitalize transition-all ${
                    isActive 
                      ? 'bg-teal-600 text-white shadow-sm' 
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
                  }">
            ${cat}
          </button>
        `;
      }).join('');

      const cardsHtml = filtered.map(item => {
        const isRevealed = !!state.glossaryRevealed[item.id];
        return `
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 hover:border-brand-500/50 dark:hover:border-brand-500/50 shadow-sm flex flex-col justify-between transition-all">

                    ${item.pos}

                  ${item.category}

              </div>

              <!-- Academic Definition -->
              <div class="mb-4">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Academic Definition</span>
                <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed font-sans">
                  ${item.def}
                </p>
              </div>

              <!-- Plain English Explanation -->
              <div class="mb-4 bg-teal-50/50 dark:bg-teal-950/30 p-3 rounded-xl border border-teal-100 dark:border-teal-900/60">
                <span class="text-xs font-bold uppercase tracking-wider text-teal-700 dark:text-teal-400 block mb-1">In Plain English (B1/B2)</span>
                <p class="text-xs sm:text-sm text-teal-900 dark:text-teal-200 leading-relaxed">
                  ${item.plain}
                </p>
              </div>

              <!-- Context in Document -->
              <div class="mb-5">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Example in Context</span>
                <blockquote class="text-xs sm:text-sm italic text-slate-600 dark:text-slate-400 pl-3 border-l-2 border-brand-500/60 leading-relaxed">
                  "${item.example}"

              </div>

              <button onclick="toggleGlossaryReveal('${item.id}')" 
                      class="w-full py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${

      return `
        <div class="max-w-5xl mx-auto">
          
          <!-- Glossary Hero -->
          <div class="text-center max-w-2xl mx-auto mb-10 pt-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-teal-50 dark:bg-teal-950/70 text-teal-800 dark:text-teal-300 border border-teal-200 dark:border-teal-800 mb-4">
              Advanced Language & Scientific Framework
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-3">
              Interactive Learner Glossary
            </h1>
            <p class="text-sm sm:text-base text-slate-600 dark:text-slate-400 leading-relaxed">
              Master 28 specialized vocabulary items, neurobiological phenomena, and idiomatic expressions extracted directly from this masterclass.
            </p>
          </div>

          <!-- Search & Filter Controls -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm mb-8 space-y-4">
            <!-- Search Bar -->
            <div class="relative">
              <svg class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input type="text" 
                     id="glossary-search-input" 
                     value="${state.glossarySearch}"
                     oninput="handleGlossarySearch(this.value)"
                     placeholder="Search target term, academic definition, or Vietnamese equivalent..."
                     class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all" />
              ${state.glossarySearch ? `
                <button onclick="handleGlossarySearch('')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">Clear</button>
              ` : ''}
            </div>

            <!-- Category Pills -->
            <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
              <span class="text-xs font-semibold text-slate-400 mr-1">Filter Domain:</span>
              ${categoryPills}
            </div>

            <!-- Counter -->
            <div class="text-xs text-slate-500 dark:text-slate-400 flex items-center justify-between pt-1">
              <span>Showing <strong>${filtered.length}</strong> of <strong>${glossaryData.length}</strong> core terms</span>
              <button onclick="revealAllGlossary(true)" class="text-teal-600 dark:text-teal-400 hover:underline">Reveal all Vietnamese</button>
            </div>
          </div>

          <!-- Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${cardsHtml.length > 0 ? cardsHtml : `
              <div class="col-span-full py-16 text-center text-slate-500">
                <p class="text-base font-semibold mb-2">No vocabulary terms match your search filter.</p>
                <button onclick="resetGlossaryFilters()" class="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold">Reset Filters</button>
              </div>
            `}
          </div>

        </div>
      `;
    }

    /* -------------------------------------------------------------
       5. INTERACTION LOGIC & EVENT HANDLERS
       ------------------------------------------------------------- */
    function navigateTo(route) {
      window.location.hash = `#${route}`;
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcons();
    }

    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('theme-sun').classList.toggle('hidden', !isDark);
      document.getElementById('theme-moon').classList.toggle('hidden', isDark);
    }

    function toggleGlobalLanguage() {
      state.globalMode = state.globalMode === 'en' ? 'vi' : 'en';
      document.getElementById('global-lang-indicator').textContent = state.globalMode === 'en' ? 'All: EN' : 'All: VI';

      // Set all paragraph cards in the current section
      if (state.currentRoute !== 'overview' && state.currentRoute !== 'glossary') {
        const sec = appData.sections.find(s => s.id === state.currentRoute);
        if (sec) {
          sec.paragraphs.forEach((_, idx) => {
            state.cardLanguages[`${sec.id}-p-${idx}`] = state.globalMode;
          });
        }
      } else if (state.currentRoute === 'overview') {
        appData.sections.forEach(s => {
          state.overviewCardLangs[s.id] = state.globalMode;
        });
      }
      render();
    }

    function toggleCardLang(cardKey) {
      const current = state.cardLanguages[cardKey] || state.globalMode || 'en';
      state.cardLanguages[cardKey] = current === 'en' ? 'vi' : 'en';
      render();
    }

    function toggleOverviewCardLang(event, secId) {
      if (event) event.stopPropagation();
      const current = state.overviewCardLangs[secId] || 'en';
      state.overviewCardLangs[secId] = current === 'en' ? 'vi' : 'en';
      render();
    }

    function setSectionAllLang(secId, lang) {
      const sec = appData.sections.find(s => s.id === secId);
      if (sec) {
        sec.paragraphs.forEach((_, idx) => {
          state.cardLanguages[`${secId}-p-${idx}`] = lang;
        });
      }
      render();
    }

    function handleGlossarySearch(val) {
      state.glossarySearch = val;
      render();
      // Keep focus in input
      const input = document.getElementById('glossary-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    function setGlossaryFilter(cat) {
      state.glossaryFilter = cat;
      render();
    }

    function toggleGlossaryReveal(id) {
      state.glossaryRevealed[id] = !state.glossaryRevealed[id];
      render();
    }

    function revealAllGlossary(status) {
      glossaryData.forEach(item => {
        state.glossaryRevealed[item.id] = status;
      });
      render();
    }

    function resetGlossaryFilters() {
      state.glossaryFilter = 'all';
      state.glossarySearch = '';
      render();
    }

    // Text-To-Speech helper for English pronunciation
    function speakText(key, text) {
      if (!('speechSynthesis' in window)) {
        alert('Web Speech API is not supported in this browser.');
        return;
      }
      window.speechSynthesis.cancel();
      const clean = text.replace(/•/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function truncateText(str, len) {
      if (!str) return '';
      return str.length > len ? str.substring(0, len) + '…' : str;
    }

    function escapeHtml(string) {
      return String(string)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeForSpeech(string) {
      return String(string).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
    }

    /* -------------------------------------------------------------
       6. APPLICATION BOOTSTRAP
       ------------------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', () => {
      // Check stored theme or default system preference
      const storedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeIcons();

      // Initialize hash routing
      initRouter();
    });
  </script>
</body>
</html>
