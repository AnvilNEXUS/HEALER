    /***********************************************************************
     * 3. APPLICATION STATE MANAGEMENT
     ***********************************************************************/
    const STATE = {
      currentView: 'overview',      // 'overview' | 'part-1' | 'part-2' | 'sec-1-1'..'sec-2-3' | 'glossary'
      globalLang: 'EN',             // 'EN' | 'VI'
      fontScaleStep: 0,             // -1, 0, 1, 2
      overviewCardLangs: {},        //Per-card language overrides on Overview: { 'sec-1-1': 'EN' | 'VI' }
      sectionTitleLangs: {},        //Per-section title language override on Reading Pages
      readingCardFlips: {},         //Per-paragraph/sentence card state on Reading Pages
      sideBySideMode: false,        //Optional side-by-side comparison toggle on reading pages
      glossarySearch: '',
      glossaryPosFilter: 'ALL',
      glossaryPartFilter: 'ALL',
      glossaryRevealed: {}          // { 'term-1': true/false }
    };

    // Helper: Get flattened array of all 9 sections
    function getAllSections() {
      return DOCUMENT_DATA.parts.flatMap(p => p.sections);
    }

    // Helper: Find a section by ID
    function getSectionById(secId) {
      return getAllSections().find(s => s.id === secId) || null;
    }

    // Helper: Escape HTML for safe rendering
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /***********************************************************************
     * 4. THEME & FONT SIZE MANAGEMENT
     ***********************************************************************/
    function initTheme() {
      const savedTheme = localStorage.getItem('bilingual_app_theme_58');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('bilingual_app_theme_58', isDark ? 'dark' : 'light');
      updateThemeIcons();
    }

    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      if (sun && moon) {
        sun.classList.toggle('hidden', !isDark);
        moon.classList.toggle('hidden', isDark);
      }
    }

    function adjustFontSize(delta) {
      STATE.fontScaleStep = Math.max(-1, Math.min(3, STATE.fontScaleStep + delta));
      const sizes = {
        '-1': '1.08rem', // ~17.3px
        '0': '1.2rem',   // ~19.2px (default)
        '1': '1.32rem',  // ~21.1px
        '2': '1.45rem',  // ~23.2px
        '3': '1.6rem'    // ~25.6px (presentation mode)
      };
      document.documentElement.style.setProperty('--reading-font-size', sizes[String(STATE.fontScaleStep)]);
    }

    /***********************************************************************
     * 5. GLOBAL LANGUAGE SWITCH & ROUTING
     ***********************************************************************/
    function setGlobalLanguage(lang) {
      STATE.globalLang = lang;
      // Reset per-card overrides so everything syncs cleanly to the global toggle
      STATE.overviewCardLangs = {};
      STATE.sectionTitleLangs = {};
      STATE.readingCardFlips = {};
      updateTopNavUI();
      renderCurrentView();
    }

    function updateTopNavUI() {
      const enBtn = document.getElementById('global-lang-en');
      const viBtn = document.getElementById('global-lang-vi');
      if (enBtn && viBtn) {
        if (STATE.globalLang === 'EN') {
          enBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg text-xs sm:text-sm font-bold tracking-wide transition-all duration-200 bg-emerald-600 text-white shadow-sm";
          viBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg text-xs sm:text-sm font-bold tracking-wide transition-all duration-200 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
        } else {
          viBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg text-xs sm:text-sm font-bold tracking-wide transition-all duration-200 bg-emerald-600 text-white shadow-sm";
          enBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg text-xs sm:text-sm font-bold tracking-wide transition-all duration-200 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
        }
      }

      const backBtn = document.getElementById('nav-back-btn');
      const backLabel = document.getElementById('nav-back-label');
      if (backBtn && backLabel) {
        const isOverview = STATE.currentView === 'overview';
        backLabel.textContent = STATE.globalLang === 'VI'
          ? (isOverview ? 'Trang Tổng Quan' : '← Về Tổng Quan')
          : (isOverview ? 'Overview Hub' : '← Back to Overview');

        if (isOverview) {
          backBtn.classList.add('opacity-80');
        } else {
          backBtn.classList.remove('opacity-80');
        }
      }

      const selectEl = document.getElementById('quick-jump-select');
      if (selectEl) {
        selectEl.value = STATE.currentView;
      }
    }

    function navigateTo(viewId, scrollToTop = true) {
      if (!viewId) viewId = 'overview';
      STATE.currentView = viewId;
      if (window.location.hash !== `#${viewId}`) {
        history.pushState(null, '', `#${viewId}`);
      }
      updateTopNavUI();
      renderCurrentView();
      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '') || 'overview';
      if (hash !== STATE.currentView) {
        STATE.currentView = hash;
        updateTopNavUI();
        renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    /***********************************************************************
     * 6. VIEW RENDERING DISPATCHER
     ***********************************************************************/
    function renderCurrentView() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const view = STATE.currentView;
      if (view === 'overview') {
        root.innerHTML = renderOverviewPage();
      } else if (view === 'glossary') {
        root.innerHTML = renderGlossaryPage();
      } else if (view === 'part-1' || view === 'part-2') {
        root.innerHTML = renderPartReadingPage(view);
      } else if (view.startsWith('sec-')) {
        const section = getSectionById(view);
        if (section) {
          root.innerHTML = renderSectionReadingPage(section);
        } else {
          root.innerHTML = renderOverviewPage();
        }
      } else {
        root.innerHTML = renderOverviewPage();
      }
    }

    /***********************************************************************
     * 7. PAGE 1: OVERVIEW / NAVIGATION HUB
     ***********************************************************************/
    function toggleOverviewCardLang(event, secId) {
      // Prevent card click navigation when clicking the corner EN/VI toggle button
      event.stopPropagation();
      const currentLang = STATE.overviewCardLangs[secId] || STATE.globalLang;
      const nextLang = currentLang === 'EN' ? 'VI' : 'EN';
      STATE.overviewCardLangs[secId] = nextLang;

      // Smoothly update just this card in the DOM without full page re-render
      const section = getSectionById(secId);
      if (!section) return;

      const headingEl = document.getElementById(`overview-card-heading-${secId}`);
      const subEl = document.getElementById(`overview-card-sub-${secId}`);
      const previewEl = document.getElementById(`overview-card-preview-${secId}`);
      const badgeEl = document.getElementById(`overview-card-lang-btn-${secId}`);
      const ctaEl = document.getElementById(`overview-card-cta-${secId}`);

      if (headingEl) {
        headingEl.classList.add('opacity-0', 'translate-y-1');
        setTimeout(() => {
          headingEl.textContent = nextLang === 'EN' ? section.headingEN : section.headingVI;

              <span class="${nextLang === 'EN' ? 'text-emerald-700 dark:text-emerald-300 font-bold' : 'text-slate-400'}">EN</span>

    /***********************************************************************
     * 8. INTERACTIVE PARAGRAPH & SENTENCE CARD COMPONENT HELPERS
     ***********************************************************************/
    function toggleReadingCard(cardKey, event) {
      if (event) event.stopPropagation();
      const currentlyFlipped = getCardFlipState(cardKey);
      const nextFlipped = !currentlyFlipped;
      STATE.readingCardFlips[cardKey] = nextFlipped;

      const innerEl = document.getElementById(`flip-inner-${cardKey}`);
      const badgeEl = document.getElementById(`flip-badge-${cardKey}`);
      const btnLabelEl = document.getElementById(`flip-btn-label-${cardKey}`);

      if (innerEl) {
        innerEl.classList.toggle('is-flipped', nextFlipped);
      }
      if (badgeEl) {
        if (nextFlipped) {
          badgeEl.textContent = 'VI • TIẾNG VIỆT';
          badgeEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300/60 dark:border-amber-700 transition-colors';
        } else {
          badgeEl.textContent = 'EN • ENGLISH';
          badgeEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-300/60 dark:border-emerald-700 transition-colors';
        }
      }
      if (btnLabelEl) {
        btnLabelEl.textContent = nextFlipped
          ? 'Switch to English / Xem Tiếng Anh'
          : 'Reveal Vietnamese / Xem Tiếng Việt';
      }
    }

    function getCardFlipState(cardKey) {
      if (typeof STATE.readingCardFlips[cardKey] === 'boolean') {
        return STATE.readingCardFlips[cardKey];
      }
      return STATE.globalLang === 'VI';
    }

    function toggleSectionTitleLang(secId) {
      const current = STATE.sectionTitleLangs[secId] || STATE.globalLang;
      const next = current === 'EN' ? 'VI' : 'EN';
      STATE.sectionTitleLangs[secId] = next;

      const sec = getSectionById(secId);
      if (!sec) return;
      const titleEl = document.getElementById(`sec-header-title-${secId}`);
      const subEl = document.getElementById(`sec-header-sub-${secId}`);
      const btnTextEl = document.getElementById(`sec-header-toggle-text-${secId}`);

      if (titleEl) {
        titleEl.textContent = next === 'EN' ? sec.headingEN : sec.headingVI;
      }
      if (subEl) {
        subEl.textContent = next === 'EN' ? sec.headingVI : sec.headingEN;
      }
      if (btnTextEl) {
        btnTextEl.textContent = next === 'EN' ? 'Title: EN (Switch to VI)' : 'Tiêu đề: VI (Đổi sang EN)';
      }
    }

    function toggleSideBySideMode() {
      STATE.sideBySideMode = !STATE.sideBySideMode;
      renderCurrentView();
    }

    function flipAllSectionCards(secId, toVietnamese) {
      const sec = getSectionById(secId);
      if (!sec) return;
      STATE.readingCardFlips[`main-${sec.id}`] = toVietnamese;
      sec.sentences.forEach((_, idx) => {
        STATE.readingCardFlips[`sent-${sec.id}-${idx}`] = toVietnamese;
      });
      renderCurrentView();
    }

    // Renders a jitter-free interactive flip card for a verbatim paragraph or sentence
    function renderInteractiveBilingualCard({ cardKey, labelEN, labelVI, textEN, textVI, isPrimary = false }) {

      if (STATE.sideBySideMode) {
        return `

                <div class="text-xs font-mono font-bold text-amber-700 dark:text-amber-400 uppercase tracking-wider">TIẾNG VIỆT (VIETNAMESE)</div>
                <p class="reading-text text-slate-900 dark:text-slate-100 font-normal">
                  ${escapeHTML(textVI)}
                </p>
              </div>
            </div>
          </div>
        `;
      }

      const activeBadgeText = isFlipped ? 'VI • TIẾNG VIỆT' : 'EN • ENGLISH';
      const activeBadgeClass = isFlipped
        ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border-amber-300/60 dark:border-amber-700'
        : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border-emerald-300/60 dark:border-emerald-700';

      const toggleBtnText = isFlipped
        ? 'Switch to English / Xem Tiếng Anh'
        : 'Reveal Vietnamese / Xem Tiếng Việt';

      return `
        <div
          onclick="toggleReadingCard('${cardKey}', event)"
          role="button"
          tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleReadingCard('${cardKey}', event);}"
          class="flip-card-stage group cursor-pointer rounded-3xl bg-white dark:bg-slate-900 border ${isPrimary ? 'border-2 border-emerald-500/50 dark:border-emerald-500/40 shadow-md hover:shadow-xl' : 'border-stone-200/90 dark:border-slate-800 shadow-sm hover:shadow-md'} p-6 sm:p-8 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          aria-label="Interactive bilingual paragraph card. Click to flip between English and Vietnamese."
        >
          <!-- Card Header: Type Label + Active Language State Badge -->
          <div class="flex flex-wrap items-center justify-between gap-2 mb-5 pb-3.5 border-b border-stone-100 dark:border-slate-800/80">
            <span class="font-mono text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
              ${escapeHTML(labelEN)}
            </span>

            <!-- Active Language Indicator Badge (EN or VI) -->
            <span
              id="flip-badge-${cardKey}"
              class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono font-bold border transition-colors ${activeBadgeClass}"
            >
              ${activeBadgeText}
            </span>
          </div>

          <!-- Jitter-free Grid-Stacked 3D Flip Body -->
          <div id="flip-inner-${cardKey}" class="flip-card-inner ${isFlipped ? 'is-flipped' : ''}">
            <!-- Face 1: English Paragraph -->
            <div class="flip-card-face face-en">
              <p class="reading-text text-slate-900 dark:text-slate-100 font-normal">
                ${escapeHTML(textEN)}
              </p>
            </div>

            <!-- Face 2: Vietnamese Paragraph -->
            <div class="flip-card-face face-vi">
              <p class="reading-text text-slate-900 dark:text-slate-100 font-normal">
                ${escapeHTML(textVI)}
              </p>
            </div>
          </div>

          <!-- Card Footer: Dedicated Reveal/Flip Button -->
          <div class="mt-6 pt-4 border-t border-stone-100 dark:border-slate-800/80 flex flex-wrap items-center justify-between gap-3">
            <span class="text-xs text-slate-400 dark:text-slate-500">
              Click anywhere on card to flip language
            </span>

            <button
              type="button"
              onclick="toggleReadingCard('${cardKey}', event)"

              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">

        </div>

    /***********************************************************************
     * 9. PAGES 2..N: INDIVIDUAL SECTION READING PAGE
     ***********************************************************************/
    function renderSectionReadingPage(sec) {
      const allSections = getAllSections();
      const currentIdx = allSections.findIndex(s => s.id === sec.id);
      const prevSec = currentIdx > 0 ? allSections[currentIdx - 1] : null;
      const nextSec = currentIdx < allSections.length - 1 ? allSections[currentIdx + 1] : null;
      const parentPart = DOCUMENT_DATA.parts.find(p => p.id === sec.partId);

      const headerLang = STATE.sectionTitleLangs[sec.id] || STATE.globalLang;
      const primaryHeading = headerLang === 'EN' ? sec.headingEN : sec.headingVI;
      const secondaryHeading = headerLang === 'EN' ? sec.headingVI : sec.headingEN;
      const toggleBtnText = headerLang === 'EN' ? 'Title: EN (Switch to VI)' : 'Tiêu đề: VI (Đổi sang EN)';

      // Primary Verbatim Full Paragraph Card
      const mainCardHTML = renderInteractiveBilingualCard({
        cardKey: `main-${sec.id}`,
        labelEN: `Verbatim Full Paragraph • Section ${sec.code}`,
        labelVI: `Đoạn văn nguyên bản • Mục ${sec.code}`,
        textEN: sec.paragraphEN,
        textVI: sec.paragraphVI,
        isPrimary: true
      });

      // Sentence-by-Sentence Interactive Cards
      const sentenceCardsHTML = sec.sentences.map((sent, idx) =>
        renderInteractiveBilingualCard({
          cardKey: `sent-${sec.id}-${idx}`,
          labelEN: `Sentence ${idx + 1} of ${sec.sentences.length}`,
          labelVI: `Câu ${idx + 1} / ${sec.sentences.length}`,
          textEN: sent.en,
          textVI: sent.vi,
          isPrimary: false
        })
      ).join('');

      // Find Glossary Terms linked to this section
      const sectionTerms = GLOSSARY_TERMS.filter(t => t.sectionId === sec.id || t.sectionLabel.includes(sec.code));

      return `
        <div class="animate-view space-y-8">

                  <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21l5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 016-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 01-3.827-5.802" />
                </svg>
                <span id="sec-header-toggle-text-${sec.id}">${toggleBtnText}</span>
              </button>
            </div>

            <!-- Reading Toolbar: Flip All EN / Flip All VI / Side-by-Side Toggle -->
            <div class="mt-6 pt-5 border-t border-stone-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-2">
                <button
                  onclick="flipAllSectionCards('${sec.id}', false)"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-stone-100 hover:bg-emerald-100 dark:bg-slate-800 dark:hover:bg-emerald-950/70 text-slate-700 dark:text-slate-200 transition-colors"
                >
                  Show All English (EN)
                </button>
                <button
                  onclick="flipAllSectionCards('${sec.id}', true)"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-stone-100 hover:bg-amber-100 dark:bg-slate-800 dark:hover:bg-amber-950/70 text-slate-700 dark:text-slate-200 transition-colors"
                >
                  Show All Vietnamese (VI)

              </div>

              <button
                onclick="toggleSideBySideMode()"
                class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-bold border ${STATE.sideBySideMode ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-stone-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-stone-200 dark:border-slate-700'} transition-colors"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 4.5v15m6-15v15m-10.875 0h15.75c.621 0 1.125-.504 1.125-1.125V5.625c0-.621-.504-1.125-1.125-1.125H4.125C3.504 4.5 3 5.004 3 5.625v12.75c0 .621.504 1.125 1.125 1.125z" />

                <span>${STATE.sideBySideMode ? 'Dual-Column Mode: ON' : 'Side-by-Side (EN + VI)'}</span>

          </div>

          <!-- Primary Interactive Verbatim Paragraph Card -->
          <section class="space-y-3">

          <!-- Key Vocabulary in This Section -->
          ${sectionTerms.length > 0 ? `

              <div class="flex flex-wrap gap-2.5">

          <!-- Bottom Pagination: Previous / Back to Overview / Next Section -->
          <nav class="pt-4 grid grid-cols-1 sm:grid-cols-2 gap-4" aria-label="Section Pagination">
            ${prevSec ? `
              <button
                onclick="navigateTo('${prevSec.id}')"
                class="group p-5 rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 hover:border-emerald-500 text-left transition-all flex items-center gap-4"
              >
                <span class="p-2.5 rounded-xl bg-stone-100 dark:bg-slate-800 group-hover:bg-emerald-600 group-hover:text-white transition-colors">←</span>
                <div class="overflow-hidden">
                  <div class="text-xs font-mono uppercase text-slate-400">Previous Section</div>
                  <div class="font-display font-bold text-slate-900 dark:text-white truncate">${escapeHTML(prevSec.headingEN)}</div>
                </div>
              </button>
            ` : `
              <button
                onclick="navigateTo('overview')"
                class="group p-5 rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 hover:border-emerald-500 text-left transition-all flex items-center gap-4"
              >
                <span class="p-2.5 rounded-xl bg-stone-100 dark:bg-slate-800 group-hover:bg-emerald-600 group-hover:text-white transition-colors">←</span>
                <div>
                  <div class="text-xs font-mono uppercase text-slate-400">Overview</div>
                  <div class="font-display font-bold text-slate-900 dark:text-white">Back to Main Hub</div>
                </div>
              </button>
            `}

            ${nextSec ? `
              <button
                onclick="navigateTo('${nextSec.id}')"
                class="group p-5 rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 hover:border-emerald-500 text-right transition-all flex items-center justify-between gap-4"
              >
                <div class="overflow-hidden flex-1">
                  <div class="text-xs font-mono uppercase text-slate-400">Next Section</div>
                  <div class="font-display font-bold text-slate-900 dark:text-white truncate">${escapeHTML(nextSec.headingEN)}</div>
                </div>
                <span class="p-2.5 rounded-xl bg-stone-100 dark:bg-slate-800 group-hover:bg-emerald-600 group-hover:text-white transition-colors">→</span>
              </button>
            ` : `
              <button
                onclick="navigateTo('glossary')"
                class="group p-5 rounded-2xl bg-amber-500/10 dark:bg-amber-500/15 border border-amber-400/50 hover:border-amber-500 text-right transition-all flex items-center justify-between gap-4"
              >
                <div class="flex-1">
                  <div class="text-xs font-mono uppercase text-amber-700 dark:text-amber-300">Final Step</div>
                  <div class="font-display font-bold text-slate-900 dark:text-white">Interactive Learner Glossary (30 Terms)</div>
                </div>
                <span class="p-2.5 rounded-xl bg-amber-600 text-white">→</span>
              </button>
            `}
          </nav>
        </div>
      `;
    }

    /***********************************************************************
     * 10. PART COMPLETE READING VIEW (#part-1 AND #part-2)
     ***********************************************************************/
    function renderPartReadingPage(partId) {
      const part = DOCUMENT_DATA.parts.find(p => p.id === partId);
      if (!part) return renderOverviewPage();

      const isVI = STATE.globalLang === 'VI';
      const sectionsCardsHTML = part.sections.map(sec => {
        return `
          <div class="space-y-3">
            <div class="flex items-center justify-between px-1">
              <button
                onclick="navigateTo('${sec.id}')"
                class="group inline-flex items-center gap-2 text-left"
              >
                <span class="text-xl">${sec.icon}</span>
                <h2 class="font-display text-xl sm:text-2xl font-bold text-slate-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
                  ${escapeHTML(isVI ? sec.headingVI : sec.headingEN)}
                </h2>
              </button>
              <button
                onclick="navigateTo('${sec.id}')"
                class="text-xs font-semibold text-emerald-700 dark:text-emerald-400 hover:underline shrink-0"
              >
                Open Sentence View →
              </button>
            </div>
            ${renderInteractiveBilingualCard({
              cardKey: `main-${sec.id}`,
              labelEN: sec.headingEN,
              labelVI: sec.headingVI,
              textEN: sec.paragraphEN,
              textVI: sec.paragraphVI,
              isPrimary: true
            })}
          </div>
        `;
      }).join('');

      return `
        <div class="animate-view space-y-8">
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-stone-200/90 dark:border-slate-800 p-6 sm:p-9 shadow-sm">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-mono font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 mb-3">
              ${escapeHTML(part.partNumber)} Complete Reading Mode
            </span>
            <h1 class="font-display text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white leading-tight mb-2">
              ${escapeHTML(part.titleEN)}
            </h1>
            <p class="font-display text-lg sm:text-xl font-bold text-emerald-700 dark:text-emerald-400 mb-5">
              ${escapeHTML(part.titleVI)}
            </p>
            <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-stone-100 dark:border-slate-800">
              <span class="text-sm text-slate-500 dark:text-slate-400">
                Click any paragraph card below to flip between English and Vietnamese, or enable Side-by-Side mode.
              </span>
              <button
                onclick="toggleSideBySideMode()"
                class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs font-bold border ${STATE.sideBySideMode ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-stone-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-stone-200 dark:border-slate-700'} transition-colors"
              >
                <span>${STATE.sideBySideMode ? 'Dual-Column Mode: ON' : 'Side-by-Side (EN + VI)'}</span>

          <div class="space-y-8">
            ${sectionsCardsHTML}
          </div>
        </div>
      `;
    }

    /***********************************************************************
     * 11. FINAL PAGE: INTERACTIVE LEARNER GLOSSARY (30 B2/C1 TERMS)
     ***********************************************************************/
    function openGlossaryTerm(termId) {
      STATE.glossarySearch = '';
      STATE.glossaryPosFilter = 'ALL';
      STATE.glossaryPartFilter = 'ALL';
      STATE.glossaryRevealed[termId] = true;
      navigateTo('glossary', false);
      setTimeout(() => {
        const el = document.getElementById(`glossary-card-${termId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('ring-4', 'ring-amber-500');
          setTimeout(() => el.classList.remove('ring-4', 'ring-amber-500'), 2200);
        }
      }, 100);
    }

    function toggleGlossaryVietnamese(termId) {
      STATE.glossaryRevealed[termId] = !STATE.glossaryRevealed[termId];
      const revealBox = document.getElementById(`glossary-vi-box-${termId}`);
      const btnLabel = document.getElementById(`glossary-vi-btn-${termId}`);
      if (revealBox && btnLabel) {
        const isShown = STATE.glossaryRevealed[termId];
        revealBox.classList.toggle('hidden', !isShown);
        btnLabel.textContent = isShown
          ? 'Hide Vietnamese / Ẩn nghĩa Tiếng Việt'
          : 'Reveal Vietnamese / Xem nghĩa';
      }
    }

    function setAllGlossaryRevealed(revealState) {
      GLOSSARY_TERMS.forEach(t => {
        STATE.glossaryRevealed[t.id] = revealState;
      });
      renderGlossaryGridOnly();
    }

    function handleGlossarySearch(val) {
      STATE.glossarySearch = val;
      renderGlossaryGridOnly();
    }

    function handleGlossaryPosFilter(pos) {
      STATE.glossaryPosFilter = pos;
      renderGlossaryGridOnly();
      updateGlossaryFilterButtons();
    }

    function updateGlossaryFilterButtons() {
      const filters = ['ALL', 'noun', 'verb', 'adjective', 'idiom'];
      filters.forEach(f => {
        const btn = document.getElementById(`pos-filter-btn-${f}`);
        if (btn) {
          const active = STATE.glossaryPosFilter === f;
          btn.className = active
            ? 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-amber-600 text-white shadow-sm transition-all'
            : 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-stone-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-stone-200 dark:hover:bg-slate-700 transition-all';
        }
      });
    }

    function getFilteredGlossaryTerms() {
      const q = STATE.glossarySearch.trim().toLowerCase();
      return GLOSSARY_TERMS.filter(item => {
        const matchesPos =
          STATE.glossaryPosFilter === 'ALL' ||
          item.pos.toLowerCase().includes(STATE.glossaryPosFilter.toLowerCase());

        const matchesQuery =
          !q ||
          item.term.toLowerCase().includes(q) ||
          item.definition.toLowerCase().includes(q) ||
          item.plainEnglish.toLowerCase().includes(q) ||
          item.vietnamese.toLowerCase().includes(q) ||
          item.sectionLabel.toLowerCase().includes(q);

        return matchesPos && matchesQuery;
      });
    }

    function renderGlossaryGridOnly() {
      const container = document.getElementById('glossary-cards-container');
      const countEl = document.getElementById('glossary-count-label');
      if (!container) return;

      const filtered = getFilteredGlossaryTerms();
      if (countEl) {
        countEl.textContent = `Showing ${filtered.length} of ${GLOSSARY_TERMS.length} terms`;
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full rounded-3xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 p-12 text-center">
            <p class="text-lg font-semibold text-slate-700 dark:text-slate-300 mb-2">No matching vocabulary terms found.</p>
            <button
              onclick="STATE.glossarySearch='';STATE.glossaryPosFilter='ALL';renderCurrentView();"
              class="mt-2 px-4 py-2 rounded-xl bg-amber-600 text-white text-sm font-bold"
            >
              Reset Filters
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const isRevealed = !!STATE.glossaryRevealed[item.id];
        return `
          <article
            id="glossary-card-${item.id}"
            class="rounded-3xl bg-white dark:bg-slate-900 border border-stone-200/90 dark:border-slate-800 p-6 sm:p-7 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-5"
          >
            <div class="space-y-4">
              <!-- 1. Target Term in Bold + Phonetic + Part of Speech + Section Link -->
              <div class="flex items-start justify-between gap-3 border-b border-stone-100 dark:border-slate-800 pb-4">
                <div>
                  <div class="flex flex-wrap items-center gap-2">
                    <h3 class="font-display text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">
                      ${escapeHTML(item.term)}
                    </h3>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-300 border border-amber-300/60 dark:border-amber-800">
                      ${escapeHTML(item.pos)}
                    </span>
                  </div>
                  <p class="font-mono text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                    ${escapeHTML(item.phonetic)}
                  </p>
                </div>

                <button
                  onclick="navigateTo('${item.sectionId}')"
                  class="shrink-0 px-2.5 py-1 rounded-lg text-xs font-mono font-semibold bg-stone-100 hover:bg-emerald-100 dark:bg-slate-800 dark:hover:bg-emerald-950 text-slate-600 dark:text-slate-300 transition-colors"
                  title="Jump to Section ${escapeHTML(item.sectionLabel)}"
                >
                  Sec ${escapeHTML(item.sectionLabel)} ↗
                </button>
              </div>

              <!-- 2. Academic / Contextual Definition -->
              <div>
                <div class="text-xs font-mono font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">
                  Academic / Contextual Definition
                </div>
                <p class="text-base text-slate-800 dark:text-slate-200 leading-relaxed">
                  ${escapeHTML(item.definition)}
                </p>
              </div>

              <!-- 3. Plain-English Explanation (Accessible to B1/B2 Learners) -->
              <div class="p-3.5 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/30 border border-emerald-200/60 dark:border-emerald-900/60">
                <div class="text-xs font-mono font-bold uppercase tracking-wider text-emerald-800 dark:text-emerald-400 mb-1">
                  Plain-English Explanation
                </div>
                <p class="text-sm sm:text-base text-slate-700 dark:text-slate-200 leading-relaxed">
                  ${escapeHTML(item.plainEnglish)}
                </p>
              </div>

              <!-- 4. Verbatim Example in Context from the Document -->
              <div class="pl-3.5 border-l-2 border-stone-300 dark:border-slate-700">
                <div class="text-xs font-mono font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">
                  Example in Context (Document Verbatim)
                </div>
                <p class="font-serif italic text-base text-slate-700 dark:text-slate-300 leading-relaxed">
                  "${escapeHTML(item.example)}"
                </p>
              </div>
            </div>

            <!-- 5. Vietnamese Equivalent (Hidden by default behind toggle button) -->
            <div class="pt-3 border-t border-stone-100 dark:border-slate-800">
              <div
                id="glossary-vi-box-${item.id}"
                class="${isRevealed ? '' : 'hidden'} mb-3 p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/50 border border-amber-300/70 dark:border-amber-800/80 transition-all"
              >
                <div class="text-xs font-mono font-bold uppercase tracking-wider text-amber-800 dark:text-amber-400 mb-0.5">
                  Vietnamese Equivalent / Nghĩa Tiếng Việt
                </div>
                <div class="text-lg font-bold text-slate-900 dark:text-white">
                  ${escapeHTML(item.vietnamese)}
                </div>
              </div>

              <button
                type="button"
                onclick="toggleGlossaryVietnamese('${item.id}')"
                class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-stone-100 hover:bg-amber-500 hover:text-white dark:bg-slate-800 dark:hover:bg-amber-600 text-slate-700 dark:text-slate-200 transition-colors"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <span id="glossary-vi-btn-${item.id}">
                  ${isRevealed ? 'Hide Vietnamese / Ẩn nghĩa Tiếng Việt' : 'Reveal Vietnamese / Xem nghĩa'}
                </span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderGlossaryPage() {
      setTimeout(() => {
        renderGlossaryGridOnly();
        updateGlossaryFilterButtons();
      }, 0);

      return `
        <div class="animate-view space-y-8">
          <!-- Glossary Header -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-stone-200/90 dark:border-slate-800 p-6 sm:p-10 shadow-sm">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-xs font-mono font-bold uppercase tracking-wider mb-3">
              <span>Interactive Learner Glossary • B2 / C1 Level</span>
            </div>
            <h1 class="font-display text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-2">
              Specialized Vocabulary & Anti-Aging Concepts
            </h1>
            <p class="font-display text-lg sm:text-xl font-bold text-amber-700 dark:text-amber-400 mb-4">
              Từ Điển Thuật Ngữ Tương Tác Dành Cho Người Học (30 Từ & Cụm Từ Trọng Tâm)
            </p>
            <p class="text-slate-600 dark:text-slate-300 text-base leading-relaxed">
              Each vocabulary card includes its part of speech, an academic definition, a simplified plain-English explanation, the verbatim sentence from the document, and a toggleable Vietnamese translation for active recall testing.
            </p>

            <!-- Search & Filter Controls -->
            <div class="mt-6 pt-6 border-t border-stone-200/80 dark:border-slate-800 space-y-4">
              <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                  <input
                    type="search"
                    value="${escapeHTML(STATE.glossarySearch)}"
                    oninput="handleGlossarySearch(this.value)"
                    placeholder="Search terms, definitions, or Vietnamese meanings..."
                    class="w-full pl-10 pr-4 py-3 rounded-2xl bg-stone-100 dark:bg-slate-800 border border-stone-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm sm:text-base"
                  />
                  <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                  </svg>
                </div>

                <!-- Bulk Reveal / Hide Vietnamese Buttons -->
                <div class="flex items-center gap-2 shrink-0">
                  <button
                    onclick="setAllGlossaryRevealed(true)"
                    class="px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm font-bold bg-amber-500/15 hover:bg-amber-500/25 text-amber-900 dark:text-amber-200 border border-amber-400/40 transition-colors"
                  >
                    Reveal All VI
                  </button>
                  <button
                    onclick="setAllGlossaryRevealed(false)"
                    class="px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm font-bold bg-stone-100 hover:bg-stone-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors"
                  >
                    Hide All VI
                  </button>
                </div>
              </div>

              <!-- Part of Speech Filter Pills -->
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-2">
                  <button id="pos-filter-btn-ALL" onclick="handleGlossaryPosFilter('ALL')">All (30)</button>
                  <button id="pos-filter-btn-noun" onclick="handleGlossaryPosFilter('noun')">Nouns</button>
                  <button id="pos-filter-btn-verb" onclick="handleGlossaryPosFilter('verb')">Verbs</button>
                  <button id="pos-filter-btn-adjective" onclick="handleGlossaryPosFilter('adjective')">Adjectives</button>
                  <button id="pos-filter-btn-idiom" onclick="handleGlossaryPosFilter('idiom')">Idioms / Phrases</button>
                </div>
                <span id="glossary-count-label" class="text-xs font-mono text-slate-500 dark:text-slate-400">
                  Showing 30 of 30 terms
                </span>
              </div>
            </div>
          </div>

          <!-- Glossary Cards Grid -->
          <div id="glossary-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Populated by renderGlossaryGridOnly() -->
          </div>
        </div>
      `;
    }

    /***********************************************************************
     * 12. INITIALIZATION ON WINDOW LOAD
     ***********************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      const initialHash = window.location.hash.replace('#', '');
      if (initialHash) {
        STATE.currentView = initialHash;
      }
      updateTopNavUI();
      renderCurrentView();
    });
  </script>
</body>
</html>
