    /**

     */
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        updateThemeIcons(true);
      } else {
        document.documentElement.classList.remove('dark');
        updateThemeIcons(false);
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcons(isDark);
    }

    function updateThemeIcons(isDark) {
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      if (!sun || !moon) return;

      if (isDark) {
        sun.classList.remove('hidden');
        moon.classList.add('hidden');
      } else {
        sun.classList.add('hidden');
        moon.classList.remove('hidden');
      }
    }

            <div class="flex items-center justify-between mb-6 pb-2 border-b border-stone-200 dark:border-stone-800">
              <h3 class="text-xs uppercase tracking-widest font-bold text-stone-500 dark:text-stone-400">Chapters (${DOCUMENT_DATA.sections.length} Sections)</h3>
              <span class="text-xs text-stone-400 dark:text-stone-500">Click card body to study • Use EN/VI to flip title</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              ${cardsHtml}
            </div>
          </div>

        </div>
      `;
    }

    /**
     * VIEW: SECTION STUDY PAGES (Pages 2 through N)
     */
    function renderSectionPage(sectionId) {
      const secIdx = DOCUMENT_DATA.sections.findIndex(s => s.id === sectionId);
      if (secIdx === -1) return `<div class="p-12 text-center">Section not found. <a href="#overview" class="text-amber-600 underline">Return to overview</a></div>`;

      const sec = DOCUMENT_DATA.sections[secIdx];
      const prevSec = DOCUMENT_DATA.sections[secIdx - 1];
      const nextSec = DOCUMENT_DATA.sections[secIdx + 1];

      const titleLang = AppState.currentSectionTitleLang;
      const activeTitle = titleLang === 'en' ? sec.title_en : sec.title_vi;
      const subTitle = titleLang === 'en' ? sec.title_vi : sec.title_en;

      const paragraphsHtml = sec.paragraphs.map((p, pIdx) => {
        const key = `${sec.id}-${pIdx}`;
        const currentLang = AppState.paragraphCardLangs[key] || 'en';
        const isEn = currentLang === 'en';
        const textContent = isEn ? p.en : p.vi;

        return `
          <div id="para-card-${pIdx}" 
               onclick="toggleParagraphLang('${sec.id}', ${pIdx})"
               tabindex="0"
               role="button"
               aria-label="Click to flip paragraph between English and Vietnamese"
               class="group relative bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 hover:border-amber-400 dark:hover:border-amber-500/70 rounded-2xl p-6 sm:p-8 shadow-sm hover:shadow-md cursor-pointer smooth-transition">
            
            <!-- Card Meta Toolbar -->
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-100 dark:border-stone-800">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500">Clause ${pIdx + 1}</span>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold ${isEn ? 'bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800' : 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800'}">
                  ${isEn ? 'EN Text' : 'VI Bản Dịch'}
                </span>
              </div>

              <div class="flex items-center gap-2">
                <span class="text-xs text-stone-400 dark:text-stone-500 group-hover:text-amber-700 dark:group-hover:text-amber-400 transition-colors hidden sm:inline">
                  Click card to flip
                </span>
                <button onclick="event.stopPropagation(); toggleParagraphLang('${sec.id}', ${pIdx})" 
                        class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-stone-100 dark:bg-stone-800 hover:bg-amber-100 dark:hover:bg-amber-950/70 text-stone-700 dark:text-stone-300 hover:text-amber-900 dark:hover:text-amber-300 border border-stone-200 dark:border-stone-700 transition-colors flex items-center gap-1">
                  <span>🔄</span>
                  <span>Flip to ${isEn ? 'Tiếng Việt' : 'English'}</span>
                </button>
              </div>
            </div>

            <!-- Paragraph Large Display Typography -->
            <div class="fade-enter">
              <p class="font-serif text-lg sm:text-[21px] text-stone-800 dark:text-stone-100 leading-[1.8] sm:leading-[1.85] tracking-normal font-normal">
                ${textContent}
              </p>
            </div>

            <!-- Touch Hint -->
            <div class="mt-4 pt-3 flex items-center justify-between text-xs text-stone-400 dark:text-stone-500 sm:hidden border-t border-stone-50 dark:border-stone-800/60">
              <span>Tap to toggle translation</span>
              <span class="font-medium text-amber-700 dark:text-amber-400">${isEn ? 'Show Vietnamese →' : 'Show English →'}</span>
            </div>

          </div>
        `;
      }).join('');

      return `
        <div class="fade-enter space-y-10">

          <!-- Section Banner -->
          <div class="space-y-4 pb-4 border-b border-stone-200 dark:border-stone-800">
            
            <div class="flex flex-wrap items-center justify-between gap-3">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-stone-200/80 dark:bg-stone-800 text-stone-700 dark:text-stone-300 text-xs font-bold tracking-wider">
                CHAPTER ${sec.num} OF ${DOCUMENT_DATA.sections.length}
              </span>

              <!-- Section Title Language Toggle -->
              <button onclick="toggleSectionTitleLanguage()" 
                      class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-900 hover:bg-stone-50 dark:hover:bg-stone-800 text-xs sm:text-sm font-semibold text-stone-700 dark:text-stone-300 shadow-sm transition-all">
                <span>🌐 Title Lang:</span>
                <span class="font-bold text-amber-700 dark:text-amber-400">${titleLang === 'en' ? 'EN (English)' : 'VI (Tiếng Việt)'}</span>
                <span class="text-stone-400 dark:text-stone-500">↺</span>
              </button>
            </div>

            <h1 class="text-2xl sm:text-4xl font-extrabold font-serif text-stone-900 dark:text-white leading-tight">
              ${activeTitle}
            </h1>

            <p class="text-sm sm:text-base text-stone-500 dark:text-stone-400 font-sans italic">
              ${subTitle}
            </p>

          </div>

          <!-- Immersion Bar -->
          <div class="bg-amber-50/80 dark:bg-amber-950/40 border border-amber-200/80 dark:border-amber-800/60 rounded-2xl p-4 px-5 flex items-center justify-between gap-4 text-xs sm:text-sm text-amber-900 dark:text-amber-200">
            <div class="flex items-center gap-2">
              <span>💡</span>
              <span><strong>Immersion Tip:</strong> Click any card body to flip between original English prose and Vietnamese translation.</span>
            </div>
            <button onclick="toggleAllParagraphs()" class="underline font-bold hover:text-amber-700 dark:hover:text-amber-300 shrink-0">
              Flip All Cards
            </button>
          </div>

          <!-- Paragraph Cards Stack -->
          <div class="space-y-6">
            ${paragraphsHtml}
          </div>

          <!-- Section Footer Navigation Bar -->
          <div class="pt-8 border-t border-stone-200 dark:border-stone-800 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <div>
              ${prevSec ? `
                <button onclick="navigateTo('${prevSec.id}')" class="w-full sm:w-auto inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-900 hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-700 dark:text-stone-300 font-semibold text-sm transition-colors shadow-sm">
                  ← Previous (${prevSec.num})
                </button>
              ` : `<div class="text-xs text-stone-400 dark:text-stone-600">Beginning of Document</div>`}
            </div>

            <button onclick="navigateTo('overview')" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 hover:bg-stone-200 dark:hover:bg-stone-700 text-stone-800 dark:text-stone-200 font-semibold text-sm transition-colors">
              Table of Contents
            </button>

            <div>
              ${nextSec ? `
                <button onclick="navigateTo('${nextSec.id}')" class="w-full sm:w-auto inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold text-sm transition-colors shadow-sm">
                  Next Section (${nextSec.num}) →
                </button>
              ` : `
                <button onclick="navigateTo('glossary')" class="w-full sm:w-auto inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-stone-900 dark:bg-stone-100 hover:bg-stone-800 dark:hover:bg-white text-white dark:text-stone-950 font-semibold text-sm transition-colors shadow-sm">
                  Explore Full Glossary →
                </button>
              `}
            </div>

          </div>

        </div>
      `;
    }

    /**
     * VIEW: INTERACTIVE LEARNER GLOSSARY (28 High-Yield Terms)
     */
    function renderGlossaryPage() {
      const glossaryItemsHtml = DOCUMENT_DATA.glossary.map((item, idx) => {
        return `
          <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-6 shadow-sm hover:shadow-md smooth-transition flex flex-col justify-between">
            
            <div class="space-y-3">
              
              <!-- Term & Part of Speech -->
              <div class="flex items-baseline justify-between gap-2 flex-wrap">
                <div class="flex items-center gap-2">
                  <h3 class="text-xl font-bold font-serif text-stone-900 dark:text-white tracking-tight">${item.term}</h3>
                  <span class="italic text-xs font-medium text-stone-500 dark:text-stone-400 bg-stone-100 dark:bg-stone-800 px-2 py-0.5 rounded">
                    ${item.pos}
                  </span>
                </div>
                <span class="text-xs font-mono font-bold text-stone-400 dark:text-stone-500">#${String(idx + 1).padStart(2, '0')}</span>
              </div>

              <!-- Contextual / Academic Definition -->
              <p class="text-sm text-stone-700 dark:text-stone-300 leading-relaxed">
                <strong class="text-stone-900 dark:text-white">Academic Definition:</strong> ${item.definition}
              </p>

              <!-- Simplified Explanation -->
              <div class="bg-amber-50/80 dark:bg-amber-950/40 border-l-2 border-amber-500 dark:border-amber-400 p-3 rounded-r-lg text-xs leading-relaxed text-amber-950 dark:text-amber-200">
                <span class="font-bold text-amber-900 dark:text-amber-300">In other words:</span> ${item.simple}
              </div>

              <!-- Example In Context -->
              <div class="text-xs text-stone-500 dark:text-stone-400 italic bg-stone-50 dark:bg-stone-800/60 p-3 rounded-lg border border-stone-100 dark:border-stone-800">
                "${item.context}"
              </div>

            </div>

            <!-- Reveal Vietnamese Toggle -->
            <div class="mt-5 pt-4 border-t border-stone-100 dark:border-stone-800">
              <button onclick="toggleGlossaryVi(${idx})" 
                      id="glossary-btn-${idx}"
                      class="w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-stone-100 dark:bg-stone-800 hover:bg-stone-200 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-300 font-semibold text-xs transition-colors">
                <span>👁️ Reveal Vietnamese</span>
              </button>

              <div id="glossary-vi-${idx}" class="hidden mt-3 p-2.5 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-950 dark:text-emerald-200 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs font-bold text-center fade-enter">
                ${item.vi}
              </div>
            </div>

          </div>
        `;
      }).join('');

      return `
        <div class="fade-enter space-y-8">
          
          <div class="space-y-3 text-center sm:text-left">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-stone-200 dark:bg-stone-800 text-stone-800 dark:text-stone-200 text-xs font-bold uppercase tracking-wider">
              Educational Lexicon Repository
            </div>
            <h1 class="text-3xl sm:text-4xl font-black font-display text-stone-900 dark:text-white">
              Interactive Learner Glossary
            </h1>
            <p class="text-stone-600 dark:text-stone-400 text-base max-w-2xl leading-relaxed">
              Curated bank of ${DOCUMENT_DATA.glossary.length} specialized academic terms, metaphysical constructs, and anatomical expressions calibrated for B2 and C1 English learners.
            </p>
          </div>

          <!-- Term Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${glossaryItemsHtml}
          </div>

          <!-- Return Footer -->
          <div class="pt-8 text-center">
            <button onclick="navigateTo('overview')" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-stone-900 dark:bg-stone-100 hover:bg-stone-800 dark:hover:bg-white text-stone-100 dark:text-stone-900 font-bold text-sm shadow transition-colors">
              ← Return to Table of Contents
            </button>
          </div>

        </div>
      `;
    }

    /**
     * INTERACTIVITY HANDLERS
     */

    // Toggle individual card heading on overview page
    function toggleCardHeaderLanguage(event, sectionId) {
      event.stopPropagation();
      const current = AppState.cardHeadingLangs[sectionId] || 'en';
      const next = current === 'en' ? 'vi' : 'en';
      AppState.cardHeadingLangs[sectionId] = next;

      const sec = DOCUMENT_DATA.sections.find(s => s.id === sectionId);
      const titleEl = document.getElementById(`card-title-${sectionId}`);
      if (titleEl && sec) {
        titleEl.textContent = next === 'en' ? sec.title_en : sec.title_vi;
      }
      renderApp();
    }

    // Toggle section title language on study page
    function toggleSectionTitleLanguage() {
      AppState.currentSectionTitleLang = AppState.currentSectionTitleLang === 'en' ? 'vi' : 'en';
      renderApp();
    }

    // Toggle single paragraph card between EN and VI
    function toggleParagraphLang(sectionId, paraIdx) {
      const key = `${sectionId}-${paraIdx}`;
      const current = AppState.paragraphCardLangs[key] || 'en';
      AppState.paragraphCardLangs[key] = current === 'en' ? 'vi' : 'en';
      renderApp();
    }

    // Flip all paragraph cards within the active section
    function toggleAllParagraphs() {
      if (!AppState.view.startsWith('section-')) return;
      const sec = DOCUMENT_DATA.sections.find(s => s.id === AppState.view);
      if (!sec) return;

      const firstKey = `${sec.id}-0`;
      const currentFirst = AppState.paragraphCardLangs[firstKey] || 'en';
      const targetLang = currentFirst === 'en' ? 'vi' : 'en';

      sec.paragraphs.forEach((_, pIdx) => {
        AppState.paragraphCardLangs[`${sec.id}-${pIdx}`] = targetLang;
      });

      renderApp();
    }

    // Toggle Vietnamese translation for a glossary term
    function toggleGlossaryVi(idx) {
      const viBox = document.getElementById(`glossary-vi-${idx}`);
      const btn = document.getElementById(`glossary-btn-${idx}`);
      if (!viBox || !btn) return;

      if (viBox.classList.contains('hidden')) {
        viBox.classList.remove('hidden');
        btn.innerHTML = '<span>✕ Hide Vietnamese</span>';
        btn.classList.add('bg-emerald-100', 'dark:bg-emerald-900', 'text-emerald-900', 'dark:text-emerald-100');
      } else {
        viBox.classList.add('hidden');
        btn.innerHTML = '<span>👁️ Reveal Vietnamese</span>';
        btn.classList.remove('bg-emerald-100', 'dark:bg-emerald-900', 'text-emerald-900', 'dark:text-emerald-100');
      }
    }

    // Initialization routine
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initRouter();
    });
  </script>
</body>
</html>
