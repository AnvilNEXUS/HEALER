kin.", "vi": "nám", "example": "A study on many women also showed that the more starches and sugars consumed, the higher the risk of developing melasma, freckles, and sagging skin.", "section": "habit-1", "paragraph": "p-10"}, {"term": "free radicals", "pos": "plural noun", "definition": "Highly reactive chemical species with an unpaired electron.", "plain": "Reactive particles that can damage cells.", "vi": "gốc tự do", "example": "When blood sugar is high and the body experiences a sudden blood sugar spike, aging-causing free radicals increase.", "section": "habit-1", "paragraph": "p-10"}, {"term": "glycation", "pos": "noun", "definition": "A nonenzymatic reaction in which sugars attach to proteins or other molecules.", "plain": "Sugar attaching to molecules in the body.", "vi": "đường hóa", "example": "At the same time, the process known as glycation occurs, along with many other processes that accelerate aging.", "section": "habit-1", "paragraph": "p-10"}, {"term": "collagen", "pos": "noun", "definition": "A structural protein found in skin and other connective tissues.", "plain": "A protein that helps support body tissues.", "vi": "collagen", "example": "As a result, your collagen is severely destroyed.", "section": "habit-1", "paragraph": "p-11"}, {"term": "elasticity", "pos": "noun", "definition": "The ability of a material or tissue to regain its shape after stretching.", "plain": "The ability to stretch and spring back.", "vi": "độ đàn hồi", "example": "The collagen in your body supports your skin, keeping it firm and youthful, helps your hair stay soft, and gives your joints their elasticity.", "section": "habit-1", "paragraph": "p-11"}, {"term": "stabilize", "pos": "verb", "definition": "To make something remain within a relatively steady range.", "plain": "To keep something steady.", "vi": "ổn định", "example": "In the long run, between a person who knows how to use exercise to stabilize blood sugar and a person who lets their blood sugar rise freely, there will undoubtedly be a massive difference in the rate of aging.", "section": "habit-2", "paragraph": "p-16"}, {"term": "debunked", "pos": "verb, past participle", "definition": "Shown to be false or unsupported by evidence.", "plain": "Shown to be mistaken.", "vi": "bác bỏ", "example": "But today, that view has been debunked, and the trend of exercising right after a meal has become popular as a healthy habit.", "section": "habit-2", "paragraph": "p-19"}, {"term": "drowsiness", "pos": "noun", "definition": "A state of feeling sleepy or having reduced alertness.", "plain": "Feeling sleepy.", "vi": "cơn buồn ngủ", "example": "The intense drowsiness that hits after a meal is primarily due to a spike in blood sugar.", "section": "habit-2", "paragraph": "p-20"}, {"term": "sympathetic nervous system", "pos": "noun phrase", "definition": "The division of the autonomic nervous system associated with alertness and physiological arousal.", "plain": "The body's system for becoming active and alert.", "vi": "hệ thần kinh giao cảm", "example": "Problems like difficulty sleeping or waking up near dawn are actually signs that your sympathetic nervous system is too active.", "section": "habit-3", "paragraph": "p-23"}, {"term": "parasympathetic nervous system", "pos": "noun phrase", "definition": "The autonomic division associated with resting and digestive functions.", "plain": "The body's system for rest and digestion.", "vi": "hệ thần kinh phó giao cảm", "example": "If the sympathetic nervous system acts like a gas pedal, then you also have the parasympathetic nervous system acting as the brakes.", "section": "habit-3", "paragraph": "p-24"}, {"term": "inflammation", "pos": "noun", "definition": "A biological response to tissue injury or harmful stimuli.", "plain": "The body's response to damage or irritation.", "vi": "viêm", "example": "An excess of free radicals and AGEs will cause inflammation and internal damage to the body.", "section": "habit-3", "paragraph": "p-23"}, {"term": "vicious cycle", "pos": "noun phrase", "definition": "A sequence in which a problem produces effects that intensify the original problem.", "plain": "A problem that keeps making itself worse.", "vi": "vòng tuần hoàn luẩn quẩn", "example": "Insomnia then increases stress, creating a vicious cycle.", "section": "habit-3", "paragraph": "p-26"}, {"term": "biological rhythm", "pos": "noun phrase", "definition": "A recurring pattern of activity or function within an organism.", "plain": "The body's repeating natural schedule.", "vi": "nhịp sinh học", "example": "Just by living your evening according to the biological rhythm suited for human DNA, youthfulness and health will naturally follow.", "section": "habit-3", "paragraph": "p-29"}, {"term": "infrared rays", "pos": "noun phrase", "definition": "Electromagnetic radiation with wavelengths longer than visible red light.", "plain": "Invisible radiation beyond the red end of visible light.", "vi": "tia hồng ngoại", "example": "That is getting exposure to infrared rays to boost melatonin, a powerful antioxidant.", "section": "habit-4", "paragraph": "p-31"}, {"term": "antioxidant", "pos": "noun", "definition": "A substance that inhibits oxidation or counteracts reactive oxidizing species.", "plain": "A substance that helps limit oxidation.", "vi": "chất chống oxy hóa", "example": "That is getting exposure to infrared rays to boost melatonin, a powerful antioxidant.", "section": "habit-4", "paragraph": "p-31"}, {"term": "oxidative stress", "pos": "noun phrase", "definition": "An imbalance between oxidizing activity and the body's ability to counteract it.", "plain": "More oxidative activity than the body can handle.", "vi": "căng thẳng oxy hóa", "example": "The root cause of disease and rapid aging stems from excessive oxidative stress and free radical damage.", "section": "habit-4", "paragraph": "p-32"}, {"term": "pineal gland", "pos": "noun phrase", "definition": "A small endocrine gland in the brain that produces melatonin.", "plain": "A small gland in the brain that makes melatonin.", "vi": "tuyến tùng", "example": "At night, when you spend time in an environment with minimal white light from phones, TVs, and LED lights, melatonin will be secreted by the pineal gland.", "section": "habit-4", "paragraph": "p-35"}, {"term": "mitochondria", "pos": "plural noun", "definition": "Cell structures involved in energy production and other cellular processes.", "plain": "Parts of cells that help produce energy.", "vi": "ti thể", "example": "The vast majority of melatonin in the body is actually located inside the mitochondria.", "section": "habit-4", "paragraph": "p-35"}, {"term": "incandescent", "pos": "adjective", "definition": "Producing visible light as a result of being heated.", "plain": "Glowing because of heat.", "vi": "sợi đốt", "example": "In the old days, >> [music] >> our parents and grandparents often used incandescent light bulbs, also known as filament bulbs.", "section": "habit-4", "paragraph": "p-36"}, {"term": "dehydration", "pos": "noun", "definition": "A condition in which the body has insufficient water.", "plain": "Not having enough water in the body.", "vi": "thiếu nước", "example": "If you don't replenish the water right after waking up, you can fall into a state of dehydration, which makes your blood thick and viscous in the morning.", "section": "habit-5", "paragraph": "p-42"}, {"term": "viscous", "pos": "adjective", "definition": "Having a thick consistency and resisting flow.", "plain": "Thick and slow to flow.", "vi": "đặc sệt", "example": "If you don't replenish the water right after waking up, you can fall into a state of dehydration, which makes your blood thick and viscous in the morning.", "section": "habit-5", "paragraph": "p-42"}, {"term": "peristalsis", "pos": "noun", "definition": "Coordinated waves of muscular contraction that move contents through the digestive tract.", "plain": "Muscle movements that push food along the gut.", "vi": "nhu động ruột", "example": "For food and water to move smoothly along that long path, muscle contractions known as peristalsis are required.", "section": "habit-5", "paragraph": "p-43"}, {"term": "atrophy", "pos": "verb", "definition": "To waste away or decrease in size, especially through disuse.", "plain": "To shrink or weaken over time.", "vi": "teo đi", "example": "In other words, if you don't actively exercise, the muscle groups in your legs and lower body will increasingly atrophy.", "section": "habit-6", "paragraph": "p-49"}, {"term": "resorption", "pos": "noun", "definition": "The breakdown and absorption of tissue, especially bone, by the body.", "plain": "The body breaking down and taking back tissue.", "vi": "tiêu xương", "example": "Among these, the facial bones are particularly prone to resorption.", "section": "characteristic-1", "paragraph": "p-57"}, {"term": "laxity", "pos": "noun", "definition": "A state of looseness or reduced firmness in a tissue or structure.", "plain": "Looseness.", "vi": "sự lỏng lẻo", "example": "Second, it's due to the laxity of the ligaments connecting the facial bones to the skin.", "section": "characteristic-1", "paragraph": "p-58"}, {"term": "micronutrients", "pos": "plural noun", "definition": "Nutrients required by the body in small quantities, such as vitamins and minerals.", "plain": "Nutrients needed in tiny amounts.", "vi": "vi chất", "example": "Additionally, you can add a teaspoon of yogurt to the mixture to supplement some micronutrients that help improve the microbiome on your skin.", "section": "characteristic-2", "paragraph": "p-67"}], "source": {"url": "https://docs.google.com/document/d/1u_2EOD93B-0hbsjVCBfnA64bP1XnysrFlnN2s1DV6Pw/edit", "revision": "AHj4eMTXLF0JI_LjBdqAeZ691b7bPv89hCLtd5ZZXM_Ils43UbRdkwdJBMQnTV8L9YCUInfxwrTiJmSnUj6Ey_KBYKTRNfyp-wQNBhlD17A", "date": "2026-11-17", "tabs": {"en": [{"text": "6 DAILY HABITS OF THE JAPANESE\n", "style": "HEADING_2"}, {"text": "THAT KEEP THE BODY LOOKING YOUNG!\n", "style": "NORMAL_TEXT"}, {"text": "Introduction\n", "style": "HEADING_2"}, {"text": "Welcome to Tom Bus. Thank you for always tuning in to Tom's channel. You probably have people around you who are the same age as you but always look youthful. When attending class reunions, sometimes you meet people who used to be the handsome boys or the beauty queens back in the day. Yet, now they have visibly aged.\n", "style": "NORMAL_TEXT"}, {"text": "Conversely, there are also those who did not stand out much in their youth, perhaps not even leaving much of an impression. But the older they get, the more beautiful or distinguished they become. This happens because as we age, the impact of our genetics gradually decreases. Meanwhile, the influence of our lifestyle and dietary habits steadily increases. In other words, no matter how good your genetics were in your youth, over time, it is difficult to fight against the accumulated damage of unhealthy living habits repeated over many years. And then, the body rapidly ages before you even realize it.\n", "style": "NORMAL_TEXT"}, {"text": "Therefore, the older you get, the more you need to invest in lifestyle habits that help you stay young and disease-free. If you can do this, you can create a distinct difference in your youthful appearance and superior health compared to those around you. Today's video will share important information for those of you who want to keep your bodies consistently youthful and healthy. At the same time, it aims to help you achieve an appearance that others perceive as younger than your actual age.\n", "style": "NORMAL_TEXT"}, {"text": "Today's informative content consists of two parts. Part one. The top six surprising habits of many Japanese people who remain youthful even at the age of 80. They maintain these practices every single day. Part two. Alarming habits. People who look up to 10 years older than their actual age share these three commonalities, which you should know in order to avoid them. So, let's get started with Tom on part one. Japanese people remain outstandingly youthful even at 80 by practicing these six surprising daily habits. Please watch until the end so you don't miss any important information.\n", "style": "NORMAL_TEXT"}, {"text": "Part 1: Top 6 Surprising Habits That Keep Japanese People Youthful at 80\n", "style": "HEADING_2"}, {"text": "Habit number one\n", "style": "HEADING_3"}, {"text": "People who are 80 years old but still exceptionally youthful typically eat very few carbohydrates, meaning starches and sugars. Dear viewers, starches and sugars are certainly an important energy source for the body. However, current studies on extending lifespan and maintaining youthfulness increasingly suggest reducing the intake of starches and sugars to live a youthful and healthy life. The reason is that starches and sugars can cause damage to the body and potentially accelerate the aging process.\n", "style": "NORMAL_TEXT"}, {"text": "In particular, eating too much starch and sugar can damage the skin. A study on many women also showed that the more starches and sugars consumed, the higher the risk of developing melasma, freckles, and sagging skin. It may sound surprising, but just by increasing your starch and sugar intake by 50 grams, your risk of melasma can increase by about 1.3 times. When you eat a lot of starches and sugars, your blood sugar easily spikes. When blood sugar is high and the body experiences a sudden blood sugar spike, aging-causing free radicals increase. At the same time, the process known as glycation occurs, along with many other processes that accelerate aging.\n", "style": "NORMAL_TEXT"}, {"text": "As a result, your collagen is severely destroyed. The collagen in your body supports your skin, keeping it firm and youthful, helps your hair stay soft, and gives your joints their elasticity. When collagen is damaged, many health problems can arise. In particular, the facial area is where this is most noticeable, so the negative effects of damaged collagen will quickly be noticed by others from the outside. In the long run, if you compare someone who regularly eats a lot of starches every day and lives with high blood sugar for many years with someone who knows how to manage their starch intake and avoids sudden blood sugar spikes, you can easily imagine a massive difference in their external appearance as well as their internal health condition.\n", "style": "NORMAL_TEXT"}, {"text": "To maintain a healthy, long-lasting youthful body and limit illnesses, it is crucial to reduce your starch intake. If you previously ate a full bowl of rice, try reducing it to half. Or stop eating white rice for dinner. Instead, get your main source of carbohydrates from various vegetables and fruits. This is a simple and easy way to start. At first, reducing starches might make you feel uncomfortable, but if you maintain it for 1 to 2 months, your body will gradually get used to it. By then, you will realize that not eating a lot of rice isn't a problem at all. This feeling is usually only truly understood by those who have tried it. So Tom advises you to give it a try for 1 month. You will be surprised that you are perfectly fine without eating a lot of white rice.\n", "style": "NORMAL_TEXT"}, {"text": "White rice and white bread are low-fiber foods, so they easily cause blood sugar to spike quickly. Instead, try to choose brown rice or whole wheat bread. These types of food help limit the spike in blood sugar. However, for those viewers who are sensitive [music] to gluten or allergic to gluten, even whole wheat bread should be limited. And with that, the first habit of reducing carbohydrate intake concludes here.\n", "style": "NORMAL_TEXT"}, {"text": "Habit number two\n", "style": "HEADING_3"}, {"text": "Next, Tom will introduce the second habit. A surprising habit that many Japanese people who remain remarkably youthful at 80 still maintain every day. That is walking for 15 minutes after eating. Dear viewers, exercising right within 15 minutes after a meal is a simple habit that can help you stay young and healthy for many years to come. Because by exercising right after eating, you can prevent your blood sugar from spiking suddenly. A healthy body is one with stable blood sugar levels that do not spike abnormally.\n", "style": "NORMAL_TEXT"}, {"text": "When eating starches and sugars, blood sugar usually starts to rise about 15 to 30 minutes later. If you walk during that time, your muscles will use this sugar as energy. By doing so, your muscles consume the sugar and help you avoid a sudden spike in blood sugar. In the long run, between a person who knows how to use exercise to stabilize blood sugar and a person who lets their blood sugar rise freely, there will undoubtedly be a massive difference in the rate of aging.\n", "style": "NORMAL_TEXT"}, {"text": "You don't need to go far after a meal; about 20 minutes or around 2,000 steps is a good reference goal. And if you walk briskly, the effectiveness will be even higher. The most important thing is to start within 15 minutes after finishing your meal. The 15 minutes after a meal is a very crucial golden window. Please remember this point. Tom thinks this habit is very easy to implement, so there is no reason not to do it. If you rest for too long before walking, your blood sugar will have already risen, so the blood sugar stabilizing effect will be reduced. If you cannot go outside because of hot weather, simply walking in place is effective enough.\n", "style": "NORMAL_TEXT"}, {"text": "You don't need exhausting changes, just a small change is enough; but such small accumulations will bring huge benefits in the future. Moreover, you don't necessarily have to walk; since the goal is to use muscles to stabilize blood sugar, doing squats is also highly effective. In fact, it has been shown that just doing squats can help suppress a blood sugar spike. If you don't have time to walk after a meal, make it a habit to do squats in place for 2 minutes. Tom himself has gotten used to this. After eating, I almost automatically do squats. If I don't squat, I even feel uncomfortable, like something is missing. Once it becomes a habit, it is very simple, so Tom hopes everyone will give it a try.\n", "style": "NORMAL_TEXT"}, {"text": "Especially as you get older, managing blood sugar is very important for preventing diseases. When blood sugar is controlled, the aging-promoting process known as glycation will have a hard time progressing. Thanks to this, you can slow down the aging rate of your entire body. Make exercising right after eating a daily habit. In the past, there was a belief that exercising immediately after eating was bad. But today, that view has been debunked, and the trend of exercising right after a meal has become popular as a healthy habit. Therefore, you can rest assured when walking or doing exercises like squats after a meal.\n", "style": "NORMAL_TEXT"}, {"text": "Additionally, if you currently experience excessive sleepiness after eating, making it difficult to concentrate on studying or working, you should definitely try this habit. The intense drowsiness that hits after a meal is primarily due to a spike in blood sugar. If you exercise to suppress that sudden blood sugar spike, your blood sugar will be more stable, and the feeling of sleepiness after a meal will also significantly decrease. This concludes the second habit, which is walking within 15 minutes after eating.\n", "style": "NORMAL_TEXT"}, {"text": "Habit number three\n", "style": "HEADING_3"}, {"text": "Next is the third surprising habit that Tom wants to introduce. A habit that remarkably youthful 80-year-old Japanese people maintain every day. That is dedicating the evening to slowing down, staying quiet, and relaxing. Did you know that sleep quality is profoundly linked to aging? When it comes to aging, we often immediately think of foods that keep us young or foods that make us age faster, tying anti-aging efforts to our diet. But in reality, sleep quality impacts aging in a deeper, broader, and more significant way. Whether you sleep well or not depends on how you spend the two hours before going to bed.\n", "style": "NORMAL_TEXT"}, {"text": "Problems like difficulty sleeping or waking up near dawn are actually signs that your sympathetic nervous system is too active. Imagine the sympathetic nervous system as the gas pedal of a car, keeping the body in an active state. But if the sympathetic nervous system is hyperactive, free radicals in the body can easily increase. At the same time, AGEs can easily accumulate. An excess of free radicals and AGEs will cause inflammation and internal damage to the body. This is the reason why the body ages rapidly while also increasing the risk of disease. Specifically, if your sympathetic nervous system is hyperactive at night, studies show that inflammation and damage can spike even higher than during the day.\n", "style": "NORMAL_TEXT"}, {"text": "If the sympathetic nervous system acts like a gas pedal, then you also have the parasympathetic nervous system acting as the brakes. During the day, the body hits the gas to operate, helping you stay alert and active. But at night, you need the parasympathetic nervous system to act like a brake, helping the body calm down and relax. However, if the sympathetic nervous system is too strong, the parasympathetic nervous system will weaken. The result is that you have a hard time relaxing at night and struggle to get quality sleep. The evening is supposed to be when the brakes take precedence so the body can slow down and unwind. But when the brakes are weak, the body revs the engine instead, forcing your body to tense up unreasonably. This creates massive stress and makes it hard for you to sleep soundly.\n", "style": "NORMAL_TEXT"}, {"text": "Poor quality sleep causes many negative effects on the body, such as lowering immunity and increasing the burden on the heart. Furthermore, when oxidative radicals increase, the skin can easily deteriorate, making you look older than your age. Good sleep will help prevent aging from both the inside and the outside. Moreover, simply having the sympathetic nervous system activated at night—a time when the parasympathetic nervous system should be dominant—goes directly against the natural DNA mechanism of the human body. Being forced into this reverse operation puts the body under intense stress. This stress, in turn, causes your body to panic and hit the gas even harder, meaning your sympathetic nervous system will become even more active.\n", "style": "NORMAL_TEXT"}, {"text": "The result is that your insomnia worsens. Insomnia then increases stress, creating a vicious cycle. Moreover, this brutal cycle doesn't stop there. When the sympathetic nervous system is activated and free radicals are produced, cells get damaged, and inflammation occurs; this very inflammation then triggers new inflammatory responses. Just having stimulating activities in the evening that make the sympathetic nervous system dominant might make you think you are only sacrificing a little bit of sleep for the night. If that were the only impact, it would be fine. But the vicious cycles inside the body that cannot be seen with the naked eye are still raging and causing even more destruction.\n", "style": "NORMAL_TEXT"}, {"text": "Many of us modern people are busy with work during the day, so usually, it's only in the evening that we have time for ourselves. Many people go out until midnight. Many stay home but scroll through their phones late into the night. Nocturnal behaviors like these are fundamentally misaligned with natural human DNA. Frankly speaking, it is abnormal according to the evolutionary biological design of our bodies. It will increase the activity of the sympathetic nervous system, a system that shouldn't be highly active in the evening. And then, before you know it, your body has gradually worn down and deteriorated.\n", "style": "NORMAL_TEXT"}, {"text": "However, looking at it positively, people who maintain youthful, disease-free bodies usually have a calm and relaxing evening lifestyle. They try to keep the room lighting moderate, play relaxing music, and enjoy a slow-paced time. Please try to finish all your busy tasks two hours before going to bed. The two hours before bed should be a time to limit white light. Live these two hours like our ancestors did in the past. Slowing down your activities to relax, stretching your body, or practicing meditation or yoga is also very good.\n", "style": "NORMAL_TEXT"}, {"text": "Just by living your evening according to the biological rhythm suited for human DNA, youthfulness and health will naturally follow. Of course, adopting this lifestyle right from the start might be difficult for many of us. But there are still many things you can do. Such as limiting blue light exposure and refraining from touching your phone during the two hours before bed. By gradually restoring a natural human lifestyle little by little, you will maintain your health and long-lasting youthfulness. Please relax and slow down in the evening to avoid stimulating the sympathetic nervous system.\n", "style": "NORMAL_TEXT"}, {"text": "Habit number four\n", "style": "HEADING_3"}, {"text": "Next, let's move on to the fourth habit that many 80-year-old Japanese people who remain youthful practice every day. That is getting exposure to infrared rays to boost melatonin, a powerful antioxidant. Did you know there is a condition called sundown syndrome? This condition commonly occurs in elderly people with Alzheimer's and dementia. When the sun sets, 45% of people with Alzheimer's and dementia begin to feel extremely fatigued. Why do you think this happens? Because they are depleted of melatonin. Their bodies do not have enough melatonin. This severely degrades the quality of their sleep.\n", "style": "NORMAL_TEXT"}, {"text": "Melatonin is also known as the sleep hormone. When the body produces enough melatonin, sleep quality will improve. However, melatonin doesn't just improve sleep; it is also a remarkably powerful antioxidant that helps prevent aging and fight off diseases. When Tom mentions antioxidants, what comes to your mind? The root cause of disease and rapid aging stems from excessive oxidative stress and free radical damage. Normally, our bodies are designed to protect themselves against these things. And the way the body protects itself is through an antioxidant network.\n", "style": "NORMAL_TEXT"}, {"text": "Your body is healthy and youthful thanks to enzymes that act as antioxidants. Therefore, in our diets, we often try to supplement vitamins and foods with antioxidant properties. People focus on supplementing Vitamin C, Vitamin E, and glutathione. However, there is an antioxidant that is even more powerful and effective, helping to protect the body from both the inside and the outside. That is melatonin. Because melatonin is not just an antioxidant that keeps your body youthful; it simultaneously activates other antioxidant networks, including glutathione.\n", "style": "NORMAL_TEXT"}, {"text": "Melatonin is twice as strong as Vitamin E, and we all know Vitamin E is very important for the skin, helps protect cardiovascular health, and limits the formation of disease within artery walls. Therefore, melatonin is a very potent anti-aging substance. It also prompts the body to boost the production of other antioxidants. The best part is that just by adjusting your lifestyle habits, you can naturally boost the production of this powerful antioxidant yourself. Dear viewers, melatonin is the sleep hormone, also known as the hormone of darkness.\n", "style": "NORMAL_TEXT"}, {"text": "At night, when you spend time in an environment with minimal white light from phones, TVs, and LED lights, melatonin will be secreted by the pineal gland. However, according to recent studies in recent years, the melatonin secreted by the pineal gland is actually just a backup or supplementary system. The vast majority of melatonin in the body is actually located inside the mitochondria. The biggest stimulus that helps the body produce melatonin inside the mitochondria is infrared rays from sunlight and natural firelight. Certain wavelengths of sunlight and infrared rays from firelight stimulate melatonin production. Through this, your body receives powerful anti-aging effects, reduced inflammation, cancer prevention, and at the same time, quality sleep.\n", "style": "NORMAL_TEXT"}, {"text": "Have you ever noticed why you feel relaxed and tend to sleep better when sitting in front of a wood-burning stove or a campfire? That is because natural fire emits [music] infrared rays that make your body boost melatonin production. You might also find yourself more relaxed and sleeping better when spending your evening by candlelight. This is also because the infrared rays from the candle help secrete melatonin. In the old days, >> [music] >> our parents and grandparents often used incandescent light bulbs, also known as filament bulbs. Tom thinks many of you probably have many memories of this type of light bulb. This is a dim orange or dim red light that generates illumination by heating a filament. And incandescent bulbs also emit beneficial infrared rays for the body.\n", "style": "NORMAL_TEXT"}, {"text": "Unfortunately, modern life is gradually moving away from incandescent bulbs. We have entered the era of artificial lighting. LED lights appear everywhere, from the living room to the bedroom. Even nightlights use LEDs. Not to mention the blue light from computers and smartphones. This causes the natural source of melatonin in our modern bodies to decline severely. So, dear viewers, the powerful antioxidant readily available inside your body is melatonin. It is not only the sleep hormone that comes from darkness, but it is also the hormone derived from infrared rays, which helps fight inflammation, repair mitochondria, prevent aging from the inside, and especially helps [music] you get deep sleep.\n", "style": "NORMAL_TEXT"}, {"text": "Exposure to sunlight during the day also helps the body produce melatonin. When outdoors, even if you stand in the shade or under a tree canopy, your body still receives indirect infrared rays. Grass, clouds, and soil also reflect infrared waves, so you don't necessarily have to sunbathe under the scorching sun at 12:00 PM. With a tropical climate like Vietnam's, you just need to get some morning sun, while spending time in natural outdoor environments, and sitting relaxed under a tree to absorb indirect infrared rays reflected by the leaves and grass. We modern people are exposed far too much to artificial lighting such as LED lights and blue light from phones and computers. Tom himself is no exception.\n", "style": "NORMAL_TEXT"}, {"text": "There are days when Tom sits indoors all day in front of a computer, or at work, sitting at a desk staring at a screen. By the time I get home, it's already dark. Spending more time outdoors, connecting with nature and plants, along with soaking up the morning sun, is a good habit for the body to receive infrared light and boost melatonin secretion, fighting aging from within. This is arguably almost as important as eating a healthy diet. The more you learn about melatonin, the more you will realize that it is not simply just good for sleep, but it also helps the body improve in many aspects. The more melatonin your body produces, the significantly lower your risk of disease becomes.\n", "style": "NORMAL_TEXT"}, {"text": "Furthermore, you can gain extra benefits from infrared rays by exposing yourself to natural firelight in the evening. You can also relax by candlelight at night. If your house has a spacious yard, build a small wood fire. Especially on winter nights, gathering around a wood fire with your family will be very good for your health. Or if you can change your light bulbs, if possible, gradually replace your home's lighting system with incandescent bulbs, or at the very least, use incandescent bulbs in the bedroom.\n", "style": "NORMAL_TEXT"}, {"text": "Habit number five\n", "style": "HEADING_3"}, {"text": "Next is the fifth habit that Tom wants to introduce. A surprising habit that many Japanese people who are 80 years old but still youthful and healthy maintain every day. That is drinking a full glass of water in one continuous gulp right after waking up in the morning. Do you drink this water after waking up every morning? Our bodies lose quite a bit of water while sleeping. If you don't replenish the water right after waking up, you can fall into a state of dehydration, which makes your blood thick and viscous in the morning. When the blood is thick, circulation becomes poor, making it difficult for nutrients and oxygen to be transported to cells throughout the body. The result is damaged cells and gradual aging of the body.\n", "style": "NORMAL_TEXT"}, {"text": "To avoid this situation, Tom hopes you will drink your first glass of water right after waking up. The habit of drinking a full glass of water in one continuous gulp as soon as you wake up will send a signal to your stomach, which in turn gets your intestines working. The intestines in our bodies are very long, about 9 meters. For food and water to move smoothly along that long path, muscle contractions known as peristalsis are required. When peristalsis weakens, food and water easily stagnate in the intestines, causing the stool to become hard. The hard stool continues to absorb water in the intestines and then sticks to the [music] intestinal walls, remaining stuck there.\n", "style": "NORMAL_TEXT"}, {"text": "This phenomenon is called impacted stool, and it can degrade the function of the entire digestive system. When impacted stool builds up, it continues to obstruct intestinal function, increasing the risk of constipation and indigestion. Moreover, if constipation is prolonged, harmful substances can accumulate in the body and negatively affect your health. Many studies also show that the risk of colon cancer can increase. To mitigate these issues, it is essential to promote intestinal peristalsis and help the body fully excrete stool.\n", "style": "NORMAL_TEXT"}, {"text": "Therefore, the habit of drinking a glass of water right after waking up becomes very important. Drinking a full glass of water in one gulp helps the intestines move smoothly, pushing the impacted stool on the intestinal walls out, thereby reducing the risk of constipation. To prevent and improve constipation, it is crucial to drink it in one continuous gulp. Please try applying this. In addition, this glass of water also helps wake up the intestines and makes the sympathetic nervous system more dominant during the day.\n", "style": "NORMAL_TEXT"}, {"text": "The morning, right after waking up, is the turning point for the autonomic nervous system in your body. As you and Tom discussed earlier, the autonomic nervous system consists of the sympathetic and parasympathetic nervous systems. At night, the parasympathetic nervous system is dominant; the body applies the brakes, relaxes, and undergoes recovery. When waking up, to make the body active, the sympathetic system takes over. The body steps on the gas to start the new day in an alert and dynamic way.\n", "style": "NORMAL_TEXT"}, {"text": "The morning, right upon waking, is the exact moment the autonomic nervous system switches gears, and at this time, bowel movements have a huge influence. Properly stimulating the intestines helps regulate the autonomic nervous system, and a small glass of water, about 200 ml, drunk continuously in one gulp right after waking up can deliver that effect. Finally, there is one point to note: even though Tom said to drink it in one continuous gulp, please don't drink so forcefully that you choke or have trouble breathing; just drink steadily and continuously, swallowing gently. The explanation about drinking a glass of water after waking up concludes here.\n", "style": "NORMAL_TEXT"}, {"text": "Habit number six\n", "style": "HEADING_3"}, {"text": "Next, I want to introduce a sixth surprising habit that Japanese people who look outstandingly young at 80 often maintain. That is training their muscles twice a week. Incorporating muscle training into your schedule twice a week is very important for maintaining health and keeping a youthful appearance. Especially after the age of 30, muscle mass in the legs and lower body will naturally decrease by about 1% each year. In other words, if you don't actively exercise, the muscle groups in your legs and lower body will increasingly atrophy.\n", "style": "NORMAL_TEXT"}, {"text": "Muscles act as a storage reservoir for sugar in the blood. Therefore, when [sniffle] muscle decreases, the space to store sugar in the body also decreases. The result is that sugar continues to remain in the blood, easily causing high blood sugar. Conversely, when you build muscle through exercise, your blood sugar will be more stable. Thanks to this, you can also suppress the processes that cause aging and disease. Maintaining and strengthening muscle, especially in the legs and lower body, not only helps you sustain long-term youthfulness but also prevents becoming bedridden in old age. At the same time, it minimizes the risk of diabetes and other diseases.\n", "style": "NORMAL_TEXT"}, {"text": "And rest assured, muscle training doesn't require complex equipment or professional coaching programs. You only need to do simple exercises targeting large muscle groups like the chest, abdomen, and thighs; for instance, doing push-ups, crunches, or squats at home is enough. The amount of exercise doesn't need to be excessive either. Training for about 15 to 20 minutes per session, just enough to feel moderately tired, is fine. As long as you maintain two sessions a week, within about two months, your muscle mass will gradually increase.\n", "style": "NORMAL_TEXT"}, {"text": "The most important thing is to exercise moderately so that you can maintain it long-term. Compared to extremely rigorous workouts, consistency is the decisive factor for improving health. By putting in a manageable level of effort, you will easily be able to stick with it. This is a healthy anti-aging habit, so please try to practice it weekly.\n", "style": "NORMAL_TEXT"}, {"text": "Part 2: What Causes You to Look Up to 10 Years Older?\n", "style": "HEADING_2"}, {"text": "Part two. What causes someone to look up to 10 years older? The common characteristics of people with an aged appearance, which you should know to avoid. In this section, Tom will explain in a very easy-to-understand way the common traits among people who look much older than their actual age. Do you think you look older or younger than your real age? Regardless of whether you care about your appearance or not, being told you look older than your age is something no one wants. By being clearly aware of the points introduced today and taking anti-aging care steps, Tom believes you will understand what you need to do to achieve a more youthful appearance.\n", "style": "NORMAL_TEXT"}, {"text": "Let's think together: what determines a youthful appearance? When looking at others, what makes you feel they look older than their age? Or conversely, what is it about them that makes you feel they look younger than their age? A large-scale opinion survey showed that the factors making a person look older than their age can be summarized into these three things. Sagging of the entire face. Eye bags and wrinkles around the eyes. Deep and sagging laugh lines. Now, Tom will briefly explain each factor.\n", "style": "NORMAL_TEXT"}, {"text": "Characteristic Number One: Sagging of the entire face\n", "style": "HEADING_3"}, {"text": "The first characteristic that makes you look older than your age is the sagging of the entire face. There are three main reasons why the face becomes saggy, thereby creating an aged impression. First, it is due to bone loss, as the foundation that shapes the face diminishes. The older you get, the more bone mass decreases. Among these, the facial bones are particularly prone to resorption. When bone diminishes, the skin and muscles that were once supported become loose, leading to sagging.\n", "style": "NORMAL_TEXT"}, {"text": "Second, it's due to the laxity of the ligaments connecting the facial bones to the skin. Recent research shows that sagging ligaments can directly affect skin sagging. Third, it is due to the loss of facial fat. When facial fat decreases, sagging becomes more pronounced. Especially as age increases, skinny people tend to look older more easily. This is primarily due to this loss of facial fat.\n", "style": "NORMAL_TEXT"}, {"text": "Do you often hear the saying, \"A slightly plump face makes you look younger for longer\"? That is because people with plump faces are generally less prone to sagging. In particular, those of you who have had thin faces since your youth need to be extremely careful and pay attention to skincare to prevent facial skin from sagging as you age.\n", "style": "NORMAL_TEXT"}, {"text": "Characteristic Number Two: Wrinkles and eye bags around the eyes\n", "style": "HEADING_3"}, {"text": "The second cause of an appearance that looks older than your actual age is wrinkles and eye bags around the eyes. When the wrinkles around the eyes become more visible, our faces easily look tired, our youthfulness rapidly declines, and we appear older. The most important areas to pay attention to are the under-eye wrinkles and crow's feet. Wrinkles easily form in these areas because the skin here is very thin and sensitive. Thin skin also means it is easily dried out, causing wrinkles to appear quickly.\n", "style": "NORMAL_TEXT"}, {"text": "Furthermore, modern lifestyles require us to use computers and smartphones for long periods, causing blood circulation around the eyes to frequently worsen, making it difficult for nutrients and oxygen to reach this area, which makes the skin around the eyes very prone to wrinkle formation. According to research, simply improving under-eye wrinkles and crow's feet can help your appearance look about 10 years younger. Because just reducing wrinkles already makes the face look significantly younger. So please proactively take care of this skin area as early as possible.\n", "style": "NORMAL_TEXT"}, {"text": "There are many ways to improve wrinkles, especially around the eyes. But in this video, Tom will share a cost-effective method that is much more efficient than many store-bought moisturizers, and you can easily do it right at home. It is a type of face mask that helps firm the skin and improve wrinkles. Additionally, if you have dark scars or dark spots, this mask can also help lighten them up. So, what kind of mask will we use? The answer is the egg white. You just need to take the egg white, put it in a bowl, beat it slightly, then apply a thin layer to your face, and wait 15 to 20 minutes until the mask dries. It will tighten everything up, leaving your skin soft and looking youthful.\n", "style": "NORMAL_TEXT"}, {"text": "I'm sure many of you already know this mask. However, Tom will add one more thing to this mask to upgrade its wrinkle-improving effectiveness. This added ingredient is rich in a substance that many people are deficient in: Vitamin A. The more deficient you are in Vitamin A, the rougher your skin will be, and the more easily wrinkles will form, especially crow's feet. This supplementary ingredient contains an abundance of Vitamin A. It also contains Vitamins D, E, K, B-complex vitamins, and choline. All are excellent for improving and preventing wrinkles.\n", "style": "NORMAL_TEXT"}, {"text": "You've figured it out, right? The answer is the egg yolk. Many people use the egg white mask but discard the yolk. The egg white handles the skin-firming and moisturizing factors, but it's the yolk that truly provides direct nutrition to the skin. Especially thanks to Vitamin A and other nutrients. You can see many products on the market using retinol to improve wrinkles, particularly crow's feet. In reality, you already have a natural source of retinol right at home: the egg yolk.\n", "style": "NORMAL_TEXT"}, {"text": "After applying it, wash off the egg mask with warm water and gently pat dry with a towel. Please maintain this twice a week. This will help prevent wrinkles on your entire face and the eye area. It is best done in the evening, >> [music] >> because the Vitamin A in the egg yolk can make your skin slightly sensitive to sunlight right after application.\n", "style": "NORMAL_TEXT"}, {"text": "Additionally, you can add a teaspoon of yogurt to the mixture to supplement some micronutrients that help improve the microbiome on your skin. Make sure it is unsweetened yogurt. Fresh organic yogurt without unnecessary additives is best. Also, in your diet, you can incorporate eggs more frequently. Eggs are considered a superfood, providing a high-quality source of protein and being rich in Vitamin A in the form of retinol. This is a form of Vitamin A found in only a few foods and is particularly useful in preventing skin aging. By doing this, you can tackle wrinkles from both sides: from the outside in and from the inside out.\n", "style": "NORMAL_TEXT"}, {"text": "Characteristic Number Three: Deep and sagging laugh lines\n", "style": "HEADING_3"}, {"text": "Next, let's move on to the third characteristic that makes your appearance look older than your true age. Deep and sagging laugh lines. Perhaps many of you already know, just having deep laugh lines automatically makes the face look older. Laugh lines becoming more pronounced with age is unavoidable. But did you know that laugh lines can form earlier due to daily lifestyle habits? The two biggest causes for the early appearance of laugh lines are a slouched posture and dry skin. Much data shows that people with dry skin tend to have deeper laugh lines.\n", "style": "NORMAL_TEXT"}, {"text": "The laugh line area moves a lot when we smile or talk. This is the skin's natural movement to create expressions. But if the skin is dry, a problem arises. Because the skin is dry, every time an expression is made, fine lines easily appear. When these fine lines overlap and repeat over a long period of time, >> [music] >> this crease will become deeply etched into the skin. However, this does not mean you shouldn't smile or express emotions. In fact, people with highly expressive faces who smile and talk often will have firmer facial muscles and are judged to be younger. Therefore, don't hesitate; try to practice smiling a lot when conversing.\n", "style": "NORMAL_TEXT"}, {"text": "Just by improving your rough, dry skin through internal and external care [music], deep laugh lines will improve. You can apply the mask tip Tom just mentioned earlier, while also supplementing with foods rich in Vitamins E and C. The second cause of deep laugh lines is a slouched posture. We must remember that slouching is the absolute worst posture for aging in many respects. When you are in a slouched or hunched posture, your face is subjected to gravity pulling downwards, making the skin prone to sagging.\n", "style": "NORMAL_TEXT"}, {"text": "Especially for those of you who work office jobs, sitting in front of a computer for long hours often causes the body to unconsciously lean forward, which makes laugh lines deepen even more; even at home, >> [music] >> many of us still use our phones constantly, leading to a forward head posture and slouching. A lot of us are dealing with this issue. This slouched posture [music] has an incredibly terrible impact on the aging process. Bad posture reduces whole-body blood flow, making the body easily fatigued. Additionally, in communication, a slouched posture makes the other person perceive you as older than your real age.\n", "style": "NORMAL_TEXT"}, {"text": "Therefore, not only to improve your appearance but more importantly for your health, >> [music] >> please pay attention to correcting and improving your sitting posture. Especially for elderly viewers with a slouched back, besides postural habits, the cause could also be that the muscles have weakened, so please train your back and abdominal muscles to improve your posture. You can find gentle back and abdominal exercises on YouTube. Tom believes there will be many helpful tutorials. Now, let's summarize the content of part two.\n", "style": "NORMAL_TEXT"}, {"text": "Conclusion\n", "style": "HEADING_2"}, {"text": "Point one, people who have thin faces in their youth are more prone to facial muscle sagging when they get older. Therefore, please pay attention to skincare to limit this condition. Point two, wrinkles around the eyes make your appearance look older than your actual age. Taking care of your skin from the inside and outside using eggs can help gradually improve dry skin and eye wrinkles.\n", "style": "NORMAL_TEXT"}, {"text": "Point three, people with dry skin or who frequently slouch are prone to developing laugh lines. In particular, the habit of looking at a phone while hunched over for long periods makes laugh lines much more prominent. Therefore, please always try to be mindful of your posture.\n", "style": "NORMAL_TEXT"}, {"text": "Tom will end the video here. If you found the video helpful, please hit the like button and subscribe to the channel to keep up with more useful health information. Thank you for listening today.\n", "style": "NORMAL_TEXT"}], "vi": [{"text": "6 VIỆC LÀM MỖI NGÀY CỦA NGƯỜI NHẬT\u000bGIÚP CƠ THỂ TRẺ TRUNG!\n", "style": "HEADING_2"}, {"text": "6 DAILY HABITS OF THE JAPANESE\u000bTHAT KEEP THE BODY LOOKING YOUNG!\n", "style": "HEADING_3"}, {"text": "Lời Mở Đầu\n", "style": "HEADING_2"}, {"text": "Xin chào quý vị đã đến với Tom Bus. Cảm ơn bạn đã luôn theo dõi kênh của Tom. Chắc hẳn xung quanh bạn cũng có những người đáng lẽ cùng tuổi với mình, nhưng lúc nào trông cũng trẻ trung. Khi đi dự những buổi họp lớp, đôi khi bạn sẽ gặp những người ngày xưa từng là soái ca hay mỹ nhân. Vậy mà bây giờ lại già đi thấy rõ.\n", "style": "NORMAL_TEXT"}, {"text": "Ngược lại, cũng có những người hồi trẻ không quá nổi bật, thậm chí chẳng để lại nhiều ấn tượng. Nhưng càng lớn tuổi lại càng đẹp lên hoặc phong độ hơn. Điều này xảy ra vì khi chúng ta có tuổi, tác động của gen di truyền dần giảm. Còn ảnh hưởng của lối sống và thói quen ăn uống lại ngày càng tăng. Nói cách khác, dù thời trẻ có sở hữu gen tốt đến đâu, theo thời gian người ta cũng khó chống lại tác hại tích lũy từ những thói quen sống kém lành mạnh lặp lại trong nhiều năm. Và rồi cơ thể nhanh chóng lão hóa lúc nào không hay.\n", "style": "NORMAL_TEXT"}, {"text": "Vì vậy, càng lớn tuổi quý vị càng cần đầu tư vào những thói quen sống giúp trẻ lâu và ít bệnh tật. Nếu làm được điều này, bạn có thể tạo ra khác biệt rõ rệt về ngoại hình trẻ trung và sức khỏe vượt trội so với những người xung quanh. Video hôm nay sẽ chia sẻ những thông tin quan trọng dành cho quý vị muốn có cơ thể luôn trẻ trung và khỏe mạnh. Đồng thời hướng đến vẻ ngoài được người khác nhìn nhận là trẻ hơn tuổi.\n", "style": "NORMAL_TEXT"}, {"text": "Nội dung kiến thức hôm nay gồm hai phần. Phần một. Top sáu thói quen bất ngờ mà nhiều người Nhật Bản dù đến 80 tuổi vẫn trẻ trung. Họ duy trì thực hiện mỗi ngày. Phần hai. Tật đáng báo động. Những người có ngoại hình trông già hơn tới 10 tuổi có ba điểm chung này, nên biết để tránh. Vậy bạn hãy cùng Tom khởi động với nội dung phần một. Những người Nhật Bản dù đến 80 tuổi vẫn trẻ trung vượt trội nhờ làm sáu thói quen bất ngờ này mỗi ngày. Quý vị hãy theo dõi đến cuối để không bỏ lỡ thông tin quan trọng nhé.\n", "style": "NORMAL_TEXT"}, {"text": "Phần 1: Top 6 Thói Quen Bất Ngờ Giúp Người Nhật Bản Trẻ Trung Ở Tuổi 80\n", "style": "HEADING_2"}, {"text": "Thói quen số một\n", "style": "HEADING_3"}, {"text": "Những người 80 tuổi nhưng vẫn trẻ trung vượt trội thường ăn rất ít carbohydrate, tức là tinh bột và đường. Quý vị thân mến, tinh bột và đường chắc chắn là nguồn năng lượng quan trọng đối với cơ thể. Tuy nhiên, những nghiên cứu về kéo dài tuổi thọ và duy trì sự trẻ trung hiện nay ngày càng cho rằng nên giảm lượng tinh bột và đường nạp vào để sống trẻ trung và khỏe mạnh. Lý do là vì tinh bột và đường có thể gây tổn hại cho cơ thể và có khả năng thúc đẩy quá trình lão hóa.\n", "style": "NORMAL_TEXT"}, {"text": "Đặc biệt, ăn quá nhiều tinh bột và đường có thể làm hại làn da. Một nghiên cứu trên nhiều phụ nữ cũng cho thấy càng ăn nhiều tinh bột và đường, nguy cơ xuất hiện nám, tàn nhang và làn da chảy xệ càng cao. Nghe có vẻ bất ngờ, nhưng chỉ cần tăng thêm 50 g tinh bột và đường, nguy cơ bị nám có thể tăng khoảng 1,3 lần. Khi ăn nhiều tinh bột và đường, đường huyết dễ tăng vọt. Khi đường huyết cao và cơ thể rơi vào tình trạng tăng đường huyết đột ngột, gốc tự do gây lão hóa tăng lên. Đồng thời xảy ra hiện tượng đường hóa cùng nhiều quá trình khác thúc đẩy lão hóa.\n", "style": "NORMAL_TEXT"}, {"text": "Kết quả là collagen của bạn bị tàn phá nghiêm trọng. Collagen trong cơ thể quý vị nâng đỡ cho làn da của bạn săn chắc và trẻ trung, giúp tóc của bạn mềm mại, giúp các khớp xương của bạn đàn hồi. Khi collagen hư hại, nhiều vấn đề sức khỏe có thể xuất hiện. Đặc biệt, vùng da mặt là nơi dễ nhận thấy nhất, nên tác động xấu của việc collagen hư hại sẽ nhanh chóng được quý vị nhận ra từ bên ngoài. Về lâu dài, nếu so sánh người thường xuyên ăn nhiều tinh bột mỗi ngày và sống trong tình trạng đường huyết cao suốt nhiều năm với người biết quản lý lượng tinh bột nạp vào và tránh để đường huyết tăng đột ngột, bạn sẽ dễ dàng hình dung giữa họ có sự khác biệt rất lớn về vẻ ngoài và cả tình trạng sức khỏe bên trong.\n", "style": "NORMAL_TEXT"}, {"text": "Để giữ một cơ thể khỏe mạnh, trẻ trung lâu dài và hạn chế bệnh tật, điều quan trọng là giảm lượng tinh bột nạp vào. Trước đây bạn ăn một bát cơm đầy, hãy giảm xuống còn một nửa. Hoặc bữa tối ngừng ăn cơm trắng. Thay vào đó nạp nguồn tinh bột chính qua các loại rau củ quả. Đây là cách đơn giản và dễ bắt đầu. Lúc đầu việc giảm tinh bột có thể khiến bạn khó chịu, nhưng nếu duy trì 1 đến 2 tháng cơ thể sẽ dần quen. Khi đó bạn sẽ nhận ra không ăn nhiều cơm cũng không có vấn đề gì. Cảm giác này thường chỉ người đã thử mới hiểu rõ. Nên Tom khuyên bạn hãy thử trong 1 tháng. Bạn sẽ ngạc nhiên vì không cần ăn nhiều cơm trắng cũng vẫn ổn.\n", "style": "NORMAL_TEXT"}, {"text": "Gạo trắng và bánh mì trắng là những thực phẩm ít chất xơ nên dễ làm đường huyết tăng nhanh. Thay vào đó bạn hãy cố gắng chọn gạo lứt hoặc bánh mì nguyên cám. Những loại này có tác dụng giúp hạn chế mức tăng đường huyết. Tuy nhiên với những quý vị nào nhạy cảm [âm nhạc] với gluten hoặc dị ứng gluten thì dù là bánh mì nguyên cám cũng nên hạn chế. Vậy là thói quen đầu tiên giảm lượng carbohydrate nạp vào đến đây là kết thúc.\n", "style": "NORMAL_TEXT"}, {"text": "Thói quen thứ hai\n", "style": "HEADING_3"}, {"text": "Tiếp theo Tom sẽ giới thiệu thói quen thứ hai. Một thói quen bất ngờ mà nhiều người Nhật Bản đến 80 tuổi vẫn trẻ trung nổi bật, vẫn duy trì thực hiện mỗi ngày. Đó là đi bộ trong vòng 15 phút sau khi ăn. Quý vị thân mến vận động ngay trong vòng 15 phút sau bữa ăn là một thói quen đơn giản nhưng có thể giúp bạn trẻ trung và khỏe mạnh trong nhiều năm sau. Bởi khi vận động ngay sau khi ăn bạn có thể ngăn đường huyết tăng đột ngột. Một cơ thể khỏe mạnh là cơ thể có mức đường huyết ổn định không tăng vọt bất thường.\n", "style": "NORMAL_TEXT"}, {"text": "Khi ăn tinh bột và đường thường khoảng 15 đến 30 phút sau đường huyết bắt đầu tăng. Nếu trong khoảng thời gian đó bạn đi bộ cơ bắp sẽ sử dụng lượng đường này làm năng lượng. Nhờ vậy cơ bắp tiêu thụ đường và giúp bạn tránh tình trạng đường huyết tăng vọt. Về lâu dài giữa người biết dùng vận động để ổn định đường huyết và người để đường huyết tăng tự do chắc chắn sẽ có khác biệt lớn về tốc độ lão hóa.\n", "style": "NORMAL_TEXT"}, {"text": "Sau khi ăn bạn không cần đi xa, khoảng 20 phút hoặc tầm 2000 bước là một mục tiêu tham khảo tốt. Và nếu bạn đi nhanh, hiệu quả sẽ càng cao. Điều quan trọng nhất là bắt đầu trong vòng 15 phút sau khi ăn xong. 15 phút sau bữa ăn là khung giờ vàng rất quan trọng. Quý vị hãy nhớ điểm này nhé. Tôm nghĩ thói quen này rất dễ thực hiện nên không có lý do gì để không làm. Nếu nghỉ quá lâu rồi mới đi bộ, lúc đó đường huyết đã tăng lên nên hiệu quả ổn định đường huyết sẽ giảm đi. Nếu không thể ra ngoài vì thời tiết nắng nóng, bạn chỉ cần đi bộ tại chỗ cũng đã đủ tác dụng.\n", "style": "NORMAL_TEXT"}, {"text": "Không cần những thay đổi quá sức vất vả, chỉ cần một chút thay đổi nhỏ, nhưng tích lũy nhỏ như vậy sẽ mang lại hiệu quả lớn trong tương lai. Ngoài ra, bạn cũng không nhất thiết phải đi bộ vì mục tiêu là dùng cơ bắp để ổn định đường huyết nên squat cũng rất hiệu quả. Thậm chí, người ta đã cho thấy rằng chỉ cần squat cũng có thể giúp kiềm chế mức tăng vọt đường huyết. Nếu không có thời gian đi bộ sau khi ăn, bạn hãy tạo thói quen squat 2 phút tại chỗ. Bản thân Tôm cũng đã quen như vậy. Ăn xong là gần như tự động squat. Nếu không squat còn thấy khó chịu như thiếu gì đó. Khi đã thành thói quen thì rất đơn giản nên Tôm mong mọi người hãy thử.\n", "style": "NORMAL_TEXT"}, {"text": "Đặc biệt khi lớn tuổi, việc quản lý đường huyết rất quan trọng để phòng chống bệnh tật. Khi kiểm soát được đường huyết, quá trình thúc đẩy lão hóa là đường hóa glycation sẽ khó tiến triển. Nhờ đó, bạn có thể làm chậm tốc độ lão hóa trên toàn cơ thể. Hãy biến việc vận động ngay sau khi ăn thành thói quen hàng ngày. Trước đây từng có quan niệm ăn xong vận động ngay là không tốt. Nhưng hiện nay quan điểm đó đã được bác bỏ và xu hướng vận động ngay sau bữa ăn đã trở nên phổ biến như một thói quen tốt cho sức khỏe. Vì vậy, bạn cứ yên tâm đi bộ hoặc vận động như squat sau khi ăn.\n", "style": "NORMAL_TEXT"}, {"text": "Ngoài ra, nếu hiện tại sau khi ăn bạn thường buồn ngủ quá mức, khiến việc học hay làm việc khó tập trung, bạn nhất định hãy thử thói quen này nhé. Cơn buồn ngủ dữ dội ập đến sau bữa ăn chủ yếu là do đường huyết tăng vọt. Nếu bạn vận động để kìm lại đà tăng đường huyết đột ngột đó, đường huyết sẽ ổn định hơn và cảm giác buồn ngủ sau ăn cũng giảm đi đáng kể. Đến đây Tom xin kết thúc thói quen thứ hai này, thói quen đi bộ trong vòng 15 phút sau khi ăn.\n", "style": "NORMAL_TEXT"}, {"text": "Thói quen thứ ba\n", "style": "HEADING_3"}, {"text": "Tiếp theo là thói quen bất ngờ thứ ba mà Tom muốn giới thiệu. Thói quen mà những người Nhật Bản đến 80 tuổi vẫn trẻ trung nổi bật duy trì mỗi ngày. Đó là dành buổi tối để sống chậm lại, yên tĩnh và thư thái. Quý vị có biết chất lượng giấc ngủ liên hệ cực kỳ sâu sắc với lão hóa không? Nhắc đến lão hóa, chúng ta thường nghĩ ngay đến thực phẩm giúp trẻ lâu hay thực phẩm làm nhanh già, tức là gắn việc ngăn ngừa lão hóa với ăn uống. Nhưng thật ra, chất lượng giấc ngủ còn tác động đến lão hóa theo cách sâu hơn, nhiều hơn và quan trọng hơn. Yếu tố quyết định bạn ngủ ngon hay không phụ thuộc vào việc bạn trải qua 2 tiếng trước khi đi ngủ như thế nào.\n", "style": "NORMAL_TEXT"}, {"text": "Những vấn đề như khó ngủ, tỉnh giấc gần sáng, thực chất là dấu hiệu cho thấy hệ thần kinh giao cảm trong cơ thể bạn đang hoạt động quá mạnh. Quý vị hãy tưởng tượng thần kinh giao cảm giống như bàn đạp ga của chiếc xe, giúp cơ thể duy trì trạng thái hoạt động. Nhưng nếu thần kinh giao cảm hoạt động quá mức, các gốc tự do trong cơ thể dễ tăng lên. Đồng thời AGEs cũng dễ tích tụ. Sự dư thừa gốc tự do và AGEs sẽ gây viêm nhiễm và tổn thương bên trong cơ thể. Đây là nguyên nhân khiến cơ thể nhanh chóng già đi, đồng thời tăng nguy cơ bệnh tật. Đặc biệt, nếu ban đêm thần kinh giao cảm của bạn hoạt động quá mức, nghiên cứu cho thấy tình trạng viêm nhiễm và tổn thương thậm chí còn tăng cao hơn ban ngày.\n", "style": "NORMAL_TEXT"}, {"text": "Nếu thần kinh giao cảm hoạt động như trước bàn đạp ga, thì bạn cũng có thần kinh phó giao cảm đóng vai trò như chiếc phanh. Ban ngày, cơ thể đạp ga để vận hành giúp bạn tỉnh táo và năng động. Nhưng về đêm bạn cần thần kinh phó giao cảm hoạt động như chiếc phanh giúp cơ thể bình tĩnh và thư giãn. Tuy nhiên nếu thần kinh giao cảm quá mạnh thần kinh phó giao cảm sẽ suy yếu. Kết quả là bạn khó thư giãn vào ban đêm và khó có được giấc ngủ chất lượng. Đáng lẽ buổi tối là lúc chiếc phanh phải chiếm ưu thế để cơ thể chậm lại và thả lỏng. Nhưng khi phanh hoạt động yếu cơ thể lại chuyển sang rồ ga khiến cơ thể bạn bị gồng lên một cách bất hợp lý. Điều đó tạo ra căng thẳng lớn và khiến bạn khó ngủ ngon giấc.\n", "style": "NORMAL_TEXT"}, {"text": "Giấc ngủ kém chất lượng gây ra nhiều ảnh hưởng xấu cho cơ thể như giảm miễn dịch tăng gánh nặng cho tim. Ngoài ra khi gốc oxy hóa tăng làn da cũng dễ xấu đi khiến trông già hơn tuổi. Một giấc ngủ tốt sẽ giúp ngăn ngừa lão hóa từ cả bên trong và bên ngoài. Hơn nữa chỉ riêng việc thần kinh giao cảm bị kích hoạt vào ban đêm đây là thời gian mà lẽ ra thần kinh phó giao cảm phải chiếm ưu thế chỉ riêng việc này đã đi ngược lại với cơ chế DNA tự nhiên của cơ thể con người. Việc bị bắt phải hoạt động đảo chiều này khiến cơ thể chịu căng thẳng rất mạnh. Những căng thẳng đó lại khiến cơ thể bạn hoảng loạn đạp ga nhanh hơn nghĩa là thần kinh giao cảm của bạn sẽ hoạt động mạnh hơn.\n", "style": "NORMAL_TEXT"}, {"text": "Kết quả là bạn càng mất ngủ. Mất ngủ lại làm căng thẳng tăng lên tạo thành vòng tuần hoàn luẩn quẩn. Thêm nữa vòng tuần hoàn khắc nghiệt này không dừng lại ở đó. Khi thần kinh giao cảm được hoạt hóa và gốc tự do được tạo ra tế bào bị tổn thương và xảy ra viêm chính tình trạng viêm đó lại kích thích tạo thêm phản ứng viêm mới. Chỉ cần buổi tối quý vị có những hoạt động kích thích làm hệ thần kinh giao cảm trội lên lúc đó bạn có thể chỉ nghĩ rằng hôm nay mình hy sinh giấc ngủ một chút. Nếu chỉ ảnh hưởng chừng đó thì thật tốt. Nhưng những vòng tuần hoàn xấu bên trong cơ thể không thể nhìn thấy bằng mắt thường vẫn đang diễn ra dữ dội và tàn phá nhiều hơn.\n", "style": "NORMAL_TEXT"}, {"text": "Nhiều người hiện đại chúng ta ban ngày bận rộn vì công việc nên thường chỉ buổi tối mới có thời gian cho bản thân. Nhiều người đi chơi đến tận nửa đêm. Nhiều người ở nhà nhưng xem điện thoại đến tận khuya. Những hành vi ban đêm như vậy vốn không phù hợp với DNA tự nhiên của con người. Nói thẳng ra là không bình thường theo thiết kế sinh học tiến hóa của cơ thể. Sẽ làm tăng hoạt động của thần kinh giao cảm mà đáng lẽ hệ thần kinh này không nên được hoạt động mạnh vào buổi tối. Và rồi trước khi bạn kịp nhận ra cơ thể đã dần bị bào mòn, xuống cấp.\n", "style": "NORMAL_TEXT"}, {"text": "Tuy nhiên nếu hiểu theo nghĩa tích cực những người có cơ thể luôn trẻ trung và ít bệnh tật thường có lối sống buổi tối điềm tĩnh và thư giãn. Họ cố gắng để ánh đèn trong phòng vừa phải mở nhạc thư giãn và tận hưởng khoảng thời gian chậm rãi. Quý vị hãy cố gắng hoàn thành tất cả mọi việc bận rộn trước khi đi ngủ hai tiếng. Hai tiếng trước khi đi ngủ nên là thời gian hạn chế ánh sáng trắng. Hai tiếng sống như ông bà tổ tiên ngày xưa. Sinh hoạt chậm lại thư giãn, kéo giãn cơ thể tập thiền hoặc yoga cũng rất tốt.\n", "style": "NORMAL_TEXT"}, {"text": "Chỉ cần buổi tối bạn sống theo nhịp sinh học vốn phù hợp với DNA của con người. Chỉ vậy thôi thì sự trẻ trung và khỏe mạnh sẽ đến. Dĩ nhiên để sinh hoạt như vậy ngay từ đầu có thể khó với nhiều người chúng ta. Nhưng vẫn có rất nhiều điều bạn làm được. Như hạn chế tiếp xúc ánh sáng xanh và hạn chế động vào điện thoại trong hai tiếng trước khi ngủ. Chỉ cần từng chút một khôi phục lại lối sống tự nhiên của con người bạn sẽ duy trì được sức khỏe và sự trẻ trung lâu dài. Quý vị hãy thư giãn và sống chậm vào buổi tối để tránh kích thích hệ thần kinh giao cảm nhé.\n", "style": "NORMAL_TEXT"}, {"text": "Thói quen thứ tư\n", "style": "HEADING_3"}, {"text": "Tiếp theo chúng ta hãy đến với thói quen thứ tư mà nhiều người Nhật Bản dù 80 tuổi vẫn trẻ trung thực hiện mỗi ngày. Tiếp xúc với tia hồng ngoại để tăng cường melatonin, một chất chống oxy hóa mạnh mẽ. Quý vị có biết có một tình trạng gọi là hội chứng hoàng hôn không? Tình trạng này thường xảy ra ở người cao tuổi mắc Alzheimer và sa sút trí tuệ. Khi mặt trời lặn, 45% người mắc Alzheimer và sa sút trí tuệ bắt đầu trở nên cực kỳ mệt mỏi. Quý vị nghĩ vì sao lại như vậy? Vì họ đang cạn kiệt melatonin. Cơ thể họ không có đủ melatonin. Điều này khiến chất lượng giấc ngủ của họ giảm sút nghiêm trọng.\n", "style": "NORMAL_TEXT"}, {"text": "Melatonin còn được gọi là hormone giấc ngủ. Khi cơ thể sản xuất đủ melatonin, chất lượng giấc ngủ sẽ được cải thiện. Tuy nhiên, melatonin không chỉ giúp cải thiện giấc ngủ, nó còn là chất chống oxy hóa cực kỳ mạnh mẽ, góp phần ngăn ngừa lão hóa và phòng chống bệnh tật. Khi Thơm nhắc đến chất chống oxy hóa, quý vị hình dung đến điều gì? Bản chất của bệnh tật và quá trình lão hóa nhanh đều bắt nguồn từ nguyên nhân gốc rễ, dư thừa căng thẳng oxy hóa và tổn thương do gốc tự do. Bình thường, cơ thể chúng ta được thiết kế để tự bảo vệ trước những điều đó. Và cách cơ thể bảo vệ là thông qua mạng lưới chất chống oxy hóa.\n", "style": "NORMAL_TEXT"}, {"text": "Cơ thể quý vị khỏe mạnh và trẻ trung là nhờ có những enzyme hoạt động như chất chống oxy hóa. Vì vậy, trong ăn uống, chúng ta thường cố gắng bổ sung vitamin và thực phẩm có tác dụng chống oxy hóa. Mọi người sẽ tập trung bổ sung vitamin C, vitamin E, glutathione. Tuy nhiên, có một chất chống oxy hóa mạnh mẽ hơn, hiệu quả hơn, giúp cơ thể được bảo vệ cả từ bên trong lẫn bên ngoài. Đó chính là melatonin. Bởi vì melatonin không chỉ đơn thuần là chất chống oxy hóa giúp cơ thể bạn trẻ trung, nó còn đồng thời kích hoạt các mạng lưới chống oxy hóa khác, bao gồm cả glutathione.\n", "style": "NORMAL_TEXT"}, {"text": "Melatonin mạnh gấp đôi vitamin E. và chúng ta đều biết vitamin E rất quan trọng cho làn da, giúp bảo vệ tim mạch và hạn chế quá trình hình thành bệnh trong thành động mạch. Vì vậy, melatonin là một chất chống lão hóa rất mạnh. Đồng thời thúc đẩy cơ thể tăng cường sản xuất các chất chống oxy hóa khác. Tuyệt vời nhất là chỉ cần điều chỉnh thói quen sinh hoạt, quý vị có thể tự tăng cường sản xuất chất chống oxy hóa mạnh mẽ này. Quý vị thân mến, melatonin là hormone rất ngủ, còn được gọi là hormone bóng tối.\n", "style": "NORMAL_TEXT"}, {"text": "Vào ban đêm, khi bạn sinh hoạt trong môi trường ít ánh sáng trắng từ điện thoại, TV và đèn LED, melatonin từ tuyến tùng sẽ được tiết ra. Tuy nhiên, theo các nghiên cứu những năm gần đây, melatonin do tuyến tùng tiết ra thực ra chỉ là một hệ thống dự phòng hoặc bổ trợ. Còn phần lớn melatonin trong cơ thể lại nằm bên trong ti thể. Tác nhân kích thích lớn nhất giúp cơ thể sản xuất melatonin bên trong ti thể chính là tia hồng ngoại từ ánh nắng mặt trời và ánh lửa tự nhiên. Một số bước sóng nhất định của ánh nắng và tia hồng ngoại từ ánh lửa sẽ kích thích sản xuất melatonin. Qua đó, cơ thể bạn nhận được tác dụng chống lão hóa mạnh mẽ, giảm viêm, phòng chống ung thư, đồng thời giúp bạn có giấc ngủ chất lượng.\n", "style": "NORMAL_TEXT"}, {"text": "Quý vị có bao giờ để ý vì sao khi ngồi trước bếp lửa củi hoặc trước đống lửa trại, bạn lại thấy thư giãn và thử ngủ ngon hơn không? Đó là vì lửa tự nhiên tỏa ra tia [âm nhạc] hồng ngoại khiến cơ thể bạn tăng cường sản xuất melatonin. Bạn cũng có thể thấy thư giãn và ngủ ngon hơn khi sinh hoạt ban đêm dưới ánh nến. Cũng vì tia hồng ngoại từ ánh nến giúp melatonin được tiết ra. Vào ngày xưa, >> [âm nhạc] >> bố mẹ, ông bà chúng ta hay dùng đèn sợi đốt hay còn được gọi là đèn dây tóc. Tòng nghĩ quý vị chắc hẳn có nhiều ký ức về bóng đèn này. Đây là loại đèn cam mờ hoặc đỏ mờ, tạo ánh sáng bằng cách đốt nóng dây tóc. Và đèn sợi đốt cũng phát ra tia hồng ngoại có lợi cho cơ thể.\n", "style": "NORMAL_TEXT"}, {"text": "Đáng tiếc là đời sống hiện đại đang dần rời bỏ đèn sợi đốt. Chúng ta bước vào kỷ nguyên ánh sáng nhân tạo. Đèn LED xuất hiện từ phòng khách đến phòng ngủ. Thậm chí đèn ngủ cũng dùng đèn LED. Chưa kể ánh sáng xanh từ máy tính và điện thoại. Điều này khiến nguồn melatonin tự nhiên trong cơ thể người hiện đại chúng ta suy giảm nghiêm trọng. Vậy nên quý vị thân mến, chất chống oxy hóa mạnh mẽ có sẵn bên trong cơ thể bạn chính là melatonin. Nó không chỉ là hormone giấc ngủ đến từ bóng tối, mà còn là hormone đến từ tia hồng ngoại, giúp chống viêm, sửa chữa ti thể, ngăn ngừa lão hóa từ bên trong, và đặc biệt giúp [âm nhạc] bạn có giấc ngủ sâu.\n", "style": "NORMAL_TEXT"}, {"text": "Việc tiếp xúc với ánh nắng ban ngày cũng giúp cơ thể sản xuất melatonin. Khi ở ngoài trời, dù đứng trong bóng mát hay dưới tán cây, cơ thể bạn vẫn nhận được tia hồng ngoại một cách gián tiếp. Cỏ, mây và đất cũng phản xạ sóng hồng ngoại, nên bạn không nhất thiết phải phơi nắng dưới cái nắng oi bức lúc 12:00 trưa. Với thời tiết vùng nhiệt đới như Việt Nam, bạn chỉ cần tắm nắng buổi sáng, đồng thời dành thời gian ở môi trường tự nhiên ngoài trời, ngồi thư giãn dưới tán cây để nhận tia hồng ngoại gián tiếp từ lá cây và cỏ phản xạ. Người hiện đại chúng ta đang tiếp xúc quá nhiều với ánh sáng nhân tạo như đèn LED và ánh sáng xanh từ điện thoại, máy tính. Bản thân Tom cũng không ngoại lệ.\n", "style": "NORMAL_TEXT"}, {"text": "Có những ngày Tom ngồi trong nhà cả ngày trước máy tính, hoặc ở chỗ làm thì ngồi tại bàn làm việc trước màn hình. Đến khi về nhà thì trời đã tối. Việc dành thêm thời gian ở ngoài trời, tiếp xúc với thiên nhiên và cây cỏ, cùng tắm nắng vào buổi sáng là một thói quen tốt để cơ thể nhận ánh sáng hồng ngoại và tăng cường tiết ra melatonin, chống lão hóa từ bên trong. Có lẽ quan trọng gần như ngang với việc ăn uống lành mạnh. Càng tìm hiểu về melatonin, bạn sẽ thấy melatonin không chỉ đơn giản là tốt cho giấc ngủ, mà nó còn giúp cơ thể cải thiện về nhiều mặt. Cơ thể quý vị càng sản xuất nhiều melatonin, nguy cơ bệnh tật càng giảm đi đáng kể.\n", "style": "NORMAL_TEXT"}, {"text": "Ngoài ra, quý vị còn có thể nhận thêm lợi ích từ tia hồng ngoại bằng cách tiếp xúc với ánh lửa tự nhiên vào buổi tối. Bạn cũng có thể thư giãn dưới ánh nến vào ban đêm. Nếu nhà bạn có sân rộng, hãy tạo một bếp củi nhỏ. Đặc biệt vào những tối mùa đông, sinh hoạt dưới bếp củi cùng gia đình sẽ tốt cho sức khỏe. Hoặc nếu có gì thay bóng đèn, nếu có thể, quý vị hãy thay dần hệ thống chiếu sáng trong nhà sang đèn sợi đốt, hoặc ít nhất sử dụng đèn sợi đốt ở phòng ngủ.\n", "style": "NORMAL_TEXT"}, {"text": "Thói quen thứ năm\n", "style": "HEADING_3"}, {"text": "Tiếp theo là thói quen thứ năm mà Tảo muốn giới thiệu. Một thói quen bất ngờ mà nhiều người Nhật Bản dù đã 80 tuổi vẫn trẻ trung, khỏe mạnh duy trì mỗi ngày. Đó là sáng ngủ dậy uống một mạch liên tục hết cả cốc nước. Quý vị có uống nước này sau khi thức dậy mỗi sáng không? Cơ thể chúng ta mất khá nhiều nước trong lúc ngủ. Nếu không bổ sung nước ngay khi thức dậy, bạn có thể rơi vào trạng thái thiếu nước khiến máu trở nên đặc sệt vào buổi sáng. Khi máu đặc, tuần hoàn sẽ kém đi, khiến dưỡng chất và oxy khó được vận chuyển đến các tế bào khắp cơ thể. Kết quả là tế bào bị tổn thương và cơ thể dần lão hóa.\n", "style": "NORMAL_TEXT"}, {"text": "Để tránh tình trạng này, Tảo mong bạn hãy uống cốc nước đầu tiên ngay sau khi thức dậy. Thói quen uống một mạch liên tục hết cả cốc nước ngay khi mới thức dậy sẽ tạo ra một tín hiệu trong bụng, từ đó khiến ruột bắt đầu hoạt động. Ruột trong cơ thể chúng ta rất dài, dài khoảng 9 m. Để thức ăn và nước di chuyển trơn tru trong quãng đường dài đó, cần có hoạt động co bóp gọi là nhu động ruột. Khi nhu động yếu đi, thức ăn và nước dễ bị ứ lại trong ruột, từ đó phân trở nên cứng. Phân cứng lại tiếp tục hút nước trong ruột rồi dính vào thành [âm nhạc] ruột và đọng lại ở đó.\n", "style": "NORMAL_TEXT"}, {"text": "Hiện tượng này được gọi là phân tồn đọng và có thể làm suy giảm hoạt động của toàn bộ hệ tiêu hóa. Khi phân tồn đọng tích tụ, nó tiếp tục cản trở hoạt động của ruột, làm tăng nguy cơ táo bón và khó tiêu. Hơn nữa, nếu táo bón kéo dài, các chất có hại có thể tích tụ trong cơ thể và ảnh hưởng xấu đến sức khỏe. Nhiều nghiên cứu cũng cho thấy nguy cơ ung thư đại tràng có thể tăng lên. Để hạn chế những vấn đề này, điều quan trọng là thúc đẩy nhu động ruột và giúp cơ thể bài xuất phân ra ngoài đầy đủ.\n", "style": "NORMAL_TEXT"}, {"text": "Vì vậy, thói quen uống một cốc nước ngay khi thức dậy trở nên rất quan trọng. Việc uống một mạch hết cả cốc nước giúp ruột vận động trơn tru, đẩy phân tồn đọng ở thành ruột ra ngoài, từ đó giảm nguy cơ táo bón. Để ngăn ngừa và cải thiện táo bón, điều quan trọng là uống một mạch liên tục. Quý vị hãy thử áp dụng nhé. Ngoài ra, cốc uống nước này còn giúp đánh thức ruột và khiến hệ thần kinh giao cảm hoạt động trội hơn vào ban ngày.\n", "style": "NORMAL_TEXT"}, {"text": "Buổi sáng ngay sau khi thức dậy là thời điểm chuyển công tắc của hệ thần kinh trong cơ thể quý vị. Như bạn và Tom đã cùng tìm hiểu trước đó, hệ thần kinh tự chủ gồm thần kinh giao cảm và phó giao cảm. Vào ban đêm, hệ thần kinh phó giao cảm hoạt động trội hơn, cơ thể được phanh lại, thư giãn và tiến hành phục hồi. Khi thức dậy, để cơ thể trở nên năng động, hệ giao cảm sẽ hoạt động trội hơn. Cơ thể được đạp ga để bắt đầu ngày mới một cách tỉnh táo, năng động.\n", "style": "NORMAL_TEXT"}, {"text": "Buổi sáng ngay khi thức dậy chính là thời điểm chuyển công tắc của hệ thần kinh tự chủ và ở thời điểm này, chuyển động của ruột ảnh hưởng rất lớn. Kích thích ruột một cách phù hợp giúp điều hòa hệ thần kinh tự chủ và một cốc nước nhỏ khoảng 200 ml uống liền một mạch liên tục ngay sau khi thức dậy có thể mang lại tác dụng đó. Cuối cùng, có một điểm cần lưu ý, dù Tom nói nên uống một mạch liên tục, nhưng quý vị đừng uống quá mạnh đến mức sặc hoặc khó thở, chỉ cần uống đều liên tục, nuốt nhẹ nhàng. Phần giải thích về sau khi thức dậy hãy uống một cốc nước xin kết thúc tại đây.\n", "style": "NORMAL_TEXT"}, {"text": "Thói quen thứ sáu\n", "style": "HEADING_3"}, {"text": "Tiếp theo, tôi muốn giới thiệu một thói quen thứ năm bất ngờ mà những người Nhật Bản dù 80 tuổi vẫn trông trẻ vượt trội thường duy trì. Đó là tập luyện cơ bắp hai lần mỗi tuần. Việc đưa luyện tập cơ bắp vào lịch hai lần mỗi tuần rất quan trọng để duy trì sức khỏe và giữ ngoại hình trẻ trung. Đặc biệt, sau 30 tuổi cơ bắp ở chân và phần thân dưới sẽ tự nhiên giảm khoảng 1% mỗi năm. Nói cách khác nếu không chủ động tập nhóm cơ ở chân và thân dưới sẽ ngày càng teo đi.\n", "style": "NORMAL_TEXT"}, {"text": "Cơ bắp có vai trò như một kho dự trữ đường trong máu. Vì vậy, khi [khịt mũi] cơ bắp giảm nơi để chứa đường trong cơ thể cũng giảm theo. Kết quả là đường tiếp tục lưu lại trong máu khiến đường huyết dễ tăng cao. Ngược lại, khi tăng cơ nếu tập luyện, đường huyết sẽ ổn định hơn. Nhờ đó, bạn cũng có thể ức chế quá trình gây lão hóa và bệnh tật. Việc giữ và tăng cường cơ bắp đặc biệt là cơ bắp vùng chân và thân dưới không chỉ giúp quý vị duy trì sự trẻ trung lâu dài mà còn giúp tránh tình trạng nằm một chỗ khi về già. Đồng thời giảm thiểu rủi ro tiểu đường và các căn bệnh khác.\n", "style": "NORMAL_TEXT"}, {"text": "Và quý vị hãy yên tâm để tập luyện cơ bắp không cần dụng cụ phức tạp hay chương trình huấn luyện chuyên nghiệp. Bạn chỉ cần thực hiện các bài tập đơn giản nhắm vào nhóm cơ lớn như vùng ngực, bụng, đùi chẳng hạn chống đẩy gập bụng, squat khi tập tại nhà cũng đủ. Lượng vận động cũng không cần quá nhiều. Mỗi lần tập chừng 15 đến 20 phút đến mức mệt vừa đủ là được. Chỉ cần bạn duy trì tuần hai buổi trong khoảng hai tháng cơ bắp sẽ dần tăng lên.\n", "style": "NORMAL_TEXT"}, {"text": "Điều quan trọng nhất là tập vừa phải để quý vị có thể duy trì lâu dài. So với tập luyện quá cực đoan sự đều đặn mới là yếu tố quyết định để cải thiện sức khỏe. Bằng mức nỗ lực vừa sức bạn sẽ dễ duy trì được. Đây là một thói quen chống lão hóa lành mạnh, nên quý vị hãy thử thực hiện hàng tuần nhé.\n", "style": "NORMAL_TEXT"}, {"text": "Phần 2: Nguyên Nhân Gì Khiến Trông Già Hơn Đến 10 Tuổi?\n", "style": "HEADING_2"}, {"text": "Phần hai. Nguyên nhân gì khiến trông già hơn đến 10 tuổi? Những đặc điểm chung của những người có vẻ ngoài già nua, biết để tránh. Trong phần này, Tom sẽ giải thích thật dễ hiểu những điểm chung ở những người trông già hơn nhiều so với tuổi thật. Quý vị nghĩ mình trông già hơn hay trẻ trung hơn so với tuổi thật? Dù có quan tâm đến vẻ ngoài hay không, việc bị cho là trông già hơn tuổi cũng là điều không ai muốn. Bằng cách ý thức rõ những điểm được giới thiệu hôm nay và thực hiện các bước chăm sóc chống lão hóa, Tom tin bạn sẽ hiểu mình cần làm gì để có vẻ ngoài trẻ trung hơn.\n", "style": "NORMAL_TEXT"}, {"text": "Chúng ta hãy cùng suy nghĩ, điều gì quyết định vẻ ngoài trẻ trung? Khi nhìn người khác, điều gì khiến bạn thấy họ trông già hơn tuổi? Hay ngược lại, điều gì ở họ khiến bạn cảm thấy họ trông trẻ hơn tuổi? Một cuộc khảo sát ý kiến quy mô lớn cho thấy, những yếu tố khiến một người trông già hơn tuổi có thể gói gọn trong ba điều sau đây. Chảy xệ toàn bộ khuôn mặt. Bọng trễ và nếp nhăn quanh mắt. Vùng rãnh cười sâu và chảy xệ. Bây giờ, Tom sẽ giải thích ngắn gọn từng yếu tố nhé.\n", "style": "NORMAL_TEXT"}, {"text": "Đặc điểm thứ nhất: Chảy xệ toàn bộ khuôn mặt\n", "style": "HEADING_3"}, {"text": "Đặc điểm đầu tiên khiến vẻ ngoài trông già hơn tuổi, chảy xệ toàn bộ khuôn mặt. Có ba nguyên nhân chính khiến khuôn mặt trở nên chảy xệ, từ đó tạo ấn tượng già nua. Thứ nhất, do xương, nền tảng tạo nên hình dáng khuôn mặt bị tiêu giảm. Càng lớn tuổi, khối lượng xương càng giảm. Trong đó, xương vùng mặt đặc biệt dễ bị tiêu. Khi xương giảm đi, phần da và cơ từng được nâng đỡ trở nên dư thừa, dẫn đến chảy xệ.\n", "style": "NORMAL_TEXT"}, {"text": "Thứ hai, do sự lỏng lẻo của các dây chằng nối giữa xương mặt và da. Nghiên cứu gần đây cho thấy, dây chằng bị trùng xuống có thể ảnh hưởng trực tiếp đến tình trạng da chảy xệ. Thứ ba, do sự suy giảm mỡ trên mặt. Khi mỡ mặt giảm, khiến chảy xệ rõ hơn. Đặc biệt, tuổi càng cao thì người gầy càng dễ trông già hơn. Chủ yếu do sự suy giảm mỡ mặt này.\n", "style": "NORMAL_TEXT"}, {"text": "Quý vị có thường nghe câu nói, \"Gương mặt hơi đầy đặn một chút thì trông trẻ lâu hơn.\" Đó là vì người có gương mặt đầy đặn thường khó bị chảy xệ hơn. Đặc biệt, những quý vị có gương mặt gầy từ lúc trẻ cần hết sức cẩn thận và chú ý chăm sóc để tránh tình trạng chảy xệ da mặt khi có tuổi.\n", "style": "NORMAL_TEXT"}, {"text": "Đặc điểm thứ hai: Nếp nhăn và bọng trễ quanh mắt\n", "style": "HEADING_3"}, {"text": "Nguyên nhân thứ hai khiến vẻ ngoài trông già hơn so với tuổi thật là các nếp nhăn và bọng trễ quanh mắt. Khi nếp nhăn quanh mắt trở nên rõ hơn, khuôn mặt chúng ta dễ trông mệt mỏi, sự trẻ trung nhanh chóng giảm đi và khiến trông già hơn. Điều cần chú ý nhất là nếp nhăn dưới mắt và nếp nhăn đuôi mắt. Nếp nhăn dễ hình thành ở những vùng này vì do vùng da ở đây rất mỏng và nhạy cảm. Da mỏng cũng đồng nghĩa với việc dễ bị khô, khiến nếp nhăn nhanh xuất hiện.\n", "style": "NORMAL_TEXT"}, {"text": "Hơn nữa, lối sống hiện đại đòi hỏi chúng ta sử dụng máy tính và điện thoại thông minh trong thời gian dài, làm tuần hoàn máu quanh mắt thường xuyên kém đi, khiến dinh dưỡng và oxy khó đến được vùng da này, khiến vùng da quanh mắt rất dễ hình thành nếp nhăn. Theo nghiên cứu, chỉ cần cải thiện nếp nhăn dưới mắt và nếp nhăn đuôi mắt cũng có thể giúp diện mạo trẻ hơn khoảng 10 tuổi. Vì chỉ cần giảm nếp nhăn đã giúp gương mặt trông trẻ trung hơn rất nhiều. Nên quý vị hãy chủ động chăm sóc vùng da này càng sớm càng tốt nhé.\n", "style": "NORMAL_TEXT"}, {"text": "Có nhiều cách để cải thiện vết nhăn, đặc biệt là ở vùng xung quanh mắt. Nhưng trong video này, Tom sẽ chia sẻ một phương pháp tiết kiệm chi phí, hiệu quả hơn nhiều loại kem dưỡng trên thị trường và bạn có thể thực hiện ngay tại nhà. Đó là một loại mặt nạ giúp làm săn chắc làn da và cải thiện vết nhăn. Ngoài ra, nếu quý vị có vết sẹo sẫm màu hay vết thâm, mặt nạ này cũng có thể giúp làm sáng chúng lên. Vậy chúng ta sẽ dùng loại mặt nạ gì? Câu trả lời là phần lòng trắng trứng. Bạn chỉ cần lấy lòng trắn
