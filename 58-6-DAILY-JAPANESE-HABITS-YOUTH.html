g trứng, cho vào bát, đánh đều một chút, sau đó thoa một lớp mỏng lên da mặt, đợi 15 đến 20 phút cho đến khi mặt nạ khô lại. Nó sẽ làm săn chắc mọi thứ, giúp làn da mềm mại, trông tươi trẻ.\n", "style": "NORMAL_TEXT"}, {"text": "Chắc nhiều bạn đã biết loại mặt nạ này. Tuy nhiên, Tom sẽ bổ sung thêm một thứ nữa vào mặt nạ này để nâng cấp hiệu quả cải thiện vết nhăn lên. Thứ bổ sung này giàu một chất mà rất nhiều người đang bị thiếu hụt, vitamin A. Bạn càng thiếu vitamin A, da của bạn sẽ càng thô ráp, vết nhăn càng dễ hình thành, đặc biệt là vết nhăn vùng đuôi mắt. Thành phần bổ sung này chứa nhiều vitamin A. Ngoài ra còn có vitamin D, E, K, các vitamin nhóm B và choline. Tất cả đều rất tốt cho việc cải thiện và phòng ngừa vết nhăn.\n", "style": "NORMAL_TEXT"}, {"text": "Quý vị đã nghĩ ra rồi đúng không? Câu trả lời chính là lòng đỏ trứng. Nhiều người sử dụng mặt nạ lòng trắng trứng, nhưng lại bỏ qua lòng đỏ. Lòng trắng sẽ xử lý yếu tố làm săn chắc da và dưỡng ẩm, nhưng lòng đỏ mới thực sự cung cấp dinh dưỡng trực tiếp cho da. Đặc biệt nhờ vitamin A và các dưỡng chất khác. Quý vị có thể thấy rất nhiều sản phẩm trên thị trường sử dụng retinol để cải thiện vết nhăn, nhất là vùng đuôi mắt. Thực ra, bạn đã có một nguồn retinol tự nhiên ngay tại nhà, lòng đỏ trứng.\n", "style": "NORMAL_TEXT"}, {"text": "Sau khi đắp xong, bạn rửa sạch mặt nạ trứng bằng nước ấm và nhẹ nhàng lau khô bằng khăn. Hãy duy trì hai lần mỗi tuần. Điều này sẽ giúp ngăn ngừa vết nhăn trên toàn bộ da mặt và vết nhăn vùng mắt. Tốt nhất là thực hiện vào buổi tối, >> [âm nhạc] >> vì vitamin A trong lòng đỏ trứng có thể khiến da hơi nhạy cảm với ánh nắng khi mới vừa đắp xong.\n", "style": "NORMAL_TEXT"}, {"text": "Thêm vào đó, bạn có thể thêm một thìa cà phê sữa chua vào hỗn hợp để bổ sung một số vi chất giúp cải thiện hệ vi sinh vật trên da. Hãy đảm bảo đó là sữa chua không đường. Tốt nhất là sữa chua tươi hữu cơ, không chứa chất phụ gia dư thừa. Ngoài ra, trong chế độ ăn uống, bạn có thể bổ sung trứng thường xuyên hơn. Trứng được xem như một siêu thực phẩm, cung cấp nguồn protein chất lượng cao và giàu vitamin A dưới dạng retinol. Đây là dạng vitamin A chỉ có trong một số ít thực phẩm và đặc biệt hữu ích trong việc ngăn ngừa lão hóa làn da. Bằng cách này, quý vị có thể cải thiện vết nhăn từ hai phía, từ ngoài vào trong và từ trong ra ngoài.\n", "style": "NORMAL_TEXT"}, {"text": "Đặc điểm thứ ba: Đường rãnh cười hằn sâu và chảy xệ\n", "style": "HEADING_3"}, {"text": "Tiếp theo, chúng ta hãy đến với đặc điểm thứ ba khiến diện mạo trông già hơn tuổi thật. Đường rãnh cười hằn sâu và chảy xệ. Có lẽ nhiều quý vị đã biết, chỉ cần rãnh cười sâu, khuôn mặt đã trông già hơn. Rãnh cười rõ dần theo tuổi tác là điều không thể tránh khỏi. Nhưng quý vị có biết, rãnh cười dễ hình thành sớm hơn do thói quen sinh hoạt hàng ngày không? Hai nguyên nhân lớn nhất khiến rãnh cười dễ xuất hiện là tư thế gù lưng và tình trạng khô da. Nhiều dữ liệu cho thấy, người có da khô thường dễ bị rãnh cười hằn sâu hơn.\n", "style": "NORMAL_TEXT"}, {"text": "Vùng rãnh cười là nơi chuyển động rất nhiều khi chúng ta cười hoặc nói. Đây là chuyển động tự nhiên của da để tạo biểu cảm. Nhưng nếu da bị khô sẽ phát sinh vấn đề. Da khô nên mỗi lần tạo biểu cảm rất dễ xuất hiện những nếp nhăn nhỏ. Khi các nếp nhăn nhỏ chồng lên nhau, nếu lặp lại trong thời gian dài, >> [âm nhạc] >> rãnh này sẽ bị khắc sâu vào da. Tuy vậy, điều này không có nghĩa là đừng cười hay đừng biểu lộ cảm xúc. Thực tế, những người có nét mặt thay đổi linh hoạt, hay cười nói sẽ có cơ mặt săn chắc và được đánh giá là trẻ trung hơn. Vì vậy, quý vị đừng ngần ngại mà hãy cố gắng luyện cười nhiều khi trò chuyện nhé.\n", "style": "NORMAL_TEXT"}, {"text": "Chỉ cần cải thiện được tình trạng da khô ráp bằng chăm sóc bên trong và bên [âm nhạc] ngoài, rãnh cười sâu sẽ được cải thiện. Quý vị có thể áp dụng mẹo đắp mặt nạ ở phần tóm mới nói lúc nãy, cùng bổ sung thêm thực phẩm chứa nhiều vitamin E và C. Nguyên nhân thứ hai khiến rãnh cười hằn sâu là tư thế gù lưng. Chúng ta hãy nhớ rằng gù lưng là tư thế tệ nhất về lão hóa trên nhiều phương diện. Khi bạn ở tư thế bị gù hay khòm lưng, khuôn mặt sẽ phải chịu trọng lực kéo xuống dưới, khiến da dễ bị chảy xệ.\n", "style": "NORMAL_TEXT"}, {"text": "Đặc biệt với những quý vị làm công việc văn phòng, việc ngồi trước máy tính trong thời gian dài thường khiến cơ thể vô tình cúi về phía trước, từ đó rãnh cười càng dễ bị hằn sâu hơn, ngay cả khi ở nhà, >> [âm nhạc] >> nhiều người chúng ta vẫn sử dụng điện thoại liên tục, dẫn đến tình trạng cổ rùa và bị gù lưng. Rất nhiều người chúng ta đang gặp tình trạng này. Tư thế gù lưng [âm nhạc] này có ảnh hưởng vô cùng tệ đến quá trình lão hóa. Tư thế xấu làm giảm lưu lượng máu toàn thân, khiến cơ thể dễ mệt mỏi. Ngoài ra, trong giao tiếp, tư thế gù lưng còn khiến người đối diện cảm thấy bạn già hơn tuổi thật.\n", "style": "NORMAL_TEXT"}, {"text": "Vì vậy, không chỉ để cải thiện ngoại hình, mà quan trọng hơn là vì sức khỏe, >> [âm nhạc] >> bạn hãy chú ý điều chỉnh và cải thiện tư thế ngồi. Đặc biệt đối với những quý vị lớn tuổi bị gù lưng, ngoài thói quen tư thế, nguyên nhân còn có thể do cơ bắp đã yếu đi, nên quý vị hãy tập cơ lưng và cơ bụng để cải thiện tư thế. Bạn có thể tìm các bài tập nhẹ nhàng cho cơ lưng và cơ bụng trên YouTube. Tầm nghĩ sẽ có nhiều hướng dẫn hữu ích.\n", "style": "NORMAL_TEXT"}, {"text": "Bây giờ, chúng ta hãy cùng tổng Đặc biệt đối với những quý vị lớn tuổi bị gù lưng, ngoài thói quen tư thế, nguyên nhân còn có thể do cơ bắp đã yếu đi, nên quý vị hãy tập cơ lưng và cơ bụng để cải thiện tư thế. Bạn có thể tìm các bài tập nhẹ nhàng cho cơ lưng và cơ bụng trên YouTube. Tầm nghĩ sẽ có nhiều hướng dẫn hữu ích. Bây giờ, chúng ta hãy cùng tổng hợp lại nội dung của phần hai nhé.\n", "style": "NORMAL_TEXT"}, {"text": "Lời Kết\n", "style": "HEADING_2"}, {"text": "Điểm một, những người có khuôn mặt gầy khi còn trẻ thường dễ bị chảy xệ cơ mặt khi lớn tuổi. Vì vậy, hãy chú ý chăm sóc để hạn chế tình trạng này. Điểm hai, nếp nhăn quanh mắt khiến vẻ ngoài trông già hơn tuổi thật. Chăm sóc da từ bên trong lẫn bên ngoài bằng trứng có thể giúp cải thiện dần tình trạng khô da và nếp nhăn vùng mắt.\n", "style": "NORMAL_TEXT"}, {"text": "Điểm ba, những người có làn da khô hoặc thường xuyên gù lưng dễ xuất hiện rãnh cười. Đặc biệt, thói quen nhìn điện thoại trong tư thế khom lưng trong thời gian dài rất dễ làm rãnh cười rõ hơn. Vì vậy, hãy cố gắng luôn ý thức về tư thế của mình.\n", "style": "NORMAL_TEXT"}, {"text": "Tom xin kết thúc video tại đây. Nếu bạn thấy video hữu ích, hãy nhấn nút thích và đăng ký kênh để theo dõi thêm những thông tin sức khỏe hữu ích khác. Xin cảm ơn quý vị đã lắng nghe hôm nay.\n", "style": "NORMAL_TEXT"}]}}}</script>

const DATA=JSON.parse(document.getElementById('app-data').textContent);
const main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const display=s=>esc(s).replace(/\u000b/g,'<br>');
const saved=(k,fall)=>{try{return localStorage.getItem(k)||fall}catch{return fall}};
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let lang=saved('daily-reader-language','en');if(!['en','vi'].includes(lang))lang='en';
let theme=saved('daily-reader-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
let presentation=false;const flips=new Map();const headings=new Map();const cardLang=new Map();
const t=(en,vi)=>lang==='en'?en:vi;
const topics={
'introduction':['A starting point','Lời dẫn'],
'habit-1':['Carbohydrates & blood sugar','Carbohydrate & đường huyết'],
'habit-2':['Movement after meals','Vận động sau bữa ăn'],
'habit-3':['Slower evenings & sleep','Buổi tối thư thái & giấc ngủ'],
'habit-4':['Light & melatonin','Ánh sáng & melatonin'],
'habit-5':['Water & digestion','Nước & tiêu hóa'],
'habit-6':['Muscle training & consistency','Cơ bắp & sự đều đặn'],
'characteristic-1':['Facial structure','Cấu trúc khuôn mặt'],
'characteristic-2':['Skin around the eyes','Làn da quanh mắt'],
'characteristic-3':['Expression & posture','Biểu cảm & tư thế'],
'conclusion':['Bringing the ideas together','Tổng hợp nội dung']};
function syncNav(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;document.getElementById('back').textContent=t('← Back to Overview','← Về tổng quan');document.getElementById('gloss-nav').textContent=t('Glossary','Từ vựng');const b=document.getElementById('language');b.textContent=lang==='en'?'EN → VI':'VI → EN';b.setAttribute('aria-label',t('Switch global reading language to Vietnamese','Chuyển ngôn ngữ đọc sang tiếng Anh'));document.getElementById('theme-label').textContent=theme==='dark'?t('Light','Sáng'):t('Dark','Tối');document.getElementById('theme').setAttribute('aria-pressed',String(theme==='dark'));document.getElementById('theme').setAttribute('aria-label',t('Toggle dark mode','Bật/tắt chế độ tối'))}
function cards(sections){return '<div class="grid">'+sections.map(s=>{let l=cardLang.get(s.id)||lang;const n=DATA.sections.indexOf(s)+1;return `<article class="chapter"><button type="button" data-card="${s.id}" aria-label="${esc(t('Switch heading language: ','Đổi ngôn ngữ tiêu đề: ')+s.en.trim())}">${l.toUpperCase()} ⇄</button><div class="number">${String(n).padStart(2,'0')} / ${t('READING','BÀI ĐỌC')}</div><h3><a href="#${s.id}" lang="${l}">${display(s[l])}</a></h3>${topics[s.id]?`<p class="topic">${esc(topics[s.id][lang==='en'?0:1])}</p>`:''}<div class="meta">${s.paragraphs.length?s.paragraphs.length+' '+t('paragraph groups','nhóm đoạn văn'):DATA.sections.filter(x=>x.parent===s.id).length+' '+t('subsections','mục nhỏ')} <span aria-hidden="true">↗</span></div></article>`}).join('')+'</div>'}
function sourceNotes(){return `<details class="source-box"><summary>${t('Source & completeness notes','Nguồn & ghi chú về tính đầy đủ')}</summary><p>${t('All 78 non-empty EN-01 text blocks and all 79 non-empty SRT-VN text blocks are preserved. There are 13 section views and 63 paragraph groups. Blank layout paragraphs and page breaks are not reading cards.','Đã giữ nguyên 78 khối văn bản có nội dung của EN-01 và 79 khối của SRT-VN. Có 13 trang mục và 63 nhóm đoạn văn. Các đoạn trống và ngắt trang không được tạo thành thẻ đọc.')}</p><p>${t('One English paragraph near the end of Characteristic Number Three corresponds to two Vietnamese paragraphs; the second repeats text and completes the concluding transition. Both are shown, unchanged, on the Vietnamese side. Source typos, differing wording, and transcript cues are retained.','Một đoạn tiếng Anh gần cuối Đặc điểm thứ ba tương ứng với hai đoạn tiếng Việt; đoạn thứ hai lặp lại nội dung và hoàn tất câu chuyển tiếp sang phần kết. Cả hai được giữ nguyên ở mặt tiếng Việt. Các lỗi gõ, khác biệt diễn đạt và ký hiệu bản chép lời đều được giữ nguyên.')}</p><p>${t('The English title is split across two paragraphs in EN-01. SRT-VN also contains this English title:','Tiêu đề tiếng Anh gồm hai đoạn trong EN-01. SRT-VN còn có tiêu đề tiếng Anh sau:')}</p><p lang="en">${display(DATA.alternateTitle)}</p><p>${t('Glossary definitions and equivalents are editorial learning aids; all example quotations are exact excerpts linked to their source paragraph. This app reproduces a health-themed transcript for language study; its health claims have not been independently verified.','Định nghĩa và từ tương đương trong mục từ vựng được biên soạn để hỗ trợ học tập; ví dụ được trích nguyên văn và liên kết đến đoạn nguồn. Ứng dụng tái hiện bản chép lời về sức khỏe để học ngôn ngữ; các nhận định sức khỏe chưa được kiểm chứng độc lập.')}</p><p><a href="${DATA.source.url}" target="_blank" rel="noopener noreferrer">${t('Open original Google Doc','Mở Google Doc gốc')}</a> · ${t('Source snapshot','Bản nguồn')}: 17 Nov 2026</p><details><summary>EN-01 · ${t('complete source text','toàn bộ văn bản nguồn')}</summary><div class="raw" lang="en">${display(DATA.source.tabs.en.map(p=>p.text).join(''))}</div></details><details><summary>SRT-VN · ${t('complete source text','toàn bộ văn bản nguồn')}</summary><div class="raw" lang="vi">${display(DATA.source.tabs.vi.map(p=>p.text).join(''))}</div></details></details>`}
function overview(){main.innerHTML=`<section class="hero"><div class="eyebrow">${t('A bilingual reading collection','Tuyển tập đọc song ngữ')} · B2 / C1</div><h1 class="hero-title" lang="en">${DATA.title.en.map(display).join('<br>')}</h1><div class="subtitle" lang="vi">${DATA.title.vi.map(display).join('<br>')}</div><p class="intro">${t('Read at your own pace. Explore the original English and Vietnamese, one paragraph at a time.','Đọc theo nhịp riêng của bạn. Khám phá nguyên văn tiếng Anh và tiếng Việt, từng đoạn một.')}</p><div class="row"><a class="button primary" href="#introduction">${t('Start reading','Bắt đầu đọc')} ↗</a><a class="button" href="#glossary">${t('Explore vocabulary','Khám phá từ vựng')}</a></div><div class="stats"><div><strong>13</strong><span>${t('section views','trang mục')}</span></div><div><strong>63</strong><span>${t('paragraph groups','nhóm đoạn văn')}</span></div><div><strong>30</strong><span>${t('glossary terms','mục từ vựng')}</span></div></div></section><div class="section-label"><h2>${t('Before you begin','Trước khi bắt đầu')}</h2><span class="small">${t('Use EN ⇄ to preview a translated title','Dùng EN ⇄ để xem tiêu đề dịch')}</span></div>${cards(DATA.sections.filter(s=>s.id==='introduction'))}${['part-1','part-2'].map(id=>{const s=DATA.sections.find(s=>s.id===id);return `<div class="section-label"><h2 lang="${lang}"><a href="#${id}">${display(s[lang])}</a></h2></div>${cards(DATA.sections.filter(s=>s.id===id||s.parent===id))}`}).join('')}<div class="section-label"><h2>${t('Finish the reading','Kết thúc bài đọc')}</h2></div>${cards(DATA.sections.filter(s=>s.id==='conclusion'))}<aside class="gloss-banner"><div><div class="eyebrow">${t('Words in context','Từ vựng trong ngữ cảnh')}</div><h2>${t('Your learner glossary','Từ vựng dành cho bạn')}</h2><p>${t('30 terms. Clear definitions. Original examples.','30 mục từ. Định nghĩa rõ ràng. Ví dụ nguyên văn.')}</p></div><a class="button primary" href="#glossary">${t('Open glossary','Mở từ vựng')} ↗</a></aside>${sourceNotes()}`}
function paragraph(p,index){const l=flips.get(p.id)||lang;return `<article class="paragraph" id="${p.id}" aria-label="${esc(t('Paragraph ','Đoạn ')+(index+1))}"><div class="para-top"><span class="badge">${String(index+1).padStart(2,'0')} <span aria-hidden="true">/</span> <span data-badge="${p.id}">${l.toUpperCase()}</span></span><button type="button" data-flip="${p.id}" aria-controls="faces-${p.id}" aria-pressed="${l==='vi'}">${l==='en'?'Reveal Vietnamese / Xem tiếng Việt':'Show English / Xem tiếng Anh'} ⇄</button></div><div class="flip-stack" id="faces-${p.id}">${['en','vi'].map(side=>`<div class="face ${l===side?'active':''}" lang="${side}" aria-hidden="${l!==side}">${p[side].map(txt=>`<p>${display(txt)}</p>`).join('')}</div>`).join('')}</div>${p.note?`<div class="note">${t('Source alignment: this English paragraph matches two Vietnamese paragraphs. The repeated material and incomplete phrase in the second Vietnamese paragraph are retained exactly.','Đối chiếu nguồn: đoạn tiếng Anh này tương ứng với hai đoạn tiếng Việt. Nội dung lặp và cụm từ chưa hoàn chỉnh trong đoạn tiếng Việt thứ hai được giữ nguyên.')}</div>`:''}<div class="source-line">EN-01 ${p.enIndices.map(i=>i+1).join(', ')} · SRT-VN ${p.viIndices.map(i=>i+1).join(', ')}</div></article>`}
function reading(s){const l=headings.get(s.id)||lang;const children=DATA.sections.filter(x=>x.parent===s.id);const index=DATA.sections.indexOf(s);main.innerHTML=`<div class="reading"><section class="hero"><div class="eyebrow">${String(index+1).padStart(2,'0')} / 13 · ${t('THE ORIGINAL TEXT','NGUYÊN VĂN')}${s.parent?` · <a href="#${s.parent}">${s.parent==='part-1'?t('Part 1','Phần 1'):t('Part 2','Phần 2')}</a>`:''}</div><h1 lang="${l}">${display(s[l])}</h1><button type="button" data-heading="${s.id}">${l.toUpperCase()} ⇄ ${t('Translate heading','Đổi ngôn ngữ tiêu đề')}</button></section><div class="reading-tools"><label class="sr-only" for="jump">${t('Jump to section','Chuyển đến mục')}</label><select id="jump">${DATA.sections.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x[lang].trim())}</option>`).join('')}</select><button id="presentation" aria-pressed="${presentation}">${t('Large text','Chữ lớn')} Aa</button></div>${s.paragraphs.length?`<p class="small">${t('Reveal each translation with the paragraph button. EN → VI in the top bar changes all paragraphs.','Dùng nút trên từng đoạn để xem bản dịch. EN → VI ở thanh trên đổi tất cả các đoạn.')}</p>`:''}${s.paragraphs.map(paragraph).join('')}${children.length?`<div class="section-label"><h2>${t('In this part','Trong phần này')}</h2></div>${cards(children)}`:''}<nav class="pager" aria-label="${t('Reading sequence','Thứ tự bài đọc')}">${index>0?`<a class="button" href="#${DATA.sections[index-1].id}">← ${esc(DATA.sections[index-1][lang])}</a>`:'<span></span>'}${index<DATA.sections.length-1?`<a class="button" href="#${DATA.sections[index+1].id}">${esc(DATA.sections[index+1][lang])} →</a>`:`<a class="button primary" href="#glossary">${t('Continue to glossary','Tiếp tục đến từ vựng')} →</a>`}</nav></div>`}
function glossary(){main.innerHTML=`<section class="hero"><div class="eyebrow">B2 / C1 · ${t('Vocabulary in context','Từ vựng trong ngữ cảnh')}</div><h1>${t('A little more understanding.','Hiểu thêm từng chút một.')}</h1><p class="intro">${t('30 words and expressions from the reading. Compare the definition with its simpler explanation, then reveal the Vietnamese equivalent.','30 từ và cụm từ trong bài đọc. So sánh định nghĩa với phần giải thích đơn giản, rồi mở nghĩa tiếng Việt.')}</p></section><label for="search">${t('Find a term','Tìm một mục từ')}</label><input class="search" id="search" type="search" autocomplete="off" placeholder="${t('Search English or Vietnamese…','Tìm tiếng Anh hoặc tiếng Việt…')}"><p class="small" id="count" role="status" aria-live="polite"></p><div id="terms" class="glossary-grid"></div><p class="small">${t('Definitions are learning aids. Examples reproduce the source wording and link back to the reading.','Định nghĩa hỗ trợ học tập. Ví dụ giữ nguyên lời văn nguồn và liên kết về bài đọc.')}</p>`;renderTerms('')}
function renderTerms(query){const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();const list=DATA.glossary.filter(g=>normalize(g.term+' '+g.vi+' '+g.definition).includes(normalize(query)));document.getElementById('count').textContent=`${list.length} / 30 ${t('terms','mục từ')}`;document.getElementById('terms').innerHTML=list.map(g=>`<article class="term"><h2 lang="en">${esc(g.term)}</h2><div class="pos" lang="en">${esc(g.pos)}</div><dl lang="en"><dt>Definition</dt><dd>${esc(g.definition)}</dd><dt>In other words</dt><dd>${esc(g.plain)}</dd></dl><blockquote lang="en">“${esc(g.example)}”<cite><a href="#${g.section}/${g.paragraph}">${esc(DATA.sections.find(s=>s.id===g.section)[lang].trim())} ↗</a></cite></blockquote><details><summary>${t('Reveal Vietnamese / Xem nghĩa','Xem nghĩa tiếng Việt / Reveal Vietnamese')}</summary><p lang="vi">${esc(g.vi)}</p></details></article>`).join('')||`<p class="empty">${t('No matching terms. Try another word.','Không tìm thấy mục từ. Hãy thử từ khác.')}</p>`}
function route(focus=true){syncNav();const hash=location.hash.slice(1)||'overview';if(hash==='main'){main.focus();return}const [id,pid]=hash.split('/');const s=DATA.sections.find(s=>s.id===id);if(id==='overview')overview();else if(id==='glossary')glossary();else if(s)reading(s);else main.innerHTML=`<section class="hero"><h1>${t('Page not found','Không tìm thấy trang')}</h1><a class="button primary" href="#overview">${t('Return to overview','Về tổng quan')}</a></section>`;document.title=(s?s[lang].trim():id==='glossary'?t('Glossary','Từ vựng'):t('Daily Habits','Thói quen mỗi ngày'))+' · The Daily Reader';if(focus){main.focus({preventScroll:true});window.scrollTo(0,0);if(pid)requestAnimationFrame(()=>document.getElementById(pid)?.scrollIntoView({block:'start'}))}}
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus()});
document.getElementById('language').addEventListener('click',()=>{lang=lang==='en'?'vi':'en';save('daily-reader-language',lang);flips.clear();headings.clear();cardLang.clear();route(false);document.getElementById('status').textContent=t('Reading language: English','Ngôn ngữ đọc: tiếng Việt')});
document.getElementById('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';save('daily-reader-theme',theme);syncNav()});
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.flip){const id=b.dataset.flip;const l=(flips.get(id)||lang)==='en'?'vi':'en';flips.set(id,l);const article=document.getElementById(id);article.querySelectorAll('.face').forEach(f=>{f.classList.toggle('active',f.lang===l);f.setAttribute('aria-hidden',String(f.lang!==l))});article.querySelector('[data-badge]').textContent=l.toUpperCase();b.textContent=(l==='en'?'Reveal Vietnamese / Xem tiếng Việt':'Show English / Xem tiếng Anh')+' ⇄';b.setAttribute('aria-pressed',String(l==='vi'));document.getElementById('status').textContent=l==='vi'?'Đang hiển thị tiếng Việt.':'Showing English.'}else if(b.dataset.card){e.stopPropagation();const id=b.dataset.card;const l=(cardLang.get(id)||lang)==='en'?'vi':'en';cardLang.set(id,l);const a=b.closest('.chapter').querySelector('h3 a');a.innerHTML=display(DATA.sections.find(s=>s.id===id)[l]);a.lang=l;b.textContent=l.toUpperCase()+' ⇄'}else if(b.dataset.heading){const id=b.dataset.heading;const l=(headings.get(id)||lang)==='en'?'vi':'en';headings.set(id,l);const h=main.querySelector('h1');h.innerHTML=display(DATA.sections.find(s=>s.id===id)[l]);h.lang=l;b.textContent=l.toUpperCase()+' ⇄ '+t('Translate heading','Đổi ngôn ngữ tiêu đề')}else if(b.id==='presentation'){presentation=!presentation;document.body.classList.toggle('presentation',presentation);b.setAttribute('aria-pressed',String(presentation))}});
main.addEventListener('change',e=>{if(e.target.id==='jump')location.hash=e.target.value});main.addEventListener('input',e=>{if(e.target.id==='search')renderTerms(e.target.value)});window.addEventListener('hashchange',()=>route());route(false);
</script>
</body></html>
