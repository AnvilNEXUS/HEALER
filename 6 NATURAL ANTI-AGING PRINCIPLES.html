    };

    /* Web Speech Synthesis Handler */
    function speakText(text, lang = 'en-US') {
      if (!('speechSynthesis' in window)) {
        showToast("Speech synthesis is not supported on this browser.", "error");
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 0.95; // slightly slower for better pedagogical clarity
      utterance.pitch = 1.0;

      const ttsController = document.getElementById('tts-controller');
      const ttsLabel = document.getElementById('tts-label');

      utterance.onstart = () => {
        State.isSpeaking = true;
        if (ttsController) {
          ttsController.classList.remove('hidden');
          ttsLabel.innerText = lang.startsWith('vi') ? "Đang đọc Tiếng Việt..." : "Reading in English...";
        }
      };

      utterance.onend = utterance.onerror = () => {
        State.isSpeaking = false;
        if (ttsController) {
          ttsController.classList.add('hidden');
        }
      };

      State.speechUtterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      State.isSpeaking = false;
      const ttsController = document.getElementById('tts-controller');
      if (ttsController) ttsController.classList.add('hidden');
    }

    /* Toast Notification System (No alert() used) */
    function showToast(message, type = "info") {
      const container = document.getElementById('toast-container');
      if (!container) return;
      
      const toast = document.createElement('div');
      const colors = type === "error" 
        ? "bg-rose-600 text-white" 
        : type === "success" 
        ? "bg-emerald-600 text-white" 
        : "bg-slate-800 text-white dark:bg-slate-700";

      toast.className = `px-4 py-2.5 rounded-xl shadow-xl text-xs font-semibold tracking-wide flex items-center gap-2 transform transition-all duration-300 translate-y-4 opacity-0 pointer-events-auto ${colors}`;
      toast.innerHTML = `
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    /* Theme Initializer */
    function initTheme() {
      const savedTheme = localStorage.getItem('longevity_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      State.theme = savedTheme || (prefersDark ? 'dark' : 'light');
      applyTheme();
    }

    function applyTheme() {
      const html = document.documentElement;
      const darkIcon = document.getElementById('theme-icon-dark');
      const lightIcon = document.getElementById('theme-icon-light');

      if (State.theme === 'dark') {
        html.classList.add('dark');
        darkIcon.classList.remove('hidden');
        lightIcon.classList.add('hidden');
      } else {
        html.classList.remove('dark');
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      }
      localStorage.setItem('longevity_theme', State.theme);
    }

    function toggleTheme() {
      State.theme = State.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
    }

        navBackBtn.classList.add('inline-flex');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Animate View Transition

                </div>

                <!-- Bottom Helper Hint -->
                <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                  <span class="flex items-center gap-1 text-[11px]">
                    <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/>
                    </svg>
                    <span>Tap card or button to reveal ${isVI ? 'English' : 'Tiếng Việt'}</span>
                  </span>
                  <button 
                    onclick="event.stopPropagation(); copyParagraphText('${escapeForSpeech(isVI ? p.vi : p.en)}')"
                    class="text-slate-400 hover:text-emerald-600 transition-colors p-1"
                    title="Copy text to clipboard">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Section Navigation Footer -->
        <div class="max-w-4xl mx-auto pt-8 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
          ${prevSec ? `
            <a href="#${prevSec.id}" class="w-full sm:w-auto px-5 py-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-left hover:border-emerald-500 shadow-sm transition-all group">
              <span class="text-xs text-slate-400 block font-medium">← Previous Section</span>
              <span class="text-sm font-bold text-slate-900 dark:text-white group-hover:text-emerald-600 transition-colors">${prevSec.titleEN}</span>
            </a>
          ` : '<div></div>'}

          ${nextSec ? `
            <a href="#${nextSec.id}" class="w-full sm:w-auto px-5 py-3 rounded-2xl bg-emerald-600 text-white text-right hover:bg-emerald-700 shadow-md shadow-emerald-600/20 transition-all group">
              <span class="text-xs text-emerald-100 block font-medium">Next Section →</span>
              <span class="text-sm font-bold">${nextSec.titleEN}</span>
            </a>
          ` : `
            <a href="#glossary" class="w-full sm:w-auto px-5 py-3 rounded-2xl bg-emerald-600 text-white text-right hover:bg-emerald-700 shadow-md transition-all">
              <span class="text-xs text-emerald-100 block font-medium">Completed All Sections →</span>
              <span class="text-sm font-bold">Open Academic Glossary</span>
            </a>
          `}
        </div>
      `;
    }

    function toggleHeaderLang(secId) {
      State.headerLanguages[secId] = State.headerLanguages[secId] === 'VI' ? 'EN' : 'VI';
      const sec = SECTIONS.find(s => s.id === secId);
      if (sec) renderSection(document.getElementById('app-root'), sec);
    }

    function toggleSingleCardLang(secId, pIdx) {
      const key = `${secId}_${pIdx}`;
      const current = State.cardLanguages[key] || State.globalDefaultLang;
      State.cardLanguages[key] = current === 'VI' ? 'EN' : 'VI';
      
      const sec = SECTIONS.find(s => s.id === secId);
      if (sec) renderSection(document.getElementById('app-root'), sec);
    }

    function toggleAllParagraphsInCurrentSection(secId) {
      const sec = SECTIONS.find(s => s.id === secId);
      if (!sec) return;
      
      const sampleKey = `${secId}_0`;
      const current = State.cardLanguages[sampleKey] || State.globalDefaultLang;
      const targetLang = current === 'EN' ? 'VI' : 'EN';

      sec.paragraphs.forEach((_, idx) => {
        State.cardLanguages[`${secId}_${idx}`] = targetLang;
      });

      renderSection(document.getElementById('app-root'), sec);
      showToast(`Switched all paragraphs to ${targetLang === 'VI' ? 'Tiếng Việt' : 'English'}`);
    }

    function copyParagraphText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("Copied paragraph to clipboard!", "success");
      } catch (err) {
        showToast("Failed to copy", "error");
      }
      document.body.removeChild(textarea);
    }

    function escapeForSpeech(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
    }

    /* Final Page: Interactive Learner Glossary (30 Specialized Terms) */
    function renderGlossary(root) {
      const filteredTerms = GLOSSARY.filter(item => {
        const matchesCategory = State.activeCategory === 'all' || item.category === State.activeCategory;
        const q = State.glossarySearch.toLowerCase().trim();
        const matchesQuery = !q || (
          item.term.toLowerCase().includes(q) ||
          item.defEN.toLowerCase().includes(q) ||
          item.plainEN.toLowerCase().includes(q) ||
          item.termVI.toLowerCase().includes(q) ||
          item.meaningVI.toLowerCase().includes(q)
        );
        return matchesCategory && matchesQuery;
      });

      root.innerHTML = `
        <div class="max-w-4xl mx-auto mb-10">
          <div class="text-center mb-8">
            <span class="text-xs font-extrabold tracking-widest uppercase px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">
              Interactive Academic Lexicon
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mt-3 mb-2 font-sans">
              Scientific Anti-Aging Glossary
            </h1>
            <p class="text-slate-600 dark:text-slate-400 text-sm max-w-2xl mx-auto">
              30 B2/C1 terms, idioms, and biochemical concepts extracted verbatim from the report. Perfect for academic vocabulary retention, context application, and pronunciation.
            </p>
          </div>

          <!-- Search & Filter Controls -->
          <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mb-8 space-y-4">
            
            <!-- Search Bar -->
            <div class="relative">
              <svg class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <input 
                type="text" 
                id="glossary-search-input"
                value="${State.glossarySearch}"
                oninput="handleGlossarySearch(this.value)"
                placeholder="Search term, definition, or Vietnamese meaning (e.g. Sirtuin, Telomere, Ikigai)..." 
                class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
              ${State.glossarySearch ? `
                <button onclick="clearGlossarySearch()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-white">
                  Clear
                </button>
              ` : ''}
            </div>

            <!-- Filter Chips & Master Actions -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <button 
                  onclick="setGlossaryCategory('all')" 
                  class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${State.activeCategory === 'all' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  All (30)
                </button>
                <button 
                  onclick="setGlossaryCategory('biology')" 
                  class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${State.activeCategory === 'biology' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  Genetics & Biology (11)
                </button>
                <button 
                  onclick="setGlossaryCategory('nutrition')" 
                  class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${State.activeCategory === 'nutrition' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  Nutrition & Antioxidants (8)
                </button>
                <button 
                  onclick="setGlossaryCategory('hormones')" 
                  class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${State.activeCategory === 'hormones' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  Hormones (5)
                </button>
                <button 
                  onclick="setGlossaryCategory('lifestyle')" 
                  class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${State.activeCategory === 'lifestyle' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">
                  Blue Zones & Habits (6)
                </button>
              </div>

              <!-- Master Reveal All / Hide All Vietnamese -->
              <div class="flex items-center gap-2">
                <button onclick="toggleAllGlossaryTranslations(true)" class="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 hover:underline">
                  Reveal All VI
                </button>
                <span class="text-slate-300 dark:text-slate-700">•</span>
                <button onclick="toggleAllGlossaryTranslations(false)" class="text-[11px] font-semibold text-slate-500 hover:underline">
                  Hide All VI
                </button>
              </div>
            </div>
          </div>

          <!-- Vocabulary Card Grid -->
          <div class="grid grid-cols-1 gap-6">
            ${filteredTerms.length > 0 ? filteredTerms.map((item) => {
              const originalIndex = GLOSSARY.findIndex(g => g.term === item.term);
              const isRevealed = State.revealedVocab[originalIndex] || false;

              return `
                <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 sm:p-7 shadow-sm hover:shadow-md transition-all">
                  
                  <!-- Top Row: Term, Part of Speech, Pronounce -->
                  <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-2.5">
                      <h3 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white tracking-tight">
                        ${item.term}
                      </h3>
                      <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 italic">
                        ${item.pos}
                      </span>
                      <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">
                        ${item.category}
                      </span>
                    </div>

                    <button 
                      onclick="speakText('${item.term}. Definition: ${escapeForSpeech(item.defEN)}', 'en-US')"
                      title="Listen to pronunciation & definition"
                      class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-emerald-50 hover:text-emerald-700 dark:hover:bg-emerald-950/80 transition-colors">
                      <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                      </svg>
                      <span>Pronounce (EN)</span>
                    </button>
                  </div>

                  <!-- Definitions -->
                  <div class="space-y-3.5 mb-5 text-sm sm:text-base">
                    <div>
                      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Academic Contextual Definition:</span>
                      <p class="text-slate-800 dark:text-slate-200 font-medium leading-relaxed">
                        ${item.defEN}
                      </p>
                    </div>

                    <div class="p-3.5 rounded-2xl bg-emerald-50/60 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900/50">
                      <span class="text-xs font-bold text-emerald-800 dark:text-emerald-300 uppercase tracking-wider block mb-0.5">In other words (B1/B2 Plain English):</span>
                      <p class="text-emerald-950 dark:text-emerald-100 text-sm leading-relaxed">
                        ${item.plainEN}
                      </p>
                    </div>

                    <div>
                      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Excerpt from Report:</span>
                      <blockquote class="italic text-slate-600 dark:text-slate-400 text-sm border-l-2 border-emerald-500 pl-3 py-0.5">
                        "${item.context}"
                      </blockquote>
                    </div>
                  </div>

                  <!-- Vietnamese Translation (Toggleable) -->
                  <div class="pt-4 border-t border-slate-100 dark:border-slate-800">
                    ${isRevealed ? `
                      <div class="p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3 animate-fadeIn">
                        <div>
                          <div class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider mb-1">Nghĩa Tiếng Việt:</div>
                          <div class="text-base font-bold text-indigo-950 dark:text-indigo-100 mb-0.5">${item.termVI}</div>
                          <p class="text-xs sm:text-sm text-indigo-900/80 dark:text-indigo-200/80 leading-relaxed">${item.meaningVI}</p>
                        </div>
                        <button 
                          onclick="toggleVocabMeaning(${originalIndex})" 
                          class="shrink-0 text-xs font-bold px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100 transition-colors">
                          Hide / Ẩn
                        </button>
                      </div>
                    ` : `
                      <button 
                        onclick="toggleVocabMeaning(${originalIndex})" 
                        class="w-full py-2.5 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 hover:border-emerald-500 text-xs font-bold text-slate-600 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                        <span>Reveal Vietnamese / Xem nghĩa Tiếng Việt</span>
                      </button>
                    `}
                  </div>

                </div>
              `;
            }).join('') : `
              <div class="text-center py-16 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800">
                <p class="text-slate-500 dark:text-slate-400 text-sm">No vocabulary terms match your search filter.</p>
                <button onclick="clearGlossarySearch()" class="mt-3 px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">
                  Reset Search Filter
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function handleGlossarySearch(val) {
      State.glossarySearch = val;
      renderGlossary(document.getElementById('app-root'));
    }

    function clearGlossarySearch() {
      State.glossarySearch = "";
      renderGlossary(document.getElementById('app-root'));
    }

    function setGlossaryCategory(cat) {
      State.activeCategory = cat;
      renderGlossary(document.getElementById('app-root'));
    }

    function toggleVocabMeaning(idx) {
      State.revealedVocab[idx] = !State.revealedVocab[idx];
      renderGlossary(document.getElementById('app-root'));
    }

    function toggleAllGlossaryTranslations(show) {
      GLOSSARY.forEach((_, idx) => {
        State.revealedVocab[idx] = show;
      });
      renderGlossary(document.getElementById('app-root'));
      showToast(show ? "Revealed all Vietnamese definitions" : "Hidden all Vietnamese definitions");
    }

    /* Global Language Toggle (Toggles default from EN to VI) */
    function toggleGlobalDefaultLang() {
      State.globalDefaultLang = State.globalDefaultLang === 'EN' ? 'VI' : 'EN';
      
      const label = document.getElementById('global-lang-label');
      if (label) {
        label.innerText = State.globalDefaultLang === 'EN' ? "English (EN)" : "Tiếng Việt (VI)";
      }

      // Reset individual overrides to follow global default
      State.cardLanguages = {};
      SECTIONS.forEach(s => {
        State.headerLanguages[s.id] = State.globalDefaultLang;
      });

      router();
      showToast(`Default language switched to ${State.globalDefaultLang === 'EN' ? 'English' : 'Tiếng Việt'}`);
    }

    /* Reading Mode Toggle (Flip Card vs Dual Side-by-Side) */
    function toggleViewMode() {
      State.viewMode = State.viewMode === 'flip' ? 'dual' : 'flip';
      const label = document.getElementById('view-mode-label');
      if (label) {
        label.innerText = State.viewMode === 'flip' ? 'Flip Mode' : 'Dual Mode';
      }
      router();
      showToast(`Switched view to ${State.viewMode === 'flip' ? 'Interactive Flip Cards' : 'Side-by-Side Comparison'}`);
    }

    /* Reading Progress Scroll Listener */
    window.addEventListener('scroll', () => {
      const progressBar = document.getElementById('reading-progress');
      if (!progressBar) return;

      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      progressBar.style.width = `${progress}%`;
    });

    /* Keyboard Navigation Shortcuts */
    window.addEventListener('keydown', (e) => {
      // Don't intercept if user is typing in the search box
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'Escape') {
        stopSpeech();
      }
    });

    /* App Initializer */
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();

      // Wire theme button
      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

      // Wire global language toggle button
      document.getElementById('global-lang-toggle').addEventListener('click', toggleGlobalDefaultLang);

      // Wire view mode toggle button
      document.getElementById('view-mode-toggle').addEventListener('click', toggleViewMode);

      // Wire TTS stop button
      document.getElementById('tts-stop-btn').addEventListener('click', stopSpeech);

      // Hash Routing Listener
      window.addEventListener('hashchange', router);

      // Launch Initial View
      router();
    });
  </script>
</body>
</html>
