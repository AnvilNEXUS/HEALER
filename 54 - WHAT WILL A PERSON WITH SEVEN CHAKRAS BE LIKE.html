            id: "p1_5",
            en: "The chest cavity also houses several vital structures:\n* The Thymus: Located behind the sternum, it is a key hub of the immune system linked to the body’s defenses and self-healing capacity. The state of the thymus is also tied to emotions and stress. When you live in chronic, prolonged stress, your immune function can suffer.\n* The Breasts/Mammary Glands: Situated on both sides of the chest, these tissues are highly sensitive to emotional shifts. In TCM theory, the nipples relate to the Liver meridian, the breast tissue relates to the Stomach meridian and connects with the Spleen, while the Pericardium meridian also traverses this region. When emotions are suppressed or stagnant, this area is often the first to experience blockages. Sensations of tension, tightness, distension, or even palpable lumps are frequently linked to unexpressed words and suppressed anger that have never found release.",
            vi: "Khu vực lồng ngực lại chứa một số cơ quan rất quan trọng:\n* Tuyến ức: Nằm phía sau xương ức, là một mắt xích quan trọng của hệ miễn dịch liên quan đến khả năng phòng vệ và phục hồi của cơ thể. Trạng thái của tuyến ức cũng có liên hệ với cảm xúc và stress. Khi bạn thường xuyên ở trong trạng thái căng thẳng kéo dài, chức năng miễn dịch cũng có thể bị ảnh hưởng.\n* Tuyến vú: Nằm ở hai bên phía trước ngực, là một trong những mô rất nhạy cảm với cảm xúc của cơ thể. Đông y cho rằng đầu vú thuộc Can, tuyến vú thuộc Vị kinh lại thông với Tỳ, Tâm bào kinh cũng đi qua khu vực này. Khi cảm xúc bị uất kết, nơi thường xuyên bị ứ lại nhất chính là khu vực này. Cảm giác căng, tức trướng, thậm chí có cảm giác kết hạch, nhiều khi liên quan đến những lời muốn nói mà không nói ra, những cơn tức giận bị nén lại mà chưa được giải tỏa."
          },
          {
            id: "p1_6",
            en: "Therefore, whether your Heart Chakra is open or not, the tension or ease in your chest serves as the most honest thermometer. Remember this guiding insight:\nThe door is set in your chest, and your face is the mirror upon that door. When the door opens and closes naturally, the reflection in that mirror is a rosy, gentle, and serene countenance.",
            vi: "Vì vậy, tâm luân có thông hay không, sự căng hay giãn ở vùng trước ngực chính là chiếc nhiệt kế trung thực nhất. Hãy ghi nhớ một câu trong phần này:\nCánh cửa nằm ở trước ngực, khuôn mặt chính là tấm gương trên cánh cửa. Cánh cửa đóng mở tự nhiên thì trong tấm gương ấy sẽ là một khuôn mặt hồng nhuận, ôn hòa."
          }
        ]
      },
      {
        id: "section-2",
        num: "2",
        tag: "Section 2",
        title_en: "2. The Doorway Opening Outward: The Capacity to Give",
        title_vi: "2. Cánh Cửa Mở Ra Bên Ngoài: Khả Năng Cho Đi",
        desc_en: "The neurobiology of oxytocin, genuine altruism vs. giving unto depletion.",
        desc_vi: "Cơ chế sinh lý của hormone oxytocin, sự cho đi từ chân tâm và cạm bẫy kiệt quệ.",
        readTime: "3 min",
        paragraphs: [
          {
            id: "p2_1",
            en: "First, look at the outward-facing aspect of the door: giving. The outward expression of the Heart Chakra manifests as compassion, goodwill, and the sharing of love. When a person can give, dares to give, and gives in a way that leaves them feeling richer rather than drained, it proves that this doorway is clear and unobstructed.",
            vi: "Trước tiên hãy nhìn vào phía cánh cửa mở ra bên ngoài: sự cho đi. Sự xuất của tâm luân là từ bi, thiện ý và sự trao truyền tình yêu. Một người có thể cho đi, dám cho đi, hơn nữa có thể cho đi theo cách càng cho càng phong phú, điều đó cho thấy cánh cửa này đang thông suốt."
          },
          {
            id: "p2_2",
            en: "There is a fascinating physiological mechanism at play here: the hormone oxytocin. Many people hear of oxytocin and think only of childbirth. In reality, its physiological roles are far broader. Oxytocin is often dubbed the love hormone or the bonding hormone:\n* When you are embraced, your body releases oxytocin.\n* When you genuinely extend goodwill toward another person, it is also released.\n* When you build trust with someone, oxytocin actively mediates that connection.",
            vi: "Ở đây có một cơ chế sinh lý rất thú vị: hormone oxytocin. Nhiều người nghe đến oxytocin sẽ nghĩ ngay đó chẳng phải là hormone sinh con sao? Thực ra tác dụng của nó còn rộng hơn rất nhiều. Oxytocin thường được gọi là hormone tình yêu hoặc hormone gắn kết:\n* Khi bạn được ôm, cơ thể có thể tiết ra oxytocin.\n* Khi bạn chân thành trao thiện ý cho người khác, nó cũng có thể được tiết ra.\n* Khi bạn xây dựng được sự tin tưởng với một người, nó cũng tham gia vào quá trình này."
          },
          {
            id: "p2_3",
            en: "As oxytocin levels rise, people tend to feel warmth, safety, and a desire for connection; the chest warms up, and breathing becomes relaxed. Those who regularly and sincerely help others generally enjoy better physical and mental well-being. This is not mere motivational rhetoric; it is an observation corroborated by research, because in the very act of giving, the body can generate its own neurological reward response—the tangible biological substrate supporting this outward pathway.",
            vi: "Khi oxytocin tăng lên, con người thường có cảm giác ấm áp, an toàn, muốn đến gần nhau, lồng ngực ấm lên, hơi thở trở nên thư giãn. Những người thường xuyên chân thành giúp đỡ người khác, trạng thái thể chất và tinh thần nhìn chung có xu hướng tốt hơn. Đây không chỉ là những lời động viên sáo rỗng mà là một quan sát có cơ sở từ các nghiên cứu, bởi ngay trong khoảnh khắc cho đi, cơ thể cũng có thể tự tạo ra những phản ứng mang tính tưởng thưởng — nền tảng vật chất hỗ trợ cho con đường xuất này."
          },
          {
            id: "p2_4",
            en: "Yet the linchpin lies in giving from a genuine heart. Though both appear as acts of giving, the underlying psychological states are worlds apart:\n* Giving with sincerity: \"I have an abundance, I share a portion with you; after giving, I feel even fuller.\" In this state, the Heart Chakra is open.\n* Giving unto depletion: \"I drain myself completely to buy your approval; after giving, I feel utterly empty.\" Here, the Heart Chakra is actually obstructed, because this is no longer true giving—it is seeking validation.",
            vi: "Nhưng điểm then chốt nằm ở hai chữ chân tâm cho đi. Cùng là cho nhưng trạng thái tâm lý hoàn toàn khác nhau:\n* Chân tâm cho đi: Tôi có phần dư, tôi chia cho bạn một chút, cho xong bản thân lại cảm thấy phong phú hơn. Trường hợp này, tâm luân đang mở.\n* Cho đi đến kiệt quệ: Tôi rút cạn chính mình để đổi lấy sự công nhận của bạn, cho xong bản thân lại càng trống rỗng. Trường hợp này thực ra tâm luân đã bị mắc kẹt, bởi đó không còn là cho mà là cầu."
          },
          {
            id: "p2_5",
            en: "Thus, the outward-facing door trains one essential quality: the ability to give. For someone who gives healthily, the door at their chest stands wide open. Reaching outward, they are relaxed, open-hearted, and warm.",
            vi: "Vì vậy, cánh cửa hướng ra bên ngoài rèn luyện một điều: cho được. Người có thể cho đi một cách lành mạnh thì cánh cửa nơi lồng ngực rộng mở. Khi hướng ra ngoài, con người thư giãn, cởi mở và có nhiệt độ."
          }
        ]
      },
      {
        id: "section-3",
        num: "3",
        tag: "Section 3",
        title_en: "3. The Doorway Turning Inward: The Capacity to Receive",
        title_vi: "3. Cánh Cửa Khép Vào Bên Trong: Khả Năng Tiếp Nhận",
        desc_en: "Ventral Vagus Nerve, Heart Rate Variability (HRV), and learning to be cared for.",
        desc_vi: "Hệ thống tham gia xã hội, nhánh phế vị bụng, độ biến thiên nhịp tim HRV và bài học đón nhận.",
        readTime: "4 min",
        paragraphs: [
          {
            id: "p3_1",
            en: "Now consider the door opening inward: receiving. This doorway is often far more difficult than the outward one, because many people can give effortlessly but struggle profoundly to receive. Reflect on your own reactions:\n* When someone compliments you, do you deflect with \"Oh, not at all, it's nothing,\" or do you say \"Thank you\"?\n* When someone offers help, can you accept it with ease, or do you feel deeply uneasy and rush to repay the debt immediately?\n* When you need care, do you dare ask for it, or do you suppress your need and insist, \"I'm fine\"?\nIf you find yourself in the second scenario most of the time, your inward-facing door is closed.",
            vi: "Bây giờ hãy nhìn vào cánh cửa hướng vào bên trong: sự tiếp nhận. Cánh cửa này còn khó hơn cánh cửa hướng ra ngoài bởi rất nhiều người cho được nhưng nhận không nổi. Bạn thử nhớ lại xem:\n* Khi người khác khen bạn, bạn nói \"đâu có, đâu có\" hay bạn nói \"cảm ơn\"?\n* Khi người khác giúp bạn, bạn có thể bình thản tiếp nhận hay cả người cảm thấy không thoải mái và vội vàng tìm cách trả lại?\n* Khi bạn cần được chăm sóc, bạn có dám mở lời hay lại cố nén xuống và nói \"không sao\"?\nNếu phần lớn thời gian bạn đều thuộc về trường hợp thứ hai thì cánh cửa hướng vào bên trong của bạn đang đóng."
          },
          {
            id: "p3_2",
            en: "A closed inward door means the intake channel of the Heart Chakra cannot open, preventing nourishment from entering. When goodwill, support, and love from others arrive at your doorstep, you push them away. Over time, your body mirrors this behavior: the chest reflexively constricts, and breathing becomes shallow, because you do not allow outside vitality to enter—even breath itself is forbidden from sinking deep.",
            vi: "Cánh cửa hướng vào đóng lại nghĩa là con đường nhập của tâm luân không mở được, sự nuôi dưỡng không thể đi vào. Thiện ý, sự giúp đỡ và tình yêu mà người khác trao cho bạn, khi đến trước cửa bạn lại đẩy chúng ra. Lâu dần, cơ thể cũng làm điều tương tự: lồng ngực quen với việc co lại, hơi thở quen với việc trở nên nông, bởi bạn không cho những thứ bên ngoài đi vào, thậm chí ngay cả khí cũng không được phép đi sâu vào."
          },
          {
            id: "p3_3",
            en: "Dây thần kinh phế vị bụng & Độ biến thiên nhịp tim (HRV) (The Ventral Vagus Nerve & Heart Rate Variability)\nHere we must discuss a crucial neuroscience concept: the Ventral Vagus Nerve, also known as the social engagement system. The vagus nerve is one of the body’s longest cranial nerves, traveling down from the brainstem through the neck, chest, and abdomen, innervating major visceral organs. It features two primary branches, with the ventral vagal branch directly mediating our capacity for social connection.\n* When a person feels safe, accepted, and bonded, this neural pathway activates. Outwardly, breathing slows, heart rate stabilizes, the chest softens, vocal tone warms and modulates, and one can comfortably hold eye contact.\n* Conversely, when someone lives in chronic avoidance of receiving, fearing dependency or burdening others, their body remains in an ongoing state of subtle constriction. Ventral vagal activation is suppressed, the sympathetic nervous system takes over, breathing becomes shallow, heart rate climbs, the chest tightens, and the neck and shoulders stiffen.",
            vi: "Dây thần kinh phế vị bụng & Độ biến thiên nhịp tim (HRV)\nỞ đây cần nói đến một khái niệm rất quan trọng trong khoa học thần kinh: Dây thần kinh phế vị bụng, còn được gọi là hệ thống tham gia xã hội. Dây thần kinh phế vị là một trong những dây thần kinh sọ dài nhất của cơ thể, đi từ thân não xuống, xuyên qua vùng cổ, ngực và bụng, chi phối hoạt động của các cơ quan nội tạng. Nó có hai nhánh, trong đó nhánh phế vị bụng có liên quan trực tiếp đến trạng thái kết nối.\n* Khi một người cảm thấy an toàn, được chấp nhận và có sự gắn kết, nhánh thần kinh này được kích hoạt. Biểu hiện ra bên ngoài là hơi thở chậm lại, nhịp tim ổn định, lồng ngực thư giãn, giọng nói trở nên mềm mại, có thể nhìn vào mắt người khác.\n* Ngược lại, một người thường xuyên sống trong trạng thái không dám nhận, không dám dựa vào người khác, sợ làm phiền người khác thì cơ thể thực chất luôn âm thầm co lại. Sự hoạt hóa của phế vị bụng bị ức chế, hệ thần kinh giao cảm tiếp quản, hơi thở trở nên nông, nhịp tim tăng, lồng ngực căng, vai lưng cứng."
          },
          {
            id: "p3_4",
            en: "This physiological dynamic can be objectively measured through Heart Rate Variability (HRV). HRV captures the millisecond variations between consecutive heartbeats, reflecting the resilience and flexibility of the autonomic nervous system.\n* A high HRV indicates that the nervous system transitions smoothly between tension and relaxation, capable of adapting to stress and resting deeply. It serves as a vital biomarker for cardiovascular health and emotional stability.\n* People who endure chronic stress and never allow themselves to relax tend to show lower HRV; their bodies remain trapped in a mode of perpetual output without input, to the point where even their heartbeat cannot truly ease.",
            vi: "Trạng thái này có một chỉ số có thể đo lường trong y học gọi là độ biến thiên nhịp tim — HRV (Heart Rate Variability). Nó đo những biến đổi rất nhỏ trong khoảng thời gian giữa các nhịp tim, qua đó phản ánh mức độ linh hoạt của hệ thần kinh tự chủ.\n* Người có HRV cao cho thấy hệ thần kinh có khả năng chuyển đổi linh hoạt giữa trạng thái căng và giãn, có thể thư giãn, cũng có thể ứng phó. Đây là chỉ dấu quan trọng liên quan đến sức khỏe tim mạch và sự ổn định cảm xúc.\n* Những người thường xuyên căng thẳng kéo dài, không dám thư giãn thường có HRV thấp hơn; cơ thể của họ luôn mắc kẹt trong chế độ sẵn sàng cho đi nhưng không dám tiếp nhận, đến mức ngay cả nhịp tim cũng không thể thực sự thả lỏng."
          },
          {
            id: "p3_5",
            en: "Thus, the inward-facing door trains one vital capacity: the ability to receive. When you can receive, the goodwill of others can enter, physiological replenishment can flow in, and even your breath becomes deep, spacious, and complete.",
            vi: "Vì vậy, cánh cửa hướng vào bên trong rèn luyện một điều: tiếp nhận được. Người có thể tiếp nhận được thì thiện ý của người khác có thể đi vào, sự nuôi dưỡng của cơ thể có thể đi vào, ngay cả hơi thở cũng trở nên sâu đầy và trọn vẹn."
          }
        ]
      },
      {
        id: "section-4",
        num: "4",
        tag: "Section 4",
        title_en: "4. The Hinge of the Doorway: Respiration",
        title_vi: "4. Trục Bản Lề Của Cánh Cửa: Hô Hấp",
        desc_en: "Dual conscious-automatic breathing switch, Heart-Lung synergy, and sighs as body rescue.",
        desc_vi: "Cơ chế hai công tắc của hơi thở, mối phối hợp Tâm - Phế và cơ chế tự cứu của tiếng thở dài.",
        readTime: "3 min",
        paragraphs: [
          {
            id: "p4_1",
            en: "We have explored both sides of the door, but where is its hinge located? It resides in your breath.\nWhy the breath? Because respiration is the most extraordinary physiological system in the human body: half of it operates under conscious control, while the other half functions automatically. You can consciously take a deep inhale, yet you can also surrender respiration entirely to automatic control. Virtually no other organ system in the body shares this dual-switch mechanism. Because of this unique trait, breath serves as the finest remote control for regulating the autonomic nervous system.",
            vi: "Hai cánh cửa đã nói xong, vậy trục bản lề của cánh cửa nằm ở đâu? Ở hơi thở.\nTại sao lại là hơi thở? Bởi hô hấp là một hệ thống đặc biệt nhất trong cơ thể: một nửa chịu sự điều khiển của ý thức, một nửa vận hành tự động. Bạn có thể chủ động hít sâu một hơi, nhưng cũng có thể hoàn toàn giao việc hô hấp cho cơ thể tự điều khiển. Trong cơ thể gần như không có hệ thống thứ hai sở hữu cùng một cơ chế hai công tắc như vậy. Chính vì đặc tính đó, hơi thở trở thành chiếc điều khiển từ xa tốt nhất để điều chỉnh hệ thần kinh tự chủ."
          },
          {
            id: "p4_2",
            en: "When emotions spike into stress, the sympathetic system takes command, making breath shallow, rapid, and strained. Conversely, when you deliberately lengthen, deepen, and slow your breath, your body receives a definitive signal: it is safe to relax. The parasympathetic nervous system engages, heart rate gently drops, blood pressure stabilizes, and the chest expands. That is why virtually all relaxation modalities ultimately return to the breath. Breath is the key that unlocks the autonomic nervous system.",
            vi: "Khi cảm xúc căng thẳng, hệ thần kinh giao cảm tiếp quản, hơi thở trở nên nông, nhanh và gấp. Ngược lại, khi bạn chủ động làm cho hơi thở chậm lại, sâu hơn và kéo dài hơn, cơ thể sẽ nhận được một tín hiệu: có thể thư giãn rồi. Sau đó, hệ thần kinh đối giao cảm được kích hoạt, nhịp tim bắt đầu giảm, huyết áp có xu hướng ổn định, lồng ngực bắt đầu giãn ra. Đó là lý do tại sao hầu hết các phương pháp thư giãn cuối cùng đều quay trở về với hơi thở. Hơi thở chính là chiếc chìa khóa mở cánh cửa của hệ thần kinh tự chủ."
          },
          {
            id: "p4_3",
            en: "The Heart-Lung Synergy in TCM (Mối liên hệ Tâm - Phế trong Đông y)\nTCM teaches: \"The Lung governs Qi and controls respiration; the Lung faces all vessels\" (Phế chủ khí tư hô hấp, phế triều bách mạch)—the Lung manages Qi and oversees breathing; it connects with all hundred vessels, drawing Qi into the body and collaborating with the Heart to distribute Qi and blood throughout the entire system. The Heart and Lungs mutually rely on each other, coexisting within the thoracic cavity. The pumping of the Heart and the breathing of the Lungs form an intimately coordinated dynamic. When breathing is deep, the chest opens and closes fully, Qi rises and falls naturally, and both Heart and Lungs find spacious ease.",
            vi: "Mối liên hệ Tâm - Phế trong Đông y\nĐông y nói: \"Phế chủ khí tư hô hấp, phế triều bách mạch\" — phế chủ quản khí đảm nhiệm hô hấp, phế thông với trăm mạch, đưa khí vào cơ thể thông qua sự phối hợp với tâm mà phân bố khí đến toàn thân và huyết mạch. Tâm phế tương y cùng nằm trong khu vực lồng ngực. Hoạt động bơm máu của tâm và hoạt động hô hấp của phế vốn là một hệ thống phối hợp liên động. Người có hơi thở sâu, lồng ngực đóng mở đầy đủ, khí cơ thăng giáng tự nhiên, tâm và phế đều được thư thái."
          },
          {
            id: "p4_4",
            en: "Simply by observing how someone breathes, you can gauge the condition of their Heart Chakra:\n* A person with an unblocked Heart Chakra: Their breath is typically deep, steady, and unhindered. Whether sitting or standing, their respiratory rhythm remains effortless, long, and tranquil. When speaking, their central Qi (trung khí) is robust and resonant.\n* A person with a blocked Heart Chakra: Their breath is often shallow, rarely reaching down into the abdomen, punctuated by frequent deep gasps followed by heavy sighs. Sighing is not an affectation; it occurs because stagnant Qi is trapped in the chest, and the body instinctively attempts to rescue itself by forcing that trapped air out.",
            vi: "Chỉ cần nhìn cách một người hô hấp, bạn có thể phần nào nhận ra trạng thái tâm luân của họ:\n* Người có tâm luân thông suốt: Hơi thở thường sâu dài, đều đặn và thông suốt. Đứng hay ngồi đều có nhịp thở tự nhiên, dài và thư thái. Khi nói, trung khí đầy đủ.\n* Người có tâm luân không thông: Hơi thở thường nông, dường như không thể hít xuống tận đáy, thỉnh thoảng lại phải hít vào một hơi thật dài kèm theo tiếng thở dài. Thở dài không phải là làm bộ, đó là bởi một luồng khí bị tắc nghẽn ở lồng ngực, cơ thể đang tự cứu mình muốn đẩy luồng khí ấy ra ngoài."
          },
          {
            id: "p4_5",
            en: "Between the two doors of giving and receiving, breath is the hinge. When the hinge pivots smoothly, the door opens and shuts with grace. When the hinge jams, the door freezes rigid—stuck and congested.",
            vi: "Hai cánh cửa một vào và một ra, hơi thở chính là bản lề. Bản lề xoay được, cửa mới có thể đóng mở tự nhiên. Bản lề bị kẹt, cánh cửa sẽ cứng đờ tại chỗ, vừa tắc vừa căng."
          }
        ]
      },
      {
        id: "section-5",

        desc_en: "A moving transformation from sallow exhaustion to youthful radiance through receiving.",
        desc_vi: "Hành trình hồi sinh dung mạo từ xám xịt sang sáng trong của một người phụ nữ học cách mở cửa nhập.",
        readTime: "4 min",
        paragraphs: [
          {
            id: "p5_1",
            en: "This brings to mind someone I once worked with. A close friend of mine who works as a teacher came to see me. At 35 years old, she was the archetypal person who only knew how to give and never how to receive. She described herself as \"the lubricant of my family and the fire extinguisher of my workplace.\" She managed every household chore, aided every friend in need, and served as the sounding board whenever a colleague needed comfort. She gave incessantly, yet never once uttered the words, \"I need help.\"",
            vi: "Nói đến đây, tôi muốn kể một chuyện mà tôi từng gặp. Có một người bạn làm giáo viên tìm đến tôi. Cô ấy 35 tuổi, điển hình cho kiểu người chỉ biết cho đi, không biết nhận lại. Cô tự mô tả mình là \"chất bôi trơn của gia đình, bình cứu hỏa của đơn vị\". Chuyện trong nhà cô lo, chuyện của bạn bè cô giúp, đồng nghiệp nào có cảm xúc tiêu cực cũng tìm đến cô để được an ủi. Cô luôn cho đi, chưa bao giờ nói \"tôi cần\"."
          },
          {
            id: "p5_2",
            en: "She came to me presenting very specific struggles:\n* Over the past two years, her complexion had deteriorated markedly—dull, grayish, and lifeless, unresponsive to even the most intensive skincare masks.\n* Her chest felt constantly tight and suffocated; she caught herself sighing at every turn, and each deep breath felt incomplete, as though cut short.\n* She suffered from restless sleep, plagued by lingering anxiety, as though some unresolved burden would not let her rest.",
            vi: "Cô tìm đến tôi vì một vấn đề rất cụ thể:\n* Trong hai năm qua, sắc mặt ngày càng xấu, xám xịt, thiếu sức sống, đắp bao nhiêu mặt nạ cũng không cứu được.\n* Lồng ngực thường xuyên cảm thấy bí tức, một chút là thở dài, mỗi lần hít sâu đều có cảm giác thiếu một chút gì đó.\n* Ban đêm ngủ không ngon, trong lòng thấp thỏm, như thể có một điều gì đó vẫn chưa thể buông xuống."
          },
          {
            id: "p5_3",
            en: "I had her sit down and asked her to do just one thing: place her hands over her chest and take ten conscious breaths. By the third or fourth breath, tears were streaming down her face. She whispered: \"It has been so long since I breathed purely for myself. Every time I inhale, I feel as though I am apologizing to someone.\"",
            vi: "Tôi bảo cô ngồi xuống, trước tiên làm một việc: đặt tay lên ngực và tự hô hấp 10 lần. Đến lần thứ ba hoặc thứ tư, nước mắt cô đã rơi xuống. Cô nói: \"Đã rất lâu rồi, tôi không chỉ vì chính mình mà hô hấp. Mỗi lần hít vào, tôi đều có cảm giác như đang xin lỗi ai đó.\""
          },
          {
            id: "p5_4",
            en: "Her condition was all too familiar to me: prolonged output without any input. Her Heart Qi was depleted, Heart blood deficient, and blood failed to rise to nourish her face, leaving her complexion sallow and gray. Trapped Qi in the chest could not disperse, producing persistent chest oppression and frequent sighing; her Heart spirit went unnurtured, resulting in restlessness and poor sleep. The root of her trouble was never her skin; it lay entirely in the word receive—she had never once permitted herself to take in nourishment.",
            vi: "Tình trạng của cô ấy tôi quá quen thuộc: chỉ xuất không nhập trong thời gian dài, tâm khí hao tán, tâm huyết hư thiếu, huyết không thể đi lên nuôi dưỡng khuôn mặt khiến sắc mặt trở nên tối xám; khí ở lồng ngực luôn bị nén lại không thể thoát ra khiến con người cảm thấy bí bách và thường xuyên thở dài; tâm thần không được nuôi dưỡng, tâm trạng bất an, ngủ không yên. Vấn đề của cô ấy không nằm trên khuôn mặt, nó nằm ở chữ nhập của cánh cửa ấy — cô chưa bao giờ cho phép bản thân thu nhận."
          },
          {
            id: "p5_5",
            en: "What I guided her through was not giving more, but practicing how to receive. Three to four months later, when she visited again, her vital spirit had transformed conspicuously to the naked eye. Most noticeably, her habit of sighing had vanished, the grayish pallor on her face had cleared into bright transparency, and the exhausted slump in her posture was gone. She shared that now, when someone compliments her, her first impulse is no longer to wave her hands in denial; instead, she smiles and says: \"Thank you, I gladly receive that.\"",
            vi: "Sau đó điều tôi dạy cô không phải là cho nhiều hơn mà là luyện thu nhận. Khoảng ba bốn tháng sau cô lại đến gặp tôi, thần sắc đã thay đổi rõ rệt, có thể nhìn thấy bằng mắt thường. Điều rõ ràng nhất là cô không còn thở dài nữa, khuôn mặt màu xám xịt trước đây đã trở nên sáng trong hơn nhiều, cả người nhìn cũng không còn mệt mỏi như trước. Cô chia sẻ rằng bây giờ khi được người khác khen, phản ứng đầu tiên của cô không còn là xua tay phủ nhận mà có thể mỉm cười và nói: \"Cảm ơn bạn, tôi xin nhận.\""
          },
          {
            id: "p5_6",
            en: "As she spoke those words, her eyes sparkled. She reflected with deep emotion:\n\"I used to believe that completely draining myself for others was what it meant to be kind. Now I understand that a door that can open and close naturally is true kindness. Only when I am whole and healthy do I truly have something genuine to offer.\"",
            vi: "Khi nói câu ấy, đôi mắt cô sáng lên. Cô nói một câu đầy cảm khái:\n\"Trước đây tôi cứ nghĩ rằng vét cạn chính mình để đối tốt với người khác chính là thiện lương. Bây giờ tôi mới hiểu, một cánh cửa có thể mở và đóng tự nhiên mới thực sự là thiện lương. Bởi vì khi tôi khỏe mạnh, tôi mới có thứ để cho đi.\""
          },
          {
            id: "p5_7",
            en: "I have revisited her words many times. The doorway of the Heart Chakra: opening is compassion, closing is self-love. An opening and a closing together—that is what makes a human being whole.",
            vi: "Tôi đã suy nghĩ về câu nói ấy rất nhiều lần. Cánh cửa của tâm luân: mở là từ bi, khép là tự ái. Một mở một khép, đó mới là một con người hoàn chỉnh."
          }

      {
        id: "section-6",
        num: "6",
        tag: "Section 5",
        title_en: "5. States of Heart Chakra Imbalance",
        title_vi: "5. Trạng Thái Tâm Luân Bất Cân Bằng",
        desc_en: "Path 1 (Depletion: output without input) vs. Path 2 (Stagnation: input without output).",
        desc_vi: "Phân tích 2 trạng thái mất cân bằng: cửa chỉ xuất không nhập (hao tổn) và cửa chỉ nhập không xuất (bế tắc).",
        readTime: "3 min",
        paragraphs: [
          {
            id: "p6_1",
            en: "Having laid out the principles, let us examine the states of imbalance. Heart Chakra disharmonies generally present along two paths:\nHướng 1: Cửa chỉ xuất không nhập (Hao tổn) (Path 1: Output Without Input - Depletion)\n* Typical manifestations: Chest fullness and oppression, stiff shoulders and upper back, shallow breathing, and chronic sighing. Always caring for others while rarely being cared for; unable to ask for help. Feeling awkward when treated kindly; swallowing grievances for fear of troubling anyone. A dull, grayish, fatigued complexion, paired with listless eyes.\n* Root cause: Excessive giving without inward replenishment, leading to dissipated Heart Qi and deficient Heart blood, stripping the complexion of its radiant luster.",
            vi: "Nói xong nguyên lý, bây giờ hãy nói về trạng thái mất cân bằng. Các vấn đề của tâm luân thông thường tôi nhìn theo hai hướng:\nHướng 1: Cửa chỉ xuất không nhập (Hao tổn)\n* Biểu hiện điển hình: Lồng ngực bí tức, vai lưng cứng, hơi thở nông, thường xuyên thở dài. Dài ngày chăm sóc người khác nhưng hiếm khi được người khác chăm sóc, không dám mở lời nhờ giúp đỡ. Người khác đối tốt với mình lại cảm thấy không tự nhiên; trong lòng có ấm ức cũng cố nén vì sợ làm phiền người khác. Sắc mặt thường tối, xám, mệt mỏi, ánh mắt uể oải.\n* Căn nguyên: Cho đi quá nhiều nhưng không thu nhận lại được, dẫn đến tâm khí hao tán, tâm huyết hư thiếu, diện sắc mất đi sự vinh nhuận."
          },
          {
            id: "p6_2",
            en: "Hướng 2: Cửa chỉ nhập không xuất (Bế tắc) (Path 2: Input Without Output - Stagnation)\n* Typical manifestations: Harbors a reservoir of pent-up emotion that can neither be spoken nor let go. Lacks warmth toward others and feels that loving is futile. It is not a lack of desire to love, but rather a heavy boulder pressing upon the chest that prevents love from flowing outward. Instinctively pulling back when others approach. Emotional backlog causes even minor events to induce breathlessness; the face appears dull, dusky, or pale-sallow, with brows perpetually furrowed.\n* Root cause: Hoarding everything inwardly and refusing to extend oneself, causing emotions to stagnate in the chest and obstructing the natural flow of Qi.",
            vi: "Hướng 2: Cửa chỉ nhập không xuất (Bế tắc)\n* Biểu hiện điển hình: Trong lòng chất chứa rất nhiều cảm xúc nhưng không nói ra được cũng không buông xuống được. Không còn nhiệt tình với người khác, cảm thấy tình yêu thật vô lực. Không phải không muốn yêu mà giống như có một tảng đá đè lên ngực khiến tình yêu không thể đi ra. Khi người khác đến gần, theo bản năng lại lùi về phía sau. Cảm xúc dễ tích tụ, chỉ một chuyện nhỏ cũng khiến bản thân cảm thấy khó thở, sắc mặt xanh xám tối, chân mày thường xuyên nhíu chặt.\n* Căn nguyên: Cái gì cũng giữ lại, cái gì cũng không dám cho đi, khiến cảm xúc uất kết ở lồng ngực, khí cơ không thông."
          },
          {
            id: "p6_3",
            en: "In TCM, this corresponds to Liver Qi stagnation and obstruction of the Heart vessels. One path is depletion, the other is stagnation; their directions are opposite, yet their origin is identical: the doorway in the chest has lost its natural open-and-close rhythm, its hinge seized. What needs to flow out cannot escape, and what needs to enter cannot penetrate. Over time, this disharmony writes itself across the face and stamps itself into the body.",
            vi: "Theo Đông y có thể nhìn nhận theo hướng can uất khí trệ, tâm mạch bất thông. Một bên là hao, một bên là tắc, hướng đi ngược nhau nhưng căn nguyên đều nằm ở cùng một nơi: cánh cửa nơi lồng ngực đã mất khả năng đóng mở tự nhiên, bản lề bị kẹt. Cái cần đi ra thì không đi ra được, cái cần đi vào thì không đi vào được. Lâu dần tất cả đều được viết lên khuôn mặt và cũng được viết vào cơ thể."
          },
          {
            id: "p6_4",
            en: "When the Heart Chakra is truly unobstructed: breath is deep, long, and smooth; the chest is relaxed without tension; giving and receiving coexist in harmony; emotions flow without being bottled up or exhausted; and an authentic inner radiance emanates—a tranquil state that requires no pretense, no straining, and no depletion.",
            vi: "Khi tâm luân thực sự thông suốt: hơi thở sâu dài và thuận, lồng ngực thư giãn không căng cứng, vừa cho đi được vừa tiếp nhận được, cảm xúc có dòng chảy không bị đè nén cũng không bị hao mòn, từ bên trong tỏa ra một sự ôn nhuận, một trạng thái an tĩnh không cần giả tạo, không cần gồng mình, không cần tiêu hao."
          }
        ]
      },
      {
        id: "section-7",
        num: "7",
        tag: "Section 6",
        title_en: "6. Methods for Regulating the Heart Chakra: One Inhale, One Exhale",
        title_vi: "6. Phương Pháp Điều Chỉnh Tâm Luân: Một Thở Vào, Một Thở Ra",
        desc_en: "Acupressure (Danzhong, Neiguan, Shenmen, Juque) & complete visualization breathwork.",
        desc_vi: "Phương pháp tác động các huyệt Đản Trung, Nội Quan, Thần Môn, Cự Khuyết và bài tập thở khai thông.",
        readTime: "5 min",
        paragraphs: [
          {
            id: "p7_1",
            en: "When helping people regulate the Heart Chakra, I rarely tell them to \"just think their way through it.\" I teach them to work through breath, because the stagnation and depletion of the Heart Chakra reside in the physical body, not in abstract theories. The harder you try to force yourself to \"be more open-minded,\" the more blocked you become; the more you demand of yourself to \"give even more,\" the more depleted you get. The body possesses its own language, and the language of the Heart Chakra is the breath.\nThe most effective method to regulate the Heart Chakra is returning to respiration, relearning the natural rhythm of opening and closing: one inhalation and one exhalation constitute one complete cycle of opening and shutting. Master this foundational practice thoroughly.",
            vi: "Khi điều chỉnh tâm luân, tôi rất ít khi dạy người ta cố nghĩ cho thông. Tôi dạy họ dùng hơi thở, bởi sự tắc nghẽn và hao tổn của tâm luân đều nằm trong cơ thể chứ không nằm trong lý luận. Bạn càng cố nghĩ \"tôi phải nghĩ thoáng hơn\" thì lại càng tắc; bạn càng ép mình \"tôi phải cho đi nhiều hơn\" thì càng hao. Cơ thể có ngôn ngữ riêng, ngôn ngữ của tâm luân chính là hơi thở.\nPhương pháp tốt nhất để điều chỉnh tâm luân là trở về với hơi thở, luyện lại sự đóng mở tự nhiên: một lần hít vào, một lần thở ra chính là một lần đóng mở. Hãy làm thật vững động tác cơ bản này."
          },
          {
            id: "p7_2",
            en: "Step 1: Open - Exhale - The Doorway Turning Outward (Bước 1: Mở (Thở ra – Cánh cửa hướng ra ngoài))\nThe tightest, most oppressive Qi in the chest is usually stagnant air unable to release. On the exhale, let it move out completely, working in tandem with the Danzhong acupoint:\n* Danzhong Acupoint (CV17): Located directly along the midline of the sternum, midway between the nipples (in the slight depression of the chest). It is the Front-Mu point of the Pericardium and the Hui-Meeting point of Qi among the Eight Influential Points, where the Qi of the entire body converges. TCM utilizes this point to loosen the chest, regulate Qi, disperse Lung Qi, and unblock the collaterals when the chest feels constricted and Qi flow is erratic.\n* How to perform: Place your thumb or the heel of your palm on Danzhong. In rhythm with your exhalation, press gently downward and outward toward the sides. Coordinate this gentle push with your outward breath, releasing trapped, oppressive tension from the chest bit by bit. Alternatively, use the heel of your palm to massage Danzhong in gentle circular motions until the chest warms up. Many people involuntarily let out a long sigh while pressing here—this is completely natural, a sign that pent-up Qi is beginning to move.",
            vi: "Bước 1: Mở (Thở ra – Cánh cửa hướng ra ngoài)\nLuồng khí căng nhất ở lồng ngực phần lớn là thứ không thể thoát ra. Khi thở ra, hãy để nó được đưa ra ngoài, kết hợp với huyệt Đản trung:\n* Huyệt Đản Trung: Nằm ở chính giữa ngực, tại trung điểm của đường nối hai đầu vú (khu vực hõm giữa ngực). Đây là Mộ huyệt của Tâm bào kinh, đồng thời là Khí hội trong Bát hội huyệt, nơi khí của toàn thân quy tụ. Đông y sử dụng huyệt này để khoan hung, lý khí, tuyên phế, thông lạc khi lồng ngực bế tắc, khí không thuận.\n* Cách thực hiện: Dùng ngón tay cái hoặc gốc lòng bàn tay đặt lên Đản trung. Theo nhịp thở ra, nhẹ nhàng đẩy xuống dưới và sang hai bên. Trong lúc đẩy phối hợp với hơi thở ra, từng chút một đưa luồng khí bí tức trong ngực ra ngoài. Hoặc dùng gốc lòng bàn tay nhẹ nhàng xoa ấn Đản trung cho đến khi vùng ngực cảm thấy ấm lên. Nhiều người khi ấn đến đây sẽ không nhịn được mà thở ra thật dài — như vậy là đúng, dấu hiệu cho thấy luồng khí đang bị dồn nén bắt đầu chuyển động."
          },
          {
            id: "p7_3",
            en: "Step 2: Close - Inhale - The Doorway Turning Inward (Bước 2: Khép (Hít vào – Cánh cửa hướng vào bên trong))\nFor the inward door of the Heart Chakra to receive, it relies on calming the spirit (an thần): when the spirit settles, Qi can gather inward. This can be combined with key acupoints:\n* Neiguan Acupoint (PC6): Located approximately two cun above the wrist crease, between the two tendons. It is the Luo-Connecting point of the Pericardium meridian and one of the Eight Confluent Points coupled with the Yin Wei Mai. TCM applies Neiguan to calm the heart, settle the spirit, regulate Qi, and relieve pain. When you feel restless, anxious, or experience chest tightness, massaging Neiguan helps soothe inner agitation.\n* Shenmen Acupoint (HT7): Located at the ulnar end of the transverse wrist crease, near the pinky side just beside the pisiform bone. It is the Yuan-Source point of the Heart meridian. TCM regards Shenmen as the gateway through which Heart spirit enters and exits, functioning to nourish the heart and calm the mind. Gently massaging Shenmen before bedtime helps unwind a nervous system that has been overstimulated all day.\n* Juque Acupoint (CV14): Located six cun above the navel, just below the xiphoid process of the sternum; it is the Front-Mu point of the Heart. When the mind is unsettled and the heart or chest feels tense, gently knead Juque with the heel of your palm, symbolically guiding the spirit back home to settle peacefully in the chest.\nAll three of these acupoints center around the principle of \"gathering inward.\" As you inhale while gently massaging these points, the heart settles and Qi gathers back to center.",
            vi: "Bước 2: Khép (Hít vào – Cánh cửa hướng vào bên trong)\nCánh cửa hướng vào của tâm luân muốn tiếp nhận được cần phải dựa vào an thần: thần được an, khí mới có thể thu lại. Có thể phối hợp với các huyệt vị:\n* Huyệt Nội Quan: Nằm cách nếp gấp cổ tay khoảng hai thốn giữa hai gân. Đây là Lạc huyệt của Tâm bào kinh, đồng thời là một trong Bát mạch giao hội huyệt thông với Âm duy mạch. Đông y sử dụng Nội quan để ninh tâm an thần, lý khí chỉ thống. Khi tâm phiền, hồi hộp, tức ngực, xoa ấn Nội quan giúp trạng thái bồn chồn dần lắng xuống.\n* Huyệt Thần Môn: Nằm ở đầu phía trụ của nếp gấp cổ tay, gần phía ngón tay út cạnh mỏm xương. Đây là Nguyên huyệt của Tâm kinh. Đông y xem Thần môn là cánh cửa xuất nhập của tâm thần, có tác dụng ninh tâm an thần. Trước khi ngủ nhẹ nhàng xoa ấn Thần môn giúp hệ thần kinh đã căng thẳng suốt một ngày dần thư giãn.\n* Huyệt Cự Khuyết: Nằm sáu thốn phía trên rốn ở khu vực dưới mũi kiếm xương ức, là Mộ huyệt của tâm. Khi tâm thần bất an, vùng tim ngực căng tức, dùng gốc lòng bàn tay nhẹ nhàng xoa ấn Cự khuyết như thể đưa tâm thần trở về và an định tại vùng ngực.\nBa huyệt này đều liên quan đến chữ \"thu\". Khi hít vào phối hợp xoa ấn các huyệt này sẽ giúp tâm an xuống, khí thu trở về."
          },
          {
            id: "p7_4",
            en: "Complete Opening-and-Closing Breathing Exercise (Bài tập thở đóng mở hoàn chỉnh)\nChoose a quiet moment, sit comfortably or lie down, and rest both hands over your chest:\n1. Exhaling (Emptying completely): Feel your chest slowly sink downward, releasing all stagnant, congested tension. Pair this with visualization: imagine extending goodwill and gentle warmth outward to those around you.\n2. Inhaling (Filling completely): Feel your chest gently expand, welcoming warmth, nourishment, and the kindness of others inward. Pair this with visualization: imagine gathering love and blessings back into your own being.\nPractice this for 3 to 5 minutes at a time, 2 to 3 times a day. Do not underestimate this visualization practice; it is actively training the two portals of your Heart Chakra: the capacity to give and the capacity to receive.",
            vi: "Bài tập thở đóng mở hoàn chỉnh\nChọn một thời điểm yên tĩnh, ngồi hoặc nằm xuống, đặt hai tay lên ngực:\n1. Thở ra (Thở cho hết): Cảm nhận lồng ngực từ từ hạ xuống, đưa tất cả những thứ đang tắc nghẽn bí bách ra ngoài. Kết hợp quán tưởng: tưởng tượng mình trao thiện ý và sự ấm áp cho những người xung quanh.\n2. Hít vào (Hít cho đầy): Cảm nhận lồng ngực từ từ mở rộng, đón nhận sự ấm áp, sự nuôi dưỡng và thiện ý của người khác vào bên trong. Kết hợp quán tưởng: tưởng tượng mình thu tình yêu và lời chúc phúc trở về cho chính mình.\nMỗi lần thực hiện từ 3 đến 5 phút, mỗi ngày 2 đến 3 lần. Đừng xem nhẹ hình ảnh quán tưởng này, nó chính là đang luyện hai cánh cửa của tâm luân: cho được và nhận được."
          },
          {
            id: "p7_5",
            en: "Supporting Acupoints & Daily Habits (Các huyệt hỗ trợ & Thói quen hàng ngày)\n* Zhongchong Acupoint (PC9): Located at the tip of the middle finger, this is the Jing-Well point of the Pericardium meridian, used to clear the heart and awaken the sensory orifices. When feeling irritable, stuffy, or flustered, press Zhongchong lightly with your thumb to clear agitation.\n* Shaofu Acupoint (HT8): Located where the tip of the little finger touches the palm when making a fist; it is the Ying-Spring point of the Heart meridian, clearing Heart fire for those with flared Heart heat, a red tongue tip, or irritability.\n* Xinshu Acupoint (BL15): Located on the back, 1.5 cun lateral to the lower border of the spinous process of the 5th thoracic vertebra (T5); it is the Back-Shu point of the Heart. You can have a family member gently knead this area or apply a warm compress across your upper back to warm the posterior Heart zone.\n* Daily Practice of Receiving: Make a conscious effort each day to practice one small act of receiving. When someone compliments you, say thank you and receive it; when someone offers help, do not rush to pay them back immediately, but allow yourself to be cared for; speak up about what you want rather than always saying \"anything is fine.\"\n* Caring for the Chest Area: Do not allow your chest to remain perpetually collapsed or hunched. After prolonged sitting, stand up, draw your shoulders back, and open your chest. During cold weather, keep your chest and upper back warm, preventing the chest from becoming both chilled and tense. When your chest is warm and your posture relaxed, Heart Qi circulates smoothly.\nNote: Acupressure, warm compresses, and moxibustion are traditional wellness practices that support the body in returning to its natural rhythms, not medical treatments intended to replace professional care. When experiencing unusual or persistent symptoms, always consult a qualified medical physician.",
            vi: "Các huyệt hỗ trợ & Thói quen hàng ngày\n* Huyệt Trung Xung: Nằm ở đầu ngón tay giữa, là Tỉnh huyệt của Tâm bào kinh, giúp thanh tâm khai khiếu. Khi trong lòng phiền loạn, bức bối, dùng ngón tay cái ấn nhẹ Trung xung để giải tỏa.\n* Huyệt Thiếu Phủ: Vị trí đầu ngón út chạm vào lòng bàn tay khi nắm tay lại, là Huỳnh huyệt của Tâm kinh, giúp thanh tâm tả hỏa cho người tâm hỏa vượng, đầu lưỡi đỏ, dễ nóng nảy, bốc hỏa.\n* Huyệt Tâm Du: Nằm ở lưng, cách dưới gai đốt sống ngực thứ 5 sang ngang 1,5 thốn, là Bối du huyệt của tâm. Có thể nhờ người nhà xoa ấn hoặc dùng khăn ấm chườm vùng lưng để sưởi ấm vùng tâm phía sau.\n* Luyện thu hằng ngày: Mỗi ngày cố ý làm một việc nhỏ mang tính tiếp nhận. Ai khen hãy nói lời cảm ơn và đón nhận; ai giúp đỡ đừng vội vàng tìm cách trả lại ngay mà hãy cho phép bản thân được chăm sóc; muốn gì hãy nói ra, đừng luôn trả lời là \"tùy\".\n* Chăm sóc vùng trước ngực: Đừng để vùng ngực luôn co rút. Nếu ngồi lâu, hãy đứng dậy đưa hai vai ra sau mở rộng lồng ngực (khai hung). Khi trời lạnh cần giữ ấm ngực và lưng, tránh để vùng ngực vừa lạnh vừa căng. Ngực ấm, thân thể thư giãn thì tâm khí mới vận hành thuận lợi.\nLưu ý: Xoa ấn huyệt, chườm ấm, cứu ngải đều là phương pháp dưỡng sinh hàng ngày giúp cơ thể trở về nhịp điệu vốn có, không phải là phương pháp điều trị bệnh thay thế y tế. Khi có triệu chứng bất thường, người bệnh vẫn cần đi khám bác sĩ."
          }

        desc_en: "Six organic markers of reverse-aging vitality and the final blessing.",
        desc_vi: "Sáu đặc điểm tự nhiên của dung mạo trẻ hóa ngược tuổi và lời đúc kết thiện lương.",
        readTime: "4 min",
        paragraphs: [
          {
            id: "p8_1",
            en: "A person whose Heart Chakra is unobstructed and who embodies genuine \"age-reversing youthfulness\" naturally exhibits six hallmark traits:\n1. A rosy, luminous complexion: Not the product of makeup or cosmetics, but a radiant clarity emanating from deep within the skin. When Heart blood rises abundantly to nourish the face, the skin takes on a healthy, delicate rosy glow and vibrant tone that looks genuinely pleasant and fresh.\n2. Soft, spirited eyes: Not sharp or piercing, but gentle and expressive. When looking at others, their gaze carries warmth, light, and receptivity, welcoming others without overwhelming them.\n3. Deep, steady, and unforced breathing: Whether standing or sitting, their breathing rhythm is effortless, prolonged, and serene. When speaking, their central Qi is full and resonant—free from breathlessness or frantic rushing. Deep inhales reach all the way down without feeling shallow or restricted.\n4. An open, relaxed chest: The shoulders are naturally open, the chest upright without strain—free from rounded shoulders or a hollowed chest—projecting an air of clarity and ease.\n5. Equanimous, warm emotions: Neither aloofly cold nor excessively volatile. In challenging situations, they can pause, understand others, and simultaneously care for themselves; they extend goodwill effortlessly and receive warmth gracefully, keeping emotions in fluid circulation.\n6. Inner-to-outer gentleness (the most precious trait): A palpable warmth seems to radiate from their chest—never rushed, never irritable, never artificial, and never self-depleting. Simply being in their presence evokes comfort, ease, and a desire to draw near.\nSuch beauty can never be replicated by cosmetics. It is the natural fruit of a doorway at the chest that opens and closes freely, with Qi and blood circulating smoothly and the spirit at peace.",
            vi: "Người có tâm luân thông suốt và đạt được diện mạo \"trẻ hóa ngược tuổi\" sẽ có 6 đặc điểm tự nhiên sau:\n1. Sắc mặt hồng nhuận, có ánh sáng: Không phải do trang điểm hay mỹ phẩm, mà là sự nhuận sắc tỏa ra từ bên dưới làn da. Khi tâm huyết đầy đủ đi lên nuôi dưỡng khuôn mặt, da sẽ trắng phớt hồng, có huyết sắc, nhìn vào thấy dễ chịu.\n2. Ánh mắt mềm mại và có thần: Không sắc bén mà nhu hòa. Khi nhìn người khác, ánh mắt ôn hòa, có ánh sáng, có nhiệt độ, đón nhận người khác nhưng không cuốn họ vào mình.\n3. Hơi thở sâu, dài và thuận: Đứng hay ngồi đều có nhịp thở tự nhiên, thư thái. Khi nói chuyện thì trung khí đầy đủ, không hụt hơi, không gấp gáp. Hít sâu có thể hít xuống tận đáy mà không cảm thấy thiếu hơi.\n4. Lồng ngực thư thái, không căng cứng: Vai mở, ngực thẳng tự nhiên, không co ngực gù lưng, toàn thân toát lên sự cởi mở, sáng sủa.\n5. Cảm xúc bình hòa và có nhiệt độ: Không lạnh lùng cũng không quá nóng nảy. Gặp chuyện biết chậm lại, biết thấu hiểu người khác nhưng cũng biết chăm sóc bản thân; vừa cho được thiện ý vừa nhận được sự ấm áp, cảm xúc có dòng chảy tự nhiên.\n6. Sự nhu hòa từ trong ra ngoài (quý giá nhất): Toàn thân như có luồng ấm áp tỏa ra từ lồng ngực, không vội vàng, không nóng nảy, không giả tạo, không tiêu hao. Chỉ cần đứng ở đó thôi đã tạo cho người xung quanh cảm giác dễ chịu, ấm áp và muốn đến gần.\nNhững vẻ đẹp này không mỹ phẩm nào mang lại được. Đó là thành quả khi cánh cửa nơi lồng ngực đóng mở tự nhiên, khí huyết lưu thông và tâm thần an định."
          },
          {
            id: "p8_2",
            en: "The Heart Chakra is the most human of the seven chakras because it governs the most intimate aspects of life: love, connection, giving, and receiving. The mark of an open Heart Chakra is not how skilled you become at loving others, but that you can both give and receive; that you can love others without fearing being loved in return. Breath runs deep, the heart rests at peace, and the complexion flourishes.\nAge reversal has never been mere surface work on the face. It lies in whether the door in your chest can open and close naturally. Starting today, rest your hand gently upon your chest. Slowly exhale to release all trapped tension, then take a deep, full breath to gather warmth and nourishment back home. When the door opens, blood flourishes; when the door closes, the spirit settles; and when the spirit is settled, the face naturally blossoms into soft, radiant grace.\nShared for the community; boundless blessings. He Zongchuan / Ha Tung Xuyen – Nine Heavens Mysterious Maiden Divine Art.",
            vi: "Tâm luân là luân xa thông tình người nhất bởi nó quản lý những điều gần gũi nhất: tình yêu, mối quan hệ, sự cho đi và tiếp nhận. Dấu hiệu tâm luân thông suốt không phải là bạn trở nên giỏi yêu người khác đến mức nào, mà là bạn có thể cho được và cũng nhận được; yêu người khác và cũng không sợ được người khác yêu. Hơi thở sâu, tâm an, sắc diện nhuận.\nTrẻ hóa ngược tuổi chưa bao giờ chỉ là công phu bên ngoài khuôn mặt. Nó nằm ở việc cánh cửa nơi lồng ngực có thể đóng mở tự nhiên hay không. Bắt đầu từ hôm nay, hãy hạ tay xuống đặt lên ngực, từ từ thở ra một hơi đẩy luồng khí dồn nén ra ngoài, sau đó hít vào thật sâu thu sự ấm áp và nuôi dưỡng trở về. Cửa mở huyết liền nhuận, cửa khép thần liền an; thần an, khuôn mặt tự nhiên sẽ trở nên ôn nhuận.\nChia sẻ cộng đồng phúc sinh vô lượng. Hà Tùng Xuyên Thiên Cửu Thiên Huyền Nữ Thần Công."
          }

        en: "The outward-facing door represents goodwill and genuine giving arising from inner abundance, which stimulates the release of oxytocin to foster warmth, safety, and holistic well-being. In contrast, giving to the point of self-depletion merely to secure external validation reflects an obstructed Heart Chakra driven by seeking rather than true generosity.\n\nThe inward-facing door reflects the capacity to receive care, compliments, and love without discomfort or instinctive deflection. Neurologically, receptivity activates the ventral vagal nerve and enhances Heart Rate Variability (HRV), promoting autonomic flexibility and deep restorative calm; conversely, chronic refusal to receive triggers sympathetic overload, persistent chest constriction, shallow breathing, and suppressed HRV.",
        vi: "Cánh cửa hướng ra ngoài biểu trưng cho thiện ý và sự cho đi chân thành xuất phát từ nội tâm đủ đầy, giúp kích hoạt hormone gắn kết oxytocin tạo cảm giác ấm áp, an toàn và nâng cao sức khỏe thể chất lẫn tinh thần. Trái lại, việc cho đi đến mức kiệt quệ chỉ nhằm tìm kiếm sự công nhận bên ngoài thực chất là dấu hiệu của sự tắc nghẽn tâm luân.\n\nCánh cửa hướng vào trong thể hiện năng lực đón nhận sự chăm sóc, lời khen và tình cảm từ người khác mà không né tránh hay mặc cảm. Về mặt thần kinh học, trạng thái sẵn sàng tiếp nhận kích hoạt nhánh phế vị bụng và tối ưu hóa độ biến thiên nhịp tim (HRV), giúp hệ thần kinh tự chủ linh hoạt và thư thái; ngược lại, việc cự tuyệt tiếp nhận khiến hệ giao cảm chi phối mạn tính, làm lồng ngực thắt nghẽn, hơi thở nông và suy giảm chỉ số HRV."

        vietnamese: "Trẻ hóa ngược tuổi (Hồi phục sức sống thanh xuân từ tầng sâu khí huyết)"
      },
      {
        id: "g32",
        term: "Moxibustion",
        pos: "noun",
        category: "tcm",
        academicDef: "A traditional Chinese medicine therapy involving the burning of mugwort (Artemisia vulgaris) over acupuncture points to warm channels and circulate Qi.",
        plainEnglish: "In other words: A healing technique of warming acupressure points with burning herbal mugwort sticks to expel cold.",
        contextExample: "Acupressure, warm compresses, and moxibustion are traditional wellness practices that support the body.",

    ];

    // ==========================================
    // 3. APPLICATION STATE MANAGEMENT
    // ==========================================
    const state = {
      currentView: "overview", // 'overview' | 'section-0'..'section-8' | 'summary' | 'glossary' | 'practice'

      cardFlipped: {},        // paragraphId -> boolean
      theme: localStorage.getItem('anahata_theme') || 'light',
      readingMode: 'flip',    // 'flip' | 'side-by-side'
      glossarySearch: '',
      glossaryCategory: 'all', // 'all' | 'tcm' | 'neuroscience' | 'psychology' | 'academic'
      glossaryRevealed: {},   // glossaryId -> boolean
      pacingActive: false,
      pacingPhase: 'exhale',  // 'exhale' | 'hold1' | 'inhale' | 'hold2'
      pacingSeconds: 4
    };

    // ==========================================
    // 4. THEME & INITIALIZATION
    // ==========================================
    function initTheme() {
      if (state.theme === 'dark' || (!('anahata_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        state.theme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        state.theme = 'light';
      }
      updateThemeIcons();
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('anahata_theme', state.theme);
      initTheme();
    }

    function updateThemeIcons() {
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      if (state.theme === 'dark') {
        sun?.classList.remove('hidden');
        moon?.classList.add('hidden');
      } else {
        sun?.classList.add('hidden');
        moon?.classList.remove('hidden');
      }
    }

    function toggleGlobalLanguage() {
      state.globalLang = state.globalLang === 'en' ? 'vi' : 'en';
      document.getElementById('global-lang-label').textContent = state.globalLang.toUpperCase();
      
      // Update default card language preferences
      SECTIONS.forEach(sec => {
        sec.paragraphs.forEach(p => {
          state.cardLanguages[p.id] = state.globalLang;
          state.cardFlipped[p.id] = (state.globalLang === 'vi');
        });
      });

      renderCurrentView();
    }

    // ==========================================
    // 5. AUDIO SPEECH SYNTHESIS HELPER
    // ==========================================
    function speakText(text, lang = 'en-US') {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 6. ROUTER & VIEW RENDERING
    // ==========================================
    function handleRouting() {
      const hash = window.location.hash.replace('#', '') || 'overview';
      state.currentView = hash;
      
      const navBackBtn = document.getElementById('nav-back-btn');
      if (hash === 'overview') {
        navBackBtn?.classList.add('hidden');
      } else {
        navBackBtn?.classList.remove('hidden');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderCurrentView();
    }

    function navigateTo(viewId) {
      window.location.hash = '#' + viewId;
    }

    function renderCurrentView() {
      const container = document.getElementById('app-container');
      if (!container) return;

      if (state.currentView === 'overview') {
        container.innerHTML = renderOverviewPage();
      } else if (state.currentView === 'summary') {
        container.innerHTML = renderSummaryPage();
      } else if (state.currentView === 'glossary') {
        container.innerHTML = renderGlossaryPage();
      } else if (state.currentView === 'practice') {
        container.innerHTML = renderPracticePage();
      } else {
        // Section Reading Pages
        const section = SECTIONS.find(s => s.id === state.currentView);
        if (section) {
          container.innerHTML = renderSectionPage(section);
        } else {
          container.innerHTML = renderOverviewPage();
        }
      }
    }

    // Toggle Heading language on overview card without entering the section
    function toggleCardHeaderLang(secId) {
      const sec = SECTIONS.find(s => s.id === secId);
      if (!sec) return;

      const titleEl = document.getElementById(`card-title-${secId}`);
      const indicatorEl = document.getElementById(`card-lang-indicator-${secId}`);
      
      if (!titleEl || !indicatorEl) return;

      const isCurrentEn = titleEl.textContent.trim() === sec.title_en.trim();
      if (isCurrentEn) {
        titleEl.textContent = sec.title_vi;
        indicatorEl.textContent = "EN";
      } else {
        titleEl.textContent = sec.title_en;
        indicatorEl.textContent = "VI";
      }
    }

    // Toggle paragraph card smoothly with cross-fade
    function toggleParagraphCard(paragraphId) {
      const current = !!state.cardFlipped[paragraphId];
      state.cardFlipped[paragraphId] = !current;

      const card = findParagraph(paragraphId);
      if (!card) return;

      const textEl = document.getElementById(`text-${paragraphId}`);
      const badgeEl = document.getElementById(`badge-${paragraphId}`);
      const btnTextEl = document.getElementById(`btn-text-${paragraphId}`);

      if (!textEl) return;

      // Animate transition
      textEl.style.opacity = '0';
      setTimeout(() => {
        const isFlippedNow = state.cardFlipped[paragraphId];
        const newText = isFlippedNow ? card.vi : card.en;
        textEl.innerHTML = formatParagraphText(newText);
        textEl.setAttribute('data-raw', escapeQuotes(newText));
        
        if (badgeEl) {
          badgeEl.textContent = isFlippedNow ? 'VIETNAMESE (VI)' : 'ENGLISH (EN)';
          badgeEl.className = isFlippedNow 
            ? 'inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-rose-100 text-rose-800 dark:bg-rose-950/70 dark:text-rose-300 transition-colors'
            : 'inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/70 dark:text-emerald-300 transition-colors';
        }

        if (btnTextEl) {
          btnTextEl.textContent = isFlippedNow ? 'Xem English' : 'Xem Tiếng Việt';
        }

        textEl.style.opacity = '1';
      }, 150);
    }

    // Toggle section title language
    function toggleSectionTitleLanguage(secId) {
      const sec = SECTIONS.find(s => s.id === secId);
      if (!sec) return;

      const titleEl = document.getElementById('section-title-main');
      const langEl = document.getElementById('section-title-lang');
      if (!titleEl || !langEl) return;

      const isEn = titleEl.textContent.trim() === sec.title_en.trim();
      if (isEn) {
        titleEl.textContent = sec.title_vi;
        langEl.textContent = 'English';
      } else {
        titleEl.textContent = sec.title_en;
        langEl.textContent = 'Tiếng Việt';
      }
    }

    // Bulk flip cards in section
    function bulkFlipSection(secId, toVietnamese) {
      const sec = SECTIONS.find(s => s.id === secId);
      if (!sec) return;

      sec.paragraphs.forEach(p => {
        state.cardFlipped[p.id] = toVietnamese;
      });

      renderCurrentView();
    }

    function setReadingMode(mode) {
      state.readingMode = mode;
      renderCurrentView();
    }

    function findParagraph(paragraphId) {
      for (const sec of SECTIONS) {
        const found = sec.paragraphs.find(p => p.id === paragraphId);
        if (found) return found;
      }
      return null;
    }

    function togglePacer() {
      const btn = document.getElementById('pacer-toggle-btn');
      if (pacingInterval) {
        clearInterval(pacingInterval);
        pacingInterval = null;
        if (btn) btn.textContent = 'Tiếp Tục';
        return;
      }

      if (btn) btn.textContent = 'Tạm Dừng';
      let phase = 0; // 0: exhale, 1: inhale

      function step() {
        const circle = document.getElementById('pacer-circle');
        const action = document.getElementById('pacer-action');
        const title = document.getElementById('pacer-title');
        const desc = document.getElementById('pacer-desc');

        if (!circle) return;

        if (phase === 0) {
          // Exhale (Shrink & release)
          circle.style.transform = 'scale(0.85)';
          circle.style.backgroundColor = '#059669';
          action.textContent = 'Thở Ra...';
          title.textContent = 'Bước 1: Mở (Thở ra – Trao Thiện Ý)';
          desc.textContent = 'Thở cho hết, cảm nhận lồng ngực hạ xuống, xoa ấn huyệt Đản Trung, tống luồng khí bí bách ra ngoài.';
          phase = 1;
        } else {
          // Inhale (Expand & receive)
          circle.style.transform = 'scale(1.35)';
          circle.style.backgroundColor = '#e11d48';
          action.textContent = 'Hít Vào...';
          title.textContent = 'Bước 2: Khép (Hít vào – Thu Tình Yêu Về)';
          desc.textContent = 'Hít cho đầy, lồng ngực mở rộng, xoa ấn Nội Quan hoặc Thần Môn, đón nhận sự nuôi dưỡng và chúc phúc cho chính mình.';
          phase = 0;
        }
      }

      step();
      pacingInterval = setInterval(step, 5000);
    }

    function resetPacer() {
      if (pacingInterval) {
        clearInterval(pacingInterval);
        pacingInterval = null;
      }
      const btn = document.getElementById('pacer-toggle-btn');
      if (btn) btn.textContent = 'Bắt Đầu Thực Hành';
      const circle = document.getElementById('pacer-circle');
      if (circle) circle.style.transform = 'scale(1)';
    }

    // ==========================================
    // 7. UTILITY & TEXT FORMATTING
    // ==========================================
    function formatParagraphText(rawText) {
      if (!rawText) return "";
      // Handle markdown bullets
      return rawText.replace(/\n\*\s/g, '\n• ');
    }

    function escapeQuotes(str) {
      if (!str) return "";
      return str.replace(/`/g, '\\`').replace(/"/g, '&quot;').replace(/\n/g, ' ');
    }

    // ==========================================
    // 8. GLOBAL EVENT LISTENERS & INITIALIZATION
    // ==========================================
    window.addEventListener('hashchange', handleRouting);
    
    // Keyboard shortcuts for ease of reading navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        navigateTo('overview');
      }
    });

    // Run on startup
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      handleRouting();
    });
  </script>
</body>
</html>
