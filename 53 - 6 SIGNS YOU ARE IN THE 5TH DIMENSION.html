          desc_vn: "Thấu hiểu nỗi hoài hương về cội nguồn tâm linh và hóa giải những cô đơn, hiểu lầm nơi các mối quan hệ thân thuộc.",
          paragraphs: [
            {
              en: "There is one more dimension to this sixth milestone that speaks directly to a quiet feeling you have carried for a long time: Fifth-dimensional souls often carry an indescribable homesickness. It is not nostalgia for a memory from this lifetime, but a distant recollection of a home beyond the physical realm—a place filled with pure light, where separation does not exist, and where love is the very air you breathe.",
              vi: "Còn một điều nữa về bài kiểm tra thứ sáu này mà tôi muốn sẻ chia cùng bạn, một điều chạm thẳng vào nỗi niềm sâu kín bạn mang theo bấy lâu: Những linh hồn thuộc chiều thứ năm thường cất giấu một nỗi hoài hương khó gọi thành tên. Đó không phải là nỗi nhớ về một kỷ niệm trong kiếp sống này mà là ký ức xa xăm về một ngôi nhà không thuộc về cõi vật chất. Nơi ấy ngập tràn ánh sáng thuần khiết, không có chia lìa và tình yêu thương chính là bầu không khí để hít thở."
            },
            {
              en: "That persistent longing without a physical destination is the echo of your spiritual origins. Your consciousness is remembering that you are not merely a physical body visiting this Earth for 70 or 80 years. You are a being of light who intentionally chose to incarnate at this exact moment—in this body, this family, and these exact circumstances. You came to bring something only you can offer:\n• To bring light where others are caught in darkness.\n• To anchor a high frequency where the surrounding energy is low.\n• To serve as a bridge uniting the visible realm with the unseen world.",
              vi: "Nỗi khao khát khôn nguôi không có phương hướng địa lý ấy chính là tiếng vọng cội nguồn tâm linh của bạn. Tâm thức bạn đang nhớ lại rằng mình không chỉ là một thân xác ghé chơi chốn này 70 hay 80 năm. Bạn là một thực thể ánh sáng đã chủ động chọn hóa thân vào đúng thời khắc này trong thân thể này, gia đình này và hoàn cảnh cụ thể này. Bạn đến để mang lại những giá trị mà chỉ riêng bạn mới có thể trao đi:\n• Thắp sáng nơi người khác đang chìm trong u tối.\n• Giữ vững tần số cao nơi xung quanh đang chùng xuống.\n• Làm nhịp cầu nối liền cõi hữu hình với thế giới vô hình đầy màu nhiệm."
            },
            {
              en: "Hear this with your whole heart: The burdens you have carried, the loneliness you have felt, the sense of alienation, your deep sensitivity, your unique worldview, and the spiritual experiences you could never share for fear of being judged—none of these are flaws. They are under no circumstances a sign that something is wrong with you. They are the signature of a fifth-dimensional soul whose eyes are open wider than the collective norm.",
              vi: "Tôi mong bạn hãy lắng nghe điều này bằng cả trái tim: Gánh nặng bạn từng mang, nỗi cô đơn bạn từng nếm trải, cảm giác lạc lõng không thuộc về nơi này, sự nhạy cảm quá mức, cách nhìn đời khác biệt hay những trải nghiệm tâm linh chẳng thể tỏ cùng ai vì sợ người đời phán xét — tất cả những điều đó không phải là khiếm khuyết. Chúng tuyệt đối không phải dấu hiệu cho thấy bạn có vấn đề. Đó chính là ấn ký của một linh hồn chiều thứ năm mang đôi mắt rộng mở hơn số đông."
            },
            {
              en: "Think of your family. They may love you deeply, yet remain unable to comprehend what you are going through. How many times have you tried opening up about your spiritual experiences, intuitive glimpses, or the sense that life holds far more than what meets the eye? At best, you were met with hesitant, confused looks. At worst, they dismissed you as impractical, eccentric, or detached from reality.",
              vi: "Hãy nghĩ về gia đình bạn. Có thể họ rất yêu thương bạn nhưng lại chẳng thể hiểu nổi những gì bạn đang đi qua. Đã bao lần bạn thử mở lòng kể về những trải nghiệm tâm linh, những điềm báo bạn thấy hay cảm nhận rằng cuộc sống này còn chứa đựng nhiều tầng thực tại sâu xa hơn mắt trần? Kết quả tốt nhất bạn nhận lại có lẽ chỉ là những ánh nhìn ái ngại, xen lẫn mơ hồ. Còn tệ hơn, họ bảo bạn viển vông kỳ dị, sống trên mây và cần phải thực tế lại."
            },
            {
              en: "You have had to carry a unique kind of pain: loving your family dearly, yet unable to reveal your authentic self around them. It is not the sting of betrayal or open conflict, but the quiet, lingering ache of having your core self misunderstood—feeling torn between living truthfully and being accepted, assuming that to belong, you must hide who you are. Many awakened souls have chosen to compartmentalize themselves: playing the role of an ordinary person at home, following familiar scripts, and quietly holding their loneliness in private spaces.",
              vi: "Bạn đã phải gánh trên vai nỗi đau đặc biệt ấy: yêu thương người thân tha thiết nhưng không thể bộc lộ trọn vẹn con người mình trước mặt họ. Đó không phải vết thương của sự phản bội hay tranh cãi gay gắt mà là nỗi đau âm ỉ dai dẳng khi bản thể chân thật bị chối từ, khi phải giằng xé giữa việc sống thật hay được thấu hiểu, khi ngỡ rằng muốn thuộc về một nơi nào đó thì buộc phải giấu mình đi. Rất nhiều người thức tỉnh đã chọn cách tự chia cắt chính mình: về nhà thì đóng vai một người bình thường, nương theo những kịch bản được định sẵn rồi lặng lẽ ôm lấy nỗi cô đơn trong những khoảng trời riêng."
            },
            {
              en: "You do not need to force anyone to understand you. Nor is it your job to awaken those who are not yet ready. The wisest love is often one that allows people to be as they are. You can love your family and friends for who they are, without needing them to validate your path. At the same time, you can live fully in your spiritual depth without requiring anyone’s permission or comprehension. Both can peacefully coexist. Loving them and staying true to yourself are not opposites. That is the true grace of the fifth dimension: boundless compassion without losing yourself.",
              vi: "Nhưng bạn ơi, bạn không cần phải gồng mình bắt ép bất kỳ ai phải hiểu mình. Bạn cũng không mang trọng trách phải đánh thức những người chưa tới lúc sẵn sàng. Tình yêu thương trí tuệ nhất đôi khi lại là một tình yêu không cưỡng cầu. Bạn hoàn toàn có thể yêu thương gia đình, bạn bè đúng như bản chất vốn có của họ mà không cần họ phải thay đổi để thừa nhận con đường bạn đi. Đồng thời, bạn vẫn có thể sống trọn vẹn với chiều sâu tâm linh của mình mà chẳng cần ai cho phép hay thấu hiểu. Hai điều đó hoàn toàn có thể song hành an yên. Yêu thương họ và thành thật với chính mình không hề đối lập. Đó chính là sự bao dung của chiều thứ năm: trắc ẩn vô bờ mà không đánh mất bản ngã."
            }
          ]
        },
        {
          id: "section-9",
          num: "09",
          badge: "Conscious Creation",
          title_en: "The Mechanics of Creating Reality in the Fifth Dimension",
          title_vn: "Cơ Chế Kiến Tạo Thực Tại Trong Chiều Thứ Năm",
          desc_en: "How internal vibrational frequency mirrors external circumstance, accompanied by the 5-Minute Frequency Creation Practice.",

          paragraphs: [
            {
              en: "Here is what has long been overlooked: how the fifth dimension actually operates when shaping your reality.",
              vi: "Và đây là điều từng bị che giấu suốt thời gian dài: cách chiều không gian thứ năm vận hành trong việc kiến tạo thực tại của bạn."
            },
            {
              en: "In the third dimension, manifestation feels slow and exhausting. You long for something, you labor tirelessly for it, gaining it only to lose it. You often feel reality is something happening to you from the outside—an obstacle you must brace against, or leave to unpredictable fate.",
              vi: "Ở chiều không gian 3D, sự hiển lộ diễn ra vô cùng chậm chạp và nhọc nhằn. Bạn mong mỏi điều gì đó, bạn lao tâm khổ tứ vì nó khi được khi mất. Bạn luôn có cảm giác thực tại là thứ gì đó nằm ngoài tầm với, một biến cố ập đến mà bạn phải gồng mình chống đỡ hay phó mặc cho may rủi của số phận."
            },
            {
              en: "In the fifth dimension, the dynamic of creation changes entirely. You realize through direct experience that your internal state of consciousness is the fertile soil from which outer reality grows:\n• When your frequency vibrates in harmony with love, gratitude, trust, and openness, the universe responds with aligned people, opportunities, and circumstances.\n• Conversely, when you dwell in fear, scarcity, doubt, and emotional contraction, life reflects those exact states back to you.",
              vi: "Nhưng ở chiều thứ năm, cuộc chơi kiến tạo đã hoàn toàn đổi khác. Bạn hiểu ra bằng chính trải nghiệm sống rằng trạng thái tâm thức bên trong mới chính là mảnh đất sản sinh ra thực tại bên ngoài:\n• Khi tần số của bạn rung động cùng nhịp với tình yêu, lòng biết ơn, niềm tin và sự cởi mở, vũ trụ sẽ hồi đáp bằng những con người, cơ hội và hoàn cảnh tương thích.\n• Ngược lại, khi bạn đắm chìm trong sợ hãi, thiếu thốn, hoài nghi và khép kín, cuộc đời cũng sẽ phản chiếu lại chính xác những trạng thái ấy."
            },
            {
              en: "The universe is neither rewarding nor punishing you; it is simply operating by the law of reflection: reality is a mirror reflecting the frequency you broadcast.",
              vi: "Không phải vũ trụ đang ban thưởng hay trừng phạt mà đó đơn giản là quy luật phản chiếu: thực tại chỉ là tấm gương soi bóng tần số bạn phát ra."
            },
            {
              en: "Those stepping into the fifth dimension experience remarkable shifts: their intentions begin taking shape faster and with greater clarity than ever before. Not because of superstitious magic, but because their inner energy is in direct alignment with what they wish to experience. They have released enough fear to receive, cultivated enough gratitude to rest in abundance, and placed complete trust in the flow of life rather than trying to micromanage every step of the universe's design.",
              vi: "Những người bước vào chiều thứ năm sẽ nhận thấy những phép màu kỳ lạ: mong ước của họ xuất hiện nhanh chóng và chuẩn xác hơn bao giờ hết. Không phải vì họ có bùa phép nhiệm màu mà vì trường năng lượng bên trong đã hòa làm một với điều họ muốn tạo ra. Họ đã buông bỏ đủ sợ hãi để đón nhận, tích lũy đủ lòng biết ơn để sống trong sự đủ đầy và đặt trọn niềm tin vào dòng chảy cuộc sống thay vì tìm cách kiểm soát từng ly từng tí những gì vũ trụ sắp đặt."
            },
            {
              en: "Today, you can practice something very simple:\n1. Choose one genuine desire in your life—whether regarding health, relationships, career, or spiritual growth.\n2. Close your eyes. Instead of worrying about how to achieve it or dwelling on obstacles, ask yourself: \"How would I feel if this were already present right now?\"\n3. Hold that feeling of peace and fulfillment fully for five minutes. Without doubt, without forcing it—simply experiencing it from the perspective of having already received the gift.\n\nThat is the magnetic frequency that aligns all things—the natural magic of the fifth dimension.",
              vi: "Ngày hôm nay, bạn có thể thực hành một điều vô cùng giản dị:\n1. Hãy chọn ra một điều duy nhất bạn khao khát trong đời về sức khỏe, tình cảm, công việc hay sự thăng tiến tâm linh.\n2. Nhắm mắt lại, thay vì loay hoay nghĩ cách làm sao để đạt được hay lo sợ chướng ngại, hãy tự hỏi: \"Mình sẽ cảm thấy thế nào nếu điều này đã hiện diện ngay lúc này?\"\n3. Hãy giữ trọn vẹn cảm xúc an vui viên mãn ấy trong 5 phút. Không nghi ngờ, không gượng gạo, chỉ đơn thuần cảm nhận từ tâm thế của người đã đón nhận món quà đó.\n\nChính đó là tần số hút vạn vật, là điều kỳ diệu thuần khiết của chiều thứ năm."
            }
          ]

          desc_en: "Serving as a steady lighthouse of peace and compassionate presence in an accelerating world.",
          desc_vn: "Sứ mệnh không nằm ở việc vĩ mô đao to búa lớn, mà ở chính tần số bình an và sự thiện lành hiện diện mỗi ngày.",
          paragraphs: [
            {

              vi: "Sở dĩ những linh hồn được chọn thức tỉnh không phải chỉ để cuộc sống riêng của họ dễ thở hơn hay ước muốn đến nhanh hơn; có một sứ mệnh lớn lao hơn thế nhiều. Thế giới đang ở một khúc quanh lịch sử chưa từng có, đối mặt với những thử thách ở quy mô chưa từng thấy và nhân loại đang cần những nguồn năng lượng thức tỉnh hơn bao giờ hết."
            },
            {
              en: "In the midst of these collective shifts, you are here to serve as a lighthouse—keeping the light alive, uplifting the shared vibration simply through your peaceful presence, and anchoring love in the middle of fearful storms.",

            },
            {
              en: "Have you ever felt you had an important calling, yet could never pinpoint its exact shape? Do not worry; that is completely natural. A soul's purpose isn't always a dramatic revelation or a detailed blueprint handed down from above. It reveals itself in layers as your spirit clarifies.",
              vi: "Bạn có từng băn khoăn rằng mình mang một sứ mệnh lớn lao nhưng mãi không biết rõ hình hài nó ra sao? Đừng lo lắng, điều đó hoàn toàn tự nhiên. Sứ mệnh không phải lúc nào cũng là một tiếng sét mặc khải hay một bản chỉ dẫn trao tận tay từ thiên thần. Nó hé mở từng lớp theo độ thuần khiết của tâm hồn bạn."
            },
            {
              en: "Often, your mission does not lie in grandiose public deeds, but in the essence of who you are:\n• In the peaceful frequency you maintain.\n• In the kindness you extend to everyone around you.\n• In the warm energy you bring into every room you enter.\n• In the quiet compassion you offer without drawing attention to it.\n• In the steady flame you keep burning when storms roll through.\n\nSometimes the greatest mission is simply to awaken, stay awake, and serve as a calm, steady presence for anyone whose path crosses yours.",
              vi: "Thậm chí sứ mệnh đôi khi không nằm ở những việc đao to búa lớn bạn làm mà nằm ở chính con người bạn:\n• Là tần số bình an bạn giữ vững.\n• Là cách bạn đối đãi tử tế với muôn người.\n• Là năng lượng ấm áp bạn mang vào mỗi căn phòng bạn bước tới.\n• Là lòng trắc ẩn bạn trao đi trong thầm lặng.\n• Là ngọn lửa bạn kiên định giữ cháy dẫu giông gió bủa vây.\n\nĐôi khi sứ mệnh vĩ đại nhất chỉ là thức tỉnh, duy trì sự tỉnh thức và trở thành một điểm tựa kết nối thiêng liêng cho bất kỳ ai hữu duyên bước qua cuộc đời bạn."
            },
            {
              en: "That mission has already begun. It starts every time you choose forgiveness over resentment; when you step back from gossip instead of getting pulled into the drama; when you listen to someone with an open heart rather than a critical mind; and when you wake each morning choosing to ground yourself in gratitude instead of complaint. Every small choice quietly adds sweetness to the wider ocean of human consciousness.",
              vi: "Sứ mệnh ấy vốn dĩ đã bắt đầu rồi. Nó khởi động mỗi khi bạn chọn bao dung thay vì oán hận. Khi bạn chọn lùi lại khỏi những thị phi thay vì cuốn vào vòng xoáy. Khi bạn lắng nghe ai đó bằng cả tấm lòng chân thành thay vì cái tôi phán xét. Và khi mỗi sớm mai thức dậy, bạn chọn neo mình vào lòng biết ơn thay vì buông lời ca thán. Từng cử chỉ nhỏ bé ấy đều đang âm thầm góp mật cho đại dương ý thức nhân loại."
            }

        {
          id: "section-11",

          desc_en: "Recapitulation of all six milestones and an affirming reminder to shine authentically as part of an awakening global family.",
          desc_vn: "Tổng kết 6 thử thách và lời hiệu triệu thiêng liêng bước đi với sự vững chãi và yêu thương trọn vẹn chính mình.",
          paragraphs: [
            {
              en: "We have walked through all six milestones together:\n1. No longer being drawn into earthly drama.\n2. Clearly recognizing and feeling that everything is energy.\n3. No longer compromising with lower vibrational habits.\n4. Experiencing an inner intuition far more reliable than everyday logic.\n5. Calmly observing the human ego from the perspective of the soul.\n6. The living experience of oneness, knowing separation is an illusion, and realizing you are an inseparable part of a living cosmos filled with love.",

            },
            {
              en: "All of these signs point to one clear truth: You have crossed that threshold. Your consciousness is vibrating at a level that many are still searching for. This does not make you superior to anyone; rather, it entrusts you with a sacred responsibility: the responsibility to tend this flame through your everyday choices, serving as a beacon when the world needs light the most.",
              vi: "Tất cả những dấu chỉ này đều khẳng định một sự thật: Bạn đã bước qua cánh cửa ấy. Ý thức của bạn đang dao động ở một tầng mức mà số đông vẫn đang tìm kiếm. Điều đó không khiến bạn trở nên cao ngạo hơn ai mà trao cho bạn một trách nhiệm thiêng liêng: trách nhiệm giữ vững ngọn lửa ấy qua từng lựa chọn thường nhật, làm ngọn hải đăng soi đường khi thế giới cần ánh sáng nhất."
            },

    const state = {
      currentView: 'overview',
      globalLanguage: localStorage.getItem('app_global_lang') || 'en', // 'en' or 'vi'
      darkMode: localStorage.getItem('app_theme') === 'dark' || 
                (!('app_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),
      // Track flipped state for paragraph cards in the current section
      flippedCards: {},
      // Track heading toggles on overview cards
      overviewToggles: {},

      glossaryCategory: 'All',
      // Track glossary revealed Vietnamese definitions
      glossaryReveals: {}
    };

    /* =========================================================================
       THEME CONTROLLER
       ========================================================================= */
    function applyTheme() {
      if (state.darkMode) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('app_theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('app_theme', 'light');
      }
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      state.darkMode = !state.darkMode;
      applyTheme();
    });

    // Initialize Theme
    applyTheme();

    /* =========================================================================
       GLOBAL LANGUAGE CONTROLLER
       ========================================================================= */
    function updateGlobalLangLabel() {
      const label = document.getElementById('globalLangLabel');
      if (state.globalLanguage === 'en') {
        label.textContent = 'EN (English)';
      } else {
        label.textContent = 'VI (Tiếng Việt)';
      }
    }

    document.getElementById('globalLangToggle').addEventListener('click', () => {
      state.globalLanguage = state.globalLanguage === 'en' ? 'vi' : 'en';
      localStorage.setItem('app_global_lang', state.globalLanguage);
      updateGlobalLangLabel();
      // If currently on a section page, synchronize all cards to global language
      if (state.currentView.startsWith('section-')) {
        const section = appData.sections.find(s => s.id === state.currentView);
        if (section) {
          section.paragraphs.forEach((_, idx) => {
            state.flippedCards[`${section.id}-${idx}`] = (state.globalLanguage === 'vi');
          });
        }
      }
      renderCurrentView();
    });

    updateGlobalLangLabel();

    /* =========================================================================
       SCROLL PROGRESS BAR
       ========================================================================= */
    window.addEventListener('scroll', () => {
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPos = window.scrollY;
      const percent = docHeight > 0 ? (scrollPos / docHeight) * 100 : 0;
      document.getElementById('scrollProgressBar').style.width = `${percent}%`;
    });

    const appContainer = document.getElementById('appContainer');
    const navBackBtn = document.getElementById('navBackBtn');

    function navigateTo(hash) {
      window.location.hash = hash;
    }

    function route() {
      const hash = window.location.hash.replace('#', '') || 'overview';
      state.currentView = hash;

      // Update Back Button visibility
      if (hash === 'overview') {
        navBackBtn.classList.add('hidden');
        navBackBtn.classList.remove('flex');
      } else {
        navBackBtn.classList.remove('hidden');
        navBackBtn.classList.add('flex');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderCurrentView();
    }

    window.addEventListener('hashchange', route);

    // Format newlines and list items within verbatim text cleanly
    function formatVerbatimText(text) {
      if (!text) return '';
      // Escape HTML entities to avoid XSS
      const safe = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Format bullet lines starting with • or \n•
      const lines = safe.split('\n');
      let result = '';
      let inList = false;

      lines.forEach((line) => {
        const trimmed = line.trim();
        if (trimmed.startsWith('•')) {
          if (!inList) {
            result += '<ul class="my-3 space-y-2 pl-2 list-none">';
            inList = true;
          }
          result += `<li class="flex items-start gap-2.5"><span class="text-purple-500 font-bold mt-1 text-base">&bull;</span><span>${trimmed.substring(1).trim()}</span></li>`;
        } else if (trimmed.match(/^[1-6]\.\s/)) {
          // Numbered lists
          if (inList) {
            result += '</ul>';
            inList = false;
          }
          result += `<div class="font-medium my-2 pl-2 flex items-start gap-2"><span class="text-purple-600 dark:text-purple-400 font-bold">${trimmed.substring(0, 3)}</span><span>${trimmed.substring(3).trim()}</span></div>`;
        } else {
          if (inList) {
            result += '</ul>';
            inList = false;
          }
          if (trimmed.length > 0) {
            result += `<p class="mb-3 last:mb-0">${trimmed}</p>`;
          }
        }
      });

      if (inList) {
        result += '</ul>';
      }

      return result;
    }

                  class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white/10 dark:bg-black/30 border border-white/20 focus:border-amber-400 focus:bg-white/15 text-white placeholder-purple-200/60 text-sm focus:outline-none transition-all"
                >
                <svg class="w-4 h-4 text-purple-200/70 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              </div>

              ${state.glossarySearch ? `
                <button onclick="handleGlossarySearch('')" class="px-3 py-2 rounded-xl bg-white/15 hover:bg-white/20 text-xs font-semibold text-white transition-colors">
                  Clear Search
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Category Filters -->
          <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
            ${categories.map(cat => `
              <button 
                onclick="filterGlossaryCategory('${cat}')"
                class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                  state.glossaryCategory === cat
                    ? 'bg-purple-600 text-white shadow-sm'
                    : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:border-purple-300 dark:hover:border-purple-700'
                }"
              >
                ${cat} ${cat === 'All' ? `(${appData.glossary.length})` : ''}
              </button>
            `).join('')}
          </div>

          <!-- Results Summary -->
          <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
            <span>Showing <strong>${filtered.length}</strong> of ${appData.glossary.length} specialized terms</span>
            <div class="flex items-center gap-2">
              <button onclick="toggleAllGlossaryReveals(true)" class="hover:text-purple-600 dark:hover:text-purple-400 font-medium">Reveal All Vietnamese</button>
              <span>&bull;</span>
              <button onclick="toggleAllGlossaryReveals(false)" class="hover:text-purple-600 dark:hover:text-purple-400 font-medium">Hide All</button>
            </div>
          </div>

          <!-- Glossary Grid Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
            ${filtered.length > 0 ? filtered.map((item, idx) => {
              const isRevealed = state.glossaryReveals[item.term] || false;

              return `
                <div class="rounded-2xl p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-4">
                  <div class="space-y-3">
                    <!-- Term Header and Part of Speech -->
                    <div class="flex items-start justify-between gap-3">
                      <div>
                        <h3 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                          ${highlightTermInText(item.term, state.glossarySearch)}
                        </h3>
                        <span class="inline-block mt-0.5 text-xs font-semibold px-2 py-0.5 rounded bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-300 border border-purple-200/60 dark:border-purple-800/60">
                          ${item.pos} &bull; ${item.category}
                        </span>
                      </div>

                      <button 
                        onclick="toggleGlossaryReveal('${item.term}')"
                        class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${
                          isRevealed
                            ? 'bg-purple-600 text-white'
                            : 'bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-purple-700 dark:text-purple-300 border border-slate-200 dark:border-slate-700'
                        }"
                      >
                        ${isRevealed ? 'Hide' : 'Xem nghĩa'}
                      </button>
                    </div>

                    <!-- Academic Definition -->
                    <div class="space-y-1">
                      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Academic Definition</span>
                      <p class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
                        ${highlightTermInText(item.def, state.glossarySearch)}
                      </p>
                    </div>

                    <!-- Plain English Explanation (B1/B2 Friendly) -->
                    <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 space-y-1">
                      <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">In other words...</span>
                      <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 italic leading-relaxed">
                        "${highlightTermInText(item.plain, state.glossarySearch)}"
                      </p>
                    </div>

                    <!-- Example in Context from Verbatim Text -->
                    <div class="space-y-1">
                      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Example in Context</span>
                      <blockquote class="text-xs text-slate-600 dark:text-slate-400 pl-3 border-l-2 border-purple-400 dark:border-purple-600 italic leading-relaxed">
                        "${highlightTermInText(item.context, state.glossarySearch)}"
                      </blockquote>
                    </div>
                  </div>

                  <!-- Vietnamese Translation Drawer -->
                  <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
                    ${isRevealed ? `
                      <div class="p-3 rounded-xl bg-purple-50 dark:bg-purple-950/60 border border-purple-200 dark:border-purple-800 text-purple-900 dark:text-purple-100 text-sm font-medium fade-enter">
                        <span class="text-xs font-bold uppercase tracking-wider text-purple-700 dark:text-purple-300 block mb-1">Nghĩa Tiếng Việt</span>
                        ${item.vi}
                      </div>
                    ` : `
                      <button 
                        onclick="toggleGlossaryReveal('${item.term}')"
                        class="w-full py-2 rounded-xl text-xs font-semibold text-center text-slate-500 hover:text-purple-600 dark:text-slate-400 dark:hover:text-purple-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors border border-dashed border-slate-200 dark:border-slate-700 flex items-center justify-center gap-1.5"
                      >
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <span>Reveal Vietnamese Translation / Xem nghĩa</span>
                      </button>
                    `}
                  </div>
                </div>
              `;
            }).join('') : `
              <div class="col-span-2 text-center py-12 space-y-3 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">
                <p class="text-base text-slate-500 dark:text-slate-400">No vocabulary items found matching "${state.glossarySearch}".</p>
                <button onclick="handleGlossarySearch('')" class="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold">
                  Reset Search
                </button>
              </div>
            `}
          </div>

          <!-- Bottom Jump to Overview -->
          <div class="text-center pt-6">
            <a href="#overview" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-sm transition-all">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
              <span>Back to Overview Hub</span>
            </a>
          </div>
        </div>
      `;

      appContainer.innerHTML = html;
    }

    function highlightTermInText(text, search) {
      if (!search || !text) return text;
      const clean = search.trim();
      if (!clean) return text;
      const regex = new RegExp(`(${clean})`, 'gi');
      return text.replace(regex, '<mark class="bg-amber-200 dark:bg-amber-900 dark:text-amber-100 rounded px-0.5">$1</mark>');
    }

    window.handleGlossarySearch = function(val) {
      state.glossarySearch = val;
      renderGlossaryView();
      // Keep focus on input if rerendered
      const input = document.getElementById('glossarySearchInput');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    };

    window.filterGlossaryCategory = function(cat) {
      state.glossaryCategory = cat;
      renderGlossaryView();
    };

    window.toggleGlossaryReveal = function(term) {
      state.glossaryReveals[term] = !state.glossaryReveals[term];
      renderGlossaryView();
    };

    window.toggleAllGlossaryReveals = function(status) {
      appData.glossary.forEach(item => {
        state.glossaryReveals[item.term] = status;
      });
      renderGlossaryView();
    };

    /* =========================================================================
       INITIALIZATION
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      route();
    });
    // In case DOM is already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      route();
    }
  </script>
</body>
</html>
