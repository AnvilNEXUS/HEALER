    <style>
      :root {
        --bg-canvas: #FBF9F5;
        --bg-surface: #FFFFFF;
        --bg-subtle: #F3EFE6;
        --bg-elevated: #FAF6EE;
        --text-primary: #1C1917;
        --text-secondary: #44403C;
        --text-muted: #78716C;
        --border-hairline: #E5DEC9;
        --border-strong: #D6CEBE;
        --accent-en: #9A3412;
        --accent-en-soft: #FFF7ED;
        --accent-en-border: #FDBA74;
        --accent-vi: #1E3A8A;
        --accent-vi-soft: #EFF6FF;
        --accent-vi-border: #93C5FD;
        --shadow-card: 0 2px 10px -2px rgba(28, 25, 23, 0.05);
        --shadow-hover: 0 10px 24px -4px rgba(28, 25, 23, 0.09);
      }

      html.dark {
        --bg-canvas: #0C1117;
        --bg-surface: #151D28;
        --bg-subtle: #1C2635;
        --bg-elevated: #192230;
        --text-primary: #F3F4F6;
        --text-secondary: #D1D5DB;
        --text-muted: #9CA3AF;
        --border-hairline: #263346;
        --border-strong: #374963;
        --accent-en: #F59E0B;
        --accent-en-soft: rgba(245, 158, 11, 0.12);
        --accent-en-border: rgba(245, 158, 11, 0.4);
        --accent-vi: #38BDF8;
        --accent-vi-soft: rgba(56, 189, 248, 0.12);
        --accent-vi-border: rgba(56, 189, 248, 0.4);
        --shadow-card: 0 4px 16px -2px rgba(0, 0, 0, 0.35);
        --shadow-hover: 0 12px 28px -4px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      /* Typography & Reading Mode Scale */
      .font-display-editorial {
        font-family: 'Fraunces', Georgia, serif;
        text-wrap: balance;
      }

      .font-reading-prose {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: clamp(1.15rem, 1.5vw, 1.275rem); /* 18.4px - 20.4px */
        line-height: 1.78;
        letter-spacing: 0.005em;
      }

      html.dark .font-reading-prose {
        letter-spacing: 0.012em;
      }

      .font-mono-tabular {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }

      /* Layout Containers */
      .app-container-wide {
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      .reading-container {
        max-width: 56rem; /* max-w-4xl (896px) */
        margin-left: auto;
        margin-right: auto;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      /* Persistent Top Navigation Bar */
      .top-navbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background-color: color-mix(in srgb, var(--bg-canvas) 92%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-hairline);
        transition: background-color 0.25s ease, border-color 0.25s ease;
      }

      .top-navbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0.75rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem;
      }

      /* Interactive Buttons & Controls */
      .btn-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 40px;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
        border: 1px solid var(--border-strong);
        background-color: var(--bg-surface);
        color: var(--text-primary);
        transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .btn-control:hover {
        background-color: var(--bg-subtle);
        border-color: var(--text-muted);
      }

      .btn-control:focus-visible,
      .interactive-card:focus-visible,
      .para-card:focus-visible {
        outline: 2px solid var(--accent-en);
        outline-offset: 2px;
      }

      .btn-primary-accent {
        background-color: var(--accent-en);
        color: #FFFFFF;
        border-color: transparent;
      }

      html.dark .btn-primary-accent {
        color: #0C1117;
      }

      .btn-primary-accent:hover {
        opacity: 0.92;
        background-color: var(--accent-en);
      }

      /* Global EN/VI Segmented Toggle Switch */
      .lang-switch-pill {
        display: inline-flex;
        align-items: center;
        background-color: var(--bg-subtle);
        border: 1px solid var(--border-hairline);
        border-radius: 0.5rem;
        padding: 0.1875rem;
        min-height: 40px;
        cursor: pointer;
        user-select: none;
      }

      .lang-switch-option {
        padding: 0.35rem 0.65rem;
        border-radius: 0.375rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        transition: background-color 0.18s ease, color 0.18s ease;
      }

      .lang-switch-option.active-en {
        background-color: var(--accent-en);
        color: #FFFFFF;
      }
      html.dark .lang-switch-option.active-en {
        color: #0C1117;
      }

      .lang-switch-option.active-vi {
        background-color: var(--accent-vi);
        color: #FFFFFF;
      }
      html.dark .lang-switch-option.active-vi {
        color: #0C1117;
      }

      /* Section Grid Cards on Overview Page */
      .overview-grid {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 1.25rem;
      }

      @media (min-width: 768px) {
        .overview-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1080px) {
        .overview-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .section-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: 0.75rem;
        padding: 1.5rem;
        cursor: pointer;
        box-shadow: var(--shadow-card);
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
        text-align: left;
      }

      .section-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }

      .card-corner-toggle {
        position: relative;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        min-height: 36px;
        padding: 0.35rem 0.7rem;
        border-radius: 0.375rem;
        font-size: 0.75rem;
        font-weight: 700;
        border: 1px solid var(--border-strong);
        background-color: var(--bg-subtle);
        color: var(--text-primary);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
      }

      .card-corner-toggle:hover {
        background-color: var(--bg-elevated);
        border-color: var(--accent-en);
        transform: scale(1.03);
      }

      .card-corner-toggle[data-lang="vi"] {
        border-color: var(--accent-vi-border);
        background-color: var(--accent-vi-soft);
        color: var(--accent-vi);
      }

      .card-corner-toggle[data-lang="en"] {
        border-color: var(--accent-en-border);
        background-color: var(--accent-en-soft);
        color: var(--accent-en);
      }

      /* Smooth 3D / Cross-Fade Flip Stage for Variable Height Paragraph Cards */
      .para-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: 0.875rem;
        padding: 1.75rem 2rem;
        box-shadow: var(--shadow-card);
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
      }

      .para-card:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow-hover);
      }

      .para-card[data-active-lang="vi"] {
        background-color: var(--bg-elevated);
        border-color: var(--accent-vi-border);
      }

      /* Grid stack so both EN and VI share the same cell and never cause layout jitter */
      .para-flip-grid {
        display: grid;
        grid-template-columns: 100%;
        perspective: 1200px;
        align-items: start;
      }

      .para-face {
        grid-row: 1;
        grid-column: 1;
        backface-visibility: hidden;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }

      .para-face.is-visible {
        opacity: 1;
        transform: rotateX(0deg) translateY(0);
        pointer-events: auto;
        z-index: 2;
      }

      .para-face.is-hidden {
        opacity: 0;
        transform: rotateX(-10deg) translateY(4px);
        pointer-events: none;
        z-index: 1;
        user-select: none;
      }

      /* Language State Indicator Badge (Subtle Typographic Marker) */
      .lang-state-indicator {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .lang-state-indicator.state-en {
        color: var(--accent-en);
      }

      .lang-state-indicator.state-vi {
        color: var(--accent-vi);
      }

      /* View Transitions */
      .view-section {
        animation: viewFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes viewFadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .para-face,
        .section-card,
        .view-section,
        .btn-control {
          transition: none !important;
          animation: none !important;
        }
      }

      @media (max-width: 640px) {
        .top-navbar-inner {
          padding: 0.55rem 0.75rem;
          gap: 0.35rem;
        }
        .top-navbar .btn-control {
          padding: 0.35rem 0.55rem;
          font-size: 0.74rem;
          min-height: 36px;
        }
        .lang-switch-option {
          padding: 0.25rem 0.5rem;
          font-size: 0.7rem;
        }
        .para-card {
          padding: 1.25rem 1.25rem;
        }
        .reading-container,
        .app-container-wide {
          padding-left: 1rem;
          padding-right: 1rem;
        }
      }
    </style>
  </head>

    "titleVi": "1. Dẫn Nhập: Hiện Tượng Xuất Bản Toàn Cầu Của Cuốn Sách Huyền Bí",
    "paragraphs": [
      {
        "id": "p1-s1-p1",
        "en": "An American man claimed that he heard the voice of God speaking to him and recorded the entire conversation into a book. This book held a place on the New York Times bestseller list for 100 consecutive weeks. It was translated into 36 languages and sold over 12 million copies worldwide.",
        "vi": "Một người Mỹ tuyên bố rằng, anh đã nghe thấy tiếng Chúa trò chuyện với mình và ghi lại toàn bộ cuộc đối thoại đó thành sách. Cuốn sách này đã đứng vững suốt 100 tuần liền trên bảng xếp hạng bán chạy của New York Times. Được dịch ra 36 thứ tiếng và bán ra hơn 12 triệu bản trên toàn thế giới."
      },
      {
        "id": "p1-s1-p2",
        "en": "What made this book become a divine work in the eyes of millions?",
        "vi": "Điều gì khiến cuốn sách này trở thành một tác phẩm thần thánh trong mắt hàng triệu người?"
      },
      {
        "id": "p1-s1-p3",
        "en": "Before reading it, many people assumed its contents would consist purely of vague, fanciful ramblings, only to find that it held profound, valuable mysteries. The author even explained the Tao, Taiji (the Great Ultimate), Tai Xu (the Great Void), and Yin and Yang in Chinese culture with remarkably coherent explanations.",
        "vi": "Nhiều người trước khi đọc quyển sách này từng nghĩ nội dung của nó sẽ toàn những lời viển vông, mơ hồ, nhưng không ngờ lại chứa đựng được nhiều bí ẩn có giá trị như vậy. Tác giả thậm chí còn giải thích về đạo, về thái cực, thái hư, về âm và dương trong văn hóa Trung Hoa cùng những lý giải vô cùng hợp lý."
      },
      {
        "id": "p1-s1-p4",
        "en": "Today, Spiritual Life will recount for you the extraordinary dialogue between Neil and God. Ultimately, what happened to him, and why has this book garnered such widespread admiration?",
        "vi": "Hôm nay, Tâm Linh Cuộc Sống sẽ kể lại cho bạn nghe cuộc trò chuyện kỳ lạ giữa Neil và Chúa. Rốt cuộc điều gì đã xảy ra với ông ấy và vì sao cuốn sách này lại được nhiều người thán phục đến vậy?"
      },
      {
        "id": "p1-s1-p5",
        "en": "Welcome, esteemed listeners, to the Spiritual Life channel. Before diving into today’s video, please don’t forget to subscribe and share the channel with others so our team has the motivation to produce even more meaningful content. Thank you, and we invite you to follow along with today's feature.",
        "vi": "Chào mừng quý khán thính giả đến với kênh Tâm Linh Cuộc Sống. Trước khi theo dõi video ngày hôm nay, đừng quên đăng ký và chia sẻ kênh đến với nhiều người để ekip chúng mình có thêm động lực ra thêm nhiều video ý nghĩa hơn bạn nhé. Xin cảm ơn và xin mời các bạn cùng theo dõi nội dung của chúng ta ngày hôm nay."
      }

  },
  {
    "id": "p1-s2",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.2",
    "titleEn": "2. Life's Tragedy & The Desperate Letter of Spring 1992",
    "titleVi": "2. Bi Kịch Cuộc Đời & Bức Thư Tuyệt Vọng Mùa Xuân Năm 1992",
    "paragraphs": [
      {
        "id": "p1-s2-p1",
        "en": "The central protagonist of this story is Neil, an American who was once a radio broadcaster, then became a journalist, advanced to editor-in-chief, and eventually founded his own company to become its executive director. But in middle age, everything suddenly collapsed. A car accident, a divorce, and shortly thereafter, the bankruptcy of his company. Virtually overnight, Neil went from a successful entrepreneur to a homeless man, surviving by collecting discarded cans to scrape together every bite to eat. He believed that fate was deliberately punishing him.",
        "vi": "Nhân vật chính trong câu chuyện là Neil, một người Mỹ từng là phát thanh viên, rồi trở thành nhà báo, sau đó lên làm tổng biên tập và cuối cùng tự mình sáng lập công ty, trở thành giám đốc. Nhưng ở độ tuổi trung niên, mọi thứ bất ngờ sụp đổ. Tai nạn xe hơi, ly hôn và chẳng bao lâu sau, công ty của ông cũng phá sản. Chỉ sau một đêm, Neil từ một doanh nhân thành đạt trở thành kẻ vô gia cư, phải sống nhờ vào việc nhặt lon kiếm từng miếng ăn. Ông tin rằng số phận đang cố tình trừng phạt mình."
      },
      {
        "id": "p1-s2-p2",
        "en": "In the spring of 1992, in a state of utter desperation, Neil opened his notebook and began writing down words of grievance against his fate, as he usually did. But this time, he felt that wasn't enough. And so, Neil decided to write a letter addressed to God. In the letter, he posed a series of questions:",
        "vi": "Vào mùa xuân năm 1992, trong tình cảnh tuyệt vọng, Neil mở cuốn sổ tay của mình và bắt đầu viết ra những lời oán trách số phận như mọi khi. Nhưng lần này, ông cảm thấy như vậy vẫn chưa đủ. Thế là Neil quyết định viết một bức thư gửi cho Thượng Đế. Trong thư, ông đặt hàng loạt câu hỏi:"
      },
      {
        "id": "p1-s2-p3",
        "en": "Is my entire life destined to be this miserable? Why is my existence so awful? Not a single day brings joy. What have I done wrong to deserve such a desolate fate?",
        "vi": "Chẳng lẽ cả đời tôi sẽ khốn khổ thế này sao? Tại sao cuộc sống của tôi lại tệ hại đến vậy? Ngày nào cũng không có niềm vui. Tôi đã làm sai gì để đáng phải chịu cảnh thê lương thế này?"
      }
    ]
  },
  {
    "id": "p1-s3",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.3",
    "titleEn": "3. The Automatic Writing Phenomenon & The First Response",
    "titleVi": "3. Hiện Tượng Tự Động Viết & Lời Hồi Đáp Đầu Tiên",
    "paragraphs": [
      {
        "id": "p1-s3-p1",
        "en": "At first, Neil only intended to use this as an outlet for his emotions, but unexpectedly, something bizarre occurred. Right after penning those questions, just as Neil was pausing to calm his mind, his hand suddenly felt guided by an unseen presence, gripping the pen and automatically tracing out the next words:",
        "vi": "Ban đầu Neil chỉ nghĩ dùng việc này để giải tỏa cảm xúc, nhưng không ngờ điều kỳ lạ đã xảy ra. Ngay sau khi viết xong những câu hỏi ấy, Neil định dừng lại để bình tâm thì bất ngờ tay ông như bị ai đó điều khiển tiếp tục cầm bút và tự động viết ra những dòng chữ tiếp theo:"
      },
      {
        "id": "p1-s3-p2",
        "en": "Do you truly wish to know the answers to those questions, or are you merely venting your anger?",
        "vi": "Anh thật sự muốn biết câu trả lời cho những câu hỏi đó, hay chỉ đang trút giận thôi?"
      },
      {
        "id": "p1-s3-p3",
        "en": "That was the very first sentence to appear. At that moment, Neil thought he had lost his mind—driven mad by misery. He repeatedly checked to confirm that the question was indeed in his own handwriting. Yet the answer had arrived from an unfamiliar thought inside his head, one that clearly was not his own. Neil simply followed the flow of that thought and kept on writing. He began to believe that if this was not a product of his own mind, perhaps God was indeed replying to him.",
        "vi": "Đó là dòng chữ đầu tiên xuất hiện. Lúc đó, Neil tưởng rằng mình đã điên rồi, do khổ quá mà phát điên. Ông liên tục kiểm tra lại để chắc chắn câu hỏi đúng là do mình viết ra. Còn câu trả lời lại đến từ một ý nghĩ lạ lùng trong đầu, rõ ràng không phải của ông. Neil cứ thế thuận theo dòng suy nghĩ đó mà tiếp tục viết. Ông bắt đầu tin, nếu đây không phải do mình nghĩ ra thì có lẽ Chúa đang trả lời ông."
      }
    ]
  },
  {
    "id": "p1-s4-1",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.4.1",
    "titleEn": "4. Essential Dialogues — Question 1: With Whom Does God Speak? Signs of Truth, Joy, and Love",
    "titleVi": "4. Những Cuộc Đối Thoại Cốt Tủy — Câu hỏi 1: Chúa trò chuyện cùng ai? Dấu hiệu của sự thật, niềm vui và tình yêu",
    "paragraphs": [
      {
        "id": "p1-s4-1-p1",
        "en": "Neil decided to ask a earnest question: Whom does God usually choose to speak with? Immediately, his hand moved involuntarily once more:",
        "vi": "Neil quyết định đặt một câu hỏi thật nghiêm túc: Chúa thường chọn những ai để trò chuyện cùng? Ngay lập tức, tay ông lại không tự chủ mà viết tiếp:"
      },
      {
        "id": "p1-s4-1-p2",
        "en": "I speak to everyone, all the time; it is simply that most people do not hear. Feelings and thoughts are the prophecies of the soul, and they are also the words of God. The hallmarks of those words are truth, joy, and love. As for feelings and thoughts that do not carry these signs...",
        "vi": "Ta đang nói chuyện với tất cả mọi người vào mọi lúc, chỉ là hầu hết họ đều không nghe thấy. Cảm xúc và suy nghĩ chính là lời tiên tri của linh hồn, cũng là lời của Thượng Đế. Dấu hiệu của những lời ấy là sự thật, niềm vui và tình yêu. Còn những cảm xúc và suy nghĩ không mang theo các dấu hiệu đó."
      },
      {
        "id": "p1-s4-1-p3",
        "en": "God continued:",
        "vi": "Chúa nói tiếp:"
      },
      {
        "id": "p1-s4-1-p4",
        "en": "If what you perceive does not carry truth, joy, or love, then it is not My voice; it is merely an erroneous judgment arising from yourself.",
        "vi": "Nếu những điều con cảm nhận không mang theo sự thật, niềm vui hay tình yêu thì đó không phải là lời ta, đó chỉ là phán đoán sai lầm từ chính con."
      },
      {
        "id": "p1-s4-1-p5",
        "en": "Neil found this puzzling and asked further: \"Then why do some individuals appear to hear Your word far more often than others? Take myself, for instance—since I believe in God, shouldn't I hear more from You?\" God replied:",
        "vi": "Neil nghe vậy thì rất khó hiểu nên lại hỏi: Vậy tại sao có người lại thường như nghe được lời Ngài nhiều hơn người khác? Ví dụ như con đây, con tin vào Chúa thì chẳng phải con nên nghe được nhiều điều từ Ngài hơn sao? Chúa trả lời:"
      },
      {
        "id": "p1-s4-1-p6",
        "en": "Because there are those who are genuinely willing to listen. They dare to receive, dare to open their hearts to that sacred connection, even when what they hear may seem terrifying, mad, or entirely wrong.",
        "vi": "Bởi vì có những người thật sự sẵn lòng lắng nghe, họ dám tiếp nhận, dám mở lòng với sự kết nối thiêng liêng ấy, dù đôi khi điều họ nghe được có thể rất đáng sợ, rất điên rồ hoặc nghe có vẻ hoàn toàn sai trái."
      },
      {
        "id": "p1-s4-1-p7",
        "en": "Neil hesitated: \"Do You mean that even when what God says appears to be wrong, we should still listen?\" God answered: \"All great discoveries of humankind were made by people who did not stubbornly insist that they were right, but rather possessed the will and the ability to create.\"",
        "vi": "Neal ngập ngừng: \"Ý Ngài là, ngay cả khi điều Chúa nói ra nghe có vẻ sai thì chúng con vẫn nên lắng nghe sao?\" Chúa đáp: \"Tất cả những khám phá vĩ đại của loài người đều được tạo ra bởi những người không khăng khăng cho rằng mình đúng, mà có đủ ý chí và khả năng để sáng tạo.\""
      },
      {
        "id": "p1-s4-1-p8",
        "en": "From these words of God, we can understand that when you have the courage to show tolerance and accept your own genuine emotions, that is precisely when you encounter God.",
        "vi": "Trong lời này của Chúa, chúng ta có thể hiểu rằng, việc bạn dám bao dung, dám chấp nhận chính cảm xúc của mình cũng chính là lúc bạn gặp được Chúa."
      }
    ]
  },
  {
    "id": "p1-s4-2",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.4.2",
    "titleEn": "4.2 The Nature of God: An Observer, Not the Director of Suffering",
    "titleVi": "4.2 Bản chất của Thượng Đế: Đấng quan sát, không phải đạo diễn đau khổ",
    "paragraphs": [
      {
        "id": "p1-s4-2-p1",
        "en": "God added: \"To humankind, I am merely an observer, not the Creator who orchestrated all the suffering in your life.\"",
        "vi": "Chúa nói thêm: \"Với con người, Ta chỉ là một người quan sát, chứ không phải là Đấng Tạo Hóa đã sắp đặt mọi đau khổ trong cuộc đời con.\""
      },
      {
        "id": "p1-s4-2-p2",
        "en": "In other words, Neil's bankruptcy, divorce, and hardships were by no means arranged by God. In truth, God has neither the prerogative nor the intention to interfere with human destiny. The only thing He does is send signals through positive emotions and thoughts to awaken awareness, allowing human beings to step out of darkness on their own and find joy.",
        "vi": "Nói cách khác, sự phá sản, ly hôn hay khốn khó của Neal hoàn toàn không phải do Thượng Đế an bài. Thực tế, Chúa không hề có quyền và cũng không có ý định can thiệp vào số phận của con người. Thứ duy nhất Ngài làm là gửi đến những tín hiệu qua cảm xúc và suy nghĩ tích cực để khơi dậy nhận thức, để con người tự mình bước ra khỏi bóng tối và tìm thấy niềm vui."
      },
      {
        "id": "p1-s4-2-p3",
        "en": "Destiny does not lie in the hands of any external deity; it is chosen and forged by humans themselves. If you dwell perpetually in suffering, suffering will only persist. And if you truly wish to achieve something, begin with gratitude rather than supplication or vague wishing.",
        "vi": "Vận mệnh không nằm trong tay bất kỳ đấng nào, mà là do chính con người lựa chọn và tạo ra. Nếu bạn mãi đắm chìm trong đau khổ thì đau khổ sẽ chỉ tiếp tục. Và nếu bạn thực sự muốn đạt được điều gì đó, hãy bắt đầu bằng lòng biết ơn, chứ không phải bằng lời cầu xin hay là những điều ước mơ hồ."
      },
      {
        "id": "p1-s4-2-p4",
        "en": "This sounds very much like the Law of Attraction. What you believe, you attract. When you say \"I wish,\" you are implicitly affirming that you do not yet possess it—you do not truly believe it will happen.",
        "vi": "Điều này nghe rất giống với luật hấp dẫn. Bạn tin điều gì, bạn sẽ thu hút điều đó. Khi bạn nói \"Ước gì\", tức là bạn đang ngầm khẳng định mình chưa có được điều đó, bạn không tin nó sẽ xảy ra."
      }
    ]
  },
  {
    "id": "p1-s4-3",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.4.3",
    "titleEn": "4.3 Question 2 & The Root of Suffering: Fear Versus Love",
    "titleVi": "4.3 Câu hỏi 2 & Nguồn gốc của đau khổ: Nỗi sợ đối lập với Tình yêu",
    "paragraphs": [
      {
        "id": "p1-s4-3-p1",
        "en": "Next, Neil asked: \"Why has my life been filled with such suffering?\" God answered:",
        "vi": "Sau đó, Neal tiếp tục hỏi: \"Tại sao cuộc sống của con lại đau khổ đến vậy?\" Chúa đã đáp lại rằng:"
      },
      {
        "id": "p1-s4-3-p2",
        "en": "All human thoughts and actions, at their deepest root, originate from one of two sources: either love or fear. The true root of suffering is fear. Humans often believe they are acting out of love, but behind that love often lies the fear of losing what they love. Fear compels people to act, and those actions inflict hurt, followed by loving again—yet this time loving memories, loving what has been lost. And so the endless cycle of loving, destroying, regretting, and loving again goes on.",
        "vi": "Mọi suy nghĩ và hành động của con người, xét đến tận cùng đều xuất phát từ hai thứ, hoặc là tình yêu, hoặc là nỗi sợ. Nguồn gốc thật sự của đau khổ chính là nỗi sợ. Con người thường cho rằng mình hành động vì yêu nhưng thực ra phía sau tình yêu ấy lại là nỗi sợ mất đi điều mình yêu. Sợ hãi khiến người ta hành động và hành động đó lại tạo ra tổn thương, rồi lại tiếp tục yêu. Nhưng lần này lại yêu ký ức, yêu những gì đã mất. Thế là vòng lặp yêu, hủy diệt, tiếc nuối, lại yêu cứ thế tiếp diễn."
      },
      {
        "id": "p1-s4-3-p3",
        "en": "People suffer because they do not believe the nature of life is happiness. They fear, and because they fear, they choose endurance, tolerating wrong situations merely to avoid taking action. For action is synonymous with having to assume responsibility for one’s own life.",
        "vi": "Con người đau khổ vì không tin rằng bản chất của cuộc sống là hạnh phúc. Họ sợ và vì sợ nên chọn cách nhẫn nhịn, chịu đựng những điều sai trái chỉ để tránh phải hành động. Bởi vì hành động không đồng nghĩa với việc phải chịu trách nhiệm cho chính cuộc đời mình."
      },
      {
        "id": "p1-s4-3-p4",
        "en": "Neil had been that way too. He feared poverty would cling to him forever, so he blamed fate, blamed God, and blamed circumstances. Because once he laid blame elsewhere, he had no need to change.",
        "vi": "Neil cũng từng như vậy. Ông sợ sự nghèo đói sẽ theo mình mãi mãi nên ông đổ lỗi cho số phận cho Chúa, cho hoàn cảnh. Vì một khi đổ lỗi, ông có thể không cần thay đổi."
      }
    ]
  },
  {
    "id": "p1-s4-4",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.4.4",
    "titleEn": "4.4 The Sole Power: The Freedom of Choice and Personal Accountability",
    "titleVi": "4.4 Quyền năng duy nhất: Quyền lựa chọn và trách nhiệm với cuộc đời",
    "paragraphs": [
      {
        "id": "p1-s4-4-p1",
        "en": "Yet the truth is that the universe and life bestow upon human beings only one power: the power of choice. To refuse to choose is to squander life itself.",
        "vi": "Nhưng sự thật là vũ trụ và cuộc sống chỉ trao cho con người đúng một quyền năng. Đó là quyền lựa chọn. Không lựa chọn tức là đang lãng phí chính sự sống của mình."
      },
      {
        "id": "p1-s4-4-p2",
        "en": "God said that humans are players in the very game of destiny they have chosen. Humankind is not merely an observer, but a creator. For every individual is the only creature in the universe capable of creating itself.",
        "vi": "Chúa nói con người là người chơi trong chính ván cờ số phận mà họ lựa chọn. Con người không chỉ là người quan sát mà còn là người sáng tạo. Bởi vì mỗi người đều là sinh vật duy nhất trong vũ trụ có thể tự tạo ra chính mình."
      },
      {
        "id": "p1-s4-4-p3",
        "en": "Neil once suffered over bankruptcy because he feared being poor. He raged over what he had lost, and most importantly, he did not believe he could alter the present. But to change one's life, one must first change one's actions. And to change one's actions, one must dare to admit that oneself created this circumstance.",
        "vi": "Neil từng đau khổ vì phá sản bởi vì ông sợ nghèo. Ông giận dữ vì những gì mình đánh mất và quan trọng nhất là ông không tin mình có thể thay đổi hiện tại. Nhưng để thay đổi cuộc đời trước hết phải thay đổi hành động. Mà muốn thay đổi hành động thì phải dám thừa nhận chính mình là người đã tạo ra hoàn cảnh này."
      },
      {
        "id": "p1-s4-4-p4",
        "en": "What you are experiencing today is the result of past choices. And what you will experience in the future will be decided by the choices you make right now. This is not victim-blaming; it is a straightforward truth.",
        "vi": "Những gì bạn đang trải qua hôm nay là kết quả của những lựa chọn trong quá khứ. Và những gì bạn sẽ trải qua trong tương lai sẽ được quyết định bởi những lựa chọn ngay lúc này. Đây không phải là kiểu đổ lỗi cho nạn nhân mà là một sự thật đơn giản."
      },
      {
        "id": "p1-s4-4-p5",
        "en": "It is like someone slapping you and you feeling pain. If you want to escape that pain, waiting for the other person to suddenly feel remorse and apologize is highly unlikely to happen, because you cannot control other people. The only thing you can control is your own reaction. You could strike back, or you could pretend you don’t care at all and lull yourself with positive thinking. Either way, whether your suffering continues depends entirely on the choice you make in this moment.",
        "vi": "Giống như việc bạn bị ai đó tát một cái và thấy đau. Nếu bạn muốn thoát khỏi nỗi đau ấy thì cho người kia tự dưng hối hận rồi quay lại xin lỗi bạn là chuyện rất khó xảy ra. Vì bạn không thể điều khiển người khác. Thứ duy nhất bạn có thể thay đổi chính là phản ứng của mình. Bạn có thể phản đòn lại một cú hoặc giả vờ không hề để tâm và tự dung ngủ mình bằng tư duy tích cực. Dù là cách nào đi nữa, bạn có đau khổ tiếp hay không phụ thuộc vào lựa chọn của bạn lúc này."
      }
    ]
  },
  {
    "id": "p1-s4-5",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.4.5",
    "titleEn": "4.5 Question 3: What is the Purpose of Human Life? (Experiencing Known Truths)",
    "titleVi": "4.5 Câu hỏi 3: Mục đích sống của con người là gì? (Trải nghiệm chân lý đã biết)",
    "paragraphs": [
      {
        "id": "p1-s4-5-p1",
        "en": "The third question Neil asked was: What is the purpose of human life? The answer was disarmingly simple. God said that we do not come to this world to learn.",
        "vi": "Câu hỏi thứ ba mà Neil đặt ra là mục đích sống của con người là gì? Và câu trả lời thật sự rất đơn giản. Chúa nói rằng, chúng ta không đến thế gian này để học hỏi."
      },
      {
        "id": "p1-s4-5-p2",
        "en": "In reality, the soul already knows everything beforehand. However, because the soul is an immaterial entity, it can only grasp abstract concepts. The single thing the soul lacks is experiential reality. The soul temporarily wipes its conscious memory to incarnate as a human being for the express purpose of directly experiencing the concepts it has always known.",
        "vi": "Thực tế, linh hồn vốn dĩ đã biết hết mọi thứ từ trước. Tuy nhiên, vì linh hồn là một tồn tại phi vật chất, chỉ có thể hiểu được các khái niệm trừu tượng. Điều duy nhất linh hồn thiếu chính là trải nghiệm thực tế. Linh hồn xóa đi ký ức tri thức của mình để trở thành con người nhằm mục đích trải nghiệm trực tiếp những khái niệm mà nó đã vốn biết."
      },
      {
        "id": "p1-s4-5-p3",
        "en": "You may consider yourself kind, generous, and wise. But if you do not act to demonstrate those virtues, they remain nothing more than definitions on paper. So it is with the soul: it recognizes that all abstract truths are empty unless manifested externally. That is why the soul must take human form—to express its intuition and feeling through lived life. The soul yearns for the sublime, much like the legendary auspicious koi carp seeking to live a complete and meaningful life.",
        "vi": "Bạn có thể tự cho mình là người tốt, hào phóng, thông thái. Nhưng nếu không hành động để thể hiện những điều đó thì tất cả chỉ là những định nghĩa trên giấy mà thôi. Linh hồn cũng vậy, nó nhận thức rằng mọi chân lý trừu tượng chỉ là hư vô nếu không được thể hiện ra bên ngoài. Chính vì thế, linh hồn phải hóa thân thành con người để thể hiện trực giác và cảm nhận của mình qua cuộc sống. Linh hồn khao khát điều tốt đẹp như cá chép may mắn trong truyền thuyết có thể sống một cuộc đời trọn vẹn và ý nghĩa."
      },
      {
        "id": "p1-s4-5-p4",
        "en": "Therefore, humans are born to love fully and to enjoy joy, not for any other burden. Experiencing the world is a valid aspect of life's purpose, but it is not the ultimate end.",
        "vi": "Vì vậy, con người sinh ra để yêu thương một cách trọn vẹn và tận hưởng niềm vui chứ không phải vì bất cứ điều gì khác. Việc trải nghiệm thế giới là một phần đúng của mục đích sống nhưng không phải là mục đích cuối cùng."
      }
    ]
  },
  {
    "id": "p1-s4-6",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.4.6",
    "titleEn": "4.6 Question 4: What is God? The Great Ultimate, Yin-Yang, and the Cosmic Substance",
    "titleVi": "4.6 Câu hỏi 4: Thần là gì? Thái cực, Âm Dương và Bản thể vũ trụ",
    "paragraphs": [
      {
        "id": "p1-s4-6-p1",
        "en": "This brings us to Neil’s fourth question: What is God? God answered that God is both Taiji (the Great Ultimate) and Tai Xu (the Great Void), both Yin and Yang. Just like the soaring eagle and the act of flight itself. God is all void, yet simultaneously all existence. God is the totality of the cosmos when the universe becomes conscious of itself.",
        "vi": "Điều này dẫn đến câu hỏi thứ tư của Neil. Thần là gì? Chúa trả lời rằng thần chính là thái cực và thái hư, là âm và dương. Cũng như chim ưng bay lượn và sự bay bổng. Thần là tất cả sự hư vô nhưng đồng thời cũng là mọi hiện hữu. Thần là tổng hòa của vũ trụ. Khi vũ trụ nhận thức về chính nó."
      },
      {
        "id": "p1-s4-6-p2",
        "en": "The Diamond Sutra also states: \"All conditioned phenomena are like an illusion; if one sees all forms as non-forms, one sees the Tathāgata.\" In Buddhist doctrine, the Buddha is without fixed form—both emptiness and presence. When you contemplate the most abstract concepts, you touch the nature of the Buddha. Much like the name Tathāgata, meaning \"the One who comes from Suchness/Truth.\"",
        "vi": "Trong kinh Kim Cang cũng có nói, phàm sở hữu tướng, giai thị hư vọng. Nếu kiến chư tướng phi tướng, thị kiến Như Lai. Nghĩa là, theo Phật pháp, Đức Phật cũng là vô tướng, vừa là hư vô, vừa là hiện hữu. Khi bạn suy ngẫm về những khái niệm trừu tượng nhất, bạn sẽ chạm đến hình ảnh của Đức Phật. Giống như cái tên Như Lai, nghĩa là người đến từ chân lý."
      },
      {
        "id": "p1-s4-6-p3",
        "en": "The I Ching (Book of Changes) likewise states: \"Changes have Taiji, which gives birth to the Two Modes [Yin and Yang]; the Two Modes give birth to the Four Images; the Four Images give birth to the Eight Trigrams.\" Scholar Kong Yingda explained that Taiji is the primordial unified Qi before heaven and earth separated, the era of primordial inception, Taishi and Taiyi.",
        "vi": "Trong kinh Dịch cũng có nói rằng, Dịch hữu thái cực, thị sinh lưỡng nghi. Lưỡng nghi sinh tứ tượng. Tứ tượng sinh bát quái. Học giả kinh Dịch Khổng Ẩn Đáo của Trung Quốc giải thích rằng, thái cực là nguyên khí hòa hợp làm một trước khi trời đất phân tách, cũng chính là thời khởi nguyên, thời thái thủy, thái y."
      },
      {
        "id": "p1-s4-6-p4",
        "en": "Perhaps they are all speaking of the exact same reality. There is a concept existing before the universe, or which is the universe itself. That reality desires to know itself, and thus manifests polarity and unity. Like the image of an eagle soaring or a goat leaping—things seemingly opposite, yet coexisting. To know cold, you must understand heat. Every perceivable phenomenon requires contrast to be highlighted. That is the genuine meaning behind the aphorism: Changes have Taiji, generating the Two Modes; the Two Modes generate the Four Images; the Four Images generate the Eight Trigrams.",
        "vi": "Có thể họ đều đang nói về cùng một điều. Có một khái niệm tồn tại trước cả vũ trụ, hoặc chính là bản thân vũ trụ. Khái niệm đó muốn nhận thức chính mình, nên mới sinh ra sự đối lập và thống nhất. Như hình ảnh chim ưng bay và con dê bay. Những thứ tưởng chừng trái ngược, nhưng lại cùng tồn tại. Để hiểu rõ được cái lạnh, bạn phải biết cái nóng là gì. Mọi sự vật được nhận biết đều cần có đối lập để làm nổi bật. Đó chính là ý nghĩa thật sự của câu, Dịch hữu thái cực, thị sinh lưỡng nghi. Lưỡng nghi sinh tứ tượng. Tứ tượng sinh bát quái."
      }
    ]
  },
  {
    "id": "p1-s4-7",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.4.7",
    "titleEn": "4.7 The Three Stages of Being: Knowing, Experiencing, and Being",
    "titleVi": "4.7 Ba giai đoạn tồn tại: Nhận thức, Trải nghiệm và Tồn tại",
    "paragraphs": [
      {
        "id": "p1-s4-7-p1",
        "en": "Continuing the dialogue between Neil and God: God stated that all things must move through three stages: knowing (awareness), experiencing, and being. Knowing represents concepts; experiencing encompasses the emotions and events occurring within the material realm. Only when both elements are present does an entity truly exist.",
        "vi": "Tiếp tục với cuộc đối thoại giữa Neil và Chúa. Chúa nói rằng, mọi sự vật đều phải trải qua ba giai đoạn, nhận thức, trải nghiệm và tồn tại. Nhận thức chính là các khái niệm, trải nghiệm là những cảm xúc và sự kiện xảy ra trong thế giới vật chất. Chỉ khi có đủ hai yếu tố này, sự vật mới thực sự tồn tại."
      },
      {
        "id": "p1-s4-7-p2",
        "en": "God's purpose is to know Himself through countless beings like us. In other words, all of us are individuated aspects separated from the essence of God, intended to help God understand His own nature. Have you noticed that myths across the world describe humanity as being made in the image of God? That does not mean we share God's physical appearance, but rather that we share the same essence. We share a single origin and a single point of return, while heading toward the exact same objective. Therefore, the mission of life is to recognize your true self through every lived experience. To know yourself is to assist God in knowing Himself.",
        "vi": "Mục đích của Chúa là thông qua vô số con người như chúng ta, Ngài có thể nhận biết chính mình. Nói cách khác, tất cả chúng ta đều là những phần tách ra từ bản thể của Thần, nhằm giúp Thần hiểu về chính bản thân mình. Bạn có để ý rằng trong các truyền thuyết trên khắp thế giới đều nói con người được tạo ra theo hình ảnh của thần. Điều đó không có nghĩa là chúng ta giống thần về hình dạng mà là chúng ta cùng chung một bản chất. Chúng ta đều có cùng một nguồn gốc và điểm trở về. Đồng thời hướng đến cùng một mục tiêu. Vì vậy, nhiệm vụ cuộc đời chính là qua từng trải nghiệm mà nhận biết chính bản thân mình. Việc nhận biết bản thân cũng chính là giúp thần hiểu về chính ngài."
      },
      {
        "id": "p1-s4-7-p3",
        "en": "This comprises the foundational content of the first volume of Conversations with God. The further you listen, the more mind-bending it might seem, right?",
        "vi": "Đây chính là phần nội dung đầu tiên trong cuốn sách Đối thoại với thần. Càng nghe càng có chút khó hiểu rồi phải không?"
      }
    ]
  },
  {
    "id": "p1-s5",
    "partId": "part-1",
    "partNumber": "PART I",
    "partTitleEn": "PART I: THE STRANGE CONVERSATION BETWEEN NEIL AND GOD",
    "partTitleVi": "PHẦN I: CUỘC ĐỐI THOẠI KỲ LẠ GIỮA NEIL VÀ CHÚA",
    "sectionNumber": "1.5",
    "titleEn": "5. Broad Perspective: Author Neale Donald Walsch & the New Age Movement",
    "titleVi": "5. Góc Nhìn Tổng Quan: Tác Giả Neale Donald Walsch & Phong Trào Thời Đại Mới (New Age)",
    "paragraphs": [
      {
        "id": "p1-s5-p1",
        "en": "Having listened this far, do you view this book as the tale of a broken man, or as a treasury of wisdom and truth worth deep contemplation?",
        "vi": "Khi bạn xem đến đây, bạn nghĩ cuốn sách này là một câu chuyện của người đàn ông thất bại hay là một kho tàng trí tuệ và chân lý đáng để ngẫm ngẫm?"
      },
      {
        "id": "p1-s5-p2",
        "en": "Conversations with God sparked a global sensation. Some regarded it as a modern religion, while many others felt it was the very beacon that rescued them from spiritual dead ends.",
        "vi": "Đối thoại với thần đã tạo nên cơn sốt trên toàn thế giới. Có người xem nó như một tôn giáo hiện đại, nhưng cũng có nhiều người cảm nhận đây chính là thứ đã cứu rỗi họ khỏi những cơn bế tắc trong tâm hồn."
      },
      {
        "id": "p1-s5-p3",
        "en": "Conversations with God spans three primary volumes, supplemented by companion titles such as Friendship with God and Communion with God, forming a broader five-book series. The author, Neale Donald Walsch, was born in 1943. Beyond the personal upheavals introduced at the beginning, Neale lived a relatively modest background. Following the book's success, he lectured around the world, remaining energetic well past the age of 80. At times, his reach has led some to draw parallels with figures like David Icke, known for theories on social manipulation and the new world order.",
        "vi": "Đối thoại với thần gồm tổng cộng ba tập. Ngoài ra còn có bộ sách Làm bạn với thần và Hòa làm một với thần tạo thành chuỗi năm cuốn sách. Tác giả là Neale Donald Walsch sinh năm 1943. Ngoài những thăng trầm trong cuộc đời mà mình đã giới thiệu từ đầu, Neale hầu như không có nhiều câu chuyện khác. Sau khi hoàn thành cuốn sách, ông bắt đầu đi diễn thuyết khắp thế giới và hiện nay đã ngoài 80 tuổi nhưng vẫn khỏe mạnh. Neale cũng từng khiến nhiều người liên tưởng đến David Icke với những thuyết âm mưu về chương trình thanh lọc nhân loại và trật tự thế giới mới."
      },
      {
        "id": "p1-s5-p4",
        "en": "Many figures create or cling to an idiosyncratic worldview, vigorously expanding it and traveling everywhere to preach for fame and fortune. But after examining this first part, you may realize that Neale never invented a brand-new deity, nor did he declare himself God's exclusive prophet. He simply presented his perspective and understanding of the universe through a sequence of questions and answers.",
        "vi": "Nhiều người tự sáng tạo hoặc giữ một quan điểm riêng rồi cố gắng mở rộng và phát triển nó một cách mạnh mẽ, đi khắp nơi thuyết giảng, kiếm danh tiếng và tiền bạc. Nhưng sau khi xem xong phần đầu tiên, có thể bạn cũng nhận ra Neale không hề bịa đặt ra một vị thần mới, cũng không tự nhận mình là đại diện của thần. Ông chỉ đơn giản trình bày quan điểm và hiểu biết của mình về thế giới thông qua những câu hỏi và câu trả lời."
      },
      {
        "id": "p1-s5-p5",
        "en": "In truth, the worldview in this book easily brings to mind the New Age movement—a decentralized spiritual philosophy popular across the West. Proponents believe in spirit, affirming that human intention can co-create reality, that all matter possesses spirit, and that humans carry an innate divine spark. You could also view the New Age movement as a cultural phenomenon encouraging people to apply the Law of Attraction in daily life. While it lacks a rigid dogma, it broadly invites you to respect mainstream, traditional values while internalizing them into your own personal conviction. Put plainly, it utilizes spiritual terminology for self-empowerment.",
        "vi": "Thực ra tư tưởng trong cuốn sách này dễ làm người ta liên tưởng đến phong trào thế giới mới hay còn gọi là phong trào thời đại mới. Một tôn giáo phi tập trung phổ biến ở phương Tây. Họ tin vào thuyết thần linh, cho rằng niềm tin của con người có thể tạo ra thực tại, rằng mọi vật đều có linh hồn và con người cũng mang trong mình bản tính thần thánh. Bạn cũng có thể xem phong trào Thời đại mới như một hiện tượng xã hội khuyến khích mọi người áp dụng luật hấp dẫn trong cuộc sống. Phong trào này không có một định nghĩa chính thức, nhưng nhìn chung thì họ chỉ cần bạn tôn trọng và hòa nhập với các giá trị truyền thống và chủ lưu của xã hội. Khi bạn nội hóa những điều đó thành niềm tin của riêng mình, thì đó chính là tinh thần của phong trào Thời đại mới. Nói thẳng ra thì đây là cách dùng thuyết thần linh để tự củng cố bản thân."
      },
      {
        "id": "p1-s5-p6",

      {
        "id": "p2-s7-p6",
        "en": "\"He has recently passed away. I received a private letter from him shortly before his death, the contents of which I have never disclosed to a single living soul. Can you enter the spirit world and ask him what was written in that final letter?\"",
        "vi": "\"Người đó vừa mới qua đời. Tôi vừa nhận được một bức thư từ ông ấy trước khi mất. Bức thư này tôi chưa từng công bố với ai. Liệu ông có thể vào thế giới linh hồn và hỏi ông ấy về nội dung của di thư không?\""
      },
      {
        "id": "p2-s7-p7",
        "en": "Without a flicker of hesitation, Swedenborg picked up a pen and wrote down the contents of the letter. When the Queen read what he had written, she turned pale and was overcome with astonishment—for Swedenborg’s text mirrored the secret letter in her hands verbatim.",
        "vi": "Swedenborg không hề thay đổi sắc mặt. Ông cầm bút và viết ra nội dung của bức thư. Khi Nữ hoàng nhìn thấy nội dung, bà đã tái mặt và vô cùng kinh ngạc, vì những gì Swedenborg viết chính xác là nội dung của bức thư mà bà đang giữ trong tay."
      },
      {
        "id": "p2-s7-p8",
        "en": "Not a single word was misplaced. Swedenborg explained on the spot that he utilized a technique to detach his consciousness from his physical body to enter the abode of angels and departed spirits, which he termed the Spirit World.",
        "vi": "Không sai một chữ. Ngay tại chỗ, Swedenborg nói rằng, ông có thể sử dụng một phương pháp để tách linh hồn ra khỏi cơ thể và đến nơi cư trú của các thiên thần và linh hồn, nơi mà ông gọi là thế giới linh hồn."
      },
      {
        "id": "p2-s7-p9",
        "en": "He had received this calling during a vision where Jesus appeared, asking: \"Have you prepared yourself for your mission?\" From that time onward, he was able to detach from the physical senses and converse with the angelic hosts.",
        "vi": "Khả năng này ông đã được ban cho trong một giấc mơ, khi Chúa Jesus hỏi ông: \"Con đã chuẩn bị sẵn sàng cho sứ mệnh của mình chưa?\" Sau đó, ông có thể tự do rời khỏi cơ thể và giao tiếp với các thiên thần."
      }
    ]
  },
  {
    "id": "p2-s8",
    "partId": "part-2",
    "partNumber": "PART II",
    "partTitleEn": "PART II: THE SPIRITUAL WORLD – EMANUEL SWEDENBORG: THE SCIENTIST WHO TRAVERSED THE REALMS",
    "partTitleVi": "PHẦN II: THẾ GIỚI TÂM LINH – EMANUEL SWEDENBORG: NHÀ KHOA HỌC DU HÀNH QUA CÁC TẦNG GIỚI",
    "sectionNumber": "2.8",
    "titleEn": "8. The Holy Scriptures: A Living Organism and Cosmic Code",
    "titleVi": "8. Kinh Thánh – Sinh Thể Sống Và Mật Mã Vũ Trụ",
    "paragraphs": [
      {
        "id": "p2-s8-p1",
        "en": "Through his communication with angels, Swedenborg held that God's existence is absolute. He wrote that the Bible is essentially a cosmic code—a living organism rather than a dead text. Every word and passage holds correspondences that must be read through an awakened spiritual lens to grasp its inner mysteries.",
        "vi": "Vì có thể giao tiếp với các thiên thần, Swedenborg tin rằng Thiên Chúa là có thật. Ông nói rằng, Kinh Thánh thực ra chính là một mã số vũ trụ, vì Kinh Thánh là một sinh thể sống, không phải là một văn bản chết. Mỗi chữ, mỗi đoạn trong Kinh Thánh đều là một mật mã cần phải được đọc bằng ánh mắt có linh hồn, để thật sự hiểu được những bí ẩn trong đó."
      },
      {
        "id": "p2-s8-p2",
        "en": "For example, in chapter six of the Gospel of John, Christ says: \"The words that I speak unto you, they are spirit, and they are life.\"",
        "vi": "Ví dụ, trong chương sáu của Tin Mừng theo Thánh Gioan, Chúa nói với nhân loại rằng: \"Những lời ta nói với các ngươi là linh hồn và là sự sống.\""
      },
      {
        "id": "p2-s8-p3",
        "en": "Or when scripture speaks of Love and Light co-creating heavenly life as eternal life, emphasizing that eternal life is the true inner light of humanity.",
        "vi": "Hay như khi Chúa nói rằng: \"Tình yêu và ánh sáng đã cùng tạo nên cuộc sống trên trời và cuộc sống này chính là sự sống vĩnh cửu.\" Điều này nhấn mạnh rằng, cuộc sống vĩnh cửu chính là ánh sáng của con người."
      },
      {
        "id": "p2-s8-p4",
        "en": "Thus, Swedenborg stated: \"In ancient times, religions were capable of direct communion with God. Over successive eras, however, humankind lost this direct link because textual meanings were corrupted and misunderstood. Angels in the spiritual world affirmed that not a single jot or tittle of the Law shall pass away. If scripture remains intact and is read by an awakened soul, humanity can commune directly with God once more.\"",
        "vi": "Vì vậy, Swedenborg nói rằng: \"Trong thời cổ đại, tôn giáo có thể trực tiếp giao tiếp với Thiên Chúa. Tuy nhiên, trong các thời kỳ sau, tôn giáo đã quên mất cách thức giao tiếp với Thiên Chúa, vì Kinh Thánh đã bị chỉnh sửa và biến dạng. Các thiên thần trong thế giới linh hồn cũng từng nói rằng, một nét, một gạch trong luật pháp cũng không thể bị xóa bỏ. Nếu Kinh Thánh không bị thay đổi và người có linh hồn đọc đúng những gì được ghi trong đó, họ sẽ có thể giao tiếp trực tiếp với Thiên Chúa.\""
      },
      {
        "id": "p2-s8-p5",
        "en": "Swedenborg also wrote: \"God formed humankind from the dust of the earth in His own image. In the sight of God, all physical matter consists of particles, which are metaphorically 'dust.' Humanity was created in God’s image to dispel evil, for the human archetype mirrors the divine form, causing demonic entities to fear humanity.\"",
        "vi": "Swedenborg cũng nói rằng: \"Thiên Chúa đã tạo ra con người từ bụi đất theo hình ảnh của Ngài. Bởi vì trong mắt Thiên Chúa, mọi thứ trên trần gian đều được cấu thành từ các phân tử. Và trong mắt ngài, các phân tử này chính là đất. Việc tạo ra con người theo hình ảnh của Thiên Chúa là để xua đuổi quỷ dữ. Vì hình dạng của con người chính là hình dạng của Thiên Chúa. Và vì vậy, quỷ dữ rất sợ hãi con người.\""
      },
      {
        "id": "p2-s8-p6",
        "en": "He cautioned that humans cannot see angels with physical eyes, but only with the eyes of the spirit. Angels dwell in the spiritual world, whereas the human physical body is composed of physical molecules bound to the material realm. Hence, in this earthly realm, humans only visually encounter their earthly peers.",
        "vi": "Swedenborg cũng cảnh báo rằng con người không thể nhìn thấy các thiên thần bằng mắt thường, chỉ có thể nhìn thấy họ bằng mắt linh hồn. Vì các thiên thần sống trong thế giới linh hồn, trong khi cơ thể vật chất của con người được cấu tạo từ các phân tử và chỉ tồn tại trong thế giới trần tục. Chính vì vậy, con người chỉ có thể nhìn thấy đồng loại, những người có trí tuệ tương đồng."
      }
    ]
  },
  {
    "id": "p2-s9",
    "partId": "part-2",
    "partNumber": "PART II",
    "partTitleEn": "PART II: THE SPIRITUAL WORLD – EMANUEL SWEDENBORG: THE SCIENTIST WHO TRAVERSED THE REALMS",
    "partTitleVi": "PHẦN II: THẾ GIỚI TÂM LINH – EMANUEL SWEDENBORG: NHÀ KHOA HỌC DU HÀNH QUA CÁC TẦNG GIỚI",
    "sectionNumber": "2.9",
    "titleEn": "9. The True Nature of the Last Judgment & The Afterlife",
    "titleVi": "9. Bản Chất Ngày Phán Xét Cuối Cùng & Thế Giới Sau Cái Chết",
    "paragraphs": [
      {
        "id": "p2-s9-p1",
        "en": "Finally, he posed the question: \"Who can guarantee that the Last Judgment will not come to pass?\"",
        "vi": "Cuối cùng, ông đặt ra câu hỏi: \"Ai có thể đảm bảo rằng cuộc phán xét cuối cùng sẽ không xảy ra?\""
      },
      {
        "id": "p2-s9-p2",
        "en": "Yet judgment does not signify the physical incineration of the earth. Popular imagination conceives of the Last Judgment as God descending upon storm clouds to end the physical globe. Swedenborg considered this a misunderstanding. Judgment occurs when external religion becomes hollow while moral corruption increases, necessitating a divine descent to restore spiritual balance.",
        "vi": "Tuy nhiên, phán xét không có nghĩa là sự hủy diệt của thế giới. Mọi người thường nghĩ rằng phán xét là Chúa sẽ ngự trên mây và giáng xuống ngày tận thế. Nhưng hiểu biết này là sai lầm. Vì khi giáo hội đồng lòng, nhân loại vẫn đang sa ngã. Trong giai đoạn này, Đấng Cứu Thế sẽ giáng trần."
      },
      {
        "id": "p2-s9-p3",
        "en": "When Heaven and Hell fall into disequilibrium—with few souls ascending to Heaven while Hell swells with malice—evil overpowers good. That is when the Redeemer initiates judgment in the spiritual realms, separating good from evil, establishing order, and inaugurating a New Heaven. Through the renewal of genuine faith on earth, cosmic balance is restored. This spiritual reordering is the true Last Judgment.",
        "vi": "Khi đó, Thiên Quốc và Địa Ngục bắt đầu mất cân bằng. Số người vào Thiên Quốc ngày càng ít đi, trong khi số người vào Địa Ngục lại ngày càng nhiều. Ác sẽ mạnh hơn thiện. Đây chính là lúc Đấng Cứu Thế thực hiện phán xét, phân biệt thiện và ác, lập lại trật tự và xây dựng một Thiên Quốc mới. Với việc tái thiết niềm tin vào tôn giáo trên trần gian, sự cân bằng này sẽ được khôi phục. Và đây chính là cái gọi là phán xét cuối cùng."
      },
      {
        "id": "p2-s9-p4",
        "en": "Swedenborg continually urged people to refrain from evil deeds, for physical death is not the finish line. The realm beyond physical passing is where genuine life begins. He affirmed that Hell is very real. When you shed your physical vessel, you become your naked soul—your true inner essence. At that moment, you stand revealed as your authentic self.",
        "vi": "Swedenborg còn nhắc nhở mọi người không được làm ác, vì cái chết không phải là điểm kết thúc. Thế giới sau cái chết mới là sự khởi đầu thực sự. Ông cho rằng Địa Ngục là có thật. Khi con người rời bỏ thân xác, họ sẽ trở thành linh hồn, hay còn gọi là nguyên thần. Vào lúc đó, bạn mới là chính mình, là bản thể thật sự của mình."
      },
      {
        "id": "p2-s9-p5",
        "en": "Upon passing, souls transition through three general states:",
        "vi": "Sau khi con người qua đời, sẽ trải qua ba trạng thái:"
      },
      {
        "id": "p2-s9-p6",
        "en": "• The First State: Truly upright and benevolent souls require no coercion; they are drawn directly into Heaven.",
        "vi": "• Trạng thái thứ nhất: Đầu tiên, những người đặc biệt thiện lương sẽ không cần sự chỉ dẫn của Thiên Chúa, mà sẽ trực tiếp được đưa vào Thiên Quốc."
      },
      {
        "id": "p2-s9-p7",
        "en": "• The Second State: Those accustomed to deceit in earthly life continue to deceive and attempt to manipulate the good.",
        "vi": "• Trạng thái thứ hai: Thứ hai, những người trong đời thích nói dối, sau khi chết vẫn tiếp tục lừa dối và lừa gạt những người thiện lương."
      },
      {
        "id": "p2-s9-p8",
        "en": "• The Third State: The persistently malicious plunge directly into Hell. No entity ends up anywhere other than the realm matching its own internal nature.",
        "vi": "• Trạng thái thứ ba: Thứ ba, những kẻ ác sẽ trực tiếp bị đẩy xuống địa ngục. Không có bất kỳ sinh mệnh nào sẽ rơi vào nhóm khác ngoài nhóm của mình."
      },
      {
        "id": "p2-s9-p9",
        "en": "Swedenborg characterized hell as a dim, gloomy place where the sun is absent and the moon is shrouded in dust. Conversely, Heaven is luminous, bathed in radiant moonlight and gentle sunlight.",
        "vi": "Swedenborg mô tả địa ngục là một nơi tăm tối và u ám, nơi không có mặt trời và mặt trăng bị che khuất bởi bụi đất. Ngược lại, Thiên Quốc lại sáng sủa với ánh trăng rực rỡ và ánh nắng ấm áp."
      },
      {
        "id": "p2-s9-p10",
        "en": "Though worldly lore suggests the road to Heaven is narrow while the gate to damnation is broad, Swedenborg observed that entering Heaven is by no means as impossibly difficult as many imagine, provided one lives a life of genuine charity and goodwill.",
        "vi": "Mặc dù đời người thường nói rằng, con đường lên Thiên Quốc là con đường hẹp, còn con đường rộng dẫn đến địa ngục. Nhưng theo Swedenborg, việc vào Thiên Quốc không khó khăn như nhiều người tưởng."
      },
      {
        "id": "p2-s9-p11",
        "en": "All of these insights are recorded in Swedenborg's published volumes. If you are intrigued, you can seek out his writings. Don't forget to subscribe so you don't miss upcoming features from Spiritual Life. We will see you in the next installment!",
        "vi": "Tất cả những nội dung trên đều được ghi lại trong các cuốn sách do Swedenborg xuất bản. Nếu bạn quan tâm, có thể tìm đọc tác phẩm này. Đừng quên đăng ký kênh để không bỏ lỡ những video tiếp theo của Tâm Linh Cuộc Sống nhé. Hẹn gặp lại tất cả mọi người trong video sau."
      }
    ]
  },
  {
    "id": "p3-s1",
    "partId": "part-3",
    "partNumber": "PART III",
    "partTitleEn": "PART III: ELECTRONIC VOICE PHENOMENA (EVP), SCIENTIFIC EVIDENCE & THE CODEX GIGAS MANUSCRIPT",
    "partTitleVi": "PHẦN III: HIỆN TƯỢNG ÂM THANH ĐIỆN TỬ SIÊU NHIÊN (EVP), BẰNG CHỨNG KHOA HỌC & BẢN THẢO CODEX GIGAS",
    "sectionNumber": "3.1",
    "titleEn": "1. Mysterious Audio Phenomena (EVP) & The 21-Gram Soul Experiment",
    "titleVi": "1. Bí Ẩn Âm Thanh Lạ (EVP) & Thí Nghiệm Trọng Lượng Linh Hồn 21 Gram",
    "paragraphs": [
      {
        "id": "p3-s1-p1",
        "en": "Electronic voice phenomena and the truth surrounding the existence of the soul. Is the ancient proverb \"Three feet above our heads dwell the spirits\" really true?",
        "vi": "Âm thanh điện tử siêu nhiên và sự thật về sự có mặt của linh hồn. Trên đầu ba thước có thần linh, có thật hay không?"
      },
      {
        "id": "p3-s1-p2",
        "en": "In a song by Taiwanese female pop singer Jolin Tsai, listeners can detect an eerie scream resembling that of a ghost. If you listen very closely to this track, you will notice a distinct line of singing coming through clearly. Yet according to Jolin Tsai’s management, throughout the entire studio recording session, that line was never sung or recorded. What is even stranger is that this mysterious voice resides on the exact same audio track as her vocals, yet it is undeniably not her voice.",
        "vi": "Trong một bài hát của Thái Y Lâm, một nữ ca sĩ người Đài Loan, người ta lại nghe thấy tiếng hét kỳ lạ giống như tiếng của một hồn ma. Nếu lắng nghe thật kỹ đoạn này, bạn sẽ nhận ra có một câu hát vang lên rất rõ. Thế nhưng theo lời quản lý của Thái Y Lâm, trong suốt quá trình thu âm, hoàn toàn không hề có câu hát đó. Điều kỳ lạ hơn là âm thanh ấy lại nằm cùng trên một đường tiếng với giọng hát của cô. Nhưng rõ ràng đó không phải là giọng của Thái Y Lâm."
      },
      {
        "id": "p3-s1-p3",
        "en": "Where did this chilling voice actually come from? In specialized technical terms, this occurrence is known as EVP—Electronic Voice Phenomena. Do these videos, images, or audio recordings that capture ghostly faces or spectral voices truly exist? Join Spiritual Life as we investigate today’s broadcast.",
        "vi": "Vậy tiếng hát rợn người ấy thực chất đến từ đâu? Thật ra hiện tượng này có một tên gọi chuyên môn là EVP, tức hiện tượng âm thanh điện tử siêu nhiên. Vậy thì những đoạn video, hình ảnh hay bản ghi âm lại được khuôn mặt hay giọng nói ma quái có thật sự tồn tại không? Hãy cùng Tâm Linh Cuộc Sống theo dõi hết video ngày hôm nay."
      },
      {
        "id": "p3-s1-p4",
        "en": "Does the soul actually exist? This question not only haunts our imaginations, but has also driven numerous scientific investigations. You have likely heard of the famous experiment regarding the \"weight of the soul,\" in which it was claimed that a soul weighs approximately 21 grams.",
        "vi": "Linh hồn có thật sự tồn tại không? Đây không chỉ là câu hỏi khiến chúng ta trăn trở, mà còn là chủ đề được nhiều nhà khoa học nỗ lực nghiên cứu. Chắc hẳn bạn từng nghe đến thí nghiệm nổi tiếng mang tên trọng lượng của linh hồn. Trong đó người ta cho rằng linh hồn nặng khoảng 21 g."
      },
      {
        "id": "p3-s1-p5",
        "en": "This experiment began in 1907 and was published in an American medical journal. According to the original account, a physician-researcher named Duncan recruited six terminally ill volunteer patients. During the study, they were placed on specially designed beds equipped with highly sensitive scales.",
        "vi": "Thí nghiệm này bắt đầu vào năm 1907 và được công bố trên một tạp chí y học của Mỹ. Theo mô tả trong bài báo gốc, một nhà nghiên cứu tên là Duncan đã mời sáu tình nguyện viên mắc bệnh nan y tham gia. Trong quá trình thí nghiệm, họ được đặt nằm trên những chiếc giường có gắn cân cực kỳ nhạy."
      },
      {
        "id": "p3-s1-p6",
        "en": "Due to metabolic processes, respiration, and perspiration, their body weight steadily declined prior to death at an average rate of roughly 28 grams per hour. One volunteer, after four continuous hours of weight loss at this rate, drew his final breath. Just seconds after he expired, his weight suddenly dropped by 21.26 grams.",
        "vi": "Do rối loạn trao đổi chất cùng các yếu tố như hô hấp và tiết mồ hôi, cân nặng của họ liên tục giảm trước khi qua đời với tốc độ trung bình khoảng 28 g mỗi giờ. Một trong những tình nguyện viên, sau 4 tiếng đồng hồ liên tục giảm cân với tốc độ như vậy đã qua đời. Nhưng chỉ vài giây sau khi ông trút hơi thở cuối cùng, cân nặng của ông bỗng giảm đột ngột 21,26 g."
      },
      {
        "id": "p3-s1-p7",
        "en": "Duncan immediately ruled out physical factors such as bodily evacuations or environmental disturbances, determining that this loss of roughly 21 grams lacked any obvious physiological explanation. Earlier scientific hypotheses had posited that if humans truly possess a soul and if that soul is composed of some unknown subtle matter, it must hold measurable mass. Based on that hypothesis, Duncan concluded that the 21 grams vanishing at the moment of death represented the weight of the soul.",
        "vi": "Duncan ngay lập tức loại trừ mọi khả năng như bài tiết hay là các yếu tố bên ngoài và phát hiện ra rằng sự mất đi 21 g này hoàn toàn không có nguyên nhân rõ ràng. Trước đó giới khoa học từng đưa ra giả thuyết rằng nếu con người thật sự có linh hồn và linh hồn được cấu thành từ một dạng vật chất chưa biết thì nó chắc chắn phải có trọng lượng nhất định. Dựa trên giả thuyết đó, Duncan tin rằng 21 g biến mất sau khi tình nguyện viên qua đời chính là trọng lượng của linh hồn."
      },
      {
        "id": "p3-s1-p8",

      },

        "id": "p3-s3-p5",
        "en": "Returning to the American psychologist: following the highway crash, he and his research team initiated extensive investigations into parapsychology—the formal study of psychic phenomena and the soul.",

        "vi": "Sau này, nhà tâm lý học này đã gặp một nữ linh môi tên là Dubois và từ đó ông thiết kế một chuỗi thí nghiệm khoa học nghiêm ngặt nhằm chứng minh khả năng của Dubois cũng như tính thực sự của linh hồn. Đây chính là thí nghiệm gọi hồn.\n\nBan đầu, ông tuyển dụng rất nhiều tình nguyện viên và đưa từng người vào phòng thí nghiệm. Trong khi nữ linh môi Dubois ở một phòng khác, trước khi thí nghiệm bắt đầu, Dubois được phép đặt các câu hỏi liên quan đến người đã mất, còn tình nguyện viên chỉ được trả lời có hoặc không. Trong suốt quá trình thí nghiệm thì tình nguyện viên không được phát ra bất kỳ âm thanh nào. Còn Du Bois phải cố gắng gọi linh hồn của người đã khuất xuất hiện. Du Bois sẽ tiếp nhận thông tin từ người đã mất thông qua tình nguyện viên và mô tả lại các đặc điểm về ngoại hình, hành vi cũng như những điều mà người quá cố muốn được truyền đạt. Tình nguyện viên sẽ đánh giá độ chính xác của những thông tin này."

    "paragraphs": [
      {
        "id": "p3-s4-p1",
        "en": "Returning to anomalous occurrences mentioned earlier, an odd glitch appeared in the music video \"Chẳng Xin\" by the Vietnamese boyband Monstar. In the second-floor background of the shoot location, a window that stood open abruptly slammed shut around the 1-minute-22-second mark, despite no crew or actors being in that room. The filming location had previously served as a French colonial prison and had stood abandoned for years.",

      },
      {
        "id": "p3-s4-p3",
        "en": "Beyond ghost photos online, stories of bizarre phone activity persist. One well-circulated account tells of a family receiving a brief phone call from a relative aboard an airliner after it went missing. The line emitted only weak static without words. Later, authorities confirmed the aircraft had crashed with no survivors. When the family checked the timestamp, the call had been initiated after the moment of impact. How could a phone place a call after an aircraft was destroyed?",
        "vi": "Ngoài những bức ảnh ma quái tràn lan trên mạng, thật giả lẫn lộn mà Tâm Linh Cuộc Sống nhắc đến ở số phát sóng trước đó, còn có nhiều câu chuyện còn kỳ lạ hơn. Trên mạng xã hội từng kể về một gia đình nhận được một cuộc gọi từ người thân sau một vụ tai nạn hàng không. Gia đình rất ngạc nhiên, bởi vì theo lý thuyết thì người này lẽ ra vẫn ở trên máy bay, không thể gọi điện được. Khi nghe điện thoại, đầu dây bên kia chỉ có tiếng điện yếu ớt, không ai nói gì. Sau đó, gia đình nhận thông báo vụ tai nạn, tất cả hành khách đã tử nạn ngay khi máy bay rơi. Nhưng gia đình bỗng nhận ra, khi kiểm tra thời gian cuộc gọi, thì nó được thực hiện sau khi vụ tai nạn xảy ra. Vậy làm sao người đã mất có thể gọi được điện thoại khi máy bay đã rơi?"
      },
      {
        "id": "p3-s4-p4",
        "en": "Some speculate that technical recording apparatuses detect frequencies beyond normal biological sensory limits. Even Nikola Tesla, the father of alternating current, explored the concept of spirit communication devices late in life and remained fascinated by anomalous electronic signals.",
        "vi": "Nhiều người cho rằng cấu tạo của máy bay, camera, hay là các thiết bị điện tử khác khác với giác quan con người, nên chúng có thể ghi lại nhiều thứ mà con người không cảm nhận được. Nikola Tesla, cha đẻ của dòng điện xoay chiều, khi về già cũng đã từng nghiên cứu về điện thoại gọi từ xa. Và ông cũng là một người rất ủng hộ tin tưởng EVP là có thật."
      },
      {
        "id": "p3-s4-p5",
        "en": "There is also the peculiar tale of a young woman who spontaneously dialed her own mobile number. After a few rings, someone picked up and a voice greeted: \"Hello?\" Frightened, she slammed the phone down. Several years later, exhausted after work, she was awakened past midnight by an incoming call. She groggily muttered \"Hello?\", only for the caller to hang up abruptly. Instantly, she recalled the strange call from years before and lay awake all night—feeling as though a bullet fired from the distant past had traversed the years to strike her in the present. Could anomalous temporal communication also fall within the realm of transpersonal phenomena?",
        "vi": "Còn có chuyện một cô gái bỗng dưng quyết định gọi điện cho chính mình. Không ngờ, cuộc gọi chỉ reo vài tiếng đã được bắt máy. Và đầu dây bên kia vang lên một câu, \"Alo, xin chào.\" Khiến cô gái sợ hãi và vội vàng cúp máy. Vài năm sau, cô gái thức giấc vì một cuộc điện thoại lúc nửa đêm, khi đang say giấc sau một ngày làm việc mệt mỏi. Cô uể oải alo, thì đầu dây bên kia đột ngột ngắt máy. Khoảnh khắc ấy, cô giật mình nhớ lại chính cuộc điện thoại của mình nhiều năm về trước và hoàn toàn mất ngủ. Cảm giác như một viên đạn đã bay đi từ quá khứ xa xôi, giờ đây, sau chặng đường dài đã tìm đến và ghim trúng chính mình ở hiện tại. Câu chuyện này là thật. Liệu việc giao tiếp với chính mình trong tương lai có được xem là một trải nghiệm tâm linh hay không?"
      },
      {
        "id": "p3-s4-p6",
        "en": "When examining near-death experiences and reincarnation, we constantly circle back to the question of whether the soul survives bodily dissolution. These occurrences may simply be expressions of out-of-body projections.",
        "vi": "Chúng ta từng khám phá rất nhiều về những trải nghiệm cận tử và luân hồi chuyển kiếp, để rồi quay lại câu hỏi, liệu linh hồn có thực sự tồn tại? Tất cả những trải nghiệm đó, rất có thể chỉ là một hình thức của xuất hồn, hay còn gọi là chiếu ảnh tinh thần."
      },
      {
        "id": "p3-s4-p7",
        "en": "The American singer-songwriter Pam Reynolds underwent a well-documented case in 1991 during high-risk brain aneurysm surgery. Her eyes were taped shut, and molded clicker earplugs were inserted into both ears, emitting rapid 100-decibel pulses hundreds of times per minute to monitor brainstem responses. Her body temperature was lowered to induce hypothermic cardiac arrest, draining the blood from her head until all brainwave activity flatlined.",
        "vi": "Ca sĩ kiêm nhạc sĩ người Mỹ Pam, vào năm 1991, đã từng trải qua điều này trong một ca phẫu thuật phình động mạch não đầy nguy hiểm. Trong ca phẫu thuật nguy hiểm này, Pam bị bịt mắt và tai thì bị nhét chặt bằng nút chống ồn liên tục phát ra âm thanh cạch cạch rất lớn hàng trăm lần mỗi giây. Có lúc cô không còn sóng điện não, máu ngừng lưu thông lên não dẫn đến tình trạng chết lâm sàng."
      },
      {
        "id": "p3-s4-p8",
        "en": "Yet when Pam was revived, she recounted feeling pulled out through the crown of her head following a deep humming tone. She hovered above the operating table, astonished, observing the surgical team. She distinctly saw the neurosurgeon holding a tool resembling an electric toothbrush (a pneumatic bone saw) and accurately recalled conversations between the surgeons and nurses.",
        "vi": "Thế nhưng khi mà Pam hồi tưởng lại, cô nghe thấy dường như có một tiếng ù trầm vang rồi cảm thấy linh hồn mình bị kéo ra khỏi thân xác. Cô lơ lửng trên không trung trong sự kinh ngạc và hoảng sợ, không hiểu chuyện gì đang xảy ra. Cô thấy rõ các bác sĩ đang cầm một dụng cụ giống hệt cái bàn chải đánh răng điện. Không chỉ vậy, cô còn nghe rõ mồn một từng lời các y tá và bác sĩ trao đổi. Những chi tiết sau này được xác nhận là gần như hoàn toàn chính xác."
      },
      {
        "id": "p3-s4-p9",
        "en": "Given the dense earplugs emitting loud clicks, Pam could not have heard physical room chatter by ordinary auditory means. As she hovered, she experienced a profound sense of peace and had no desire to return to her body. Suddenly, she felt drawn into a realm of light where deceased relatives, including her grandmother and uncle, greeted her and insisted she return. Her uncle guided her back, and she described re-entering her body as akin to plunging into an icy pool of water.",
        "vi": "Điều khó hiểu là theo lẽ thường, với tiếng ồn át tai từ nút bịt tai Pam hoàn toàn không thể nghe được bất kỳ âm thanh nào khác trong phòng mổ. Càng lơ lửng, Pam càng cảm thấy yêu thích trạng thái này và hoàn toàn không muốn trở về cơ thể mình nữa. Nhưng chính ngay lúc đó, cô bị kéo mạnh vào một vùng ánh sáng nơi cô nhìn thấy những người thân đã qua đời như bà và chú của mình. Họ cùng nhau nhắc nhở cô phải quay trở lại. Cuối cùng, chú của Pam đã dùng lực đẩy cô trở về thân xác. Một cảm giác kinh hoàng như thể vừa nhảy vào một chậu nước đá buốt giá."
      }
    ]

  {
    "id": "p3-s5",
    "partId": "part-3",
    "partNumber": "PART III",
    "partTitleEn": "PART III: ELECTRONIC VOICE PHENOMENA (EVP), SCIENTIFIC EVIDENCE & THE CODEX GIGAS MANUSCRIPT",
    "partTitleVi": "PHẦN III: HIỆN TƯỢNG ÂM THANH ĐIỆN TỬ SIÊU NHIÊN (EVP), BẰNG CHỨNG KHOA HỌC & BẢN THẢO CODEX GIGAS",
    "sectionNumber": "3.5",
    "titleEn": "5. Meditation, Astral Projection & The Nature of the Soul",
    "titleVi": "5. Thiền Định, Chiếu Ảnh Tinh Thần Và Bản Chất Của Linh Hồn",
    "paragraphs": [
      {
        "id": "p3-s5-p1",
        "en": "Many traditions warn practitioners to proceed cautiously during deep meditation, cautioning that advanced states can induce spontaneous out-of-body projection. Neuroscientific studies suggest that out-of-body sensations can be triggered under specific neurological conditions. Skilled meditators in deep absorption show an ability to voluntarily modulate these altered states.",
        "vi": "Có lẽ nhiều người từng nghe cảnh báo khi luyện tập thiền định phải hết sức thận trọng. Bởi chỉ cần một chút sơ sẩy, linh hồn có thể xuất ra khỏi xác. Đây không phải là lời đồn thổi vô căn cứ. Các nghiên cứu hiện tại đã chỉ ra rằng hiện tượng chiếu ảnh tinh thần có thể được chủ động kiểm soát. Nhiều thiền sư khi nhập định sâu có tỷ lệ nhất định tự kích hoạt được hiện tượng này."
      },
      {
        "id": "p3-s5-p2",
        "en": "Mainstream neurological consensus tends to interpret these episodes as temporary disruptions in multisensory integration—specifically within the temporoparietal junction of the brain. Hallucinogenic compounds are also known to induce similar out-of-body sensations.",
        "vi": "Tuy nhiên thì phần lớn các quan điểm khoa học hiện nay vẫn nghiêng về lý thuyết đây là một dạng rối loạn nhận thức trong não bộ. Các thử nghiệm cũng chứng minh một số loại thuốc gây ảo giác cũng có khả năng cao dẫn đến trạng thái xuất hồn tương tự."
      },
      {
        "id": "p3-s5-p3",
        "en": "Conversely, spiritual researchers argue that these experiences serve as subjective evidence of a distinct soul. They propose that consciousness can separate from the biological frame and safely return, suggesting that pharmacological triggers might open access to perceptual dimensions that current instruments cannot yet quantify.",
        "vi": "Cũng có một luồng ý kiến mạnh mẽ cho rằng những trải nghiệm này chính là những bằng chứng xác thực về sự tồn tại của linh hồn. Họ tin rằng một số người có khả năng kiểm soát linh hồn mạnh mẽ có thể chủ động xuất hồn và quay trở về. Thậm chí những gì được cho là ảo giác do tác động của thuốc có thể không phải là ảo giác mà chỉ là những hiện thực mà khoa học chưa thể lý giải."
      },
      {
        "id": "p3-s5-p4",
        "en": "The question of the soul’s reality remains an open frontier. Contemporary science cannot definitively prove or disprove its existence; we must each reflect on the evidence for ourselves.",
        "vi": "Tóm lại thì câu hỏi về sự tồn tại của linh hồn vẫn là một chủ đề rất bất tận. Chín người mười ý và không thể nào dùng khoa học hiện tại để chứng minh hay là phủ định. Chúng ta chỉ có thể tự mình suy ngẫm."
      },
      {
        "id": "p3-s5-p5",
        "en": "Nevertheless, harboring hope regarding spiritual continuity is natural. Deep within, humans yearn for an immortal essence, absolute cosmic justice, and the principle that good deeds meet good rewards while evil meets retribution. If the soul is real, unresolved matters in this life may find balance in the next. This perspective provides people with the inner equilibrium and resilience needed to face an impermanent world.",
        "vi": "Nhưng mà dù sao đi nữa, việc chúng ta nuôi dưỡng một niềm hy vọng tốt đẹp về thế giới tâm linh là điều hoàn toàn tự nhiên. Có lẽ sâu thẳm bên trong con người luôn khao khát một linh hồn bất diệt, khao khát một sự công bằng tuyệt đối, mong đợi cái gọi là trên đầu ba thước có thần linh, hy vọng thiện có thiện báo, ác có ác báo. Nếu linh hồn là có thật, chắc chắn những gì chưa được giải quyết ở kiếp này sẽ được hoàn tất ở kiếp sau. Đây có thể là cách duy nhất để chúng ta gìn giữ trật tự nội tâm và kéo dài ý chí tinh thần của mình khi phải đối diện với một thế giới đầy rẫy sự vô thường."
      },
      {
        "id": "p3-s5-p6",
        "en": "What are your thoughts on the existence of the soul? Be sure to share your insights in the comments below for the Spiritual Life community.",
        "vi": "Bạn suy nghĩ gì về việc có linh hồn hay không? Đừng quên bình luận bên dưới cho Tâm Linh Cuộc Sống được biết nhé."
      }
    ]
