  {
    "id": "p3-s6",
    "partId": "part-3",
    "partNumber": "PART III",
    "partTitleEn": "PART III: ELECTRONIC VOICE PHENOMENA (EVP), SCIENTIFIC EVIDENCE & THE CODEX GIGAS MANUSCRIPT",
    "partTitleVi": "PHẦN III: HIỆN TƯỢNG ÂM THANH ĐIỆN TỬ SIÊU NHIÊN (EVP), BẰNG CHỨNG KHOA HỌC & BẢN THẢO CODEX GIGAS",
    "sectionNumber": "3.6",
    "titleEn": "6. The Legend of the Demonic Pact & The Colossal Manuscript \"Codex Gigas\"",
    "titleVi": "6. Huyền Thoại Giao Kèo Với Quỷ Dữ Và Bản Thảo Khổng Lồ \"Codex Gigas\"",
    "paragraphs": [
      {
        "id": "p3-s6-p1",
        "en": "Spiritual Life has previously explored historical legends surrounding pacts with the devil—tales where figures purportedly traded their souls for supreme intellect, supernatural skill, or virtuoso artistry.",
        "vi": "Tâm Linh Cuộc Sống đã từng có video nhắc đến giao kèo với quỷ. Có nghĩa là những người nổi tiếng hay thiên tài bậc nhất thế giới đã lựa chọn bán linh hồn mình cho quỷ để có được năng lực đặc biệt, trí tuệ hoặc tài năng khiến ai ai cũng phải ngưỡng mộ."
      },
      {
        "id": "p3-s6-p2",
        "en": "Goethe’s masterpiece Faust was inspired by historical European legends of individuals trading their eternal souls for worldly power.",
        "vi": "Trước nhà văn Goethe với kiệt tác Faust được cho là dựa trên một sự kiện có thật xảy ra tại châu Âu thời trung cổ. Nhân vật chính vì ham muốn mà sẵn sàng ký khế ước với quỷ, đánh đổi cả linh hồn."
      },
      {
        "id": "p3-s6-p3",
        "en": "Yet centuries earlier, a different legend emerged in medieval Europe involving a demonic pact. Strangely, in this lore, the devil acted cooperatively: not only saving a man’s life, but helping him complete an enormous illuminated manuscript in a single night.",
        "vi": "Ít ai biết rằng vài thế kỷ trước đã từng có một người khác cũng từng giao kèo với quỷ. Và điều kỳ lạ là con quỷ ấy lại vô cùng tốt bụng. Nó không chỉ cứu mạng người đàn ông kia mà còn giúp ông ta hoàn thành một bản thảo khổng lồ chỉ trong một đêm."
      },
      {
        "id": "p3-s6-p4",
        "en": "That volume, weighing as much as a grown adult, is the Codex Gigas—the largest surviving medieval manuscript in existence, widely dubbed The Devil's Bible.",
        "vi": "Cuốn sách ấy nặng tương đương với một người trưởng thành, chính là Codex Gigas, bản thảo thời trung cổ lớn và nặng nhất thế giới còn tồn tại đến ngày nay. Còn được gọi là Kinh Thánh của quỷ."
      },
      {
        "id": "p3-s6-p5",
        "en": "What astounds codicologists is the uncanny consistency of the handwriting and parchment wear. Paleographers conclude that the massive text was written by a single scribe over an exceptionally concentrated period. Given the monumental scale of the manuscript, completing it in a single night is physically impossible. Scribes typically required 20 to 30 years to handwrite a work of this volume. Consequently, folklore insisted the scribe was possessed by the devil, spawning an aura of dark mystery around the tome.",
        "vi": "Điều khiến người ta rùng mình là từ nét chữ nhất quán đến độ hao mòn của các trang giấy, nhiều chuyên gia đều đi đến cùng một nhận định, cuốn sách này gần như chắc chắn được viết bởi một người trong một khoảng thời gian cực kỳ ngắn. Với khối lượng bản thảo khổng lồ đó, làm thế nào chỉ trong một đêm có thể hoàn thành được? Điều này rõ ràng vượt quá giới hạn của con người. Các chuyên gia tính toán rằng để một người tự mình chép tay toàn bộ số sách này ít nhất phải mất từ 20 đến 30 năm. Chính vì vậy, ngày càng có nhiều người tin rằng tác giả đã bị quỷ nhập trong quá trình viết sách. Cùng với đó là hàng loạt lời đồn kỳ bí được thêu dệt xoay quanh cuốn sách này."
      },
      {
        "id": "p3-s6-p6",
        "en": "The story traces back to the 13th century at a Benedictine monastery in Podlažice, east of Prague. A monk named Herman committed a grave breach of monastic vows and was sentenced to be immured—walled up alive. In medieval penal practice, immurement meant being sealed within a windowless stone cell to perish slowly from thirst, starvation, or madness.",
        "vi": "Câu chuyện bắt đầu vào thế kỷ 13 tại một tu viện dòng Benedictine nằm ở phía đông Prague. Một tu sĩ tên là Herman đã vi phạm nghiêm trọng quy định của tu viện và bị kết án bằng hình phạt khủng khiếp chính là chôn sống. Nhưng điều đáng sợ hơn là hình phạt chôn sống ở đây không đơn giản như bạn tưởng. Thay vì bị chôn dưới đất, người phạm tội sẽ bị nhốt sống trong một căn phòng kín xây bằng gạch đá, hoàn toàn không có lối ra. Bị nhốt trong đó, họ sẽ chết dần vì đói khát hoặc phát điên trước khi chết."
      },
      {
        "id": "p3-s6-p7",
        "en": "Terrified of this gruesome fate, Herman pleaded for mercy. The abbots eventually offered a bargain: if he could compose a magnificent manuscript containing all worldly and spiritual knowledge that would bring eternal glory to the monastery, his execution would be remitted. But there was an impossible catch: he had to finish it in a single night.",
        "vi": "Để tránh số phận kinh hoàng ấy, Herman đã bắt đầu van xin các tu sĩ thi hành án. Cuối cùng, họ đưa ra một thỏa thuận. Nếu Herman có thể viết ra một cuốn sách vĩ đại nhất từ trước đến nay thì hình phạt sẽ được xóa bỏ. Nhưng điều kiện là anh phải hoàn thành nó chỉ trong một đêm."
      },
      {
        "id": "p3-s6-p8",
        "en": "Left with no alternative, Herman accepted. As midnight approached, it became obvious that the task was impossible; merely preparing the hundreds of animal hides for parchment could not be accomplished in hours, let alone illuminating thousands of pages.",
        "vi": "Herman không còn sự lựa chọn nào khác ngoài việc đồng ý. Nửa đêm nhanh chóng ập đến, ai cũng đoán trước được Herman hoàn toàn không thể nào hoàn thành được nhiệm vụ bất khả thi này. Đừng nói đến việc viết, chỉ riêng việc chuẩn bị da dê làm giấy cũng đã không thể hoàn tất trong thời gian ngắn như vậy."
      },
      {
        "id": "p3-s6-p9",
        "en": "At the brink of despair, Herman committed the ultimate taboo: he summoned the devil. He offered his soul in exchange for completing the book before dawn.",
        "vi": "Đến thời khắc sinh tử, trong tuyệt vọng, tu sĩ Herman đã làm điều cấm kỵ, chính là cầu cứu quỷ dữ. Giống như những trường hợp bán linh hồn khác mà Tâm Linh Cuộc Sống từng kể, Herman nguyện đánh đổi linh hồn của mình để đổi lấy một điều, hoàn thành cuốn sách trong một đêm."
      },
      {
        "id": "p3-s6-p10",
        "en": "The devil accepted, seized the quill, and finished the colossal volume overnight. As part of the pact, Herman added a full-page illumination of Satan within the text. Thus the manuscript earned its moniker: The Devil's Bible.",
        "vi": "Quỷ dữ đồng ý ngay lập tức. Nó tự mình cầm bút, hoàn thành bản thảo vĩ đại này chỉ trong một đêm duy nhất. Và như một phần của giao kèo, Herman đã phải vẽ hình quỷ Satan ngay trong sách. Cuốn sách này sau đó được gọi là Kinh Thánh của quỷ."
      },
      {
        "id": "p3-s6-p11",
        "en": "Today, demonic pacts sound like sheer fiction, but in European folklore, crossroads bargains were widely whispered. The legendary Mississippi Delta bluesman Robert Johnson was rumored to have sold his soul at a midnight crossroads to acquire superhuman guitar prowess. Italian violin virtuoso Niccolò Paganini was similarly suspected of unnatural pacts, with spectators swearing they saw dark shadows hovering over his bow during electrifying performances.",
        "vi": "Ngày nay, việc giao kèo với quỷ nghe có vẻ hoang đường và khó tin, nhưng trong quá khứ, đặc biệt là ở châu Âu và Mỹ, những câu chuyện giao kèo với quỷ như vậy lại không hề hiếm gặp.\n\nNgười ta đồn rằng nhạc sĩ Mỹ Robert Johnson huyền thoại của dòng nhạc Blues, trước khi trở thành tay guitar vĩ đại nhất lịch sử, từng bán linh hồn cho quỷ tại một ngã tư. Từ đó, anh đột nhiên có được kỹ năng chơi guitar điêu luyện đến mức siêu phàm.\n\nKhông chỉ vậy, thiên tài violin người Ý Niccolo Paganini cũng đã bị nghi là từng giao kèo với quỷ. Một số khán giả thậm chí còn quả quyết rằng họ thấy bóng dáng quỷ dữ xuất hiện ngay bên cạnh anh khi đang biểu diễn."
      }
    ]
  },
  {
    "id": "p3-s7",
    "partId": "part-3",
    "partNumber": "PART III",
    "partTitleEn": "PART III: ELECTRONIC VOICE PHENOMENA (EVP), SCIENTIFIC EVIDENCE & THE CODEX GIGAS MANUSCRIPT",
    "partTitleVi": "PHẦN III: HIỆN TƯỢNG ÂM THANH ĐIỆN TỬ SIÊU NHIÊN (EVP), BẰNG CHỨNG KHOA HỌC & BẢN THẢO CODEX GIGAS",
    "sectionNumber": "3.7",
    "titleEn": "7. The Odyssey of Codex Gigas & Codicological Analysis",
    "titleVi": "7. Hành Trình Lưu Lạc Của Codex Gigas & Giải Mã Cổ Tự Học",
    "paragraphs": [
      {
        "id": "p3-s7-p1",
        "en": "Returning to The Devil’s Bible: in the 15th century, roughly 200 years after its creation, the Hussite Wars broke out. The Benedictine monastery was sacked, and the manuscript began centuries of wandering across Central Europe.",
        "vi": "Quay lại với Kinh Thánh của quỷ, vào thế kỷ 15, tức khoảng 200 năm sau khi cuốn sách ra đời, chiến tranh Bohemia nổ ra. Tu viện dòng Benedict, nơi từng tuyên án chung sống Herman đã bị thiêu rụi hoàn toàn trong chiến loạn. Bản gốc Kinh Thánh của quỷ cũng bắt đầu hành trình lưu lạc khắp nơi."
      },
      {
        "id": "p3-s7-p2",
        "en": "In 1594, the manuscript was acquired by Holy Roman Emperor Rudolf II in Prague, famous for his cabinet of curiosities.",
        "vi": "Cho đến năm 1594, cuốn sách này rơi vào tay một trong những nhân vật quyền lực nhất thời bấy giờ, Hoàng đế Rudolph II của Đế chế La Mã Thần Thánh."
      },
      {
        "id": "p3-s7-p3",
        "en": "In 1648, during the closing days of the Thirty Years' War, Swedish forces plundered Prague Castle and took the Codex Gigas as war booty to Stockholm. It has been preserved in the National Library of Sweden ever since.",
        "vi": "Năm 1648, trong giai đoạn cuối của Chiến tranh 30 năm ở châu Âu, nhiều báu vật của Đế chế La Mã Thần Thánh bị quân đội Thụy Điển cướp phá. Trong đó, có cả Kinh Thánh của quỷ. Cuốn sách sau đó được đưa về thư viện Hoàng gia Thụy Điển tại Stockholm, nơi nó được lưu giữ cho đến ngày nay."
      },
      {
        "id": "p3-s7-p4",
        "en": "In 1697, a catastrophic fire devastated the Royal Tre Kronor Castle in Stockholm. Remarkably, the Codex Gigas was saved when librarians hurled the massive volume out of a high window, escaping the flames intact.",
        "vi": "Năm 1967, Thụy Điển xảy ra một vụ hỏa hoạn lớn, thiêu rụi nhiều phần của thư viện này. May mắn thay, Kinh Thánh của quỷ đã thoát nạn, không hề hấn gì, giống như được quỷ che chở. Và suốt hàng trăm năm tiếp theo, nó vẫn được cất giữ cẩn thận tại đây."
      },
      {
        "id": "p3-s7-p5",
        "en": "Did a single human truly write this text, or was it supernatural?",
        "vi": "Cho đến nay, bí ẩn lớn nhất xoay quanh cuốn sách này chính là truyền thuyết. Liệu nó có thực sự được viết ra bởi một người bị quỷ nhập?"
      },
      {
        "id": "p3-s7-p6",
        "en": "The dilemma confounding scholars is that while the manuscript contains five times the text of a standard Latin Bible, the calligraphy is extraordinarily uniform from the first folio to the last. There is no indication of fluctuating mood, aging, illness, or scribal fatigue; the script flows with mechanical regularity.",
        "vi": "Điều khiến giả thuyết này càng trở nên khó bác bỏ là bởi vì dù lượng kiến thức của sách gấp năm lần một bản Kinh Thánh đầy đủ, nhưng toàn bộ nội dung lại được viết bằng cùng một nét chữ, giống nhau từ đầu đến cuối từng đường nét, hoàn toàn đồng nhất, không hề thay đổi dù chỉ một chút. Điều này có nghĩa là trong suốt quá trình sao chép, người chép sách không hề bị ảnh hưởng bởi mệt mỏi hay cảm xúc. Từng chữ cái đều được viết chính xác, không sai sót hay là chỉnh sửa dù là nhỏ nhất."
      },
      {
        "id": "p3-s7-p7",
        "en": "Michael Gullick, a leading paleographer consulted by the National Library of Sweden, determined that the entire manuscript was unquestionably executed by a single scribe. Gullick calculated that working 24 hours a day without pause, a scribe would need a minimum of 5 years just to pen the text. Accounting for daylight, ink production, and daily tasks, completing the work solo would realistically demand between 25 and 35 years of labor.",
        "vi": "Michael Gullick, một nhà nghiên cứu cổ văn của thư viện Hoàng gia Thụy Điển, sau khi phân tích kỹ các ghi chú trong sách đã kết luận rằng việc hoàn thành toàn bộ bản thảo này chỉ có thể do một người làm. Sau nhiều thử nghiệm và tính toán, ông cho rằng nếu làm việc liên tục không nghỉ trong 24 giờ mỗi ngày, người đó cũng cần ít nhất 5 năm mới có thể hoàn thành cuốn sách. Nhưng nếu tính cả thời gian ăn uống, nghỉ ngơi thì thời gian sẽ còn kéo dài hơn rất nhiều. Thông thường, một người muốn hoàn thành cuốn tác phẩm khổng lồ này một mình sẽ phải mất ít nhất từ 25 đến 35 năm."
      },
      {
        "id": "p3-s7-p8",
        "en": "Curiously, ink analysis indicates that the pigment consistency across the folios shows remarkable uniformity, suggesting it was written within a relatively short window of the scribe's life.",
        "vi": "Đáng sợ là các chuyên gia đều đồng thuận rằng người chép sách này đã hoàn thành nó trong một khoảng thời gian cực kỳ ngắn. Nếu không, sẽ không thể giải thích được lý do tại sao từ đầu trang đến cuối trang, độ khô của mực viết trên từng trang lại giống hệt nhau như vậy."
      },
      {
        "id": "p3-s7-p9",
        "en": "Another eerie detail is the full-page illustration of the devil on folio 290. Unlike the other parchment pages, the leaves containing the portrait are noticeably darkened. Myth lovers claimed demonic energy scorched the surrounding parchment.",
        "vi": "Một bí ẩn khác liên quan đến cuốn sách chính là bức tranh hình quỷ. Khác hẳn với màu sắc các trang giấy khác, tấm da dê chứa hình vẽ này đen kịt một cách kỳ lạ. Có giả thuyết cho rằng, năng lượng ma quỷ ẩn chứa trong cuốn sách đã ăn mòn chính bản thân cuốn sách, khiến những trang giấy quanh bức tranh quỷ đen kịt như bị cháy thành than."
      },
      {
        "id": "p3-s7-p10",
        "en": "Modern conservators offer a scientific explanation: over centuries of curiosity, the volume was frequently displayed open to the devil’s portrait, exposing those specific pages to UV light and air oxidation, which blackened the vellum.",
        "vi": "Tuy nhiên, bên cạnh những suy đoán huyền bí này, cũng có học giả phân tích từ góc độ khoa học hơn. Họ cho rằng, vì quá nhiều người tò mò, tin vào truyền thuyết về Kinh Thánh của quỷ, nên thường xuyên mở sách đúng vào trang có hình quỷ. Điều này khiến hai trang da dê ấy hấp thụ lượng tia cực tím lớn hơn nhiều so với những trang khác, nên mới có màu đen khác biệt như vậy."
      },
      {
        "id": "p3-s7-p11",
        "en": "What does the manuscript actually contain?",
        "vi": "Vậy cuốn sách này ghi chép những gì?"
      },
      {
        "id": "p3-s7-p12",
        "en": "The core text is the complete Latin Vulgate Bible (both Old and New Testaments). But it is also a medieval encyclopedia, encompassing Flavius Josephus's Antiquities of the Jews, Cosmas of Prague's Chronicle of Bohemia, treatises by Isidore of Seville, medical compendia, and a liturgical calendar.",
        "vi": "Nội dung chính là bản Latinh của Kinh Thánh, bao gồm cả Cựu Ước và Tân Ước. Nhưng đây không chỉ là một cuốn sách tôn giáo đơn thuần. Nó còn chứa đựng rất nhiều kiến thức thế tục, được xem như một cuốn bách khoa toàn thư thời Trung Cổ ở châu Âu. Trong đó có ghi lại các di tích và cuộc chiến của người Do Thái, biên niên sử Bohemia, cùng những tài liệu về y học. Thậm chí, cuốn sách còn tích hợp cả lịch, thứ tưởng chừng rất bình thường, nhưng lại được xem như một phần không thể thiếu."
      },
      {
        "id": "p3-s7-p13",
        "en": "It even incorporates medical charms and incantations for curing fevers and banishing demonic forces. One Latin formula for reducing fever instructs the recitation of words summoning a mystical draco to carry away the illness.",
        "vi": "Điều gây sốc hơn cả là nó còn chứa đựng những bí kíp về cách trừ tà, triệu hồi ma quỷ. Trong quá khứ, người châu Âu thực sự đã dùng chúng để chữa bệnh. Chẳng hạn như câu thần chú giúp giảm sốt và xua tan đau đớn. Theo truyền thuyết, sau khi đọc câu này, sẽ có một con khủng long được triệu hồi và con người có thể ra lệnh cho nó mang đi cơn sốt của bệnh nhân."
      },
      {
        "id": "p3-s7-p14",
        "en": "In medieval Europe, boundaries between medicine, Christian ritual, and folklore were blurred. Charms were commonly utilized alongside herbal remedies, reflecting the intellectual horizon of the Middle Ages, much like the bizarre remedies found in traditional pharmacopeias.",
        "vi": "Còn về hiệu quả thực sự của những câu thần chú này thì vẫn là một câu hỏi lớn. Thực ra, vào thời Trung Cổ ở châu Âu, việc sử dụng các câu thần chú là rất phổ biến. Khi đó, ranh giới giữa y học, ma thuật và tôn giáo còn rất mơ hồ và mọi thứ thường bị hòa lẫn vào nhau. Người dân phương Tây thời xưa tin rằng, các câu thần chú và bùa chú có thể chữa bệnh cứu người không phải là ít. Những nội dung này trong Kinh Thánh của quỷ cũng phần nào phản ánh trình độ nhận thức của con người thời đó. Giống như Bản Thảo Cương Mục Tâm Linh Cuộc Sống từng chia sẻ ở video trước. Quái đản, kỳ quặc, nhưng tại thời điểm đó lại được áp dụng rộng rãi."
      },
      {
        "id": "p3-s7-p15",
        "en": "Modern scholars suspect the Faustian legend arose from a misreading of the scribe’s signature: Hermanus Inclusus. While inclusus can poetically suggest being shut in or immured, in monastic Latin it simply designated a recluse or anchorite monk who chose voluntary isolation for devotional study. Herman was likely an anchorite dedicating his life to penance through scribal labor.",
        "vi": "Truyền thuyết lan truyền rất có thể xuất phát từ việc người ta hiểu nhầm chữ ký của tác giả trong cuốn sách đoạn ký duy nhất mang dấu ấn cá nhân chính là Herman in Claus. Như đã nói ở đầu video, in Claus tiếng Latin nghĩa là chôn sống, nhưng một số chuyên gia cho rằng ý nghĩa thực sự của từ này gần hơn với từ ẩn sĩ. Vì vậy, có thể giả thuyết về câu chuyện Herman được chôn sống là không có thật. Họ cho rằng tên thật của tác giả chính là Herman in Claus, chỉ đơn giản như vậy."
      },
      {
        "id": "p3-s7-p16",
        "en": "Furthermore, the devil’s portrait shows him wearing an ermine loincloth. In medieval Europe, ermine fur was a royal prerogative; the illuminator clearly adapted contemporary courtly dress when designing the figure.",
        "vi": "Hơn nữa, bằng chứng cho thấy kinh thánh của quỷ là do con người tạo ra còn nằm ở bức tranh quỷ trong sách khi quỷ mặc áo khoác bằng lông chồn và thắt khăn lông chồn quanh eo. Châu Âu thời trung cổ, lông chồn được xem là biểu tượng của hoàng gia. Từ đó, chúng ta có cơ sở để tin rằng họa sĩ vẽ bức tranh này có thể đã dựa vào trang phục hoàng gia thời đó để tưởng tượng ra phong cách ăn mặc hàng ngày của quỷ."
      },
      {
        "id": "p3-s7-p17",
        "en": "Still, the astonishing mechanical uniformity of the massive manuscript remains an awe-inspiring human achievement. Was it purely monastic discipline, or was there something more mysterious behind Herman's pen? Let us know your thoughts in the comments!",
        "vi": "Tuy nhiên, cho đến ngày nay, riêng việc những chữ trong sách được xác nhận do một người viết liên tục, đồng nhất như một chiếc máy là chưa ai bác bỏ được. Mặc dù khoa học hiện đại đã đạt được những thành quả cực lớn, nhưng bí mật này sẽ mãi mãi bị chôn vùi cùng sự ra đi của Herman. Quyển kinh thánh của quỷ này thực ra chứa đựng những kiến thức vô cùng giá trị, gần giống một quyển bách khoa toàn thư.\n\nTâm linh cuộc sống không biết các bạn nghĩ gì sau khi xem xong video này. Cuốn sách này rốt cuộc là do con người tạo hay là sản phẩm của quỷ? Đừng quên để lại ý kiến của mình bên dưới phần bình luận để Tâm linh Cuộc Sống và mọi người được biết nhé."
      }
    ]
  },
  {
    "id": "p4-s1",
    "partId": "part-4",
    "partNumber": "PART IV",
    "partTitleEn": "PART IV: THE LEGEND OF MAZU (THE HEAVENLY EMPRESS) & HER UNIQUE IDENTITY CARD",
    "partTitleVi": "PHẦN IV: HUYỀN THOẠI THIÊN HẬU THÁNH MẪU (MA TỔ) & TẤM THẺ CĂN CƯỚC ĐẶC BIỆT",
    "sectionNumber": "4.1",
    "titleEn": "1. Historical Prototype Lin Mo & Imperial Enfeoffment in the Song Dynasty",
    "titleVi": "1. Nguyên Mẫu Lịch Sử Lâm Mặc & Quá Trình Phong Thần Thời Tống",
    "paragraphs": [
      {
        "id": "p4-s1-p1",
        "en": "The authentic legend of Mazu—the Heavenly Empress who manifested thousands of times to shield seafaring communities. If Puyi was the only Chinese emperor to hold a modern citizen ID card, Mazu is the only deity in history issued an official identification document.",
        "vi": "Huyền thoại có thật về Thiên Hậu Thánh Mẫu hàng ngàn lần hiển linh bảo vệ người dân vùng biển. Nếu Phổ Nghi là vị hoàng đế duy nhất từng nhận chứng minh thư, thì Thần Mẫu Tổ hay còn gọi là Thiên Hậu Thánh Mẫu chính là vị thần tiên duy nhất có giấy tờ tùy thân hợp pháp."
      },
      {
        "id": "p4-s1-p2",
        "en": "In 2017, photos of the Mazu statue boarding an international commercial flight circulated globally on social media. Soon after, she was spotted traveling on high-speed trains, appearing for all the world like an official on a business tour. Why, among hundreds of deities in Chinese culture, is Mazu alone granted an official identification credential? Can this card actually be used like that of an ordinary citizen?",
        "vi": "Năm 2017, một bức ảnh thần Ma Tổ đi máy bay ra nước ngoài lan truyền khắp mạng xã hội. Sau đó, người ta bắt gặp hình ảnh Ma Tổ xuất hiện trên tàu cao tốc như đang đi công tác. Nhưng vì sao giữa hàng trăm vị thần trong văn hóa Trung Hoa, chỉ riêng Ma Tổ được cấp giấy tờ hợp pháp? Liệu căn cước công dân này có được sử dụng như người bình thường hay không?"
      },
      {
        "id": "p4-s1-p3",
        "en": "Join Spiritual Life as we explore the historical origins of Mazu, the patron goddess of seafarers—the first folk faith tradition recognized by UNESCO as an Intangible Cultural Heritage of Humanity.",
        "vi": "Hãy cùng Tâm Linh Cuộc Sống tìm hiểu về nguồn gốc thần thoại của Ma Tổ, vị nữ thần bảo hộ cho những người đi biển. Vị thần không chỉ được tôn thờ trong dân gian, mà còn là di sản văn hóa phi vật thể cấp thế giới đầu tiên của Trung Quốc."
      },
      {
        "id": "p4-s1-p4",
        "en": "Mazu is not an invented mythological figure, but a historical individual. Her birth name was Lin Mo, born in 960 CE during the early Song Dynasty on Meizhou Island, Fujian Province. According to the ancient stele record of the Shengdun Shunji Temple, she was revered as the \"Divine Maiden Who Intercedes with Heaven,\" famed for her shamanic healing and deep spiritual gifts. Local residents credited her with averting misfortune, erecting shrines in her honor shortly after her passing. Historical texts such as the Puyang Bishi note that she possessed exceptional gifts from birth, treating ailments and aiding villagers.",
        "vi": "Ma Tổ không phải là một nhân vật thần thoại bịa đặt hay là truyền miệng dân gian, mà thực sự có nguyên mẫu trong lịch sử. Tên thật của bà là Lâm Mặc, sinh năm 960 vào thời Tống, trên đảo Mai Châu, tỉnh Phúc Kiến. Theo ghi chép trong văn bia tái dựng miếu Thánh Đôn Thuấn Cơ, bà được gọi là Thông Thiên Thần Nữ, họ Lâm, người vùng Mai Châu, nổi tiếng vì theo nghề pháp sư. Người dân tin rằng bà có khả năng thay đổi họa phúc, linh ứng đến mức họ lập miếu thờ ngay tại quê nhà. Thậm chí sách cổ như Phủ Dương Bị Sử của Trung Quốc cũng ghi chép rằng, nữ thần Mai Châu họ Lâm sinh ra đã kỳ lạ, có thể cứu người chữa bệnh bằng đá thần."
      },
      {
        "id": "p4-s1-p5",
        "en": "Historical chronicles record that Lin Mo was an expert swimmer with an acute understanding of meteorology and coastal tides. She regularly warned fishermen of approaching typhoons and braved rough seas to rescue sailors during maritime disasters.",
        "vi": "Trong các ghi chép cổ, Lâm Mặc là một nữ pháp sư có pháp lực cao cường, giỏi bơi lội, đặc biệt là nhạy cảm với sự thay đổi của thiên văn thời tiết. Bà thường xuyên dự báo bão biển cho người dân và không ít lần ra khơi cứu người trong các vụ tai nạn trên biển."
      },
      {
        "id": "p4-s1-p6",
        "en": "At the age of 28, she was said to have ascended to heaven as a goddess. In historical reality, she likely perished during a heroic rescue effort amid a fierce coastal tempest. Swept out to sea while rescuing distressed fishermen, the islanders refused to believe she had died, insisting she had ascended to the heavenly realms.",
        "vi": "Năm 28 tuổi, bà được cho là đã đăng thiên thành thần, nghĩa là được phong thần và bay về trời. Nhưng cũng rất có thể, sự thật là một trong lần ra khơi cứu nạn ở tuổi 28, bà đã hy sinh anh dũng, để lại lòng biết ơn và niềm tôn kính sâu sắc trong dân gian. Đó là trong một trận cuồng phong dữ dội hiếm thấy, Lâm Mặc liều mình lao ra biển để cứu những ngư dân gặp nạn. Nhưng không may, bà bị bão cuốn đi giữa biển khơi. Người dân không tin bà đã chết mà tin rằng bà đã được người trời đón về."
      },
      {
        "id": "p4-s1-p7",
        "en": "In her honor, villagers built a shrine atop Meizhou Island, named the Tongxian Lingnü Shrine—the first Mazu temple in the world.",
        "vi": "Để tưởng nhớ, họ lập miếu thờ bà trên đỉnh núi ở đảo Mai Châu, gọi là miếu Thông Hiền Linh Nữ. Cũng là ngôi miếu thờ Ma Tổ đầu tiên trên thế giới."
      },
      {
        "id": "p4-s1-p8",
        "en": "In pre-modern times, navigating the treacherous seas in wooden vessels was fraught with peril. Coastal folk desperately sought a compassionate protector against maritime storms. Stories of Lin Mo’s bravery spread throughout coastal Fujian, blossoming into a dedicated maritime faith.",
        "vi": "Thời xưa con người hiểu biết rất ít về biển cả, đại dương mênh mông dữ dội và khó lường. Khiến những con thuyền nhỏ dễ gặp nạn. Trong hoàn cảnh đó, họ khao khát một vị thần có thể che chở giữa sóng gió. Và Ma Tổ với những câu chuyện cảm động sau khi qua đời, bắt đầu được truyền tụng dọc bờ biển Phúc Kiến, trở thành tín ngưỡng của một nhóm nhỏ cư dân ven biển."
      },
      {
        "id": "p4-s1-p9",
        "en": "The turning point that transformed Mazu from a regional coastal faith into an imperial state cult occurred roughly 200 years later during the reign of Emperor Huizong of the Northern Song Dynasty.",
        "vi": "Tuy nhiên thì bước ngoặt đưa tín ngưỡng Ma Tổ lan rộng khắp nơi lại diễn ra vào khoảng 200 năm sau. Vào cuối thời Bắc Tống, dưới triều Tống Huy Tông."
      },
      {
        "id": "p4-s1-p10",
        "en": "Chinese folk belief has always been pragmatic: deities that prove efficacious are worshipped; those that fail to respond are abandoned. By all accounts, Mazu proved remarkably responsive.",
        "vi": "Người Trung Quốc xưa rất thực tế khi thờ thần. Thần nào linh thì tiếp tục thờ, không linh ứng thì xa rời và thậm chí là lãng quên. Thần thánh bị xem là người phục vụ. Không làm tròn trách nhiệm thì bị thay thế là chuyện bình thường. Và thật trùng hợp, Ma Tổ lại là vị thần rất hay hiển linh."
      },
      {
        "id": "p4-s1-p11",
        "en": "During this era, the Jurchen Jin dynasty blocked northern overland trade routes, forcing the Song imperial court to pivot toward maritime silk routes.",
        "vi": "Chính trong thời kỳ đó, nhà Tống bị nước Kim tỏa tuyến đường thương mại trên đất liền. Trước tình hình bị Kim Quốc phong tỏa đường bộ, triều đình nhà Tống buộc phải chuyển hướng, đẩy mạnh phát triển thương mại đường biển."
      },
      {
        "id": "p4-s1-p12",
        "en": "The court dispatched an official diplomatic mission of eight vessels across the Yellow Sea to Goryeo (modern Korea). A vicious storm wrecked seven of the eight ships. The sole surviving ship was the flagship carrying the imperial envoy Lu Yuandi.",
        "vi": "Trong một lần triều đình cử tám chiếc tàu lớn sang Cao Ly, nay là Hàn Quốc, để thiết lập quan hệ buôn bán. Nhưng không ngờ, chuyến đi này lại gặp tai họa. Tám chiếc thuyền thì bảy chiếc chìm mất giữa biển, chỉ còn đúng một chiếc, cũng chính là con tàu chở vị sứ thần chính thức của triều đình, may mắn sống sót và trở về an toàn."
      },
      {
        "id": "p4-s1-p13",
        "en": "Stunned by his survival, Emperor Huizong questioned the envoy. Crew members testified that as towering waves threatened to capsize the ship, the storm clouds parted, revealing a red-robed maiden descending through the tempest to steady the helm and guide the craft to safety.",
        "vi": "Việc này khiến Tống Huy Tông vô cùng kinh ngạc, lập tức triệu kiến sứ thần để hỏi nguyên nhân. Những người cùng đi kể lại rằng khi con tàu sắp bị lật bởi cuồng phong thì bất ngờ mây đen trên trời bị xé toạc, một tiên nữ mặc áo đỏ xuất hiện giữa không trung, hạ xuống rồi dang tay giữ lấy con tàu, giúp họ thoát khỏi cơn bão chết người."
      },
      {
        "id": "p4-s1-p14",
        "en": "The trembling envoy called out: \"Who has saved our lives?\"",
        "vi": "Vị sứ thần run rẩy hỏi: \"Là ai đã cứu mạng chúng tôi?\""
      },
      {
        "id": "p4-s1-p15",
        "en": "The vision replied: \"I am Lin Mo, maiden of Meizhou.\"",
        "vi": "Người tiên chỉ đáp: \"Ta là Lâm Mặc, pháp sư đến từ Mai Châu.\""
      },
      {
        "id": "p4-s1-p16",
        "en": "Upon inquiry, Emperor Huizong learned of the deceased holy maiden of Meizhou Island and formally bestowed an imperial plaque upon her shrine, elevating Mazu from a local seaside cult into a state-recognized protector of the realm.",
        "vi": "Tống Huy Tông sau đó cho người tra xét thì phát hiện quả nhiên tại Phúc Kiến có người tên Lâm Mặc từng là nữ pháp sư nổi tiếng được lập miếu thờ sau khi mất. Nhà vua lập tức sắc phong, công nhận ngôi miếu này, biến Ma Tổ từ một tín ngưỡng dân gian ít người biết trở thành vị thần được hoàng triều chính thức thờ phụng."
      },
      {
        "id": "p4-s1-p17",
        "en": "Historical records, such as Li Junfu’s Puyang Bishi, corroborate that in the fifth year of the Xuanhe era, envoy Lu Yuandi met severe gales en route to Goryeo and was rescued by the spirit of Mazu.",
        "vi": "Tuy chuyện mang sắc màu thần thoại nhưng sử sách Trung Quốc cũng có ghi chép rõ ràng trong tác phẩm Phủ Dương bị sử của người Phúc Kiến là Lý Tuấn Phủ từng viết rằng vào năm Tuyên Hòa thứ năm, sứ thần Lục Doãn Địch trên đường đi sứ Cao Ly đã gặp gió lớn giữa biển được nữ thần Ma Tổ cứu giúp thoát nạn. Sau đó các miếu thờ Ma Tổ được đặt tên chính thức theo chiếu chỉ hoàng gia. Từ đây Ma Tổ có được thân phận chính thức không còn là một vị thần dân gian địa phương nữa mà bắt đầu hành trình trở thành một vị thần mang tầm vóc quốc gia."
      },
      {
        "id": "p4-s1-p18",
        "en": "Under Song policies encouraging overseas commerce, Mazu was granted her first noble imperial title: Lady Linghui.",
        "vi": "Dưới chính sách khai dương ích quốc của nhà Tống, tức là khuyến khích khai thác biển để làm giàu quốc gia, cùng với sự chú trọng ngày càng lớn của triều đình đối với thương mại đường biển, Ma Tổ lần đầu tiên được phong tặng danh hiệu hoàng gia gọi là Linh Huệ phu nhân. Trong đó Linh Huệ là phong hiệu, còn phu nhân là một tước vị quý tộc chính thức."
      },
      {
        "id": "p4-s1-p19",
        "en": "Securing imperial titles for deities required verified state petitions and proven miracles. Over the next century, successive Song emperors enfeoffed Mazu 13 times due to repeated maritime interventions. By the end of the Song dynasty, she had risen through the ranks of nobility, from Lady to Consort.",
        "vi": "Thời điểm đó muốn một vị thần được triều đình phong danh hiệu là chuyện cực kỳ khó khăn, phải linh nghiệm và có công trạng rõ ràng. Nhưng với Ma Tổ thì dường như lại là ngoại lệ. Từ lần đầu được sắc phong, chỉ trong vòng hơn 100 năm sau đó, Ma Tổ đã liên tiếp được triều đình các đời sau phong tặng tới 13 lần vì nhiều lần hiển linh giúp đỡ người dân miền biển. Đến thời điểm triều Tống sụp đổ, Ma Tổ đã mang trong mình đủ loại danh hiệu cao quý như Linh Huệ, Hiển Tích, Gia Anh, Thuận Khánh Phi."
      },
      {
        "id": "p4-s1-p20",
        "en": "Subsequent dynasties—Yuan, Ming, and Qing—continued this tradition. Whenever maritime stability, grain transport, or naval security was critical, emperors bestowed grand titles. By the end of the Qing Dynasty, her accumulated honorific reached an astonishing 64-character title.",
        "vi": "Và cũng từ đó Ma Tổ chính thức trở thành biểu tượng thiêng liêng của hàng hải Trung Hoa, vị nữ thần bảo hộ cho mọi chuyến hải trình từ dân thường cho đến sứ thần quốc gia. Sang đến các triều đại sau như Nguyên, Minh, Thành, chỉ cần quốc gia còn cần đến giao thương hàng hải thì các vị hoàng đế đều lần lượt sắc phong cho Ma Tổ như một cách thể hiện sự quan tâm của triều đình đối với biển cả. Từ thời Tống cho đến khi nhà Thanh kết thúc, Ma Tổ đã được phong tặng tổng cộng 64 chữ danh hiệu."
      },
      {
        "id": "p4-s1-p21",

        "vi": "Nhưng quan trọng hơn hết, chính vì xuất thân từ dân gian, là người đã hy sinh vì nhân dân, nên Ma Tổ đặc biệt được lòng dân. Dân chúng không chỉ tôn thờ mà còn liên tục giao thêm việc cho bà, từ cứu nạn trên biển đến hộ mệnh, cầu an, xin con, cầu duyên, rồi đến cả định hướng cuộc đời. Về sau người ta không chỉ thờ Ma Tổ khi ra biển mà hễ gặp chuyện khó quyết cũng có thói quen hỏi thử ý của Ma Tổ xem sao."
      }
    ]
  },

        "vi": "Hiểu được nguồn gốc và quá trình phong thần của Ma Tổ, giờ chúng ta hãy cùng quay lại câu hỏi ở đầu video của Tâm Linh Cuộc Sống: Vì sao Trung Quốc có nhiều thần như vậy mà chỉ mỗi Ma Tổ là có căn cước công dân?"

    "partTitleVi": "PHẦN IV: HUYỀN THOẠI THIÊN HẬU THÁNH MẪU (MA TỔ) & TẤM THẺ CĂN CƯỚC ĐẶC BIỆT",

    "paragraphs": [
      {
        "id": "p4-s3-p1",
        "en": "Wherever there is sea, there are Chinese communities; wherever there are Chinese communities, there is Mazu. With her tradition inscribed by UNESCO as an Intangible Cultural Heritage of Humanity, Mazu commands approximately 300 million devotees across more than 50 nations.",

      },
      {
        "id": "p4-s3-p2",
        "en": "When planning her 2017 Maritime Silk Road tour across Southeast Asia, international air transit was mandatory. Civil aviation authorities arranged special ticketing based on her historical persona. The boarding pass seen in viral photos was a dedicated commemorative ticket created by Xiamen Airlines in coordination with the Meizhou Ancestral Temple.",
        "vi": "Vào năm 2017, khi tổ chức chuyến tuần du Đông Nam Á lần đầu tiên, việc di chuyển bằng máy bay là điều cần thiết. Để thuận tiện cho hành trình, dưới sự hỗ trợ của các cơ quan chức năng, một tấm căn cước công dân đặc biệt đã được cấp cho Ma Tổ, dựa trên thân phận lịch sử của bà. Chiếc thẻ lên máy bay mà mọi người nhìn thấy thực chất là một tấm thẻ kỷ niệm do Xiamen Airlines phối hợp với tổ miếu Ma Tổ ở Mai Châu thiết kế, như một cách bày tỏ sự tôn kính đối với tín ngưỡng."
      },
      {
        "id": "p4-s3-p3",
        "en": "A common misconception should be clarified: not every Mazu statue holds a legal identity card. The card was issued exclusively to the principal image (Jin Shen) of the Meizhou Ancestral Temple—the spiritual epicenter of global Mazu belief.",

      },
      {
        "id": "p4-s3-p4",
        "en": "Only the original statue residing on Meizhou Island was granted this legal identity document. When the statue flew internationally in 2017 or traveled on high-speed rail train D3142 to Kunshan in 2019, it was the original Meizhou statue occupying a reserved seat as an honored passenger.",
        "vi": "Nghe thì có vẻ hơi rối, nhưng nói một cách đơn giản: Chỉ duy nhất kim thân Ma Tổ được thờ tại chính điện tổ miếu ở đảo Mai Châu mới thực sự được cấp căn cước công dân. Còn tất cả các tượng Ma Tổ ở những nơi khác, dù cũng được thờ phụng linh thiêng, nhưng về mặt pháp lý thì không có.\n\nVí dụ như trong bức ảnh nổi tiếng năm 2017, tượng Ma Tổ đi máy bay ra nước ngoài chính là kim thân tại tổ miếu Mai Châu, và đó cũng là vị Ma Tổ duy nhất ở Trung Quốc có căn cước công dân thật sự. Đến năm 2019, khi Ma Tổ ngồi trên chuyến tàu cao tốc D3142 đi đến thành phố Côn Sơn, tỉnh Giang Tô, cũng chính là tượng Ma Tổ gốc từ tổ miếu. Vì vậy mới đủ điều kiện để mua vé hợp pháp và di chuyển như một hành khách đặc biệt."
      },
      {
        "id": "p4-s3-p5",
        "en": "For branch statues (Fenling—consecrated offshoots from the ancestral root), travel arrangements can also use the name Lin Mo. Under the virtual registry code 7001, the final two digits (01) are replaced with the specific branch statue's registration number (e.g., 7005 or 7021), enabling transit by rail or air. This administrative mechanism exists strictly for cultural exchanges, rather than daily civilian use.",
        "vi": "Nhưng cũng có một số trường hợp cần thiết, nếu là phân linh (tức là tượng Ma Tổ phân thân từ kim thân gốc được đăng ký), thì vẫn có thể sử dụng tên Lâm Mặc khi làm thủ tục di chuyển. Số căn cước ảo của mã 7001, còn hai số cuối 01 sẽ được thay thế bằng số thứ tự phân thân tương ứng. Ví dụ như số 7005 hay 7021, thì tượng Ma Tổ đó cũng có thể mua vé và di chuyển bằng tàu hay máy bay. Chẳng hạn tượng Ma Tổ mặt đen này có thể đi máy bay, có vé máy bay đầy đủ. Thực tế, đây cũng là một phân thân của Ma Tổ đã được đăng ký và báo cáo với các cơ quan chức năng. Căn cước chỉ dùng cho những mục đích đặc biệt như di chuyển tín ngưỡng, chứ không phải căn cước thực sự để sử dụng bình thường."
      }

    "paragraphs": [

        "id": "p4-s4-p1",
        "en": "To understand Mazu is to understand the soul of Fujian, the birthplace of her veneration. For the people of Fujian, Meizhou is what Jerusalem is to the Western world—an irreplaceable spiritual homeland. It is often said that a Fujian native might deceive anyone, but would never utter a falsehood before Mazu. In rural Fujian police stations, one can even find dedicated \"Mazu Mediation Rooms,\" where community disputes over land, contracts, or maritime boundaries are resolved before her shrine with remarkable success.",
        "vi": "Nói về Ma Tổ thì cũng phải nhắc đến người dân Phúc Kiến, quê hương khai sinh tín ngưỡng Ma Tổ. Với họ, Ma Tổ quan trọng như Jerusalem đối với phương Tây vậy, không thể nào mà mất đi được. Người Phúc Kiến có thể nói dối bất kỳ ai, nhưng sẽ không bao giờ nói dối trước Ma Tổ. Ở một số vùng quê của Phúc Kiến, trong các đồn công an địa phương, bạn còn có thể bắt gặp một phòng hòa giải Ma Tổ đặc biệt, nơi chuyên giúp mọi người giải quyết các mâu thuẫn, tranh cãi."
      },
      {
        "id": "p4-s4-p2",
        "en": "Across a thousand years, the legend of Mazu has stood as a guardian of coastal Asia. Lin Mo—filial, wise, and profoundly compassionate—transcended her historical mortality to become an enduring symbol of safety and hope upon the vast ocean.",
        "vi": "Trải qua hàng nghìn năm, huyền thoại về Thiên Hậu Thánh Mẫu, vị nữ thần biển cả được tôn thờ với lòng tôn kính sâu sắc ở trong lòng người dân ven biển Trung Hoa và nhiều quốc gia châu Á. Hình ảnh Ma Tổ — người con gái hiếu thảo, thông tuệ và đầy lòng từ bi — đã vượt qua ranh giới của một nhân vật lịch sử để trở thành biểu tượng thiêng liêng của niềm tin, của sự bảo hộ và hy vọng giữa đại dương mênh mông."

          const filteredItems = GLOSSARY_DATA.filter(function (item) {
            const matchPos = state.glossaryPosFilter === 'all' || item.pos === state.glossaryPosFilter;
            const matchPart = state.glossaryPartFilter === 'all' || item.partId === state.glossaryPartFilter;
            if (!matchPos || !matchPart) return false;
            if (!q) return true;
            return (
              item.term.toLowerCase().includes(q) ||
              item.definition.toLowerCase().includes(q) ||
              item.explanation.toLowerCase().includes(q) ||
              item.contextExample.toLowerCase().includes(q) ||
              item.vietnamese.toLowerCase().includes(q)
            );
          });

          const cardsHtml = filteredItems
            .map(function (item, idx) {
              const isRevealed = Boolean(state.glossaryRevealed[item.id]);
              const partLabel =
                item.partId === 'part-1'
                  ? 'Part I · Neil & God'
                  : item.partId === 'part-2'
                  ? 'Part II · Swedenborg'
                  : item.partId === 'part-3'
                  ? 'Part III · EVP & Codex'
                  : 'Part IV · Mazu';

              return `
                <article
                  class="rounded-xl p-6 border flex flex-col justify-between"
                  style="background-color: var(--bg-surface); border-color: var(--border-hairline); box-shadow: var(--shadow-card);"
                  data-glossary-card="${item.id}"
                >
                  <div>
                    <!-- Top Metadata Row -->
                    <div class="flex items-center justify-between gap-2 text-xs font-mono-tabular mb-2" style="color: var(--text-muted)">
                      <span>#${String(idx + 1).padStart(2, '0')} · ${partLabel}</span>
                      <span>CEFR ${escapeHtml(item.cefr)}</span>
                    </div>

                    <!-- 1. Target Term (Bold) + Part of Speech -->
                    <div class="flex items-baseline gap-2.5 mb-4 pb-3 border-b" style="border-color: var(--border-hairline)">
                      <h2 class="font-display-editorial text-2xl font-bold" style="color: var(--text-primary)">
                        ${escapeHtml(item.term)}
                      </h2>
                      <span class="text-xs italic font-serif" style="color: var(--accent-en)">
                        (${escapeHtml(item.pos)})
                      </span>
                    </div>

                    <!-- 2. Academic / Contextual Definition -->
                    <div class="mb-3.5">
                      <div class="text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--text-muted)">
                        Academic / Contextual Definition
                      </div>
                      <p class="text-sm md:text-base leading-relaxed" style="color: var(--text-primary)">
                        ${escapeHtml(item.definition)}
                      </p>
                    </div>

                    <!-- 3. Plain-English Explanation -->
                    <div class="mb-3.5 rounded-lg p-3.5 border" style="background-color: var(--bg-subtle); border-color: var(--border-hairline)">
                      <div class="text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--accent-en)">
                        Plain-English Explanation (B1/B2)
                      </div>
                      <p class="text-sm leading-relaxed" style="color: var(--text-secondary)">
                        ${escapeHtml(item.explanation)}
                      </p>
                    </div>

                    <!-- 4. Example in Context -->
                    <div class="mb-5">
                      <div class="text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--text-muted)">
                        Example in Context (Verbatim)
                      </div>
                      <blockquote class="font-serif italic text-sm leading-relaxed m-0" style="color: var(--text-secondary)">
                        "${escapeHtml(item.contextExample)}"
                      </blockquote>
                    </div>
                  </div>

                  <!-- 5. Vietnamese Equivalent (Hidden by default behind toggle button) -->
                  <div class="pt-4 border-t" style="border-color: var(--border-hairline)">
                    <div class="flex items-center justify-between gap-3">
                      <button
                        type="button"
                        class="card-corner-toggle"
                        data-action="toggle-glossary-vi"
                        data-glossary-id="${item.id}"
                        data-lang="${isRevealed ? 'vi' : 'en'}"
                        aria-expanded="${isRevealed ? 'true' : 'false'}"
                      >
                        <span data-glossary-btn-text="${item.id}">
                          ${isRevealed ? 'Hide Vietnamese / Ẩn nghĩa' : 'Reveal Vietnamese / Xem nghĩa'}
                        </span>
                      </button>

                      <div
                        data-glossary-vi-box="${item.id}"
                        class="text-sm font-semibold transition-opacity duration-300 ${isRevealed ? 'opacity-100' : 'opacity-0 pointer-events-none select-none'}"
                        style="color: var(--accent-vi)"
                        aria-hidden="${isRevealed ? 'false' : 'true'}"
                      >
                        ${escapeHtml(item.vietnamese)}
                      </div>
                    </div>
                  </div>
                </article>
              `;
            })
            .join('');

          viewport.innerHTML = `
            <div data-view="glossary" class="view-section app-container-wide pt-8 md:pt-12">
              <!-- Glossary Header -->
              <header class="border-b pb-8 mb-8" style="border-color: var(--border-strong)">
                <div class="text-xs font-mono-tabular uppercase tracking-widest mb-2" style="color: var(--accent-vi)">
                  Interactive Learner Glossary · B2 / C1 Academic &amp; Specialized Vocabulary
                </div>
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                  <div>
                    <h1 class="font-display-editorial text-3xl sm:text-4xl font-bold" style="color: var(--text-primary)">
                      Bilingual Learner Glossary (32 Terms)
                    </h1>
                    <p class="text-base mt-2 max-w-2xl" style="color: var(--text-secondary)">
                      Study key academic concepts, philosophical terminology, and challenging expressions extracted directly from the four broadcast parts. Click "Reveal Vietnamese / Xem nghĩa" on any card to check your comprehension.
                    </p>
                  </div>
                  <div class="flex flex-wrap items-center gap-2 shrink-0">
                    <button type="button" id="glossary-reveal-all-btn" class="btn-control">
                      Reveal All Vietnamese / Xem tất cả
                    </button>
                    <button type="button" id="glossary-hide-all-btn" class="btn-control">
                      Hide All / Ẩn tất cả
                    </button>
                  </div>
                </div>

                <!-- Filter & Search Controls -->
                <div class="mt-6 pt-5 border-t flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4" style="border-color: var(--border-hairline)">
                  <div class="flex flex-wrap items-center gap-1.5" role="group" aria-label="Filter by Part of Speech">
                    ${['all', 'noun', 'verb', 'adjective', 'adverb']
                      .map(function (pos) {
                        const active = state.glossaryPosFilter === pos;
                        const label = pos === 'all' ? 'All POS (32)' : pos.charAt(0).toUpperCase() + pos.slice(1);
                        return `<button type="button" data-glossary-pos="${pos}" class="px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer border ${active ? 'btn-primary-accent' : ''}" style="${active ? '' : 'background-color: var(--bg-surface); color: var(--text-secondary); border-color: var(--border-hairline);'}">${label}</button>`;
                      })
                      .join('')}
                  </div>

                  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <select
                      id="glossary-part-select"
                      aria-label="Filter glossary by Broadcast Part"
                      class="px-3.5 py-2 rounded-xl text-xs font-semibold border outline-none"
                      style="background-color: var(--bg-surface); border-color: var(--border-strong); color: var(--text-primary);"
                    >
                      <option value="all" ${state.glossaryPartFilter === 'all' ? 'selected' : ''}>All 4 Parts</option>
                      <option value="part-1" ${state.glossaryPartFilter === 'part-1' ? 'selected' : ''}>Part I · Neil &amp; God</option>
                      <option value="part-2" ${state.glossaryPartFilter === 'part-2' ? 'selected' : ''}>Part II · Swedenborg</option>
                      <option value="part-3" ${state.glossaryPartFilter === 'part-3' ? 'selected' : ''}>Part III · EVP &amp; Codex</option>
                      <option value="part-4" ${state.glossaryPartFilter === 'part-4' ? 'selected' : ''}>Part IV · Legend of Mazu</option>
                    </select>

                    <input
                      type="search"
                      id="glossary-search-input"
                      value="${escapeHtml(state.glossarySearch)}"
                      placeholder="Search term, definition, or Vietnamese..."
                      aria-label="Search glossary terms"
                      class="min-w-[240px] px-4 py-2 rounded-xl text-sm border outline-none"
                      style="background-color: var(--bg-surface); border-color: var(--border-strong); color: var(--text-primary);"
                    />
                  </div>
                </div>
              </header>

              <!-- Glossary Grid -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${
                  cardsHtml ||
                  `<div class="col-span-2 border rounded-xl p-12 text-center" style="background-color: var(--bg-surface); border-color: var(--border-hairline)">
                    <p class="text-lg font-medium mb-2">No glossary terms match your filter</p>
                    <button type="button" id="reset-glossary-filters" class="btn-control mt-2">Reset Glossary Filters</button>
                  </div>`
                }
              </div>
            </div>
          `;
        }

        // ==================== ROUTER & NAVIGATION ====================
        function renderCurrentView() {
          updateTopBarUI();
          if (state.currentView === 'overview') {
            renderOverviewView();
          } else if (state.currentView === 'section') {
            renderSectionReadingView(state.activeSectionId);
          } else if (state.currentView === 'glossary') {
            renderGlossaryView();
          }
        }

        function navigateToHash(hash, shouldScrollTop) {
          const clean = (hash || '#overview').replace(/^#/, '');

          if (clean === 'overview' || clean === '') {
            state.currentView = 'overview';
            renderCurrentView();
            if (shouldScrollTop !== false) window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (clean === 'glossary') {
            state.currentView = 'glossary';
            renderCurrentView();
            if (shouldScrollTop !== false) window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          // Part anchors on Overview
          if (clean === 'part-1' || clean === 'part-2' || clean === 'part-3' || clean === 'part-4') {
            state.currentView = 'overview';
            state.overviewPartFilter = 'all';
            renderCurrentView();
            const partEl = document.getElementById(clean);
            if (partEl) {
              partEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            return;
          }

          // Section route: #section-p1-s1
          if (clean.indexOf('section-') === 0) {
            const secId = clean.replace(/^section-/, '');
            const found = SECTIONS_DATA.find(function (s) {
              return s.id === secId;
            });
            if (found) {
              state.currentView = 'section';
              state.activeSectionId = found.id;
              state.sectionTitleLang = state.globalLang;
              renderCurrentView();
              if (shouldScrollTop !== false) window.scrollTo({ top: 0, behavior: 'smooth' });
              return;
            }
          }

          // Default fallback
          state.currentView = 'overview';
          renderCurrentView();
        }

        // ==================== EVENT LISTENERS ====================
        document.addEventListener('click', function (e) {
          const target = e.target;
          if (!target) return;

          // 1. Corner EN/VI Toggle Button on Overview Section Cards (MUST stopPropagation so card does not open!)
          const overviewCardToggle = target.closest('[data-action="toggle-overview-card-lang"]');
          if (overviewCardToggle) {
            e.stopPropagation();
            e.preventDefault();
            const secId = overviewCardToggle.getAttribute('data-section-id');
            if (secId) {
              const current = state.overviewCardLangs[secId] || state.globalLang;
              state.overviewCardLangs[secId] = current === 'en' ? 'vi' : 'en';
              updateSingleOverviewCardDOM(secId);
            }
            return;
          }

          // 2. Overview Card Body Click -> Open Section Reading Page
          const sectionCard = target.closest('[data-card-section-id]');
          if (sectionCard) {
            const secId = sectionCard.getAttribute('data-card-section-id');
            if (secId) {
              window.location.hash = '#section-' + secId;
            }
            return;
          }

          // 3. Paragraph Card Explicit Button or Card Body Click -> Flip Paragraph EN/VI
          const paraToggleBtn = target.closest('[data-action="toggle-para-card"]');
          if (paraToggleBtn) {
            e.stopPropagation();
            const paraId = paraToggleBtn.getAttribute('data-para-id');
            if (paraId) {
              const curr = state.paragraphLangs[paraId] || state.globalLang;
              state.paragraphLangs[paraId] = curr === 'en' ? 'vi' : 'en';
              updateSingleParagraphCardDOM(paraId);
            }
            return;
          }

          const paraCard = target.closest('[data-para-card]');
          if (paraCard) {
            // Do not flip if user is selecting text
            const sel = window.getSelection && window.getSelection();
            if (sel && sel.toString().length > 0) return;
            const paraId = paraCard.getAttribute('data-para-card');
            if (paraId) {
              const curr = state.paragraphLangs[paraId] || state.globalLang;
              state.paragraphLangs[paraId] = curr === 'en' ? 'vi' : 'en';
              updateSingleParagraphCardDOM(paraId);
            }
            return;
          }

          // 4. Section Page Inline Heading Toggle Button
          const secHeaderToggle = target.closest('#section-header-lang-toggle');
          if (secHeaderToggle) {
            state.sectionTitleLang = state.sectionTitleLang === 'en' ? 'vi' : 'en';
            const sec = SECTIONS_DATA.find(function (s) {
              return s.id === state.activeSectionId;
            });
            if (sec) {
              const h1 = document.getElementById('section-page-heading');
              const sub = document.getElementById('section-page-subheading');
              const lbl = document.getElementById('section-header-lang-label');
              const isEn = state.sectionTitleLang === 'en';
              if (h1) h1.textContent = isEn ? sec.titleEn : sec.titleVi;
              if (sub) sub.textContent = isEn ? sec.titleVi : sec.titleEn;
              if (lbl) lbl.textContent = isEn ? 'Heading: EN ⇄ VI' : 'Tiêu đề: VI ⇄ EN';
            }
            return;
          }

          // 5. Flip All Paragraphs in Active Section
          const batchParaBtn = target.closest('[data-action="set-section-paras-lang"]');
          if (batchParaBtn) {
            const targetLang = batchParaBtn.getAttribute('data-target-lang') || 'en';
            const sec = SECTIONS_DATA.find(function (s) {
              return s.id === state.activeSectionId;
            });
            if (sec) {
              sec.paragraphs.forEach(function (p) {
                state.paragraphLangs[p.id] = targetLang;
                updateSingleParagraphCardDOM(p.id);
              });
            }
            return;
          }

          // 6. Glossary Individual Vietnamese Reveal Toggle
          const glossaryToggle = target.closest('[data-action="toggle-glossary-vi"]');
          if (glossaryToggle) {
            const gId = glossaryToggle.getAttribute('data-glossary-id');
            if (gId) {
              state.glossaryRevealed[gId] = !state.glossaryRevealed[gId];
              const isRev = Boolean(state.glossaryRevealed[gId]);
              const box = document.querySelector('[data-glossary-vi-box="' + gId + '"]');
              const btnTxt = document.querySelector('[data-glossary-btn-text="' + gId + '"]');
              glossaryToggle.setAttribute('data-lang', isRev ? 'vi' : 'en');
              glossaryToggle.setAttribute('aria-expanded', isRev ? 'true' : 'false');
              if (btnTxt) {
                btnTxt.textContent = isRev
                  ? 'Hide Vietnamese / Ẩn nghĩa'
                  : 'Reveal Vietnamese / Xem nghĩa';
              }
              if (box) {
                box.setAttribute('aria-hidden', isRev ? 'false' : 'true');
                if (isRev) {
                  box.classList.remove('opacity-0', 'pointer-events-none', 'select-none');
                  box.classList.add('opacity-100');
                } else {
                  box.classList.add('opacity-0', 'pointer-events-none', 'select-none');
                  box.classList.remove('opacity-100');
                }
              }
            }
            return;
          }

          // 7. Glossary Reveal All / Hide All
          if (target.closest('#glossary-reveal-all-btn')) {
            GLOSSARY_DATA.forEach(function (item) {
              state.glossaryRevealed[item.id] = true;
            });
            renderGlossaryView();
            return;
          }
          if (target.closest('#glossary-hide-all-btn')) {
            GLOSSARY_DATA.forEach(function (item) {
              state.glossaryRevealed[item.id] = false;
            });
            renderGlossaryView();
            return;
          }

          // 8. Overview Part Filter Tabs
          const partFilterBtn = target.closest('[data-part-filter]');
          if (partFilterBtn) {
            state.overviewPartFilter = partFilterBtn.getAttribute('data-part-filter') || 'all';
            renderOverviewView();
            return;
          }

          // 9. Glossary POS Filter Tabs
          const posFilterBtn = target.closest('[data-glossary-pos]');
          if (posFilterBtn) {
            state.glossaryPosFilter = posFilterBtn.getAttribute('data-glossary-pos') || 'all';
            renderGlossaryView();
            return;
          }

          // 10. Reset Filter Buttons
          if (target.closest('#reset-overview-search')) {
            state.overviewPartFilter = 'all';
            state.overviewSearch = '';
            renderOverviewView();
            return;
          }
          if (target.closest('#reset-glossary-filters')) {
            state.glossaryPosFilter = 'all';
            state.glossaryPartFilter = 'all';
            state.glossarySearch = '';
            renderGlossaryView();
            return;
          }

          // 11. Top Bar & Navigation Buttons
          if (target.closest('#nav-back-overview-btn') || target.closest('[data-action="back-overview"]')) {
            window.location.hash = '#overview';
            return;
          }
          if (target.closest('#nav-glossary-btn') || target.closest('[data-action="open-glossary"]')) {
            window.location.hash = '#glossary';
            return;
          }
          const navSecBtn = target.closest('[data-nav-section]');
          if (navSecBtn) {
            const targetSec = navSecBtn.getAttribute('data-nav-section');
            if (targetSec) window.location.hash = '#section-' + targetSec;
            return;
          }

          // 12. Global EN/VI Language Switch
          if (target.closest('#global-lang-toggle')) {
            state.globalLang = state.globalLang === 'en' ? 'vi' : 'en';
            syncAllLangStatesToGlobal(state.globalLang);
            renderCurrentView();
            return;
          }

          // 13. Theme Toggle Button
          if (target.closest('#theme-toggle-btn')) {
            applyTheme(state.theme === 'dark' ? 'light' : 'dark');
            return;
          }

          // 14. Scroll to Top
          if (target.closest('#scroll-top-btn')) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
        });

        // Keyboard Accessibility (Enter / Space on cards)
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          const active = document.activeElement;
          if (!active) return;

          if (active.hasAttribute('data-card-section-id')) {
            e.preventDefault();
            const secId = active.getAttribute('data-card-section-id');
            if (secId) window.location.hash = '#section-' + secId;
          } else if (active.hasAttribute('data-para-card')) {
            e.preventDefault();
            const paraId = active.getAttribute('data-para-card');
            if (paraId) {
              const curr = state.paragraphLangs[paraId] || state.globalLang;
              state.paragraphLangs[paraId] = curr === 'en' ? 'vi' : 'en';
              updateSingleParagraphCardDOM(paraId);
            }
          }
        });

        // Search Input Listeners
        document.addEventListener('input', function (e) {
          const target = e.target;
          if (!target) return;
          if (target.id === 'overview-search-input') {
            state.overviewSearch = target.value;
            const pos = target.selectionStart;
            renderOverviewView();
            const nextInput = document.getElementById('overview-search-input');
            if (nextInput) {
              nextInput.focus();
              try {
                nextInput.setSelectionRange(pos, pos);
              } catch (err) {}
            }
          } else if (target.id === 'glossary-search-input') {
            state.glossarySearch = target.value;
            const pos = target.selectionStart;
            renderGlossaryView();
            const nextInput = document.getElementById('glossary-search-input');
            if (nextInput) {
              nextInput.focus();
              try {
                nextInput.setSelectionRange(pos, pos);
              } catch (err) {}
            }
          }
        });

        document.addEventListener('change', function (e) {
          const target = e.target;
          if (!target) return;
          if (target.id === 'glossary-part-select') {
            state.glossaryPartFilter = target.value;
            renderGlossaryView();
          } else if (target.id === 'section-quick-jump') {
            if (target.value) {
              window.location.hash = '#section-' + target.value;
            }
          }
        });

        window.addEventListener('hashchange', function () {
          navigateToHash(window.location.hash, true);
        });

        // Boot Application
        applyTheme(state.theme);
        navigateToHash(window.location.hash || '#overview', false);
      })();
    </script>
  </body>
</html>
