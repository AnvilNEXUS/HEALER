      attachGlossaryEvents();
    }

    /* Helper: Highlight term inside context quote */
    function highlightTerm(context, term) {
      const base = term.replace(/ \(.*?\)/, '');
      const regex = new RegExp(`(${base})`, 'gi');
      return context.replace(regex, '<mark class="bg-indigo-100 dark:bg-indigo-900 text-indigo-900 dark:text-indigo-100 font-semibold px-0.5 rounded">$1</mark>');
    }

    function attachGlossaryEvents() {
      // Search Input
      const searchInput = document.getElementById('glossary-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.glossarySearch = e.target.value;
          renderGlossaryView();
          // refocus and put cursor at end
          const newIn = document.getElementById('glossary-search-input');
          if (newIn) {
            newIn.focus();
            newIn.setSelectionRange(newIn.value.length, newIn.value.length);
          }
        });
      }

      // Filter Pills
      document.querySelectorAll('.glossary-filter-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.glossaryFilter = btn.getAttribute('data-cat');
          renderGlossaryView();
        });
      });

      // Reset Button if empty
      const btnReset = document.getElementById('btn-reset-glossary');
      if (btnReset) {
        btnReset.addEventListener('click', () => {
          state.glossarySearch = '';
          state.glossaryFilter = 'All';
          renderGlossaryView();
        });
      }

      // Individual Term Audio Pronounce
      document.querySelectorAll('.btn-pronounce-term').forEach(btn => {
        btn.addEventListener('click', () => {
          const term = btn.getAttribute('data-term');
          speakText(term);
        });
      });

      // Individual Toggle Vietnamese Meanings
      document.querySelectorAll('.btn-toggle-vocab-vi').forEach(btn => {
        btn.addEventListener('click', () => {
          const gid = btn.getAttribute('data-gid');
          if (state.revealedGlossary.has(gid)) {
            state.revealedGlossary.delete(gid);
          } else {
            state.revealedGlossary.add(gid);
          }
          const box = document.getElementById(`vi-box-${gid}`);
          const isRevealed = state.revealedGlossary.has(gid);
          if (box) {
            box.classList.toggle('hidden', !isRevealed);
          }
          btn.innerHTML = isRevealed ? 'Hide Vietnamese / Đóng nghĩa' : 'Reveal Vietnamese / Xem nghĩa';
          btn.className = `btn-toggle-vocab-vi w-full py-2 px-3 rounded-xl text-xs font-bold transition-all border flex items-center justify-center gap-1.5 ${isRevealed ? 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700' : 'bg-emerald-600 hover:bg-emerald-500 text-white border-transparent shadow-sm'}`;
        });
      });

      // Reveal All Terms
      const btnRevealAll = document.getElementById('btn-reveal-all-glossary');
      if (btnRevealAll) {
        btnRevealAll.addEventListener('click', () => {
          appData.glossary.forEach(g => state.revealedGlossary.add(g.id));
          renderGlossaryView();
          showToast('All Vietnamese definitions revealed!');
        });
      }
    }

    function router() {
      const hash = window.location.hash.replace('#', '') || 'overview';
      state.currentView = hash;

      // Scroll top smoothly on page transition
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (hash === 'overview') {
        renderOverviewView();
      } else if (hash === 'glossary') {
        renderGlossaryView();
      } else {
        renderSectionView(hash);
      }
    }

    /* Global Language Toggle Handling */
    function updateGlobalLanguage(lang) {
      state.currentLang = lang;
      localStorage.setItem('app_lang', lang);

      const btnEn = document.getElementById('btn-lang-en');
      const btnVi = document.getElementById('btn-lang-vi');

      if (lang === 'en') {
        btnEn.className = 'px-2.5 py-1 text-xs font-bold rounded-md transition-all bg-white dark:bg-slate-700 text-sky-700 dark:text-sky-300 shadow-sm';
        btnVi.className = 'px-2.5 py-1 text-xs font-bold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
      } else {
        btnVi.className = 'px-2.5 py-1 text-xs font-bold rounded-md transition-all bg-white dark:bg-slate-700 text-emerald-700 dark:text-emerald-300 shadow-sm';
        btnEn.className = 'px-2.5 py-1 text-xs font-bold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
      }

      // Re-render current active view
      router();
      showToast(lang === 'en' ? 'Global language set to English' : 'Chuyển ngôn ngữ mặc định sang Tiếng Việt');
    }

    // Attach Top Header Buttons
    document.getElementById('btn-lang-en').addEventListener('click', () => updateGlobalLanguage('en'));
    document.getElementById('btn-lang-vi').addEventListener('click', () => updateGlobalLanguage('vi'));

    // Dark Mode Toggle
    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      showToast(state.theme === 'dark' ? 'Dark mode activated' : 'Light mode activated');
    });

    // Keyboard Shortcut (Alt + T for Theme)
    window.addEventListener('keydown', (e) => {
      if (e.altKey && (e.key === 't' || e.key === 'T')) {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      }
    });

    /* Initial App Launch */
    window.addEventListener('DOMContentLoaded', () => {
      populateQuickSelector();
      updateGlobalLanguage(state.currentLang);
      window.addEventListener('hashchange', router);
      router();
    });
  </script>
</body>
</html>
