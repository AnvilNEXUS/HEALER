                            en: "As we draw closer to 2027—when Solar Cycle 25 reaches its peak and karmic fruition happens swiftly and instantaneously—holding onto vivid memories of old grudges allows those karmic creditors to immediately trace that energetic memory cord straight back to you. Therefore, for those who have lived virtuously in recent times, the unseen realms, your tutelary guardians, and your spiritual teachers activate a mechanism called wiping the reel of past grievances. It automatically blurs and fades heavy memories from your brain—like pulling the plug and severing the tracking lines so that karmic creditors from the old cycle can no longer lock onto your frequency as you cross into 2027.",
                            vi: "Thế nên mà khi tiến sát vào năm 2027 này, thời điểm chu kỳ mặt trời thứ 25 đạt đỉnh và tốc độ trả quả đang diễn ra một cách nhanh chóng tức thì nên nếu như bạn còn nhớ rõ từng mối hận cũ thì những oan gia trái chủ đó sẽ lập tức dò theo được sợi dây ký ức năng lượng để tìm đến bạn. Vì vậy đối với những người mà thời gian qua đã biết sống thiện lành, cõi vô hình hay là các vị bổn tôn, các bậc thầy tâm linh của bạn để kích hoạt những cơ chế gọi là xóa trắng thước phim oan trái. Nghĩa là nó sẽ tự động làm mờ và xóa bớt những ký ức nặng nề trong não bộ của chúng ta, giống như việc bạn rút phích cắm và cắt đứt những sợi dây định vị để những oan gia của chu kỳ cũ không còn dò được tần số của bạn khi bạn bước sang năm 2027 nữa."
                        }

                {
                    id: "sec-6",
                    headEN: "2. \"Unconscious Gaps\" While Driving and Flash Summons to the Unseen Realms",
                    headVI: "2. \"Khoảng Trống Vô Thức\" Khi Lái Xe Và Sự Triệu Tập Chớp Nhoáng Ở Cõi Vô Hình",
                    paragraphs: [
                        {
                            en: "A second mysterious phenomenon many of you have shared with me is driving home along long stretches of road with a completely blank mind—unable to remember which intersections you passed—or sitting in a daze as though you had vanished from reality for dozens of minutes or even hours.",
                            vi: "Một hiện tượng huyền bí thứ hai mà Jenny được nghe các bạn nói lại đó là việc các bạn hay khi mà lái xe về nhà, đi trên những quãng đường dài mà hoàn toàn trống rỗng, đầu óc mình trống rỗng không nhớ là mình đã đi qua ngã tư nào hoặc là bạn ngồi thẫn thờ như là bạn vừa biến mất khỏi thực tại vài giờ hay vài chục phút vậy."
                        },
                        {
                            en: "In some cases, deep regression hypnosis sessions offer an explanation that has stunned consciousness researchers: during those brief moments when your mind goes blank and you can't recall a thing, your spirit or consciousness has actually been summoned in a flash to the unseen realms right in the middle of the day—either to untangle a life-or-death karmic knot or to receive guidance steering you away from a hidden catastrophe.",
                            vi: "Thì việc này có thể giải thích trong một số trường hợp ở các ca thôi miên hồi quy sâu. Nó hé lộ một sự thật làm rúng động giới nghiên cứu tâm thức. Đó là trong những phút ngắn ngủi mà đầu óc của bạn trống rỗng, không nhớ được điều gì đó thì thực chất là thần thức của bạn hay tâm thức của bạn vừa được triệu tập chớp nhoáng ở cõi vô hình ngay giữa ban ngày để hóa giải một nút thắt sinh tử hoặc để chỉ dẫn tránh cho bạn một đại nạn ngầm nào đó."
                        },
                        {
                            en: "The clearest evidence is how many people, during one of those unconscious gaps, spontaneously turn down a different street, pause to do something unexpected, or abruptly turn back home to fetch some random item, delaying themselves by around ten minutes—only to hear the shocking news on TV or the radio moments later that a serious accident just happened on the exact stretch of road they avoided.",
                            vi: "Và bằng chứng rõ rệt nhất là rất nhiều người trong khoảng trống vô thức đó bỗng nhiên tự nhiên rẽ sang một con đường khác, bạn làm một việc gì đó khác hoặc bạn đột nhiên quay xe về nhà, lấy một món đồ không đâu vào đâu cả và làm trễ mất khoảng 10 phút chẳng hạn. Thì để rồi ngay sau đó bạn mới bàng hoàng hay tin trên tivi hay là ở radio là đúng đoạn đường mình vừa tránh được lại xảy ra một tai nạn nghiêm trọng."
                        },
                        {
                            en: "The reason for this is that the frequencies and energies of higher realms surpass the storage capacity of the ordinary physical brain. The very instant your consciousness returns to your body after pulling you out of danger, every memory from those few minutes is completely sealed and locked away, leaving you with nothing more than a bewildered feeling, as though you had just woken up from a dream.",
                            vi: "Lý do cho điều này đó là bởi vì những tần số và năng lượng ở cõi giới cao vượt quá khả năng lưu trữ của não bộ thông thường nên ngay khi mà giây phút thần thức của bạn quay trở lại cơ thể sau khi đã cứu bạn thoát nạn thì toàn bộ những ký ức trong vài phút ấy sẽ bị niêm phong khóa lại hoàn toàn và chỉ để lại cho bạn một cảm giác ngơ ngác như là bạn vừa tỉnh mộng sau một giấc mơ."
                        }
                    ]

                {
                    id: "sec-7",
                    headEN: "The Third Secret: Earth Splitting into Two Realms and the \"Frequency Phase-Shift\" Phenomenon",
                    headVI: "Bí Mật Thứ Ba: Trái Đất Tách Làm Hai Cõi Và Hiện Tượng \"Lệch Pha Tần Số\"",
                    paragraphs: [
                        {
                            en: "All of these phenomena lead straight to our third secret—the most mysterious one in today's video: Earth splitting into two realms. Many people still assume that if 2027 onward—or Earth's ascension into 5D—marks the great sifting of humanity, there must be some miracle that physically lifts good people off the ground to fly away and live on another planet, while those living out of alignment are left behind on this old Earth.",
                            vi: "Và chính tất cả những hiện tượng này dẫn thẳng đến một bí mật thứ ba là hiện tượng kỳ bí nhất trong video ngày hôm nay. Đó gọi là trái đất tách làm hai cõi. Bởi vì trong tâm thức của nhiều người hiện vẫn còn đang nghĩ rằng nếu như năm 2027 trở đi hay là khi mà trái đất thăng lên 5D chẳng hạn là năm mà các đại sàng lọc của nhân loại xảy ra thì chẳng lẽ có một phép màu nào đó khiến cho con người được tự nhiên bốc lên, những người lương thiện được bay lên hành tinh khác ở, còn những người sống lỗi thì sẽ phải ở lại trái đất cũ này hay sao?"
                        },
                        {
                            en: "In truth, that is just how we think when we are still caught in what we call 3D physical logic. The reality pointed to by both Buddhism and quantum scientists is ten thousand times more awe-inspiring: all of us will still have our feet planted on this same physical earth, still share this same physical ground, and even live under the exact same roof—yet Earth is genuinely splitting into two invisible realms layered right on top of each other.",
                            vi: "Nhưng đó thật ra chỉ là những suy nghĩ của bạn khi bạn còn bị vướng mắc ở cái gọi là vật lý 3D. Còn sự thật mà nhà Phật hay là các nhà khoa học lượng tử chỉ ra thì nó còn kỳ vĩ hơn gấp vạn lần. Đó là tất cả chúng ta sẽ vẫn cùng đạp chân ở trên mặt đất vật lý này, vẫn sống chung ở mặt đất vật lý này, thậm chí sống chung dưới một mái nhà. Nhưng mà trái đất đang thực sự tách làm hai cõi giới vô hình xếp chồng lên nhau."
                        },
                        {
                            en: "The first sign confirming this is a recurring feeling of déjà vu—this scene is so familiar; I've seen this somewhere before—happening over and over again. You might be sitting in a conversation or walking into an unfamiliar room or place, and suddenly you freeze because you know with absolute certainty that you have seen it before, that you have lived through this exact moment down to the finest detail. You might even know the very next sentence the person across from you is about to say. Has anyone watching experienced something like this? Leave a comment down below so everyone and I can hear your story.",
                            vi: "Dấu hiệu đầu tiên để bạn có thể xác nhận điều này đó là bạn sẽ thường xuyên có những cảm giác như cảnh này thật quen thuộc, mình đã từng gặp ở đâu rồi. Nó sẽ lặp lại liên tục. Chẳng hạn như bạn đang ngồi nói chuyện hay là bạn đang bước vào một căn phòng lạ, một nơi chốn nào đó lạ thì đột nhiên bạn khựng lại vì biết chắc chắn rằng mình đã từng thấy nó rồi, mình từng sống qua cái khoảnh khắc này không sai một chi tiết nào rồi. Thậm chí là bạn còn có thể biết trước cả câu tiếp theo mà người đối diện sắp mở miệng nói. Không biết là ở đây có bạn nào từng trải qua trường hợp như thế này không? Hãy comment xuống bên dưới để Jenny và mọi người cùng biết nhé."
                        },
                        {
                            en: "The secret behind this phenomenon is that during your nights of deep sleep leading up to 2027, your consciousness has been quietly stepping ahead into the future to rehearse and preview new timelines—parallel timelines—to see which forks in the road are the safest and most peaceful paths toward the success and goals you have set within your subconscious. So when you physically step onto that exact milestone or location in waking life, your subconscious memory clicks into place with reality, sending out a confirmation signal that you have officially stepped onto the peaceful track—into the 2027 cycle you already saw within.",
                            vi: "Bí mật của hiện tượng này nằm ở chỗ đó là trong những đêm mà bạn ngủ sâu trước thềm 2027 thần thức hay là tâm thức của bạn đã âm thầm đi trước vào tương lai để diễn tập và kiểm duyệt các dòng thời gian mới. Đó là các dòng thời gian song song để xem xem những ngã rẽ nào là an toàn và bình an nhất để dẫn đến những thành công, những mục tiêu mà bạn đã đặt trước trong tiềm thức. Vì vậy khi ở ngoài đời thực bạn bước chân chạm đúng vào cột mốc đó hay là vị trí đó thì ký ức tiềm thức của bạn lập tức khớp vào thực tại, nó phát ra tín hiệu xác nhận rằng bạn đã chính thức bước sang đường ray bình an hay là bước vào chu kỳ của năm 2027 mà bạn đã thấy trước trong tiềm thức."
                        }
                    ]
                },
                {
                    id: "sec-8",
                    headEN: "Three Everyday Signs of \"Frequency Phase-Shift\"",
                    headVI: "Ba Hiện Tượng \"Lệch Pha Tần Số\" Giữa Đời Thường",
                    paragraphs: [
                        {
                            en: "As each soul steps onto a different track, an unprecedented and mysterious phenomenon begins unfolding right in everyday life, known as frequency phase-shift. It makes two people feel as though they inhabit two completely different worlds. You can verify this for yourself by observing three strange occurrences happening right around you:",
                            vi: "Khi mà mỗi linh hồn bước sang một đường ray khác nhau thì một hiện tượng kỳ bí cũng chưa từng có đã xảy ra ở ngay giữa đời thường đó là hiện tượng tên lệch pha tần số. Nó khiến cho hai người như ở hai thế giới khác nhau vậy. Bạn có thể tự kiểm chứng điều này qua việc quan sát ba hiện tượng lạ lùng đang diễn ra ngay xung quanh bạn:"
                        },
                        {
                            en: "First is the phenomenon of the invisible veil. You may have people you were very close to for ten or twenty years who live just a few blocks away in the same city. Yet over the past few months, you somehow just cannot manage to meet up—every time you schedule a get-together, something bizarre pops up at the last minute to block it, or you walk right past each other on the street without noticing, as if an invisible mist were veiling your eyes. That happens because the two of you have shifted into different frequency realms, so invisible magnetic fields or energetic boundaries are automatically fading the other person's presence out of your world.",
                            vi: "Thứ nhất là hiện tượng che mắt vô hình. Nghĩa là có những người mà bạn từng rất thân suốt 10 năm, 20 năm ở cách nhau chỉ vài con phố trong cùng một thành phố. Nhưng mà vài tháng gần đây thì tự nhiên không tài nào bạn gặp được nhau, cứ lên lịch hẹn là đúng phút chót có chuyện lạ cản bước hoặc là đi lướt qua nhau ở ngoài đường nhưng mà dường như có một màn sương vô hình che mắt không nhìn thấy được đối phương. Thì đó là vì hai người đã tách sang hai cõi tần số khác nhau, thế nên từ trường vô hình hay là những kết giới đó đang tự động làm mờ đi sự hiện diện của người kia ra khỏi thế giới của bạn."
                        },
                        {
                            en: "Second is sharing the same roof while living in two different worlds. This appears most often between spouses or family members sitting less than a meter apart across the dinner table, yet when they look into each other's eyes, they feel like complete strangers from different planets. One person simply longs for a gentle life of harmony and letting go, while the other opens their mouth only to calculate, compete, and snap in frustration. Even though you speak the exact same language, you can no longer truly understand one another.",
                            vi: "Hoặc hiện tượng thứ hai đó là chung một máy nhà nhưng mà ở hai thế giới. Điều này xuất hiện nhiều nhất ở các cặp vợ chồng hay là người thân khi mà ngồi đối diện nhau qua mâm cơm chưa đầy 1 m thế nhưng khi nhìn vào mắt nhau lại thấy xa lạ như là người dưng từ hành tinh khác vậy. Kiểu như một người thì chỉ mong muốn cuộc sống hiền hòa buông xả còn người kia thì mở miệng ra là tính toán hơn thua và gắt gỏng. Nghĩa là giờ đây khi mà các bạn có thể nói cùng một ngôn ngữ nhưng mà người nghe không còn hiểu được nhau nữa."
                        },
                        {
                            en: "And third is the phenomenon of two skies of destiny over the same patch of ground. This can happen within the same company, neighborhood, or small community amid the shifts of 2027. People who still hold onto greed and envy step out their front door only to encounter misfortune, deception, and dead ends, as though walking through a dark realm. Meanwhile, someone right beside them—at the very next desk or in the house next door—keeps meeting helpful benefactors who guide their way, watching bad turns miraculously transform into blessings, as if wrapped in an invisible circle of protective light.",
                            vi: "Và thứ ba là hiện tượng hai bầu trời số phận trên cùng một mảnh đất. Điều này thì có thể xảy ra ở cùng một công ty hay là một khu vực một xóm nhỏ trước những biến động năm 2027. Đó là những người khi còn giữ tâm tham lam đố kỵ thì họ bước ra cửa là có thể gặp xui rủi, lừa lọc bế tắc như đang đi giữa những cái cõi tối tăm. Còn một người ở ngay bên cạnh, ngồi ngay bàn bên cạnh hay là ngôi nhà bên cạnh lại có thể liên tục gặp được quý nhân đưa đường chỉ lối, chuyện dữ hóa lành một cách kỳ diệu như đang được bao bọc trong một vòng tròn ánh sáng bảo hộ vô hình vậy."
                        }
                    ]
                },
                {
                    id: "sec-9",
                    headEN: "Three Personal Keys to Anchor Your Frequency of Consciousness for 2027",
                    headVI: "Ba Chìa Khóa Tự Thân Để Giữ Vững Tần Số Tâm Thức Năm 2027",
                    paragraphs: [
                        {
                            en: "In Buddhism, there is a law stating that the outer world manifests according to the inner mind. So the question is: standing before a historic great divergence like this, what do you need to do through your own inner strength to keep your consciousness anchored in the deepest peace? The answer is that the sole passport determining whether you step into the bright realm of prosperity or descend into the dark realm of chaos in 2027 rests entirely on the frequency of your own consciousness right now. Everything you can practice on your own comes down to these three keys.",
                            vi: "Thì trong Phật giáo đó là quy luật gọi là cảnh giới bên ngoài sẽ biến hiện theo tâm thức bên trong. Nên câu hỏi ở đây là khi đứng trước một cuộc đại phân luồng lịch sử như thế này thì bạn cần phải làm gì bằng chính nội lực tự thân của mình để có thể giữ vững được thần thức tâm thức của mình một cách bình an nhất. Thế thì câu trả lời đó là tấm vé thông hành duy nhất quyết định bạn có bước vào được cõi sáng của sự thịnh vượng hay là bước xuống cõi tối hỗn loạn năm 2027 sẽ nằm trọn ở tần số tâm thức của chính bạn ngay lúc này. Và các phương pháp để bạn có thể tự thân thực hành nằm trọn ở ba chìa khóa sau."
                        }
                    ]
                },
                {
                    id: "sec-10",
                    headEN: "Key One: Practice Three Mindful Breaths",
                    headVI: "Chìa Khóa Thứ Nhất: Thực Hành Ba Hơi Thở Chánh Niệm",
                    paragraphs: [
                        {
                            en: "First, practice three mindful breaths to bring your mind back to the present moment. Whenever you catch your thoughts drifting or your memory slipping, pause for thirty seconds. Place your hand over your chest, take three deep breaths, and silently tell yourself: I am fully present right here in this very moment. I guarantee that those three breaths will immediately draw back your scattered energy and help you reclaim mastery over your own mind.",
                            vi: "Thứ nhất, đó là thực hành ba hơi thở chánh niệm để đưa tâm trí của bạn quay trở về với hiện tại. Nghĩa là mỗi khi mà thấy đầu óc mình lơ đễnh, quên trước quên sau thì hãy dừng lại 30 giây. Bạn có thể đặt tay lên ngực, hít thở sâu ba hơi và thầm nhủ trong đầu là: tôi đang có mặt trọn vẹn ngay tại phút giây này. Thì Jenny đảm bảo là sau ba hơi thở đó sẽ thu hồi ngay nguồn năng lượng đang phân tán của bạn, giúp cho bạn làm chủ lại được tâm trí của mình."
                        }
                    ]
                },
                {
                    id: "sec-11",
                    headEN: "Key Two: Proactively Clear Emotional Clutter Before Sleep",
                    headVI: "Chìa Khóa Thứ Hai: Chủ Động Dọn Rác Cảm Xúc Trước Khi Đi Ngủ",
                    paragraphs: [
                        {
                            en: "Second, proactively clear out emotional clutter before going to sleep instead of waiting for your brain to become overloaded. Every night when you lie down in bed, take a deep breath and set an intention to let go—releasing every harsh remark and every unpleasant incident from the day, restoring clarity to your consciousness so that you can wake up the next morning with your sharpest intuition.",
                            vi: "Và thứ hai là bạn hãy chủ động dọn rác cảm xúc trước khi đi ngủ. Thay vì đợi bộ não của mình quá tải, nghĩa là mỗi tối khi đặt lưng xuống giường thì hãy hít thở sâu và khởi lên một niệm buông bỏ, buông bỏ hết mọi câu nói hay là mọi chuyện bất như ý trong ngày, trả lại sự trong trẻo cho tâm thức để sáng hôm sau bạn có thể thức dậy với trực giác sáng suốt nhất."
                        }
                    ]
                },
                {
                    id: "sec-12",
                    headEN: "Key Three: Remain Non-Judgmental and Compassionate Toward Those on a Different Frequency",
                    headVI: "Chìa Khóa Thứ Ba: Giữ Tâm Không Phán Xét Và Từ Bi Trước Những Người Lệch Tần Số",
                    paragraphs: [
                        {
                            en: "Third—and this is something I remind you of in every single video—hold a non-judgmental, compassionate heart toward those on a different frequency. Even when you see that your relatives or friends no longer share your perspective, do not look down on them, do not force them to be like you, and do not argue to prove who is right. The very moment you grow angry, you drag your own frequency straight down. The rule is to respect each person's individual journey, keep your words gentle, and quietly wish them peace. Only when your own heart is at peace will the place where you stand naturally become a realm of goodness.",
                            vi: "Và điều thứ ba cũng là điều mà Jenny luôn nhắc các bạn trong mọi video đó là hãy giữ tâm không phán xét và từ bi trước những người lệch tần số. Đó là khi dù thấy người thân hay là bạn bè của mình không còn chung góc nhìn với mình nữa thì cũng đừng coi thường, cũng đừng ép họ giống như mình và đừng tranh cãi hơn thua. Bởi khoảnh khắc mà bạn nổi giận nghĩa là bạn đang tự kéo tụt tần số của mình xuống thấp. Thì quy tắc là hãy tôn trọng hành trình riêng của mỗi người, giữ lời nói của mình hiền hòa và chỉ âm thầm chúc bình an cho họ. Chỉ khi tâm bạn cũng được bình an thì nơi bạn đứng sẽ tự khắc là cõi lành."
                        }
                    ]
                },
                {
                    id: "sec-13",
                    headEN: "Closing Thoughts and Affirmation for Welcoming 2027",
                    headVI: "Lời Kết Và Câu Khẳng Định Đón Năm 2027",
                    paragraphs: [
                        {
                            en: "Finally, the fact that you have listened all the way through today's video is a synchronicity signaling that your soul is ready to step onto the brightest timeline of 2027. So if you are ready to take mastery of your own consciousness, feel free to leave this affirmation in the comments below: When the mind is at peace, all things are at peace. Let's anchor this frequency of awakening and goodness together.",
                            vi: "Và cuối cùng là việc bạn đã lắng nghe trọn vẹn những lời chia sẻ của video ngày hôm nay là tín hiệu đồng bộ báo hiệu rằng linh hồn của bạn đang sẵn sàng bước sang dòng thời gian tươi sáng nhất của 2027. Nên nếu như bạn cũng sẵn sàng làm chủ tâm thức của mình thì cũng có thể comment xuống bên dưới một câu khẳng định như thế này là: tâm an vạn sự an để cùng nhau neo giữ tần số tỉnh thức và thiện lành này nhé."
                        },
                        {
                            en: "That is everything I wanted to share with you in today's video. Thank you for being here with me, and I wish you the strength to always keep the bright lamp of wisdom burning steadily within your consciousness. For now, goodbye, and I will see you in the next video.",
                            vi: "Và đó là tất cả những điều Khánh Vy muốn chia sẻ với các bạn trong video ngày hôm nay. Cảm ơn các bạn đã cùng đồng hành và chúc các bạn luôn giữ vững ngọn đèn trí tuệ sáng ngời trong tâm thức của mình. Còn bây giờ xin chào và hẹn gặp lại các bạn trong những video tiếp theo."
                        }
                    ]
                }
            ],
            glossary: [
                { term: "Phenomena", pos: "noun", def: "A fact or situation that is observed to exist or happen, especially one whose cause or explanation is in question.", plain: "Observable events, often strange or remarkable.", example: "Lately, many of you have been messaging me about some very strange phenomena...", vi: "Những hiện tượng" },
                { term: "Consciousness", pos: "noun", def: "The state of being awake and aware of one's surroundings; the awareness or perception of something.", plain: "The mind's awareness of itself and the world.", example: "All of these are signs of a great sifting of consciousness right on the threshold...", vi: "Tâm thức" },
                { term: "Threshold", pos: "noun", def: "The magnitude or intensity that must be exceeded for a certain reaction, phenomenon, result, or condition to occur.", plain: "The starting point or doorway to a new era.", example: "...right on the threshold of the 2027 spiritual grand cycle.", vi: "Ngưỡng cửa / Thềm" },
                { term: "Migration", pos: "noun", def: "Movement from one part of something to another.", plain: "A large-scale move or shift.", example: "The Largest \"Soul Migration,\" Sudden \"Memory Loss\"...", vi: "Sự di cư" },
                { term: "Regression", pos: "noun", def: "A return to a former or less developed state.", plain: "Going backward in time or memory.", example: "...practicing master Dolores Cannon's quantum regression hypnosis...", vi: "Sự hồi quy" },
                { term: "Superconscious", pos: "noun", def: "A level of awareness beyond normal human consciousness.", plain: "The highest, most connected part of the mind.", example: "...to connect with their superconscious or higher consciousness...", vi: "Siêu thức" },
                { term: "Escapism", pos: "noun", def: "The tendency to seek distraction and relief from unpleasant realities.", plain: "Running away from problems instead of facing them.", example: "The second case, however, is a trap known as escapism.", vi: "Chạy trốn / Lảng tránh" },
                { term: "Resentment", pos: "noun", def: "Bitter indignation at having been treated unfairly.", plain: "Holding a grudge or feeling bitter.", example: "...if your heart has not yet let go of anger and resentment...", vi: "Sự sân hận / Oán hận" },
                { term: "Delusion", pos: "noun", def: "An idiosyncratic belief or impression that is firmly maintained despite being contradicted by reality.", plain: "Believing things that aren't true; ignorance.", example: "...wearing that same cloak of greed, anger, and delusion...", vi: "Sự si mê / Ảo tưởng" },
                { term: "Storehouse Consciousness", pos: "noun", def: "In Yogacara Buddhism, the foundational consciousness containing all karmic seeds (Alaya-vijnana).", plain: "The deep mind where all past memories and karmas are kept.", example: "...held in your Alaya-vijnana (storehouse consciousness) are not merely past recollections...", vi: "Kho A Lại Da Thức" },
                { term: "Grievance", pos: "noun", def: "A real or imagined wrong or other cause for complaint or protest.", plain: "A feeling of resentment over something unfair.", example: "...activate a mechanism called wiping the reel of past grievances.", vi: "Nỗi oan trái / Bất bình" },
                { term: "Karmic Creditor", pos: "noun", def: "In Buddhism, a being to whom one owes a karmic debt from past actions.", plain: "Someone from the past who you owe an energetic debt to.", example: "...binding your soul tightly to the karmic creditors who once hurt you.", vi: "Oan gia trái chủ" },
                { term: "Fruition", pos: "noun", def: "The point at which a plan or project is realized.", plain: "The moment when karma ripens or results appear.", example: "...when Solar Cycle 25 reaches its peak and karmic fruition happens swiftly...", vi: "Sự ứng nghiệm / Đơm hoa kết trái" },
                { term: "Catastrophe", pos: "noun", def: "An event causing great and often sudden damage or suffering.", plain: "A massive disaster or tragedy.", example: "...or to receive guidance steering you away from a hidden catastrophe.", vi: "Đại nạn / Thảm họa" },
                { term: "Ascension", pos: "noun", def: "The act of rising to an important position or a higher level.", plain: "Moving up to a higher spiritual dimension.", example: "...if 2027 onward—or Earth's ascension into 5D—marks the great sifting...", vi: "Sự thăng lên / Thăng thiên" },
                { term: "Multidimensional", pos: "noun/adj", def: "Of or involving several dimensions or aspects.", plain: "Existing across many different realms or planes.", example: "...guiding you through the multidimensional 4D portal...", vi: "Đa chiều không gian" },
                { term: "Synchronicity", pos: "noun", def: "The simultaneous occurrence of events that appear significantly related but have no discernible causal connection.", plain: "Meaningful coincidences.", example: "...listened all the way through today's video is a synchronicity signaling...", vi: "Sự đồng bộ" },
                { term: "Subconscious", pos: "noun", def: "Of or concerning the part of the mind of which one is not fully aware but which influences one's actions.", plain: "The deep mind that stores automatic thoughts.", example: "...toward the success and goals you have set within your subconscious.", vi: "Tiềm thức" },
                { term: "Clutter", pos: "noun", def: "A collection of things lying about in an untidy mass.", plain: "A messy collection of unnecessary things (like bad thoughts).", example: "Second, proactively clear out emotional clutter before going to sleep...", vi: "Rác (cảm xúc) / Mớ lộn xộn" },
                { term: "Intuition", pos: "noun", def: "The ability to understand something immediately, without the need for conscious reasoning.", plain: "A deep, unexplainable gut feeling.", example: "...wake up the next morning with your sharpest intuition.", vi: "Trực giác" },
                { term: "Compassionate", pos: "adj", def: "Feeling or showing sympathy and concern for others.", plain: "Caring deeply about others' suffering.", example: "...hold a non-judgmental, compassionate heart toward those on a different frequency.", vi: "Từ bi" },
                { term: "Affinity", pos: "noun", def: "A spontaneous or natural liking or sympathy for someone or something.", plain: "A natural karmic connection or bond.", example: "The first case is that your karmic affinity with your old land has run its course...", vi: "Duyên / Duyên nợ" },
                { term: "Uncanny", pos: "adj", def: "Strange or mysterious, especially in an unsettling way.", plain: "Weirdly familiar or unnatural.", example: "...leaving you with a constant sense of déjà vu—that uncanny feeling of...", vi: "Kỳ lạ / Bí ẩn" },
                { term: "Déjà vu", pos: "noun", def: "A feeling of having already experienced the present situation.", plain: "The feeling that you've seen this exact scene before.", example: "...leaving you with a constant sense of déjà vu...", vi: "Cảm giác quen thuộc / Đã từng trải qua" }
            ]
        };

        const app = {
            currentView: 'overview',
            globalLang: 'en',
            root: document.getElementById('app-root'),

            init() {
                this.render();
            },

            navigate(viewId) {
                this.currentView = viewId;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.updateNav();
                this.render();
            },

            toggleGlobalLang() {
                this.globalLang = this.globalLang === 'en' ? 'vi' : 'en';
                document.getElementById('global-lang-indicator').innerText = this.globalLang === 'en' ? 'EN / VI' : 'VI / EN';
                this.render();
            },

            toggleTheme() {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                } else {
                    html.classList.add('dark');
                }
            },

            toggleCardLang(event, buttonEl = null) {
                // If button was clicked directly (overview headers)
                if (buttonEl) {
                    event.stopPropagation();
                    const stateObj = buttonEl.dataset;
                    stateObj.current = stateObj.current === 'en' ? 'vi' : 'en';
                    const targetEl = document.getElementById(buttonEl.dataset.target);
                    if(targetEl) {
                        targetEl.innerText = buttonEl.dataset[stateObj.current];
                    }
                    buttonEl.innerText = stateObj.current.toUpperCase();
                    return;
                }

                // Interactive paragraph card toggling
                const card = event.currentTarget;
                const enDiv = card.querySelector('.lang-en');
                const viDiv = card.querySelector('.lang-vi');
                const badge = card.querySelector('.badge-lang');
                
                if (card.dataset.active === 'en') {
                    card.dataset.active = 'vi';
                    enDiv.classList.replace('fade-active', 'fade-inactive');
                    viDiv.classList.replace('fade-inactive', 'fade-active');
                    badge.innerText = 'VI';
                    badge.classList.replace('bg-brand-100', 'bg-amber-100');
                    badge.classList.replace('text-brand-700', 'text-amber-700');
                    badge.classList.replace('dark:bg-brand-900', 'dark:bg-amber-900');
                    badge.classList.replace('dark:text-brand-300', 'dark:text-amber-300');
                } else {
                    card.dataset.active = 'en';
                    viDiv.classList.replace('fade-active', 'fade-inactive');
                    enDiv.classList.replace('fade-inactive', 'fade-active');
                    badge.innerText = 'EN';
                    badge.classList.replace('bg-amber-100', 'bg-brand-100');
                    badge.classList.replace('text-amber-700', 'text-brand-700');
                    badge.classList.replace('dark:bg-amber-900', 'dark:bg-brand-900');
                    badge.classList.replace('dark:text-amber-300', 'dark:text-brand-300');
                }
            },

            toggleGlossaryTerm(event) {
                const card = event.currentTarget;
                const viText = card.querySelector('.vi-translation');
                const toggleHint = card.querySelector('.toggle-hint');
                
                if(viText.classList.contains('hidden')) {
                    viText.classList.remove('hidden');
                    toggleHint.innerText = 'Hide Vietnamese';
                } else {
                    viText.classList.add('hidden');
                    toggleHint.innerText = 'Reveal Vietnamese / Xem nghĩa';
                }
            },

            updateNav() {
                const btnBack = document.getElementById('btn-back');
                const navTitle = document.getElementById('nav-title');
                
                if (this.currentView === 'overview') {
                    btnBack.classList.add('hidden');
                    navTitle.innerText = "2027 SOUL MIGRATION";
                } else if (this.currentView === 'glossary') {
                    btnBack.classList.remove('hidden');
                    navTitle.innerText = "Learner Glossary";
                } else {
                    btnBack.classList.remove('hidden');
                    navTitle.innerText = "Reading Section";
                }
            },

            render() {
                if (this.currentView === 'overview') {
                    this.root.innerHTML = this.renderOverview();
                } else if (this.currentView === 'glossary') {
                    this.root.innerHTML = this.renderGlossary();
                } else {
                    const section = documentData.sections.find(s => s.id === this.currentView);
                    if (section) {
                        this.root.innerHTML = this.renderSection(section);
                    } else {
                        this.root.innerHTML = `<div class="text-center mt-20 text-red-500">Section not found.</div>`;
                    }
                }
            },

            renderOverview() {
                let cardsHtml = documentData.sections.map((sec, idx) => {
                    const displayTitle = this.globalLang === 'en' ? sec.headEN : sec.headVI;
                    return `
                        <div onclick="app.navigate('${sec.id}')" class="interactive-card cursor-pointer bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col justify-between h-full relative overflow-hidden group">
                            <div class="absolute top-0 left-0 w-1 h-full bg-brand-500 transform scale-y-0 group-hover:scale-y-100 transition-transform duration-300 origin-top"></div>
                            
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-xs font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase">Section ${idx + 1}</span>
                                <button onclick="app.toggleCardLang(event, this)" 
                                        data-en="${sec.headEN}" 
                                        data-vi="${sec.headVI}"
                                        data-target="heading-${sec.id}"
                                        data-current="${this.globalLang}"
                                        class="px-2 py-1 text-xs font-bold rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                                    ${this.globalLang.toUpperCase()}
                                </button>
                            </div>
                            <h3 id="heading-${sec.id}" class="text-xl font-serif font-bold text-slate-800 dark:text-slate-100 leading-snug">
                                ${displayTitle}
                            </h3>
                            <div class="mt-6 flex items-center text-brand-600 dark:text-brand-400 text-sm font-semibold group-hover:translate-x-1 transition-transform">
                                Read Section <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </div>
                        </div>
                    `;
                }).join('');

                const pageTitle = this.globalLang === 'en' ? documentData.docTitleEN : documentData.docTitleVI;

                return `
                    <div class="space-y-10 animate-[fadeIn_0.4s_ease-out]">
                        <header class="text-center mb-12">
                            <p class="text-brand-600 dark:text-brand-400 font-bold tracking-widest uppercase text-sm mb-3">Interactive Bilingual Guide</p>
                            <h1 class="text-3xl sm:text-4xl md:text-5xl font-serif font-bold leading-tight text-slate-900 dark:text-white">
                                ${pageTitle}
                            </h1>
                            <p class="mt-4 text-slate-500 dark:text-slate-400 max-w-2xl mx-auto">Select a section below to start reading. Tap any paragraph while reading to instantly flip between English and Vietnamese.</p>
                        </header>
                        
                        <!-- Glossary Quick Access -->
                        <div onclick="app.navigate('glossary')" class="interactive-card cursor-pointer bg-gradient-to-r from-brand-600 to-brand-800 dark:from-brand-800 dark:to-brand-950 rounded-2xl p-6 sm:p-8 text-white flex flex-col sm:flex-row items-center justify-between shadow-lg">
                            <div>
                                <h2 class="text-2xl font-bold mb-2">Interactive Learner Glossary</h2>
                                <p class="text-brand-100 opacity-90 max-w-xl">Master 24 advanced academic concepts and idioms extracted directly from the text to elevate your B2/C1 English proficiency.</p>
                            </div>
                            <div class="mt-6 sm:mt-0 whitespace-nowrap bg-white text-brand-800 px-6 py-3 rounded-full font-bold shadow-md hover:bg-brand-50 transition-colors">
                                Access Glossary →
                            </div>
                        </div>

                        <!-- Section Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            },

            renderSection(section) {
                const displayTitle = this.globalLang === 'en' ? section.headEN : section.headVI;
                const altTitle = this.globalLang === 'en' ? section.headVI : section.headEN;

                let paragraphsHtml = section.paragraphs.map((p, idx) => {
                    const enActive = this.globalLang === 'en';
                    const activeClass = enActive ? 'fade-active' : 'fade-inactive';
                    const inactiveClass = enActive ? 'fade-inactive' : 'fade-active';
                    
                    const badgeText = enActive ? 'EN' : 'VI';
                    const badgeColor = enActive ? 'bg-brand-100 text-brand-700 dark:bg-brand-900 dark:text-brand-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-300';

                    return `
                        <div onclick="app.toggleCardLang(event)" data-active="${this.globalLang}" class="group interactive-card cursor-pointer bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 dark:border-slate-700 relative">
                            <div class="absolute top-4 right-4 z-10">
                                <span class="badge-lang px-2.5 py-1 text-[10px] font-black rounded uppercase tracking-widest ${badgeColor} transition-colors duration-300">
                                    ${badgeText}
                                </span>
                            </div>
                            <div class="fade-swap-grid text-[18px] sm:text-[20px] font-serif leading-[1.8] text-slate-700 dark:text-slate-300 mt-2">
                                <div class="lang-en ${enActive ? 'fade-active' : 'fade-inactive'}">
                                    ${p.en}
                                </div>
                                <div class="lang-vi ${enActive ? 'fade-inactive' : 'fade-active'}">
                                    ${p.vi}
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700/50 flex justify-center opacity-40 group-hover:opacity-100 transition-opacity">
                                <span class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Tap to translate</span>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="animate-[fadeIn_0.4s_ease-out] max-w-3xl mx-auto pb-20">
                        <header class="mb-10 text-center">
                            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-slate-900 dark:text-white leading-tight mb-4">
                                ${displayTitle}
                            </h1>
                            <p class="text-sm font-serif italic text-slate-500 dark:text-slate-400">
                                ${altTitle}
                            </p>
                        </header>
                        <div class="space-y-6">
                            ${paragraphsHtml}
                        </div>
                    </div>
                `;
            },

            renderGlossary() {
                let glossaryHtml = documentData.glossary.map(item => `
                    <div onclick="app.toggleGlossaryTerm(event)" class="interactive-card cursor-pointer bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-full">
                        <div class="p-6 flex-grow">
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="text-xl font-bold text-brand-700 dark:text-brand-400">${item.term}</h3>
                                <span class="text-xs font-medium px-2 py-1 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded">${item.pos}</span>
                            </div>
                            <div class="space-y-3">
                                <div>
                                    <p class="text-sm font-bold text-slate-800 dark:text-slate-200 mb-1">Definition</p>
                                    <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">${item.def}</p>
                                </div>
                                <div class="pl-3 border-l-2 border-brand-200 dark:border-brand-800">
                                    <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">In other words...</p>
                                    <p class="text-sm text-slate-600 dark:text-slate-400 italic">${item.plain}</p>
                                </div>
                                <div class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Context</p>
                                    <p class="text-sm font-serif text-slate-700 dark:text-slate-300 leading-relaxed">"${item.example}"</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-900/80 border-t border-slate-100 dark:border-slate-700 p-4 text-center">
                            <p class="toggle-hint text-xs font-bold uppercase tracking-widest text-brand-600 dark:text-brand-400 mb-2">Reveal Vietnamese / Xem nghĩa</p>
                            <p class="vi-translation hidden text-lg font-serif font-bold text-slate-800 dark:text-white">${item.vi}</p>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="animate-[fadeIn_0.4s_ease-out]">
                        <header class="mb-12 text-center max-w-2xl mx-auto">
                            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-slate-900 dark:text-white mb-4">Learner Glossary</h1>
                            <p class="text-slate-600 dark:text-slate-400">Master 24 advanced academic terms extracted from the text. Tap any card to reveal the Vietnamese translation.</p>
                        </header>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${glossaryHtml}
                        </div>
                    </div>
                `;
            }
        };

        // Initialize application on load
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
            
            // System preference for Dark Mode
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        });
    </script>
</body>
</html>
