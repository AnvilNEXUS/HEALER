    /**
     * ROUTER & NAVIGATION
     */
    function initRouter() {
      window.addEventListener('hashchange', handleHashChange);
      handleHashChange();
    }

    function handleHashChange() {
      const hash = window.location.hash.replace('#', '') || 'overview';
      AppState.view = hash;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateTo(route) {
      window.location.hash = route;
    }

    /**
     * RENDER DISPATCHER
     */
    function renderApp() {
      const root = document.getElementById('app-root');
      const navBackBtn = document.getElementById('nav-back-btn');
      const globalToggleBtn = document.getElementById('global-toggle-btn');
      const navBrand = document.getElementById('nav-brand');

      if (AppState.view === 'overview') {
        navBackBtn.classList.add('hidden');
        globalToggleBtn.classList.add('hidden');
        navBrand.classList.remove('hidden');
        root.innerHTML = renderOverviewPage();
      } else if (AppState.view === 'glossary') {
        navBackBtn.classList.remove('hidden');
        navBackBtn.classList.add('inline-flex');
        globalToggleBtn.classList.add('hidden');
        navBrand.classList.add('hidden');
        root.innerHTML = renderGlossaryPage();
      } else if (AppState.view.startsWith('section-')) {
        navBackBtn.classList.remove('hidden');
        navBackBtn.classList.add('inline-flex');
        globalToggleBtn.classList.remove('hidden');
        globalToggleBtn.classList.add('inline-flex');
        navBrand.classList.add('hidden');
        root.innerHTML = renderSectionPage(AppState.view);
      }
    }

              <div class="flex items-baseline justify-between gap-2 flex-wrap">
                <div class="flex items-center gap-2">
                  <h3 class="text-xl font-bold font-serif text-stone-900 tracking-tight">${item.term}</h3>
                  <span class="italic text-xs font-medium text-stone-500 bg-stone-100 px-2 py-0.5 rounded">
                    ${item.pos}
                  </span>
                </div>
                <span class="text-xs font-mono font-bold text-stone-400">#${idx + 1}</span>
              </div>

              <!-- Contextual / Academic Definition -->
              <p class="text-sm text-stone-700 leading-relaxed">
                <span class="font-semibold text-stone-900">Definition:</span> ${item.definition}
              </p>

              <!-- Plain English Explanation (B1/B2 Friendly) -->
              <div class="bg-amber-50/70 border-l-2 border-amber-500 p-3 rounded-r-lg text-xs leading-relaxed text-amber-950">
                <span class="font-bold text-amber-900">In other words:</span> ${item.simple}
              </div>

              <!-- Example in Context -->
              <div class="text-xs text-stone-500 italic bg-stone-50 p-3 rounded-lg border border-stone-100">
                "${item.context}"
              </div>

            </div>

            <!-- Vietnamese Equivalent Toggle Section -->
            <div class="mt-5 pt-4 border-t border-stone-100">
              <button onclick="toggleGlossaryVi(${idx})" 
                      id="glossary-btn-${idx}"
                      class="w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-xs transition-colors">
                <span>👁️ Reveal Vietnamese</span>
              </button>

              <div id="glossary-vi-${idx}" class="hidden mt-3 p-2.5 bg-emerald-50 text-emerald-950 border border-emerald-200 rounded-lg text-xs font-bold text-center fade-in">
                ${item.vi}
              </div>
            </div>

          </div>
        `;
      }).join('');

      return `
        <div class="fade-in space-y-8">
          
          <div class="space-y-3 text-center sm:text-left">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-stone-200/80 text-stone-800 text-xs font-bold uppercase tracking-wider">
              Educational Resource Bank
            </div>
            <h1 class="text-3xl sm:text-4xl font-black font-display text-stone-900">
              Interactive Learner Glossary
            </h1>
            <p class="text-stone-600 text-base max-w-2xl leading-relaxed">
              Curated for Upper-Intermediate (B2) and Advanced (C1) English learners. These 16 terms unpack physiological concepts, traditional Asian medicine metaphysics, and academic argument transitions.
            </p>
          </div>

          <!-- Vocabulary Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${glossaryItemsHtml}
          </div>

          <!-- Back to Document Hub -->
          <div class="pt-8 text-center">
            <button onclick="navigateTo('overview')" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-stone-900 hover:bg-stone-800 text-stone-100 font-bold text-sm shadow transition-colors">
              ← Return to Document Hub
            </button>
          </div>

        </div>
      `;
    }

    /**
     * INTERACTION HANDLERS
     */

    // Toggle individual overview card heading between EN and VI
    function toggleCardHeaderLanguage(event, sectionId) {
      event.stopPropagation();
      const current = AppState.cardHeadingLangs[sectionId] || 'en';
      const next = current === 'en' ? 'vi' : 'en';
      AppState.cardHeadingLangs[sectionId] = next;

      const sec = DOCUMENT_DATA.sections.find(s => s.id === sectionId);
      const titleEl = document.getElementById(`card-title-${sectionId}`);
      if (titleEl && sec) {
        titleEl.textContent = next === 'en' ? sec.title_en : sec.title_vi;
      }
      renderApp();
    }

    // Toggle active reading section title language
    function toggleSectionTitleLanguage() {
      AppState.currentSectionTitleLang = AppState.currentSectionTitleLang === 'en' ? 'vi' : 'en';
      renderApp();
    }

    // Toggle an individual paragraph card between EN and VI
    function toggleParagraphLang(sectionId, paraIdx) {
      const key = `${sectionId}-${paraIdx}`;
      const current = AppState.paragraphCardLangs[key] || 'en';
      AppState.paragraphCardLangs[key] = current === 'en' ? 'vi' : 'en';
      renderApp();
    }

    // Toggle all paragraph cards in current active section at once
    function toggleAllParagraphs() {
      if (!AppState.view.startsWith('section-')) return;
      const sec = DOCUMENT_DATA.sections.find(s => s.id === AppState.view);
      if (!sec) return;

      // Determine prevailing state: if first card is EN, flip all to VI; else all to EN
      const firstKey = `${sec.id}-0`;
      const currentFirst = AppState.paragraphCardLangs[firstKey] || 'en';
      const targetLang = currentFirst === 'en' ? 'vi' : 'en';

      sec.paragraphs.forEach((_, pIdx) => {
        AppState.paragraphCardLangs[`${sec.id}-${pIdx}`] = targetLang;
      });

      renderApp();
    }

    // Reveal/Hide Vietnamese translation for a glossary term
    function toggleGlossaryVi(idx) {
      const viBox = document.getElementById(`glossary-vi-${idx}`);
      const btn = document.getElementById(`glossary-btn-${idx}`);
      if (!viBox || !btn) return;

      if (viBox.classList.contains('hidden')) {
        viBox.classList.remove('hidden');
        btn.innerHTML = '<span>✕ Hide Vietnamese</span>';
        btn.classList.add('bg-emerald-100', 'text-emerald-900');
      } else {
        viBox.classList.add('hidden');
        btn.innerHTML = '<span>👁️ Reveal Vietnamese</span>';
        btn.classList.remove('bg-emerald-100', 'text-emerald-900');
      }
    }

    // Initialize application on page load
    window.addEventListener('DOMContentLoaded', initRouter);
  </script>
</body>
</html>
