        // State Management

        // Theme Management
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-icon-dark').classList.remove('hidden');
                document.getElementById('theme-icon-light').classList.add('hidden');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-icon-dark').classList.add('hidden');
                document.getElementById('theme-icon-light').classList.remove('hidden');
            }
        }

        // Initialize Theme
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon-light').classList.remove('hidden');
        } else {
            document.getElementById('theme-icon-dark').classList.remove('hidden');
        }

                const headingText = sec.heading[globalLang];
                html += `
                    <div onclick="window.location.hash = '${sec.id}'" class="group relative bg-white dark:bg-darkcard border border-slate-200 dark:border-slate-700 rounded-2xl p-6 cursor-pointer hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 overflow-hidden">
                        <div class="absolute top-0 right-0 p-4">
                            <span class="text-4xl opacity-5 group-hover:opacity-10 transition-opacity font-serif font-bold text-slate-900 dark:text-white">0${idx + 1}</span>
                        </div>
                        <h3 class="text-xl font-serif font-bold mb-3 pr-8 text-slate-800 dark:text-slate-100 group-hover:text-brand transition-colors">
                            ${headingText}
                        </h3>
                        <p class="text-brand dark:text-blue-400 font-medium text-sm flex items-center gap-1 opacity-80 group-hover:opacity-100">
                            Read section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </p>
                    </div>
                `;
            });

            html += `
                </div>
                
                <div onclick="window.location.hash = 'glossary'" class="relative bg-gradient-to-br from-brand to-indigo-600 rounded-2xl p-8 cursor-pointer hover:shadow-xl transition-all duration-300 text-white transform hover:-translate-y-1 mb-12">
                    <h3 class="text-2xl font-serif font-bold mb-2 flex items-center gap-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        Interactive Learner Glossary
                    </h3>
                    <p class="text-blue-100">Master 24 specialized terms and academic concepts extracted directly from the text.</p>
                </div>
            `;

            document.getElementById('app-root').innerHTML = html;
        }

        function renderSection(sectionId) {
            document.getElementById('nav-back-btn').classList.remove('hidden');
            document.getElementById('nav-brand').classList.add('hidden');

            const section = documentData.sections.find(s => s.id === sectionId);
            if (!section) return renderOverview();

            let html = `
                <header class="mb-10 text-center">
                    <h1 class="text-3xl md:text-4xl font-serif font-bold mb-6">${section.heading[globalLang]}</h1>
                    <div class="h-1 w-20 bg-brand mx-auto rounded-full"></div>
                </header>
                <div class="space-y-6">
            `;

            section.content.forEach(block => {
                if (block.type === 'h3') {
                    html += createCard(block.en, block.vi, true);
                } else if (block.type === 'bullet') {
                    html += `<div class="pl-4 border-l-4 border-slate-200 dark:border-slate-700">
                        ${createCard(block.en, block.vi, false)}
                    </div>`;
                } else {
                    html += createCard(block.en, block.vi, false);
                }
            });

            html += `</div>
                <div class="mt-12 text-center">
                    <a href="#overview" class="inline-flex items-center gap-2 px-6 py-3 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-medium rounded-full hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Return to Overview
                    </a>
                </div>
            `;

            document.getElementById('app-root').innerHTML = html;
        }

        function renderGlossary() {
            document.getElementById('nav-back-btn').classList.remove('hidden');
            document.getElementById('nav-brand').classList.add('hidden');

            let html = `
                <header class="mb-10 text-center">
                    <h1 class="text-3xl md:text-4xl font-serif font-bold mb-4">Vocabulary Glossary</h1>
                    <p class="text-slate-600 dark:text-slate-400">Click any card to reveal the Vietnamese translation.</p>
                </header>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            `;

            documentData.glossary.forEach(term => {
                const isFlipped = globalLang === 'vi' ? 'flipped' : '';
                
                html += `
                <div class="card-wrapper perspective-1000 cursor-pointer" onclick="this.classList.toggle('flipped')">
                    <div class="card-inner grid transition-transform duration-500 transform-style-3d ${isFlipped} h-full">
                        
                        <!-- Front (English) -->
                        <div class="card-front col-start-1 row-start-1 backface-hidden bg-white dark:bg-darkcard border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm flex flex-col h-full">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">${term.term}</h3>
                                    <span class="text-xs font-semibold uppercase tracking-wider text-brand dark:text-blue-400">${term.pos}</span>
                                </div>
                                <span class="text-xs font-bold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded">EN</span>
                            </div>
                            
                            <div class="flex-grow space-y-3">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Academic Definition</h4>
                                    <p class="text-sm text-slate-800 dark:text-slate-200">${term.defEn}</p>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">In other words...</h4>
                                    <p class="text-sm text-slate-800 dark:text-slate-200">${term.plainEn}</p>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Context</h4>
                                    <p class="text-sm italic text-slate-600 dark:text-slate-400">"${term.example}"</p>
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 text-center">
                                <span class="text-xs font-medium text-brand dark:text-blue-400 flex items-center justify-center gap-1">
                                    Reveal Vietnamese
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                                </span>
                            </div>
                        </div>

                        <!-- Back (Vietnamese) -->
                        <div class="card-back col-start-1 row-start-1 rotate-y-180 backface-hidden bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-sm flex flex-col h-full items-center justify-center text-center">
                            <span class="inline-block px-2 py-1 mb-4 text-xs font-bold tracking-wider text-teal-800 bg-teal-100 dark:text-teal-200 dark:bg-teal-900/50 rounded uppercase">VI</span>
                            <h3 class="text-3xl font-serif font-bold text-brand dark:text-blue-400 mb-2">${term.vi}</h3>
                            <p class="text-slate-500 dark:text-slate-400 text-sm">Vietnamese Equivalent</p>
                        </div>
                        
                    </div>
                </div>
                `;
            });

            html += `</div>`;
            document.getElementById('app-root').innerHTML = html;
        }

        function renderRoute() {
            const hash = window.location.hash || '#overview';
            if (hash === '#overview') {
                renderOverview();
            } else if (hash === '#glossary') {
                renderGlossary();
            } else if (hash.startsWith('#section-')) {
                renderSection(hash.substring(1));
            } else {
                renderOverview();
            }
            window.scrollTo(0, 0);
        }

        // Init App
        window.addEventListener('hashchange', renderRoute);
        renderRoute();
    </script>
</body>
</html>
